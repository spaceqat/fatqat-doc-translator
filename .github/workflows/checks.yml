name: checks

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: [zh, ko]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate the translation database
        run: python tools/translate.py --locale ${{ matrix.locale }} check --require-complete
      - name: Report untranslated upstream segments
        run: python tools/translate.py --locale ${{ matrix.locale }} extract --dry-run
