version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install -r requirements.txt
      - python -u tools/inject_build.py --stage prepare --require-complete --output "$READTHEDOCS_OUTPUT/html"
    pre_build:
      - python -u tools/inject_build.py --stage tutorials --require-complete --output "$READTHEDOCS_OUTPUT/html"
      - python -u tools/inject_build.py --stage english --require-complete --output "$READTHEDOCS_OUTPUT/html"
    build:
      html:
        - python -u tools/inject_build.py --stage translated --require-complete --output "$READTHEDOCS_OUTPUT/html" --site-url "$READTHEDOCS_CANONICAL_URL"
