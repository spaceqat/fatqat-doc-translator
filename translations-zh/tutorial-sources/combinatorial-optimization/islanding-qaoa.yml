  en: H. You, V. Vittal, and X. Wang, "Slow coherency-based islanding", *IEEE Transactions on Power Systems* **19**(1), 483–491 (2004). Where the coherent generator groups this model takes as input come from.
  zh: H. You, V. Vittal, and X. Wang, "Slow coherency-based islanding", *IEEE Transactions on Power Systems* **19**(1), 483–491 (2004)。说明本模型作为输入的同调发电机群从何而来。
  status: machine
