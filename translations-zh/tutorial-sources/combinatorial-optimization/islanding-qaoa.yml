  en: A. Lucas, "Ising formulations of many NP problems", *Frontiers in Physics* **2**, 5 (2014). The standard catalogue of constraint-to-penalty mappings.
  zh: A. Lucas, "Ising formulations of many NP problems", *Frontiers in Physics* **2**, 5 (2014)。约束到惩罚映射的标准汇总。
  status: machine
- id: 35edd69e96efb8bf
  en: 'Y. Jiang, Z. Liang, Q. Guan, Y. Li, and G. K. Venayagamoorthy, "PACE-QAOA: Physics-Constrained Quantum Optimization for Qubit-Efficient Power System Islanding", [arXiv:2608.02789](https://arxiv.org/abs/2608.02789) (2026). Compact encodings that reduce phase-separator cost on sparse grids.'
  zh: 'Y. Jiang, Z. Liang, Q. Guan, Y. Li, and G. K. Venayagamoorthy, "PACE-QAOA: Physics-Constrained Quantum Optimization for Qubit-Efficient Power System Islanding", [arXiv:2608.02789](https://arxiv.org/abs/2608.02789) (2026)。通过紧凑编码降低稀疏电网上相位分离器的开销。'
  status: machine
- id: 6c6bdd4203f4f366
  en: 'Y. Jiang, Z. Liang, Q. Guan, Y. Li, and G. K. Venayagamoorthy, "SPLIT-Q: A Scalable Sequential Quantum Computing Framework for Coherent Controlled Islanding", [arXiv:2608.12711](https://arxiv.org/abs/2608.12711) (2026). Qubit-bounded sequential regional QAOA for larger networks.'
  zh: 'Y. Jiang, Z. Liang, Q. Guan, Y. Li, and G. K. Venayagamoorthy, "SPLIT-Q: A Scalable Sequential Quantum Computing Framework for Coherent Controlled Islanding", [arXiv:2608.12711](https://arxiv.org/abs/2608.12711) (2026)。面向更大规模网络、量子比特数有上限的顺序区域 QAOA。'
  status: machine
- id: 23ae00a855364c35
  en: Run the controlled-islanding QUBO on a FatQat simulator, then repair the measured bitstrings into feasible splits with pVSQA postprocessing.
  zh: 在 FatQat 模拟器上运行受控解列（controlled islanding）QUBO，再用 pVSQA 后处理把测得的比特串修复为可行划分。
  status: machine
- id: 056cd07fc09b5afd
  en: '[Model controlled islanding as a QUBO](islanding-model.md) turned the problem of splitting a transmission network into a quadratic function of binary variables: the objective is the power interrupted by the cut lines, and generator coherency and island balance are penalties that vanish when the requirement holds [6]. The coherent generator groups are input data, identified by methods such as slow-coherency analysis [4]. This tutorial takes that model, runs it on a quantum circuit, and deals with what comes back.'
  zh: '[将受控解列问题建模为 QUBO](islanding-model.md)把输电网的划分问题转化为二元变量的二次函数：目标是切断线路所中断的功率，发电机同调性和孤岛平衡则是在满足要求时为零的惩罚项 [6]。同调机群是输入数据，可用慢同调分析等方法识别 [4]。本教程把这个模型放到量子线路上运行，并处理返回的结果。'
  status: machine
- id: 05a85c873ff4ba87
  en: 'The headline difficulty is that a shallow QAOA circuit on a constrained problem returns mostly unusable bitstrings: in the 14-bus sampling run at the end of this tutorial, only a small fraction of the shots describe a split the grid could actually operate. The fix is not a deeper circuit but classical postprocessing, which is the second half of this tutorial.'
  zh: 主要困难在于，浅层 QAOA 量子线路处理带约束的问题时，返回的比特串大多不可用：在本教程末尾的 14 节点采样实验中，只有一小部分采样对应电网实际能够运行的划分。解决办法不是加深量子线路，而是经典后处理，这也是本教程的后半部分。
  status: retired
- id: 8af8344bdf236cb4
  en: 'The circuit is the standard QAOA ansatz [3], built exactly as in the QUBO tutorial: substitute $x_i = (1 - z_i)/2$ to get an Ising Hamiltonian, then emit an `RZ` per field term, a `CX`-`RZ`-`CX` ladder per coupling, and an `RX` mixer per layer.'
  zh: 量子线路采用标准 QAOA 拟设 [3]，写法与 QUBO 教程完全相同：代入 $x_i = (1 - z_i)/2$ 得到 Ising 哈密顿量，然后为每个场项生成一个 `RZ`，为每个耦合项生成一组 `CX`-`RZ`-`CX`，并在每层加入一个 `RX` 混合器。
  status: machine
- id: 8bf33778acc77f4a
  en: The fix is to stop treating a measurement as an answer and start treating it as a *starting point*. The postprocessing variationally scheduled quantum algorithm (pVSQA) [2] walks each measured bitstring downhill toward a nearby feasible assignment.
  zh: 解决办法是不再把测量结果当作答案，而是把它当作*起点*。后处理变分调度量子算法（pVSQA）[2] 从每个测得的比特串出发，沿能量下降方向走向附近的可行分配。
  status: machine
- id: b36af32fd33076b2
  en: None of the descents ends on a feasible split. They settle into a handful of local minima of the QUBO, including the disconnected ground state found earlier, and the typical result fails the connectivity check. The greedy stage is doing exactly what it was asked to do, and it is not enough.
  zh: 没有一次下降最终得到可行划分。它们停在 QUBO 的少数几个局部极小值上，其中包括前面找到的不连通基态，典型结果都无法通过连通性检查。贪心阶段准确地完成了交给它的任务，但仅靠它还不够。
  status: retired
- id: 5b051cf8beb8813d
  en: 'The second stage handles what the QUBO deliberately left out. When an island falls into several connected components, each stray fragment can be fixed two ways: move the fragment to a neighboring island, or annex the buses on the shortest path between the fragment and the island''s main body. Both candidates are scored with the model''s own energy, which includes the coherency penalty, and the lower one wins.'
  zh: 第二阶段处理 QUBO 有意略去的部分。当一个孤岛分裂成多个连通分量时，每个游离片段有两种修复方式：把片段移到相邻孤岛，或者把片段与该孤岛主体之间最短路径上的节点并入该孤岛。两种候选方案都用模型自身的能量（其中包括同调惩罚）打分，取能量较低者。
  status: retired
- id: 9c8e663a00ecd2e1
  en: 'Together the two stages turn most random bitstrings into feasible splits, and in this run every feasible result is the best feasible split. Stage 2 is what made the difference: the same descent that produced nothing usable on its own now reaches the answer for most starting points. The rest end on infeasible splits, so the repair is strong but not guaranteed.'
  zh: 两个阶段结合后，大多数随机比特串都能变为可行划分，而且在这次运行中，每个可行结果都是最佳可行划分。起决定作用的是第二阶段：单独使用时得不到任何可用结果的同一下降过程，现在从大多数起点出发都能到达答案。其余起点最终得到的是不可行划分，因此修复能力很强，但并不保证成功。
  status: machine
- id: eb31d7be19d4259d
  en: Repairing random bitstrings already reaches the best feasible split most of the time. So before claiming that QAOA contributes anything, the classical half has to be run on its own for comparison. Uniform random bitstrings, repaired with the same Method 1, are the baseline; anything the quantum sampler is worth has to show up as a difference against it.
  zh: 修复随机比特串在大多数情况下就已经能得到最佳可行划分。因此，在声称 QAOA 有任何贡献之前，必须先单独运行经典部分作为对照。以同一方法 1 修复的均匀随机比特串作为基线；量子采样器的任何价值都必须体现为相对于这一基线的差异。
  status: machine
- id: 28493a9f493426ae
  en: In this run the QAOA samples reach the answer somewhat more often after repair, but uniform random bitstrings already reach it most of the time. On a 14-bus network the repair is strong enough to find the answer from most starting points, so the margin left for the quantum sampler is small, and this single run does not establish an advantage. What it does establish is that the repaired samples reach the best feasible split found by exhaustive enumeration.
  zh: 在这次运行中，QAOA 样本经修复后得到答案的频率略高，但均匀随机比特串在大多数情况下也已经能得到答案。在 14 节点网络上，修复强到能从大多数起点找到答案，留给量子采样器的余地很小，这一次运行并不能证明存在优势。它能证明的是：修复后的样本能够得到穷举所确定的最佳可行划分。
  status: retired
- id: 1a6295d2c35275a9
  en: Separating the two claims needs a network where the classical descent gets stuck — larger, more strongly meshed, or with tighter coherency groups. That is exactly where the qubit accounting at the end of this tutorial becomes the binding constraint, and it is where the effort should go next.
  zh: 要把这两种说法区分开，需要一个经典下降会陷入困境的网络：规模更大、网状连接更紧密，或同调分组更严格。而在这样的网络上，本教程末尾的量子比特数统计恰好会成为硬约束，这也是下一步应投入精力的方向。
  status: machine
- id: 2894d35f10aee0e5
  en: Applied to a real measurement, the effect is a shift in what the shot budget buys. Raw outcomes spread across the whole energy range and are mostly infeasible; repaired outcomes mostly land on feasible splits. Repair runs once per *distinct* outcome rather than once per shot, which is what keeps it affordable.
  zh: 应用到实际测量时，效果体现在同样的采样预算能换来什么。原始结果分散在整个能量范围内，且大多不可行；修复后的结果大多落在可行划分上。修复只对每个*不同的*结果执行一次，而不是每次采样执行一次，因此开销可以承受。
  status: machine
- id: d9227c13ef51c1d0
  en: 'Qubit count is what decides whether a network is reachable at all, and it follows directly from the encoding and the components in use. Three numbers matter per system: the one-hot width $n_\text{buses} \times k$, the binary width $n_\text{buses}$ when $k = 2$, and the width once the slack-carrying requirements are added. The two encodings are developed in [Model controlled islanding as a QUBO](islanding-model.md).'
  zh: 量子比特数决定了一个网络能否处理，它直接取决于所用的编码和模型组成部分。每个系统有三个关键数字：独热编码宽度 $n_\text{buses} \times k$、$k = 2$ 时的二元编码宽度 $n_\text{buses}$，以及加入需要松弛变量的要求后的宽度。两种编码的推导见[将受控解列问题建模为 QUBO](islanding-model.md)。
  status: machine
- id: 62ce4716eb325793
  en: 'The pipeline is complete and each piece is checkable: the QUBO encodes coherency and balance, the decoding checks the remaining operating requirements, and the repair turns most measured bitstrings into feasible splits, as the shot counts above show. The best split it finds matches the one from exhaustive enumeration.'
  zh: 整个流程已经完整，而且每个环节都可以检验：QUBO 编码了同调性和平衡要求，解码阶段检查其余运行要求，修复则把大多数测得的比特串变为可行划分，如上面的采样计数所示。流程找到的最佳划分与穷举结果一致。
  status: machine
- id: c7a75b29a6bea777
  en: What it does not yet show is a quantum advantage, and it is worth being precise about why. On networks small enough to simulate, the classical repair reaches the optimum from most starting points, uniform random ones included, so the quantum sampler's contribution is hard to separate from it. Making that contribution visible needs a network where the classical descent has somewhere to get stuck — and there, the width numbers above become the binding constraint rather than the runtime. Approaches aimed at exactly that constraint are developed in [7] and [8].
  zh: 目前还没有展示出量子优势，原因值得说清楚。在小到可以模拟的网络上，经典修复从大多数起点（包括均匀随机起点）出发都能到达最优解，因此很难把量子采样器的贡献与之区分开。要让这种贡献显现出来，需要一个经典下降有可能陷入困境的网络；而到了那种规模，成为硬约束的将是上面的宽度数字，而不是运行时间。[7] 和 [8] 提出了专门针对这一约束的方法。
  status: machine
- id: bab4a790be123976
  en: '**Constraint-preserving mixers.** The binary encoding used here has no one-hot constraint, but the one-hot encoding needed for more than two islands does. There an XY mixer confines the state to the one-hot subspace, so amplitude is never spent on assignments the penalty would only have to reject.'
  zh: '**保持约束的混合器。**这里使用的二元编码没有独热约束，但多于两个孤岛时所需的独热编码有。此时可用 XY 混合器把量子态限制在独热子空间内，振幅就不会浪费在最终只会被惩罚项排除的分配上。'
  status: machine
- id: ca762d809adb2da4
  en: '**Warm starts.** Seeding QAOA from a classical partition [5] and letting the circuit search nearby uses shallow depth where it helps most.'
  zh: '**热启动。**用经典划分 [5] 初始化 QAOA，再让量子线路在其附近搜索，可以把浅层深度用在最有帮助的地方。'
  status: machine
- id: aaf08f67f2a7ffef
  en: The headline difficulty is that a shallow QAOA circuit on a constrained problem returns mostly unusable bitstrings. Out of 2000 measurements of the 14-bus model below, around 25 describe a split the grid could actually operate. The fix is not a deeper circuit but classical postprocessing, which is the second half of this tutorial.
  zh: 主要困难在于，浅层 QAOA 量子线路处理带约束的问题时，返回的比特串大多不可用。对下面的 14 节点模型测量 2000 次，只有约 25 个结果对应电网实际能够运行的划分。解决办法不是加深量子线路，而是经典后处理，这也是本教程的后半部分。
  status: machine
- id: 0ab8121af92867c8
  en: 'None of the descents ends on a feasible split. More than half reach the QUBO''s ground state, and that is the disconnected split found earlier; the rest stop in other local minima that are no better. A stronger optimizer would not help: the lowest-energy split the QUBO can describe is itself infeasible, because connectivity was deliberately left out of it. The greedy stage is doing exactly what it was asked to do, and it is not enough.'
  zh: 没有一次下降停在可行划分上。超过一半到达了 QUBO 的基态，而那正是前面找到的不连通划分；其余的停在其他局部极小值上，结果也不更好。换用更强的优化器也无济于事：QUBO 所能描述的能量最低的划分本身就不可行，因为连通性被有意排除在模型之外。贪心阶段完全按要求完成了任务，但这还不够。
  status: machine
- id: 4210b9d13621d065
  en: 'The second stage handles what the QUBO deliberately left out. When an island falls into several connected components, each stray fragment can be fixed two ways: hand it to a neighboring island, or annex the buses along the shortest path back to the island''s main body. Both moves are constructed, scored with the model''s own energy, and the better one wins.'
  zh: 第二阶段处理 QUBO 有意略去的部分。当一个孤岛分裂成多个连通分量时，每个游离碎片都有两种修复方式：把它交给相邻的孤岛，或者把沿最短路径连回该孤岛主体的节点并入。两种方案都会生成出来，用模型自身的能量打分，取较优者。
  status: machine
- id: eb76c93370d86f56
  en: In this run the QAOA samples reach the answer somewhat more often after repair, but uniform random bitstrings already reach it most of the time, so one run does not establish an advantage.
  zh: 在这次运行中，QAOA 样本经修复后得到答案的频率略高，但均匀随机比特串在大多数情况下也已经能得到答案，因此仅凭一次运行并不能证明存在优势。
  status: machine
