- id: 54027e6812e01b5a
  en: 'Two families pin down $|\mathrm{GHZ}_8\rangle$. Each neighbor parity $\langle Z_i Z_{i+1}\rangle = 1$ says adjacent atoms always agree -- something the classical mixture also satisfies. The global $X$-parity $\langle X_0 X_1 \cdots X_7\rangle = 1$ is the discriminator: it equals $+1$ only for the coherent superposition and averages to $0$ for the mixture. Observing both confirms a true GHZ state.'
  zh: 两类可观测量可以确定 $|\mathrm{GHZ}_8\rangle$。每个近邻奇偶性 $\langle Z_i Z_{i+1}\rangle = 1$ 表示相邻原子的结果总是一致——经典混合态同样满足这一点。全局 $X$ 奇偶性 $\langle X_0 X_1 \cdots X_7\rangle = 1$ 才是区分二者的判据：只有相干叠加态使它等于 $+1$，而它在混合态上的平均值为 $0$。两者都观测到，才能确认这是真正的 GHZ 态。
  status: retired
- id: 38ce5b51e9de9c9d
  en: Every observable returns $+1$, including the global $X$-parity, so the state is the coherent GHZ superposition rather than a classical mixture that would merely reproduce its counts.
  zh: 所有可观测量都返回 $+1$，包括全局 $X$ 奇偶性，因此该态是相干的 GHZ 叠加态，而不是仅能复现相同计数的经典混合态。
  status: retired
- id: 898a53cc5fc106ed
  en: 'A lost atom is neither in $|0\rangle$ nor in $|1\rangle$: it is *gone*, and reads out as the erasure digit `2`, distinct from either computational outcome. Any shot whose bitstring contains a `2` therefore had at least one atom fall out during transport.'
  zh: 丢失的原子既不处于 $|0\rangle$，也不处于 $|1\rangle$：它已经*不在阱中*，读出时显示为擦除数字 `2`，与两种计算基结果都不同。因此，只要某次采样的比特串中含有 `2`，就说明至少有一个原子在输运过程中丢失。
  status: retired
- id: ad715a1db01c70cf
  en: In this run 469 of the 2000 shots, 23.5%, contain a `2`. Counting each atom in each `Pair` and `Unpair`, the program makes 28 atom moves, so with a 1% loss per move about $1 - 0.99^{28} \approx 25\%$ of shots should lose at least one atom. The most frequent loss outcomes have a single `2` at atom `0` or `4`, which move six times each, followed by atoms `2` and `6`, which move four times.
  zh: 在本次运行中，2000 次采样里有 469 次（23.5%）含有 `2`。把每次 `Pair` 和 `Unpair` 中的每个原子都计为一次移动，程序共移动原子 28 次；若每次移动的丢失概率为 1%，预计约有 $1 - 0.99^{28} \approx 25\%$ 的采样至少丢失一个原子。最常见的丢失结果是在原子 `0` 或 `4` 处出现单个 `2`，这两个原子各移动 6 次；其次是原子 `2` 和 `6`，各移动 4 次。
  status: retired
