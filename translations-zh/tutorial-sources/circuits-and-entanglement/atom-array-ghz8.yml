  zh: 本教程在 fatqat 的中性原子执行目标 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 上创建八原子 Greenberger-Horne-Zeilinger（GHZ）态。相比双量子比特 Bell 教程，它在两方面更进一步：量子态跨越八个原子而非两个，并且线路运行在一个双量子比特门连通性*在线路中途重新配置*而非固定不变的后端上。
  status: retired
