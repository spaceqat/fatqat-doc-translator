  en: In this run 469 of the 2000 shots, 23.5%, contain a `2`. Counting each atom in each `Pair` and `Unpair`, the program makes 28 atom moves, so with a 1% loss per move about $1 - 0.99^{28} \approx 25\%$ of shots should lose at least one atom.
  zh: 在本次运行中，2000 次采样里有 469 次（23.5%）含有 `2`。把每次 `Pair` 和 `Unpair` 中的每个原子都计为一次移动，程序共移动原子 28 次；若每次移动的丢失概率为 1%，预计约有 $1 - 0.99^{28} \approx 25\%$ 的采样至少丢失一个原子。
