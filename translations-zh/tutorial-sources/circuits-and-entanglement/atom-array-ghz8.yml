- id: e0858691f131201b
  en: The tree deliberately couples atoms that are far apart. Layer 1 entangles atoms `0` and `4`; layer 2 needs `0` with `2` and `4` with `6`; layer 3 needs `0` with `1`. Atom `0` therefore needs three partners, which no fixed one-dimensional layout can provide, because each site in a line has at most two neighbours.
  zh: 这棵树有意耦合相距较远的原子。第 1 层纠缠原子 `0` 和 `4`；第 2 层需要 `0` 与 `2`、`4` 与 `6` 相互作用；第 3 层需要 `0` 与 `1` 相互作用。因此原子 `0` 需要三个伙伴，而任何固定的一维布局都无法满足，因为直线上的每个位置最多只有两个邻居。
  status: machine
