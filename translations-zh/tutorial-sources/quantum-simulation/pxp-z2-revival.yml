- id: e7e53de75a66f1ad
  en: 'Ten sites, working in rad/µs and µs units, and the familiar drive scale $\Omega=2\pi$ rad/µs, so the PXP coefficient is $g=\pi$ rad/µs. One convention to keep straight: FatQat stores the amplitude of $|b_0\ldots b_9\rangle$ at index $\sum_i b_i 2^{N-1-i}$ (site 0 is the most significant bit), so each Néel state is a single basis vector -- just two index numbers to remember.'
  zh: 我们使用十个格点，以 rad/µs 和 µs 为单位，并采用常见的驱动尺度 $\Omega=2\pi$ rad/µs，因此 PXP 系数为 $g=\pi$ rad/µs。有一个约定需要分清：FatQat 将 $|b_0\ldots b_9\rangle$ 的振幅存放在索引 $\sum_i b_i 2^{N-1-i}$ 处（格点 0 是最高有效位），因此每个 Néel 态都是单个基矢，只需记住两个索引值。
  status: machine
- id: 34b0a0781304f01c
  en: Trotterizing PXP into a FatQat program
  zh: 将 PXP Trotter 化为 FatQat 程序
  status: machine
- id: 7e8a771e969e0599
  en: Two constraints decided the approach. First, as noted above, the pulse emulators cannot start from $|Z_2\rangle$; the gate-level [`Simulator`][fatqat.simulator.Simulator], on the other hand, accepts an `initial_state`. Second, no native gate set contains a PXP term, so we use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to supply a local matrix for each PXP operation.
  zh: 有两个限制决定了这种做法。第一，如上所述，脉冲仿真器无法从 $|Z_2\rangle$ 开始；而门级 [`Simulator`][fatqat.simulator.Simulator] 接受 `initial_state`。第二，原生门集中没有 PXP 项，因此我们用 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 为每个 PXP 操作提供局部矩阵。
  status: machine
- id: 0aafb0ac266fdeb7
  en: Note that when FatQat flattens a local matrix, the FIRST target is the most significant bit -- index $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$. It is easy to get this backwards, and the result is silently wrong dynamics rather than an error message.
  zh: 注意，FatQat 展平局部矩阵时，第一个目标是最高有效位，即索引 $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$。这一点很容易弄反，而且弄反后不会报错，只会悄无声息地得到错误的动力学。
  status: machine
- id: 9e40865072487336
  en: The exact oracle
  zh: 精确参考解
  status: machine
- id: 7571221e4e174bcf
  en: 'FatQat''s own physics tests check numerics against an independent oracle, so we do the same here: assemble the exact PXP Hamiltonian directly with QuTiP and solve it once over the whole time grid, starting from the same $|Z_2\rangle$ vector.'
  zh: FatQat 自身的物理测试会用独立的参考解核验数值结果，这里也照此进行：直接用 QuTiP 建立精确的 PXP 哈密顿量，从同一个 $|Z_2\rangle$ 向量出发，在整个时间网格上一次性求解。
  status: machine
- id: c7679e357a4a83cb
  en: 'What to measure: fidelity and half-chain entropy'
  zh: 要测量的量：保真度与半链熵
  status: machine
- id: 8e2a7ee713717b49
  en: The fidelity $F(t)=|\langle Z_2|\psi(t)\rangle|^2$ says how much of the state comes back, and the fidelity to the twin branch tells us whether a revival lands on the *same* Néel orientation or the mirrored one. The half-chain von Neumann entropy
  zh: 保真度 $F(t)=|\langle Z_2|\psi(t)\rangle|^2$ 表示态有多少回到了初态；与孪生分支的保真度则告诉我们，复苏回到的是*同一个* Néel 取向还是其镜像。半链 von Neumann 熵
  status: machine
- id: 3ba301ad4d1569f1
  en: with $A$ the first five sites, tracks how entangled the two halves get. Both curves come from the same small helpers, so the FatQat and oracle numbers are directly comparable.
  zh: 其中 $A$ 为前五个格点，它跟踪链的左右两半之间纠缠的程度。两条曲线都由同一组小辅助函数计算，因此 FatQat 与参考解的数值可以直接比较。
  status: machine
- id: 3c8f985fb9fe8d1d
  en: Run the quench and collect the time series
  zh: 运行淬火并收集时间序列
  status: machine
- id: 598e41995b39d4c7
  en: Revival peaks are just local maxima of the fidelity after the initial decay. Notice that each peak lands on the *same* Néel branch -- the twin-branch fidelity stays negligible there, so the state really does come back to where it started.
  zh: 复苏峰就是保真度在初始衰减之后的局部极大值。注意每个峰都落在*同一个* Néel 分支上：此时孪生分支的保真度可以忽略，因此态确实回到了它的出发点。
  status: machine
- id: b4a30ca8ffdb26e8
  en: Read the revival and the entropy growth
  zh: 解读复苏与熵增长
  status: machine
- id: c371a23deacee0dc
  en: 'The left panel shows the revivals around $t\approx 1.5, 3.0, 4.5, 5.9$ µs, each a little weaker than the last -- the fingerprint of PXP scars. The middle panel shows why these dynamics are not thermal: the half-chain entropy grows, but it *dips* at every revival, as if the state briefly remembered how to be a product state again. The right panel tells the same story in real space, with the Néel stripes melting during the quench and partially reassembling each time the fidelity peaks.'
  zh: 左图显示了 $t\approx 1.5, 3.0, 4.5, 5.9$ µs 附近的复苏，每次都比前一次稍弱，这是 PXP 疤痕的标志。中图说明这些动力学为何不是热化的：半链熵在增长，但在每次复苏时都会*回落*，仿佛态短暂地记起了如何重新成为乘积态。右图在实空间中呈现同样的过程：Néel 条纹在淬火中逐渐消融，并在每次保真度达到峰值时部分重新出现。
  status: machine
- id: 32ded8937adb0820
  en: The Trotter and exact curves differ by less than $10^{-3}$, so the second-order Trotter step with $dt=0.01$ µs reproduces the exact PXP dynamics. The peaks are spaced by about 1.5 µs, consistent with $T\approx 4.7/g$, and at each peak the state returns to its own Néel configuration rather than to $|\bar Z_2\rangle$.
  zh: Trotter 曲线与精确曲线之差小于 $10^{-3}$，因此 $dt=0.01$ µs 的二阶 Trotter 步重现了精确的 PXP 动力学。峰间距约为 1.5 µs，与 $T\approx 4.7/g$ 一致；在每个峰处，态回到的是它自己的 Néel 构型，而不是 $|\bar Z_2\rangle$。
  status: machine
- id: a558db3e392ae1be
  en: Custom operations with a `MatrixImplementationMap` and a chosen `initial_state` let FatQat's gate-level simulator study a constrained model that the pulse emulators cannot start from.
  zh: 借助 `MatrixImplementationMap` 定义的自定义操作和指定的 `initial_state`，FatQat 的门级模拟器可以研究脉冲仿真器无法从所需初态开始的受约束模型。
  status: retired
