  en: We use ten sites, times in µs, and rates in rad/µs. The drive $\Omega=2\pi$ rad/µs gives the PXP coefficient $g=\pi$ rad/µs. FatQat stores the amplitude of $|b_0\ldots b_9\rangle$ at index $\sum_i b_i 2^{N-1-i}$, so site 0 is the most significant bit and each Néel state is a single basis vector.
  zh: 我们使用十个格点，时间以 µs 为单位，速率以 rad/µs 为单位。驱动 $\Omega=2\pi$ rad/µs 对应 PXP 系数 $g=\pi$ rad/µs。FatQat 将 $|b_0\ldots b_9\rangle$ 的振幅存放在索引 $\sum_i b_i 2^{N-1-i}$ 处，因此格点 0 对应最高有效位，每个 Néel 态都是单个基矢。
