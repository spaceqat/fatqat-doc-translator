- id: 5e8d36c73323de1c
  en: The Trotter and exact fidelity curves differ by at most 0.00059, so the second-order Trotter step with $dt=0.01$ µs reproduces the exact PXP dynamics on this time scale. The return probability falls to zero within about 0.3 µs and then recovers in sharp peaks at 1.50, 2.95, 4.45, and 5.90 µs, with fidelities 0.768, 0.618, 0.482, and 0.359. The peaks are spaced by about 1.5 µs, consistent with the estimate $T\approx 4.7/g$. Their fidelity to $|\bar Z_2\rangle$ is at most 0.007, so the state returns to its own Néel configuration.
  zh: Trotter 与精确解的保真度曲线之差至多为 0.00059，因此 $dt=0.01$ µs 的二阶 Trotter 步在该时间尺度上重现了精确的 PXP 动力学。返回概率在约 0.3 µs 内降到零，随后在 1.50、2.95、4.45 和 5.90 µs 处以尖峰形式恢复，保真度分别为 0.768、0.618、0.482 和 0.359。峰间距约为 1.5 µs，与估计 $T\approx 4.7/g$ 一致。这些峰处与 $|\bar Z_2\rangle$ 的保真度至多为 0.007，因此态回到的是它自己的 Néel 构型。
  status: retired
