  zh: 其主导误差是各 $h_j$ 之间的对易子。对称（Strang）步可以消除这一主导误差：把每一项拆成两个半角，先按正序作用，再按逆序作用同样的半角，
  status: retired
- id: 15ad972da6cad45e
  en: In the code, the forward pass is `for site in range(NUM_SITES)` (left edge, bulk terms, right edge), and the backward pass is the same loop in reverse. Each half-step exponent is $h_j\,dt/2$, and $h_j$ already contains $\Omega/2$, so every registered matrix uses the angle $\theta=\Omega\,dt/4$. Repeating the symmetric step `round(duration / dt)` times evolves the state for durations that are integer multiples of `dt`.
  zh: 代码中，正向遍历为 `for site in range(NUM_SITES)`（左边界、体项、右边界），反向遍历则是同一循环的逆序。每个半步的指数为 $h_j\,dt/2$，而 $h_j$ 已包含 $\Omega/2$，因此每个注册的矩阵都使用角度 $\theta=\Omega\,dt/4$。将对称步重复 `round(duration / dt)` 次，即可让态演化 `dt` 整数倍的时长。
  status: retired
- id: e907e20350c090df
  en: 'When FatQat flattens a local matrix, the first target is the most significant bit: the index is $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$. Reversing this order would make the edge terms act on the wrong site. The result would be incorrect dynamics, not an error message.'
  zh: FatQat 展平局部矩阵时，第一个目标对应最高有效位：索引为 $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$。若把这个顺序弄反，边界项就会作用在错误的格点上。其后果是动力学出错，而不会报错。
  status: retired
