  status: retired
- id: f1ac339b77561635
  en: 'with open boundaries, meaning $P_{-1}=P_L=1$. Read each term out loud: site $i$ may flip, but only while both of its neighbours sit in $|g\rangle$. The bulk terms involve three sites; the two boundary terms, $X_0 P_1$ and $P_{L-2}X_{L-1}$, only two.'
  zh: 这里采用开放边界，即 $P_{-1}=P_L=1$。每一项的含义是：只有两个近邻都处于 $|g\rangle$ 时，格点 $i$ 才能翻转。链内部的项涉及三个格点，边界项 $X_0 P_1$ 和 $P_{L-2}X_{L-1}$ 则只涉及两个。
  status: retired
- id: 9e082ebf36b0ef42
  en: 'A word on scope: this is an ideal model study. The constraint is imposed exactly (not approximated by a big-but-finite $U$), and there is no decoherence and no atom loss.'
  zh: 关于范围的说明：这是一个理想模型研究。约束是精确施加的（而不是用一个很大但有限的 $U$ 来近似），也不考虑退相干和原子丢失。
  status: machine
- id: e352925c0a507d77
  en: 2. The Z2 state and why it revives
  zh: 2. Z2 态及其复苏的原因
  status: retired
- id: b2684425cab669ef
  en: Two Neel configurations live inside the constrained subspace,
  zh: 受约束子空间中包含两个 Neel 构型，
  status: retired
- id: 5ef459440c9ded7a
  en: We prepare $|Z_2\rangle$, let it go, and watch the return probability $F(t)=|\langle Z_2|\psi(t)\rangle|^2$. A handful of special scarred eigenstates dominate this quench, so $F(t)$ oscillates with a period near $T\approx 4.7/g$, where $g=\Omega/2$ is the PXP coefficient. For the drive used below that means $T\approx 1.5$ us -- but rather than trusting the estimate, we will simply measure where the peaks actually land.
  zh: 我们制备 $|Z_2\rangle$，放手让它演化，并观察返回概率 $F(t)=|\langle Z_2|\psi(t)\rangle|^2$。少数特殊的疤痕本征态主导了这次淬火，因此 $F(t)$ 以接近 $T\approx 4.7/g$ 的周期振荡，其中 $g=\Omega/2$ 是 PXP 系数。对于下面使用的驱动，这意味着 $T\approx 1.5$ us——但与其相信这个估计，我们不如直接测量峰值实际落在哪里。
  status: retired
- id: a00b1f6295c53c7f
  en: Imports, constants, and the Z2 vector
  zh: 导入、常量与 Z2 向量
  status: machine
- id: 735ebb315bf89414
  en: 'Ten sites, working in rad/us and us units, and the familiar drive scale $\Omega=2\pi$ rad/us, so the PXP coefficient is $g=\pi$ rad/us. One convention to keep straight: FATQAT stores the amplitude of $|b_0\ldots b_9\rangle$ at index $\sum_i b_i 2^{N-1-i}$ (site 0 is the most significant bit), so each Neel state is a single basis vector -- just two index numbers to remember.'
  zh: 使用十个位置，单位为 rad/us 和 us，并采用熟悉的驱动尺度 $\Omega=2\pi$ rad/us，因此 PXP 系数为 $g=\pi$ rad/us。需明确一个约定：FATQAT 将 $|b_0\ldots b_9\rangle$ 的振幅存放在索引 $\sum_i b_i 2^{N-1-i}$ 处，位置 0 为最高有效位。因此，每个 Néel 态都只是一个基向量，只需记住两个索引。
  status: retired
- id: 358c7c83cbe273ed
  en: 3. Trotterizing PXP into a fatqat program
  zh: 3. 把 PXP Trotter 分解为 fatqat 程序
  status: retired
- id: f8c161b6503ae29e
  en: Two constraints decided the approach. First, the pulse emulators always start from $|g\ldots g\rangle$ and only offer global controls, so a quench from $|Z_2\rangle$ is simply not expressible there; the gate-level [`Simulator`][fatqat.simulator.Simulator], on the other hand, happily accepts an `initial_state`. Second, no native gate set contains a PXP term, so we use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to supply a local matrix for each PXP operation.
  zh: 这里的方案由两个限制决定。首先，脉冲仿真器总是从 $|g\ldots g\rangle$ 出发，而且只提供全局控制，因此无法表示从 $|Z_2\rangle$ 开始的淬火过程；门级 [`Simulator`][fatqat.simulator.Simulator] 则可以通过 `initial_state` 指定初态。其次，原生门集中没有 PXP 项，所以我们用 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 为每个 PXP Operation 提供局部矩阵。
  status: retired
- id: 3844729635724a7b
  en: The exponentials we need are easy to write down. With $M=PXP$ and $M^2=P\otimes I\otimes P$,
  zh: 所需的指数很容易写出。取 $M=PXP$，且 $M^2=P\otimes I\otimes P$，
  status: machine
- id: c5d1095ee4717ed0
  en: Concretely, that is a $2\times 2$ rotation between $|ggg\rangle$ and $|grg\rangle$ for a bulk term, and between $|gg\rangle$ and $|rg\rangle$ (left edge) or $|gg\rangle$ and $|gr\rangle$ (right edge) for the boundary terms. Each matrix is built once, checked to be unitary, and registered under its operation class.
  zh: 具体来说，对体项，这是 $|ggg\rangle$ 与 $|grg\rangle$ 之间的 $2\times 2$ 旋转；对边界项，则是 $|gg\rangle$ 与 $|rg\rangle$（左边界）或 $|gg\rangle$ 与 $|gr\rangle$（右边界）之间的旋转。每个矩阵只生成一次，经过幺正性检查后注册到对应的操作类下。
  status: machine
- id: 38cb3c48923c07f4
  en: Now for the actual time evolution. We want $e^{-iH_{\mathrm{PXP}}dt}$, where $H_{\mathrm{PXP}}=\sum_j h_j$ with $h_j=(\Omega/2)M_j$. The $h_j$'s do not commute, so the exponential does not factor into a product of the individual $e^{-ih_j dt}$'s -- it has to be approximated. The first-order Trotter formula just sweeps the terms once,
  zh: 下面进行真正的时间演化。我们需要 $e^{-iH_{\mathrm{PXP}}dt}$，其中 $H_{\mathrm{PXP}}=\sum_j h_j$，$h_j=(\Omega/2)M_j$。各 $h_j$ 互不对易，因此该指数不能分解为各个 $e^{-ih_j dt}$ 的乘积，必须做近似。一阶 Trotter 公式只是把各项依次作用一遍，
  status: machine
- id: 8bb547b29d7342b9
  en: 'and its leading error is a commutator of the $h_j$''s. A symmetric (Strang) step removes that leading error: split every term into two half angles, sweep forward, then sweep the same half angles backward,'
  zh: 其主导误差是各 $h_j$ 之间的对易子。对称（Strang）步可以消除这一主导误差：把每一项拆成两个半角，先按正序作用一遍，再按逆序作用同样的半角，
  status: machine
- id: 403d59f01d13d8cf
  en: In code, the forward pass is `for site in range(NUM_SITES)` -- left edge, then the bulk terms, then the right edge -- and the backward pass is the same loop in reverse. Each half-step exponent is $h_j\,dt/2$, and $h_j$ already carries $\Omega/2$, so every registered matrix uses the one angle $\theta=\Omega\,dt/4$. Repeating this symmetric step `round(duration / dt)` times walks the quench out to durations that are integer multiples of `dt`.
  zh: 代码中，正向遍历为 `for site in range(NUM_SITES)`，依次经过左边界、体项和右边界；反向遍历则是同一循环的逆序。每个半步的指数为 $h_j\,dt/2$，而 $h_j$ 已包含 $\Omega/2$，因此每个注册的矩阵都使用同一个角度 $\theta=\Omega\,dt/4$。将对称步重复 `round(duration / dt)` 次，即可把淬火演化推进到 `dt` 整数倍的时长。
  status: machine
- id: 9d1f96b180a23ce4
  en: 'A small warning from experience: when fatqat flattens a local matrix, the FIRST target is the most significant bit -- index $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$. It is easy to get this backwards (we did), and the result is silently wrong dynamics rather than an error message.'
  zh: 一个来自实践的小提醒：当 fatqat 展平局部矩阵时，第一个目标是最高有效位——索引为 $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$。这一点很容易弄反（我们就弄反过），后果是悄无声息的错误动力学，而不是一条错误信息。
  status: retired
- id: 0a86841c1163bb47
  en: 4. The exact oracle
  zh: 4. 精确对照（oracle）
  status: retired
- id: b57c7ec9be57aa34
  en: 'Never trust a hand-built Trotter circuit without a second opinion. fatqat''s own physics tests check numerics against an independent oracle, so we do the same here: assemble the exact PXP Hamiltonian directly with QuTiP and solve it once over the whole time grid, starting from the same $|Z_2\rangle$ vector.'
  zh: 手工编写的 Trotter 线路需要独立结果来核验。fatqat 的物理测试也采用这种方法：这里直接用 QuTiP 构造精确的 PXP 哈密顿量，从相同的 $|Z_2\rangle$ 出发，一次求解整个时间网格，再与线路模拟比较。
  status: retired
- id: 7cc4caa86a408c3e
  en: '5. What to measure: fidelity and half-chain entropy'
  zh: 5. 测什么：保真度与半链熵
  status: retired
- id: 233adac0fddee8d5
  en: Two numbers tell the whole story. The fidelity $F(t)=|\langle Z_2|\psi(t)\rangle|^2$ says how much of the state comes back, and the fidelity to the twin branch tells us whether a revival lands on the *same* Neel orientation or the mirrored one. The half-chain von Neumann entropy
  zh: 主要看保真度和纠缠熵两个指标。保真度 $F(t)=|\langle Z_2|\psi(t)\rangle|^2$ 衡量量子态返回初态的程度；与另一条分支的保真度则帮助判断，复苏时回到的是*相同的* Neel 取向，还是镜像取向。半链 von Neumann 熵为
  status: retired
- id: ece6693024fffa8c
  en: with $A$ the first five sites, tracks how entangled the two halves get. Both curves come from the same small helpers, so the fatqat and oracle numbers are directly comparable.
  zh: 其中 $A$ 为前五个格点，它追踪两半链之间的纠缠程度。两条曲线都来自同一组小的辅助函数，因此 fatqat 与对照的数值可以直接比较。
  status: retired
- id: efff7dd531d18964
  en: 6. Run the quench and collect the time series
  zh: 6. 运行淬火并收集时间序列
  status: retired
- id: 54738af626f46c87
  en: Build one Trotter program for the interval between samples. Starting from $|Z_2\rangle$, pass each final state into the next run through `initial_state`. For this noiseless, time-independent quench, a uniform, Trotter-aligned grid gives the same ordered evolution at each sample as restarting from the initial state.
  zh: 为相邻采样时刻之间的时间间隔编写一个 Trotter 程序。从 $|Z_2\rangle$ 出发，通过 `initial_state` 把每次运行的末态传给下一次运行。对于这个无噪声、不含时的淬火，只要时间网格均匀且与 Trotter 步长对齐，这样逐段演化在每个采样时刻得到的态，就与从初态重新演化的结果相同。
  status: machine
- id: a105df806941eff7
  en: Revival peaks are just local maxima of the fidelity after the initial decay. Notice that each peak lands on the *same* Neel branch -- the twin-branch fidelity stays negligible there, so the state really does come back to where it started.
  zh: 复苏峰不过是初始衰减之后保真度的局部极大值。注意每个峰都落在*同一个* Neel 分支上——孪生分支的保真度在那里始终可以忽略，因此态确实回到了它出发的地方。
  status: retired
- id: 276c31b8dc599493
  en: 7. Read the revival and the entropy growth
  zh: 7. 解读复苏与熵增长
  status: retired
- id: 47bf563363e4b866
  en: 'The left panel is the money plot: three revivals around $t\approx 1.5, 3.0, 4.5$ us, each a little weaker than the last -- the fingerprint of PXP scars. The middle panel shows why these dynamics are not thermal: the half-chain entropy grows, but it *dips* at every revival, as if the state briefly remembered how to be a product state again. The right panel tells the same story in real space, with the Neel stripes melting during the quench and partially reassembling each time the fidelity peaks.'
  zh: 左图显示了最主要的结果：在 $t\approx 1.5, 3.0, 4.5$ us 附近出现三次逐渐减弱的复苏，这是 PXP 多体疤痕的典型特征。中图中，半链熵整体增长，却在每次复苏时*下降*，表明系统短暂地更接近直积态，这与通常的热化过程不同。右图从实空间展示同一过程：Neel 条纹在淬火演化中逐渐消失，并在保真度峰值附近部分恢复。
  status: retired
