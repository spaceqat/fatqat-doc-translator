  en: The half-chain entropy grows over the quench, from 0.278 at the first revival to 0.918 at the fourth, and reaches 0.938 within the 6 µs window. The growth slows or briefly reverses near each revival instead of increasing steadily. In the occupation panel, the alternating pattern of the Néel state fades during each period and partly reappears at each revival, with lower contrast each time.
  zh: 半链熵在淬火过程中增长，从第一次复苏时的 0.278 增加到第四次复苏时的 0.918，并在 6 µs 的时间窗口内达到 0.938。它并非稳定增长，而是在每次复苏附近放缓或短暂回落。在占据概率图中，Néel 态的交替图样在每个周期内逐渐消退，又在每次复苏时部分重现，且对比度一次比一次低。
  status: retired
