- id: 0230d4ce555b5150
  en: For each grid time we rebuild the Trotter program (it grows with the duration) and evolve it once from $|Z_2\rangle$; the oracle hands us the corresponding exact state. It is a bit of a brute-force way to sample a time axis, but it keeps everything on the public API -- and the ten-site chain is small enough that it finishes in seconds.
  zh: 对每个网格时间点，我们重建 Trotter 程序（它随时长增长）并从 $|Z_2\rangle$ 演化一次；对照则交给我们对应的精确态。用这种方式采样时间轴略显笨拙，但它把一切都保持在公共 API 上——而十格点的链足够小，几秒内就能完成。
  status: retired
- id: 7d5fb68bab2fd30e
  en: Observe Z₂ revivals and entanglement in a PXP chain
  zh: 观察 PXP 链中 Z₂ 态的复苏与纠缠
  status: machine
- id: 79abe33e357c3199
  en: Trotterize the constrained PXP Hamiltonian, quench a ten-site chain from the Z₂ Néel state, and compare its revivals and half-chain entropy with an exact QuTiP solution.
  zh: 对受约束的 PXP 哈密顿量做 Trotter 分解，让十格点链从 Z₂ Néel 态开始淬火，并将其复苏和半链纠缠熵与 QuTiP 精确解比较。
  status: machine
- id: e2e7b2a598ed5b20
  en: In the limit of strong Rydberg blockade, a driven chain of atoms is described by the PXP model. In this tutorial, we quench a ten-site open PXP chain from the Néel state $|Z_2\rangle = |r\,g\,r\,g\,\ldots\rangle$ and follow how much of the initial state returns and how entangled the two halves of the chain become.
  zh: 在里德堡阻塞很强的极限下，受驱动的原子链可以用 PXP 模型描述。本教程让一条十格点、开边界的 PXP 链从 Néel 态 $|Z_2\rangle = |r\,g\,r\,g\,\ldots\rangle$ 开始淬火，跟踪初态能恢复多少，以及链的左右两半纠缠到什么程度。
  status: retired
- id: 21c2aa1cec553660
  en: An interacting chain of this size would generally thermalize and lose the memory of its initial product state. Most initial states of the PXP chain behave this way, but $|Z_2\rangle$ returns close to itself at regular intervals. These revivals are associated with quantum many-body scars (see [Turner et al., Nature Physics 14, 745 (2018)](https://doi.org/10.1038/s41567-018-0137-5)). The half-chain entanglement entropy grows during the quench and decreases near each revival.
  zh: 这种规模的相互作用链一般会热化，失去对初始直积态的记忆。PXP 链的大多数初态都是如此，但 $|Z_2\rangle$ 会以规则的时间间隔回到自身附近。这种复苏与量子多体疤痕有关（参见 [Turner et al., Nature Physics 14, 745 (2018)](https://doi.org/10.1038/s41567-018-0137-5)）。半链纠缠熵在淬火过程中增长，并在每次复苏附近减小。
  status: retired
