- id: df1815ad6749aba6
  en: '[`PhaseDamping`][fatqat.noise.PhaseDamping] reduces coherence between energy levels without changing the probability of finding the system in each level.'
  zh: '[`PhaseDamping`][fatqat.noise.PhaseDamping] 让不同能级之间的相干性减弱，各能级的占据概率保持不变。'
  status: machine
- id: 14a8aa91b2fa681f
  en: Supply exactly one parameter. Use `p` in a simulator. In a pulse emulator, specify the rate with `rate` or the pure-dephasing time with `t_phi`. In a multilevel system, the simulator and emulator describe different coherence decay.
  zh: 三个参数只选一个。模拟器用 `p`，脉冲仿真器可以用 `rate` 指定速率，也可以用 `t_phi` 指定纯退相位时间。在多能级系统里，两种后端的相干性衰减规律不同。
  status: machine
