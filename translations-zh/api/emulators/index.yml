- id: d10c6c057a325847
  en: FatQat provides [transmon](../pulse-emulator.md) and [neutral-atom](../atom-emulators.md) pulse emulators. See [Pulse control](../pulse-control/index.md) for shared control values, or [Simulators](../simulators/index.md) for gate-level simulation. The guided path begins with [Follow a Program into physical dynamics](../../guide/hamiltonian-emulation.md).
  zh: FatQat 提供 [transmon](../pulse-emulator.md) 和[中性原子](../atom-emulators.md)脉冲仿真器。有关共享的控制值，参见[脉冲控制](../pulse-control/index.md)；有关门级模拟，参见[模拟器](../simulators/index.md)。入门讲解从[用 Program 模拟物理动力学](../../guide/hamiltonian-emulation.md)开始。
  status: retired
