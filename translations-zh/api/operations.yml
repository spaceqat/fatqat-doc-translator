- id: 512a30b73eaed878
  en: An operation describes what to apply to a program's targets. Pass parameter-free operations such as `ops.H` directly to [`Program.add()`][fatqat.Program.add]. Call a parameterized constructor such as `ops.RX(0.2)` first.
  zh: 操作说明要对程序中的目标做什么。`ops.H` 这类无参数操作可以直接传给 [`Program.add()`][fatqat.Program.add]；有参数的门则先用 `ops.RX(0.2)` 这样的构造函数创建，再传进去。
  status: machine
- id: 2d57ffadd76b16aa
  en: Create measurements with [`measure()`][fatqat.Program.measure] or [`measure_all()`][fatqat.Program.measure_all]. For target forms and conditions, see [`Program.add()`][fatqat.Program.add]. The backend checks whether it can run the requested operations.
  zh: 用 [`measure()`][fatqat.Program.measure] 或 [`measure_all()`][fatqat.Program.measure_all] 添加测量。目标和条件怎么传，见 [`Program.add()`][fatqat.Program.add]。具体操作能不能运行，由后端检查。
  status: machine
