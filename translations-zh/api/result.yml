  en: '| `"counts"` | [`get_counts`][fatqat.Result.get_counts] or [`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples] | A backend run with measurement counts |'
  zh: '| `"counts"` | [`get_counts`][fatqat.Result.get_counts] 或 [`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples] | 后端返回测量计数时 |'
  status: machine
- id: 4fb9b5bc156f9d91
  en: '| `"statevector"` | [`get_statevector`][fatqat.Result.get_statevector] | A statevector run with final-state output enabled |'
  zh: '| `"statevector"` | [`get_statevector`][fatqat.Result.get_statevector] | 用态矢量方法运行并返回最终态时 |'
  status: machine
- id: f297810ede9611c0
  en: '| `"density_matrix"` | [`get_density_matrix`][fatqat.Result.get_density_matrix] | A density-matrix run with final-state output enabled |'
  zh: '| `"density_matrix"` | [`get_density_matrix`][fatqat.Result.get_density_matrix] | 用密度矩阵方法运行并返回最终态时 |'
