- id: 72e1dc699fb37306
  en: Use [`Simulator.run()`][fatqat.simulator.Simulator.run] and [`Simulator.run_sweep()`][fatqat.simulator.Simulator.run_sweep] to run an optical program. The class reference below covers the optical method and cutoff, and includes a two-photon beam splitter example.
  zh: 运行光学程序沿用 [`Simulator.run()`][fatqat.simulator.Simulator.run] 和 [`Simulator.run_sweep()`][fatqat.simulator.Simulator.run_sweep]。下面的类参考说明光学模拟方法和光子数上限，并给出两个光子进入分束器的例子。
  status: machine
- id: 5b4a57c92b175783
  en: '[`LOSimulator`][fatqat.simulator.LOSimulator] runs programs with photons in optical modes. Use it to compute the output photon counts or amplitudes of a linear-optical circuit.'
  zh: '[`LOSimulator`][fatqat.simulator.LOSimulator] 运行以光学模式描述光子的程序。可以用它计算线性光学线路输出的光子计数或振幅。'
  status: machine
- id: 84f0aeee1b2415a2
  en: Configure an optical run
  zh: 设置光学模拟
  status: machine
- id: 3ab407b9e63bd350
  en: When passing a `noise` model, use device labels to select optical modes.
  zh: 通过 `noise` 传入噪声模型时，用设备标签指定光学模式。
  status: machine
- id: 33d0762e53b0d0e9
  en: Pass the photon counts in the mode order recorded in `metadata["state_axes"]`.
  zh: 传入各模式的光子数时，按 `metadata["state_axes"]` 记录的模式顺序排列。
  status: machine
