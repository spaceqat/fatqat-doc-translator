- id: 24a37eaf20a2a41e
  en: LOSimulator
  zh: LOSimulator
  status: machine
- id: 9ac80e2eeb6f6fcc
  en: '[`LOSimulator`][fatqat.simulator.LOSimulator] is a [`Simulator`](../simulator.md) for Programs with optical modes. It runs, returns results, and handles noise and sweeps like `Simulator`, except as listed below. For a worked example, see [Simulate linear optics](../../guide/linear-optics.md).'
  zh: '[`LOSimulator`][fatqat.simulator.LOSimulator] 是用于含光学模式的 Program 的 [`Simulator`](../simulator.md)。除下列区别外，其执行、结果返回、噪声处理和参数扫描均与 `Simulator` 相同。完整示例见[线性光学模拟](../../guide/linear-optics.md)。'
  status: machine
- id: bb075b3e25ea22b6
  en: '**Differences from `Simulator`**'
  zh: '**与 `Simulator` 的区别**'
  status: machine
- id: 48db188c37d058f6
  en: '| Topic | `LOSimulator` |'
  zh: '| 项目 | `LOSimulator` |'
  status: machine
- id: f0815e455eeb8172
  en: '| Registers | Also accepts [`ModeRegister`][fatqat.ModeRegister] and [`CountRegister`][fatqat.CountRegister]; `Simulator` rejects them |'
  zh: '| Registers | 还接受 [`ModeRegister`][fatqat.ModeRegister] 和 [`CountRegister`][fatqat.CountRegister]；`Simulator` 不接受这两种类型 |'
  status: machine
- id: 7ccd76781c55737a
  en: '| Methods | Adds `"fixed_photon_state"`, the default |'
  zh: '| 方法 | 新增 `"fixed_photon_state"`，并将其作为默认方法 |'
  status: machine
- id: c2be93767fa5a52f
  en: '| `simulation_config` | Adds `"cutoff"` |'
  zh: '| `simulation_config` | 新增 `"cutoff"` |'
  status: retired
- id: ee698140cfa0afbf
  en: '| [`Estimator`][fatqat.Estimator] | On a mode, accepts [`NumberOperator`][fatqat.observable.NumberOperator] and [`Projector`][fatqat.observable.Projector] up to level `cutoff`; Pauli operators raise at any cutoff |'
  zh: '| [`Estimator`][fatqat.Estimator] | 对模式接受最高至 `cutoff` 能级的 [`NumberOperator`][fatqat.observable.NumberOperator] 和 [`Projector`][fatqat.observable.Projector]；无论截断值为多少，Pauli 算符都会报错 |'
  status: machine
- id: f325511225173275
  en: '| Noise selectors | Select modes by device label; a `ModeRegister` reference is not supported |'
  zh: '| 噪声选择器 | 按设备标签选择模式；不支持 `ModeRegister` 引用 |'
  status: machine
- id: 22823497e2d96b0a
  en: '| `execution_config` | Adds `"cutoff"` |'
  zh: '| `execution_config` | 新增 `"cutoff"` |'
  status: machine
- id: df1c2f9aec65aba2
  en: '[`LOSimulator`][fatqat.simulator.LOSimulator] runs programs that describe photons in optical modes. Use it to calculate how operations such as beam splitters and phase shifters change the distribution of photons across modes.'
  zh: '[`LOSimulator`][fatqat.simulator.LOSimulator] 运行用光学模式描述光子的程序。要计算分束器、相移器等操作如何改变光子在各模式中的分布，可以用这个模拟器。'
  status: machine
- id: bc104aa146b9230d
  en: Choose an optical simulation method
  zh: 选择光学模拟方法
  status: machine
- id: 40b7f1d716afe15f
  en: Use the default `fixed_photon_state` method when the program uses only a [`ModeRegister`][fatqat.ModeRegister] or several such registers, starts in a [`BasisState`][fatqat.simulator.BasisState] or the vacuum, and preserves the total photon number. It stores amplitudes only for the arrangements possible at that photon number.
  zh: 如果程序的量子寄存器都是 [`ModeRegister`][fatqat.ModeRegister]，初态为 [`BasisState`][fatqat.simulator.BasisState] 或真空态，且演化保持总光子数，可以用默认方法 `fixed_photon_state`。它只保存这个光子数下各种分布对应的振幅。
  status: machine
- id: 59654309ae31ebf7
  en: Use `statevector` or `density_matrix` for a dense initial state, for reset or noise channels, or for a program that mixes modes with qubits. The simulator also provides the [operator methods](../simulator.md#methods).
  zh: 如果要传入数组形式的初态、模拟重置或噪声信道，或在同一程序中混用光学模式和量子比特，可以用 `statevector` 或 `density_matrix`。模拟器也提供[算符方法](../simulator.md#methods)。
  status: machine
- id: 5be366c37c77c943
  en: Set the photon cutoff
  zh: 设置光子数上限
  status: machine
- id: 184d79b5ca5f6fe9
  en: The `cutoff` sets the maximum number of photons per mode for one run. Pass it in `execution_config` to set the range from `0` through `cutoff` for each mode and each entry in a [`CountRegister`][fatqat.CountRegister].
  zh: '`cutoff` 指定单次运行中每个模式能容纳的最大光子数。通过 `execution_config` 传入该值后，每个模式和 [`CountRegister`][fatqat.CountRegister] 的每个成员都可以表示从 `0` 到 `cutoff` 的光子数。'
  status: machine
- id: 3091fe0ed82a8127
  en: When you supply a `BasisState`, the simulator can infer the cutoff from the total number of photons, with a minimum of one. It can also infer the cutoff from a compatible dense initial array. For a vacuum run with no `initial_state`, set `cutoff` explicitly.
  zh: 传入 `BasisState` 时，模拟器可以用总光子数确定上限，最小取 1。也可以从维度合适的初态数组推断上限。如果省略 `initial_state`，直接从真空态开始运行，就需要显式设置 `cutoff`。
  status: machine
- id: 69e5582d2a32a5bc
  en: Read optical results
  zh: 读取光学模拟结果
  status: machine
- id: 9f1c0128038d16f2
  en: For the fixed-photon method, [`Result.get_fixed_photon_state()`][fatqat.Result.get_fixed_photon_state] gives one amplitude per arrangement of photons. Use [`fixed_photon_index()`][fatqat.simulator.fixed_photon_index] to find an arrangement's position, and [`fixed_photon_occupation()`][fatqat.simulator.fixed_photon_occupation] to find the arrangement at a given position.
  zh: 使用固定光子数方法时，[`Result.get_fixed_photon_state()`][fatqat.Result.get_fixed_photon_state] 返回各种光子分布对应的振幅。要查某种分布在数组中的下标，用 [`fixed_photon_index()`][fatqat.simulator.fixed_photon_index]。已知下标想查各模式的光子数，则用 [`fixed_photon_occupation()`][fatqat.simulator.fixed_photon_occupation]。
  status: machine
- id: f94c3a4139464601
  en: To calculate an observable on a mode, use [`Estimator`][fatqat.Estimator] with [`NumberOperator`][fatqat.observable.NumberOperator] or a [`Projector`][fatqat.observable.Projector] up to the cutoff. In a noise model, select modes by device label.
  zh: 要计算某个模式上的可观测量，可以在 [`Estimator`][fatqat.Estimator] 中使用 [`NumberOperator`][fatqat.observable.NumberOperator]，也可以用 [`Projector`][fatqat.observable.Projector] 投影到光子数上限以内的能级。噪声模型用设备标签选中模式。
  status: machine
