- id: 510055bee9f4640c
  en: Start with [Choose how much physics to model](../../guide/execution-models.md) to choose an execution level, or follow [Test a Program against a hardware profile](../../guide/superconducting-simulation.md) for the profile workflow.
  zh: 请先阅读[选择需要建模的物理细节](../../guide/execution-models.md)来选定执行层级，或按照[用硬件约束模拟检验 Program](../../guide/superconducting-simulation.md)了解设备模型的工作流程。
