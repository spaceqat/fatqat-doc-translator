- id: abea5b4fb1e7da50
  en: Start with [Choose a simulation or emulation approach](../../guide/execution-models.md) to choose an execution level, or follow [Test a Program against a hardware profile](../../guide/superconducting-simulation.md) for the profile workflow.
  zh: 可以先阅读[选择模拟与仿真方式](../../guide/execution-models.md)，确定所需的执行方式；也可以通过[用硬件约束模拟检验 Program](../../guide/superconducting-simulation.md)了解设备模型的使用流程。
