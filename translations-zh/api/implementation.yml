  en: data `fatqat.implementation.DeviceOperands`
  zh: data `fatqat.implementation.DeviceOperands`
  status: machine
- id: c8d39d581916d005
  en: Alias for an ordered tuple of hashable backend-defined physical labels.
  zh: 有序元组的类型别名；每个元素是后端定义的、可哈希的物理标签。
  status: machine
- id: 50cbd645e833b814
  en: '| Form | Use it for | Value passed to `add` |'
  zh: '| 形式 | 适用场景 | 传给 `add` 的值 |'
  status: machine
- id: 6b0bbf8976a50788
  en: '| Two-dimensional NumPy array | One constant matrix | The array; FATQAT copies it, so later changes do not affect the rule |'
  zh: '| 二维 NumPy 数组 | 单个常量矩阵 | 该数组；FatQat 会复制它，因此之后的修改不会影响该规则 |'
  status: machine
- id: 526e30d236208856
  en: '| Callable | A matrix that depends on operation parameters or target dimensions | `rule(op)` by default. If the callable accepts a `targets=` keyword or `**kwargs`, FATQAT calls `rule(op, targets=targets)`. |'
  zh: '| 可调用对象 | 依赖操作参数或目标维度的矩阵 | 默认调用 `rule(op)`。如果该可调用对象接受 `targets=` 关键字或 `**kwargs`，FatQat 会调用 `rule(op, targets=targets)`。 |'
  status: machine
