  en: '| [`MatrixImplementation`][fatqat.implementation.MatrixImplementation] | A configured or stateful rule object | Override `__call__(op, *, targets)`. |'
  zh: '| [`MatrixImplementation`][fatqat.implementation.MatrixImplementation] | 带配置或有状态的规则对象 | 重写 `__call__(op, *, targets)`。 |'
  status: machine
- id: 5d5b2445efafc346
  en: For two qubits, targets `(q0, q1)` therefore use the local basis `|00>`, `|01>`, `|10>`, `|11>`. Controlled operations list controls before targets. When the tuple lists every subsystem in public order, this is also the basis used by returned states and operators. A local matrix on a smaller or differently ordered target tuple must be embedded before direct use with a full returned state; the simulator performs that embedding during execution.
  zh: 因此，对于两个量子比特，目标 `(q0, q1)` 使用局域基 `|00>`、`|01>`、`|10>`、`|11>`。受控操作先列控制位，再列目标位。当元组按公共顺序列出全部子系统时，返回的态和算符也使用此基。作用于更小或不同顺序目标元组的局域矩阵，必须先嵌入完整空间，才能直接用于完整返回态；模拟器会在执行过程中完成这种嵌入。
  status: machine
- id: 30d3572927e4155e
  en: Use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to add custom operations and channels to a simulator, or choose rules by physical target. Pass the map as `implementation_map=` when constructing the backend. Built-in gates and channels work without a custom map. Noise placement is still defined by `NoiseModel`; the map supplies how each matched channel acts.
  zh: 使用 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 为模拟器添加自定义 Operation 和量子信道，或按物理目标选择实现规则。构造后端时，通过 `implementation_map=` 传入这份映射即可。内置量子门和信道无需自定义映射就能使用。噪声施加在何处仍由 `NoiseModel` 决定；映射负责定义匹配到的信道如何作用于量子态。
  status: retired
- id: acb9ba579f4c546a
  en: '[`default_matrix_implementation_map`][fatqat.implementation.default_matrix_implementation_map] returns a fresh map containing FATQAT''s built-in matrix gates and finite channel rules. Editing it does not affect another map or a later call. Construct [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] directly when the backend should support only rules you add. A supplied map replaces both the gate and channel registrations; start with the default map to retain built-ins.'
  zh: '[`default_matrix_implementation_map`][fatqat.implementation.default_matrix_implementation_map] 每次都会返回一份新映射，包含 FATQAT 内置的矩阵门和有限量子信道规则。修改它不会影响其他映射或后续调用。若希望后端只支持自己添加的规则，可直接构造 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]。传入映射会同时替换默认的门和信道注册，因此需要保留内置实现时，应从默认映射开始扩展。'
  status: retired
- id: 37537a4985e85159
  en: '[`MatrixImplementationMap.add`][fatqat.implementation.MatrixImplementationMap.add] accepts an operation or channel instance or class. Matrix operations accept these rule forms:'
  zh: '[`MatrixImplementationMap.add`][fatqat.implementation.MatrixImplementationMap.add] 接受 Operation 或信道的实例，也接受它们的类。矩阵 Operation 支持以下几种规则形式：'
  status: retired
- id: 1c1741d2f28083af
  en: Channel rules are callables returning Kraus matrices; see [Custom noise implementations](noise/custom-implementations.md). For operations that update quantum and classical state together, the same map accepts `CustomOperationImplementation` objects. See [Custom operations](simulators/custom-operations.md).
  zh: 信道规则是返回 Kraus 矩阵的可调用对象，详见[自定义噪声实现](noise/custom-implementations.md)。需要同时更新量子态和经典状态时，也可以向同一份映射注册 `CustomOperationImplementation` 对象，详见[自定义 Operation](simulators/custom-operations.md)。
  status: retired
- id: 7f1d40e4fd319694
  en: Both modes accept `num_subsystems=None` and instance-dependent channel widths. Their device-specific tuples may have different lengths. A fixed integer `num_subsystems` requires that many labels.
  zh: 两种模式都接受 `num_subsystems=None`，也支持由具体信道实例决定目标数量。此时，按设备指定的目标元组可以有不同的长度。若 `num_subsystems` 是固定整数，元组中的标签数量就必须与之相等。
  status: machine
- id: eb9d12d01172db20
  en: '`add` rejects an invalid registration immediately with `TypeError` or `ValueError`. Matrix and channel rules run when a backend prepares a program. A matrix rule that raises produces [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError], an array with the wrong target shape produces [`BackendValidationError`][fatqat.errors.BackendValidationError], and a missing rule produces [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]. These errors occur before `run` returns a [`Job`][fatqat.Job].'
  zh: 注册不合法时，`add` 会立即抛出 `TypeError` 或 `ValueError`。矩阵规则和信道规则在后端准备程序时执行。矩阵规则自身抛出异常时，会报 [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError]；返回数组的形状与目标不匹配时，会报 [`BackendValidationError`][fatqat.errors.BackendValidationError]；找不到规则时，会报 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]。这些错误都会在 `run` 返回 [`Job`][fatqat.Job] 之前发生。
  status: retired
- id: 5c4c675315c95649
  en: Matrix implementation maps
  zh: 矩阵实现映射
  status: machine
- id: 4eca2c94120f12aa
  en: A [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] tells a matrix simulator how to apply an operation or noise channel. Use it to register a custom rule, replace a built-in one, or give different device locations different implementations of the same operation. Pass the map as `implementation_map` when creating a simulator. A `NoiseModel` still determines when and where a channel applies.
  zh: '[`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 告诉矩阵模拟器怎样执行操作或施加量子信道。你可以添加自己的规则、替换内置规则，也可以为同一操作在不同设备位置指定不同实现。创建模拟器时，用 `implementation_map` 传入映射。信道何时作用、作用于哪些目标，仍由 `NoiseModel` 决定。'
  status: retired
- id: b1a65ddcabb5f2c3
  en: Start with [`default_matrix_implementation_map()`][fatqat.implementation.default_matrix_implementation_map] to keep the built-in gate and channel rules, or create an empty [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to define the whole set yourself. The simulator copies the registrations when it is created. Adding or removing a rule from the original map later does not update an existing simulator.
  zh: 想保留内置的门和信道规则，可以从 [`default_matrix_implementation_map()`][fatqat.implementation.default_matrix_implementation_map] 开始。如果想自行提供全部规则，就创建空的 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]。模拟器在创建时复制注册表，之后在原映射上添加或删除规则，不会更新已创建的模拟器。
  status: retired
- id: f40a9da80ceb688a
  en: '[`add()`][fatqat.implementation.MatrixImplementationMap.add] checks the registration when you add it. A rule that raises while the backend prepares an operation can produce [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError]. A matrix with the wrong shape raises [`BackendValidationError`][fatqat.errors.BackendValidationError], and an unregistered operation raises [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError].'
  zh: '[`add()`][fatqat.implementation.MatrixImplementationMap.add] 会在注册时检查规则。后端准备操作时，如果规则抛出异常，可能收到 [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError]。矩阵形状不符会抛出 [`BackendValidationError`][fatqat.errors.BackendValidationError]，操作没有匹配的规则则会抛出 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]。'
  status: machine
- id: 56497e2eae3f315e
  en: When a simulator encounters a gate, its implementation map determines which matrix to apply. With [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap], you can add a rule, change a built-in one, or use different matrices for the same gate at different device locations. Pass the map as `implementation_map` when you create the simulator. The map also supplies channel rules. The `NoiseModel` determines when a channel acts and which targets it affects.
  zh: 模拟器执行一个门时，会通过实现映射选出要用的矩阵。用 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 可以添加规则、替换内置规则，也可以为同一个门在不同设备位置指定不同的矩阵。创建模拟器时，通过 `implementation_map` 传入映射。量子信道的实现也可以在这里注册。信道何时施加、作用于哪些目标，由 `NoiseModel` 决定。
  status: machine
- id: dbfd687cdc799f58
  en: Choose a starting map
  zh: 从哪种映射开始
  status: machine
- id: 132de6bafd924ad4
  en: To keep the built-in gate and channel rules, start with [`default_matrix_implementation_map()`][fatqat.implementation.default_matrix_implementation_map]. To provide every rule yourself, create an empty [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]. The simulator uses a copy of the registrations made before it was created. Additions and removals you make later affect only the original map.
  zh: 想在内置的门和信道规则上做调整，就从 [`default_matrix_implementation_map()`][fatqat.implementation.default_matrix_implementation_map] 开始。想自己提供全部规则，就创建一个空的 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]。模拟器会复制创建时已有的规则。之后在原映射上添加或删除规则，只会改动原映射。
  status: machine
- id: 598ab5fcbbae0aef
  en: Register a rule with [`MatrixImplementationMap.add()`][fatqat.implementation.MatrixImplementationMap.add]. You can pass an operation or channel instance, or its class. For an operation implemented with a matrix, choose one of the following forms.
  zh: 用 [`MatrixImplementationMap.add()`][fatqat.implementation.MatrixImplementationMap.add] 注册规则。操作或信道既可以传入实例，也可以传入类型。用矩阵实现操作时，可以用下表中的任一种写法。
  status: machine
- id: 729694e213b728eb
  en: Use a callable that returns Kraus matrices for a [custom channel](noise/custom-implementations.md). To update the quantum and classical state together, register a `CustomOperationImplementation`. See [Custom operations](simulators/custom-operations.md) for that interface.
  zh: '[自定义量子信道](noise/custom-implementations.md)用返回 Kraus 矩阵的可调用对象来实现。需要同时更新量子态和经典状态时，注册 `CustomOperationImplementation`。这套接口见[自定义操作](simulators/custom-operations.md)。'
  status: machine
- id: c14e77884dfb0917
  en: In a matrix rule, `op` is the operation instance, including any parameters such as a rotation angle. `targets` gives one [`RegisterRef`][fatqat.RegisterRef] per operand, in program order. Read `target.register.dim` if the matrix depends on a target's dimension.
  zh: 矩阵规则接收的 `op` 是操作实例，其中包含转角等参数。`targets` 按程序中的目标顺序给出每个操作对象的 [`RegisterRef`][fatqat.RegisterRef]。如果矩阵随目标维度变化，可以读取 `target.register.dim`。
  status: machine
- id: f2336c17e484067b
  en: Registration and run errors
  zh: 注册与运行时的异常
  status: machine
