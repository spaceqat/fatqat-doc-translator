- id: 923e0b10256db3ec
  en: '| Noise type | Accepted parameters | Applies to | User-visible effect |'
  zh: '| 噪声类型 | 接受的参数 | 作用对象 | 用户可见效果 |'
  status: machine
- id: 156c15a252c49924
  en: '| [`Depolarizing`][fatqat.noise.Depolarizing] | Exactly one of `p` or `rate` | `p`: the selected operands; `rate`: one subsystem | Uniform mixing toward the maximally mixed state |'
  zh: '| [`Depolarizing`][fatqat.noise.Depolarizing] | `p` 与 `rate` 中恰好其一 | `p`：所选操作数；`rate`：一个子系统 | 向最大混合态的均匀混合 |'
  status: machine
- id: 9aabbed5deff741d
  en: '| [`PauliChannel`][fatqat.noise.PauliChannel] | Pauli-string probability mapping or pair sequence | One qubit per string character | A stochastic mixture of `I`, `X`, `Y`, and `Z` strings |'
  zh: '| [`PauliChannel`][fatqat.noise.PauliChannel] | 算符串及其概率，可用映射或成对提供 | 算符串中的每个字符对应一个量子比特 | 按给定概率施加由 `I`、`X`、`Y` 和 `Z` 组成的算符串 |'
  status: machine
- id: 6cbdd4700b1ba810
  en: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | Exactly one of `p` or `rate`, with one value per adjacent transition | One subsystem | Ladder decay from level `k` to `k - 1` |'
  zh: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | `p` 与 `rate` 中恰好其一，每个相邻跃迁对应一个值 | 单个子系统 | 从能级 `k` 到 `k - 1` 的阶梯式衰减 |'
  status: retired
- id: efa905c053cdb71f
  en: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] | Exactly one of `p`, `rate`, or `t_phi` | One subsystem | Coherence decay without population transfer |'
  zh: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] | `p`、`rate` 与 `t_phi` 中恰好其一 | 单个子系统 | 无布居转移的相干衰减 |'
  status: machine
- id: 2d73e3d318c879fe
  en: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` and `t2` | One subsystem | Combined energy relaxation and residual pure dephasing |'
  zh: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` 与 `t2` | 单个子系统 | 能量弛豫与剩余纯退相位的组合 |'
  status: retired
- id: eebe1848a578f638
  en: '| [`Loss`][fatqat.noise.Loss] | Per-carrier probability `p` | Every selected carrier in a matched operation | Persistent carrier removal on an occupancy-aware backend |'
  zh: '| [`Loss`][fatqat.noise.Loss] | 每个载体各自的概率 `p` | 匹配操作中每个被选中的载体 | 在跟踪占据状态的后端上持久移除载体 |'
  status: machine
- id: bfe822216ede4f67
  en: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | Column-stochastic report matrix | Each measured subsystem independently, or one selected subsystem | Classical resampling of the reported digit after physical collapse |'
  zh: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | 列随机的报告矩阵 | 每个被测量的子系统各自独立，或一个选定的子系统 | 物理坍缩后对报告数位的经典重采样 |'
  status: machine
- id: 0ee5d8b7052aa775
  en: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | Exactly one scalar `p` or `rate` | One qubit | Conventional finite channel or continuous qubit energy relaxation |'
  zh: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | 必须且只能提供一个标量 `p` 或 `rate` | 一个量子比特 | 常规有限信道或连续量子比特能量弛豫 |'
  status: machine
- id: 62b111ac1123a957
  en: '| [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] | Exactly one scalar `p` or `rate`, plus explicit transition coefficients | One subsystem | One explicitly authored finite or continuous jump operator |'
  zh: '| [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] | 必须且只能提供一个标量 `p` 或 `rate`，并显式提供跃迁系数 | 一个子系统 | 一个显式指定的有限或连续跃迁算符 |'
  status: machine
- id: 827b3d1eab64fc91
  en: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` and `t2` | One qubit | Combined energy relaxation and residual pure dephasing |'
  zh: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` 和 `t2` | 一个量子比特 | 能量弛豫与剩余纯退相位的组合 |'
  status: machine
- id: cb50d52d143477c2
  en: '[TransitionRelaxation](noise/transition-relaxation.md)'
  zh: '[TransitionRelaxation](noise/transition-relaxation.md)'
  status: machine
- id: 0fb9b9d4a3969e53
  en: Use a `NoiseModel` to vary the noise in a run while keeping the same [`Program`][fatqat.Program]. Simulators can apply a channel after an operation. Pulse emulators can evolve the state with continuous noise, including during idle time. Readout confusion changes the reported digits in either case.
  zh: 用 `NoiseModel` 可以在同一个 [`Program`][fatqat.Program] 上更换噪声设置。模拟器可以在操作之后施加量子信道，脉冲仿真器则可以让量子态在连续噪声下演化，空闲时段也包括在内。两类后端都可以用读出混淆改变报告的数值。
  status: machine
- id: 02106b968d931d5b
  en: Noise types are available in `fatqat.noise`. Pass a [`NoiseModel`][fatqat.NoiseModel] to the backend with `noise=...`.
  zh: 噪声类型定义在 `fatqat.noise` 中。用 `noise=...` 将 [`NoiseModel`][fatqat.NoiseModel] 传给后端。
  status: machine
- id: 160ec68daf42959e
  en: Choose a type by the effect you want to model. For a type with both forms, use a probability for a single channel application or a rate or relaxation time for continuous evolution. Follow the definition for your backend on the type's page.
  zh: 先想清楚要模拟哪种效应，再选噪声类型。对于有两种形式的类型，单次施加信道用概率，连续演化用速率或弛豫时间。各类型页面分别说明了这两种形式的定义。
  status: machine
- id: f64b397bb3b7412b
  en: Check [Backend support](noise/backend-support.md#noise-backend-support) for the forms, scopes, and target dimensions your backend accepts.
  zh: 可在[后端支持情况](noise/backend-support.md#noise-backend-support)中查看后端接受哪些噪声形式、作用范围和目标维度。
  status: machine
- id: f46f649b5bdcf20b
  en: After an operation
  zh: 在操作之后施加噪声
  status: machine
- id: 33f5fab7bc7eb06e
  en: Pass `operation=ops.CX` to apply a depolarizing channel jointly to the two operands after each `CX`. For a full comparison, see [Ideal and noisy runs](../guide/ideal-and-noisy.md).
  zh: 传入 `operation=ops.CX` 后，每次执行 `CX` 都会对两个操作对象共同施加一个退极化信道。完整的对比示例见[理想运行与含噪运行](../guide/ideal-and-noisy.md)。
  status: machine
- id: be67945c3e0deae0
  en: During pulse evolution
  zh: 在脉冲演化期间施加噪声
  status: machine
- id: 4684600942117fcd
  en: Omit `operation` to keep relaxation active on `"q0"` throughout the elapsed time, including idle periods. The reference transmon model uses nanoseconds, so `rate` is in inverse nanoseconds.
  zh: 省略 `operation` 后，`"q0"` 在整个演化期间都会受到弛豫的影响，空闲时也一样。参考 Transmon 模型以纳秒为时间单位，因此 `rate` 的单位是纳秒的倒数。
  status: machine
