  en: Import or export supported OpenQASM, convert compatible Qiskit circuits, or use FatQat through Qiskit's backend interface. See [Bring Programs to and from OpenQASM and Qiskit](../../guide/interoperability.md) for the guided workflows.
  zh: 导入或导出受支持的 OpenQASM，转换兼容的 Qiskit 线路，或通过 Qiskit 的后端接口使用 FatQat。完整使用示例请参见[在 OpenQASM 与 Qiskit 之间导入和导出程序](../../guide/interoperability.md)。
  status: retired
