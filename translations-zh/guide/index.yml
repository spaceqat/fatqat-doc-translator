  en: New to FatQat?
  zh: 初次使用 FatQat？
  status: machine
- id: 5e6b46ba4d76696f
  en: '[Build, draw, and run a Bell program](quickstart.md), then learn how to [write Programs and registers](program.md). When you are ready to compare backends, [choose how much physics to model](execution-models.md).'
  zh: 初次使用时，可以先[创建并运行一个贝尔态 Program](quickstart.md)，再了解[如何使用 Program 和 Register](program.md)。需要挑选后端时，参考[选择需要建模的物理细节](execution-models.md)。
  status: retired
