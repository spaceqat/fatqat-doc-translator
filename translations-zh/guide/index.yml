- id: 81408cccd382026f
  en: New to FatQat? [Build and run a Bell program](quickstart.md). It takes about ten minutes and ends with a circuit drawing and a counts plot.
  zh: 初次接触 FatQat？[创建并运行一个贝尔程序](quickstart.md)。它大约需要十分钟，最后会得到一张线路图和一张计数图。
  status: retired
- id: 3d039d4c8ded5334
  en: When you are ready to go beyond the first circuit, [write a richer Program](program.md). That chapter introduces named registers, classical control, reusable parameters, and mixed qubit–qutrit systems without changing the authoring model.
  zh: 当你准备超越第一个线路时，请[编写更丰富的 Program](program.md)。那一章介绍命名寄存器、经典控制、可复用参数以及量子比特–qutrit 混合系统，而无需改变编写模型。
  status: retired
- id: 199aa25730d144d7
  en: '!!! tip'
  zh: '!!! tip'
  status: machine
- id: b178c070c1fed1bf
  en: The guide teaches complete workflows and the reasoning behind them. Follow a link to the [API reference](../api/index.md) when you need a precise signature or contract. The [tutorials](../tutorials/index.md) are longer case studies built on the same features.
  zh: 本指南介绍完整的使用流程，并说明为什么这样做。需要查询函数签名或具体行为约定时，请查阅 [API 参考](../api/index.md)。[教程](../tutorials/index.md)则通过更完整的案例展示这些功能。
  status: machine
- id: 1080a3d338cf5d1d
  en: '| Question | Execution target | Typical answer |'
  zh: '| 问题 | 执行目标 | 典型答案 |'
  status: retired
- id: d2e2f49bf495ee0a
  en: '| What does the algorithm do? | General simulator | Counts, states, expectations, or a unitary |'
  zh: '| 算法做了什么？ | 通用模拟器 | 计数、状态、期望值或酉矩阵 |'
  status: retired
- id: 1b8f6b17b5797f3e
  en: '| Does it fit this device profile? | Hardware-profile simulator | Native-operation, layout, and noise behavior |'
  zh: '| 它符合这个设备配置文件吗？ | 设备模型模拟器 | 原生操作、布局与噪声行为 |'
  status: retired
- id: f3e03c4b532b6ca3
  en: '| What dynamics produce it? | Hamiltonian emulator | Time evolution, leakage, occupancy, and pulse effects |'
  zh: '| 什么样的动力学产生了它？ | 哈密顿量仿真器 | 时间演化、泄漏、占用与脉冲效应 |'
  status: retired
- id: 3c607c2c258c3bf6
  en: Choose the level of detail that answers your question. Direct simulation and physics workflows start from the same backend-independent [`Program`][fatqat.Program]. When mapping and routing are part of the question, start from the compiler's concise [`LogicalProgram`][fatqat.LogicalProgram] instead.
  zh: ''
  status: retired
