  en: Choose an execution path
  zh: 选择执行路径
  status: retired
- id: 77ca0539d56d4aa7
  en: Simulate states, measurements, observables, and parameter sweeps, then compare ideal and noisy results or tune performance.
  zh: 查看量子态、测量结果和可观测量，扫描不同参数，再比较理想与含噪结果，或优化运行性能。
  status: machine
- id: 643afd5e2f430d6d
  en: Check native operations, placement, connectivity, capacity, atom occupancy, pairing, and reference noise.
  zh: 检查原生操作、放置、连接关系、容量、原子占据、配对和参考噪声。
  status: machine
- id: aeff105564baafc7
  en: Follow calibrated transmon gates and direct pulse controls as continuous dynamics, with built-in models for transmons and neutral atoms.
  zh: 用内置的 transmon 和中性原子模型，研究校准门和直接脉冲控制过程中，物理状态如何随时间变化。
  status: machine
- id: acd3ea8d36e24bf4
  en: '[Compare the execution levels](execution-models.md) if you are unsure which path contains the detail your study needs.'
