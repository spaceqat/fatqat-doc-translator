- id: 2d5c199ea29af3bf
  en: In FatQat, you can change the conditions of a run while keeping the calculation you wrote. To see how noise affects measurement outcomes, run the same [`Program`][fatqat.Program] with and without a noise model. In a pulse experiment, you can keep the laser drive fixed, change the distance between two atoms, and see how likely both atoms are to be excited.
  zh: 用 FatQat 做模拟时，可以保留写好的程序，只改变这次运行的条件。想看噪声会怎样影响测量结果，可以用同一个 [`Program`][fatqat.Program] 分别做理想运行和含噪运行。做脉冲实验时，也可以保持激光脉冲不变，只调整两个原子的间距，看看两个原子同时被激发的概率怎样变化。
  status: machine
- id: c3b62edf1be27f3a
  en: The question also determines which result to read. Measurement counts show how often each outcome appears. An expectation value can reveal differences that counts in one basis miss. When the control pulse itself matters, you can compare the final states for different pulse shapes or durations.
  zh: 要看哪种结果，取决于你想了解什么。测量计数告诉你每种结果出现了多少次。即使两个态在同一个测量基底下给出相同的分布，可观测量的期望值仍可能把它们区分开。如果关心控制脉冲本身，可以对比不同波形或时长得到的最终量子态。
  status: machine
- id: ddaae48bacc0be6e
