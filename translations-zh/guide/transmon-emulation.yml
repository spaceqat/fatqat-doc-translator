- id: 11ac253adfad36b4
  en: Retain `model_document` when you need persisted frequencies, anharmonicities, model identity, or coupling topology. The runtime model provides the execution capabilities; use the document to look up the stored model data.
  zh: 如果需要查阅已保存的频率、非谐性、模型标识或耦合拓扑，请保留 `model_document`。运行时模型负责执行计算，模型文档则用于查询这些数据。
  status: machine
- id: e4578d45bd6941b4
  en: This guide chooses the density-matrix method because it repeatedly inspects populations. The common default is `method="statevector"`; use `method="unitary"` when the complete coherent operator is the result you need.
  zh: 本例需要多次查看各能级的布居数，因此选择密度矩阵方法。通常默认使用 `method="statevector"`；如果需要完整的相干演化算符，则使用 `method="unitary"`。
  status: retired
- id: d8cecfc462563111
  en: A transmon uses its two lowest levels as the qubit states $\lvert 0\rangle$ and $\lvert 1\rangle$. A pulse can also move some population into the next level, $\lvert 2\rangle$. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] keeps all three levels so you can see this leakage. Here we use the same transmon to compare a reference gate pulse and a waveform you specify directly. Both follow the workflow in [Write and run pulse programs](hamiltonian-emulation.md).
  zh: Transmon 的最低两个能级 $\lvert 0\rangle$ 和 $\lvert 1\rangle$ 用来表示量子比特。施加脉冲后，测量时也可能得到第三个能级 $\lvert 2\rangle$，这就是泄漏。[`TransmonEmulator`][fatqat.emulator.TransmonEmulator] 保留这三个能级，让你能算出泄漏的概率。本章沿用[编写和运行脉冲程序](hamiltonian-emulation.md)一章的流程，在同一个 Transmon 上比较参考门脉冲和你直接指定的波形。
  status: retired
- id: 639b8cd29776463d
  en: Load a single-transmon model
  zh: 加载单个 Transmon 的模型
  status: machine
- id: f0be9e1022d36511
  en: Load the built-in `transmon.single` model. It gives both examples the same transmon, `q0`, and the same physical parameters.
  zh: 先加载内置的 `transmon.single` 模型。两次运行都使用同一个 Transmon `q0` 和同一套物理参数。
  status: machine
- id: bce0c2a1de21a3c9
  en: Use `method="density_matrix"` to read each level's population from the diagonal of the returned matrix. The default is `method="statevector"`. Use `method="unitary"` when you want the coherent evolution operator.
  zh: 使用 `method="density_matrix"` 时，返回矩阵的每个对角元都给出测得相应能级的概率。默认方法是 `method="statevector"`。想获取相干演化算符时，可以用 `method="unitary"`。
  status: retired
- id: 537695a5f5eeebbf
  en: Add an `RX` gate with angle $\pi/2$ to the Program. The emulator looks up the reference pulse for that rotation and applies it to the transmon.
  zh: 在 Program 中添加一个角度为 $\pi/2$ 的 `RX` 门。仿真器会找到这个旋转对应的参考脉冲，并把它施加到 Transmon 上。
  status: machine
- id: f0c1b461a89daaa5
  en: After the rotation, $\lvert 0\rangle$ and $\lvert 1\rangle$ each have about half the population. `calibrated_populations[2]` is the fraction left in $\lvert 2\rangle$ at the end of the pulse, here less than 0.0001%.
  zh: 旋转结束后，如果测量 Transmon 的能级，得到 $\lvert 0\rangle$ 和 $\lvert 1\rangle$ 的概率各约为一半。`calibrated_populations[2]` 是测得 $\lvert 2\rangle$ 的概率，这里低于 0.0001%。
  status: machine
- id: 9d2fa656510b1b0a
  en: Now drive the same transmon with a [`PulseOperation`][fatqat.operations.PulseOperation]. The example uses a 10 ns Hann pulse with an area of $\pi/2$, the target angle of the reference rotation.
  zh: 接下来，用 [`PulseOperation`][fatqat.operations.PulseOperation] 直接驱动同一个 Transmon。这里用一个时长为 10 ns 的 Hann 脉冲，其面积是 $\pi/2$，与参考旋转的目标角度相同。
  status: machine
- id: b973ec493fc06698
  en: The samples give the Rabi rate $\Omega(t)$ in rad/ns. Here they are real and drive the X component. An imaginary component would drive Y. The Hann envelope starts and ends at zero, and the emulator interpolates between the samples.
  zh: 采样值表示 Rabi 速率 $\Omega(t)$，单位是 rad/ns。本例用实数样本驱动 X 分量。虚部则用于驱动 Y 分量。Hann 包络从零升起，再回到零，仿真器在采样点之间插值得到连贯的波形。
  status: machine
- id: 31fb89278fed79a0
  en: '![The 10 ns Hann pulse rises from zero to its peak at 5 ns and then returns to zero. Dots mark the waveform samples.](../assets/generated/guide/transmon-hann-pulse.svg)'
  zh: '![10 ns 的 Hann 脉冲从零开始，在 5 ns 达到峰值，最后回到零。圆点表示波形的采样值。](../assets/generated/guide/transmon-hann-pulse.svg)'
  status: machine
- id: 5aea9472c7ddc2a3
  en: Compare the final populations
  zh: 比较各能级的测量概率
  status: machine
- id: 4ac69a26cecbf864
  en: The direct pulse leaves about 50.9% of the population in $\lvert 0\rangle$, 49.1% in $\lvert 1\rangle$, and 0.07% in $\lvert 2\rangle$. The reference pulse also divides the population nearly evenly between the qubit states, with less than 0.0001% left in $\lvert 2\rangle$. The 10 ns Hann pulse and the 20 ns reference `RX` pulse differ in shape, duration, and DRAG correction. The plot compares the final populations for these two recipes.
  zh: 直接驱动结束后，如果测量能级，得到 $\lvert 0\rangle$ 的概率约为 50.9%，得到 $\lvert 1\rangle$ 的概率约为 49.1%，得到 $\lvert 2\rangle$ 的概率约为 0.07%。参考脉冲结束后，测得两个量子比特态的概率也接近各半，测得 $\lvert 2\rangle$ 的概率低于 0.0001%。10 ns 的 Hann 脉冲和 20 ns 的参考 `RX` 脉冲在形状、时长和 DRAG 修正上都有差别。下图对比了两种脉冲结束后测得各能级的概率。
  status: machine
- id: 14b8bf136240d780
  en: '![Both recipes split the population nearly evenly between levels 0 and 1. The magnified panel shows the small population left in level 2 after direct drive.](../assets/generated/guide/transmon-populations.svg)'
  zh: '![两种脉冲结束后，测得能级 0 和 1 的概率都接近各半。右侧放大了直接驱动后测得第三能级的微小概率。](../assets/generated/guide/transmon-populations.svg)'
  status: machine
