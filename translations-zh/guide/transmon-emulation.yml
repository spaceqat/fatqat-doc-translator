- id: e5ef4e2d81a53b6b
  en: '*In this example with $E_J/E_C=50$, the $0\to1$ transition requires more energy than the $1\to2$ transition. The difference in transition frequencies helps a pulse address the qubit transition.*'
  zh: '*图中取 $E_J/E_C=50$。$0\to1$ 跃迁所需的能量比 $1\to2$ 更高。两种跃迁的频率不同，有助于脉冲选择性地驱动量子比特跃迁。*'
  status: machine
- id: 3679a064dba06eb4
  en: The reference calibration uses analytic recipes to keep pulse generation simple. The grid generator uses the same pulse shapes and chooses a CZ branch for each pair of connected transmons. Further pulse optimization can improve gate fidelity, for example by reducing the small residual controlled phase in the reference iSWAP.
  zh: 参考校准采用解析脉冲方案，便于生成。生成阵列时沿用相同的脉冲形状，并为每一对相连的 Transmon 选定 CZ 分支。进一步优化脉冲还有望提高门保真度，例如减小参考 iSWAP 附带的小角度受控相位。
  status: machine
