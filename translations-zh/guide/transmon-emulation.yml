- id: 1bc09d2a36d1e372
  en: Use the calibrated path to study the supplied gate recipe. Use direct controls when the waveform itself is the experiment; the two forms can also coexist in one Program. The [transmon emulator API](../api/pulse-emulator.md) lists the supported units, gates, noise forms, and simulation methods.
  zh: 要研究已有的门脉冲方案，可以使用校准门；要研究波形本身，则使用直接控制。两种方式也可以在同一个 Program 中使用。支持的单位、门、噪声形式和模拟方法见 [transmon 仿真器 API](../api/pulse-emulator.md)。
  status: machine
- id: 9ddf784fe4d478dc
  en: Program qubits bind to those subsystem IDs in declaration order unless a [`ResourceLayout`][fatqat.ResourceLayout] says otherwise. Every model transmon remains in the physical state even when the Program addresses only one of them.
  zh: 默认情况下，Program 中的量子比特按声明顺序映射到这些子系统 ID；也可以用 [`ResourceLayout`][fatqat.ResourceLayout] 指定映射。即使 Program 只使用一个 transmon，物理态仍包含模型中的所有 transmon。
