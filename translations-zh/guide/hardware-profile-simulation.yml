- id: 063e8d01586c723b
  en: Test a Program against a hardware profile
  zh: 用硬件约束模拟检验 Program
  status: retired
- id: dd5d423aa27c8b6c
  en: A hardware-profile simulator checks whether a Program can run on a selected device shape as written. Like the general [`Simulator`][fatqat.simulator.Simulator], it evolves discrete gates at circuit level; it also enforces a native operation set, placement, connectivity, capacity, and, for atom arrays, occupancy.
  zh: 设备模型模拟器检查一个 Program 能否按原样在选定的设备形态上运行。与通用的 [`Simulator`][fatqat.simulator.Simulator] 一样，它在线路层面演化离散的门；此外它还强制执行原生操作集、布局、连通性和容量，对原子阵列而言还包括占据情况。
  status: retired
- id: 79ff32bd1861d1d0
  en: 'This makes profiles useful before a physical Hamiltonian model is needed. It also sets an important boundary: a profile validates your choices; it does not make those choices for you.'
  zh: 这使得配置文件在需要物理哈密顿量模型之前就很有用。它也确立了一条重要边界：配置文件校验你的选择；它不会替你做出这些选择。
  status: retired
- id: 357dadc44d4cb087
  en: Start from logical behavior
  zh: 从逻辑行为开始
  status: retired
- id: be392b6c0383ce38
  en: 'First establish what the Program means with the general-purpose simulator. A Bell Program uses convenient logical gates and has no device placement yet:'
  zh: 首先用通用模拟器确定 Program 的含义。Bell Program 使用方便的逻辑门，此时还没有任何设备布局：
  status: retired
- id: 6ddd7d4e751889ac
  en: 'Now ask a Google-style superconducting profile about the same Program. The profile can report whether it supports `H`, so you do not need to copy its gate table into application code:'
  zh: 现在向一个 Google 风格的超导设备模型文件询问同一个 Program。配置文件可以报告它是否支持 `H`，因此你无需把它的门表复制到应用代码中：
  status: retired
- id: 9e4c8419e4254a3c
  en: Submitting `bell` would therefore raise [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]. FatQat does not silently decompose `H` or `CX` into this profile's native operations.
  zh: 直接运行 `bell` 会报 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]。这个设备模型不会自动把 `H` 或 `CX` 分解为原生门。
  status: machine
- id: 99e35bd7fe9ea137
  en: Make placement explicit
  zh: 为量子比特选择位置
  status: machine
- id: 7c4114505c751fc6
  en: 'Native operations are only half the question. On this 2 x 3 profile, integer device labels are arranged row by row:'
  zh: 除了原生门，还需要检查量子比特的放置。在这个 2 x 3 设备模型中，整数设备标号按行排列：
  status: retired
- id: 7011c7a69c8943a3
  en: 'The next Program is native, but placing its two qubits at `0` and `4` asks for a diagonal `CZ` that the grid does not provide:'
  zh: 下面的 Program 只用设备支持的门。如果把两个量子比特放在 `0` 和 `4`，`CZ` 就无法执行，因为这两个位置之间没有直接连线。
  status: machine
- id: e188fe557e4d245f
  en: 'Move the second program qubit to the neighbouring device label `1`; the Program itself does not need to change:'
  zh: 把第二个程序量子比特移动到相邻的设备标号 `1`；Program 本身不需要更改：
  status: retired
- id: 835f1a3da81c7086
  en: This confirms that the gate set and placement are valid. Fidelity, timing, and pulse dynamics require a physical emulator.
  zh: 这确认了门集与布局是有效的。保真度、时序和脉冲动力学则需要物理仿真器。
  status: retired
- id: 60aa19096ca566cb
  en: Add reference noise deliberately
  zh: 使用内置噪声模型
  status: retired
- id: 1a2c8568f0b110f0
  en: 'The superconducting profiles are ideal unless a noise model is passed. Their packaged models are useful comparison baselines, not current hardware characterizations:'
  zh: 超导设备模型文件在未传入噪声模型时是理想的。它们打包的模型是有用的对比基线，而不是当前硬件的表征：
  status: retired
- id: 586a20cb7e42abaa
  en: 'Keeping noise opt-in makes the comparison legible: first verify target compatibility, then decide whether the reference error model answers your question. `AtomArraySimulator` has no packaged reference noise model; pass a [`NoiseModel`][fatqat.NoiseModel] of your own when loading, loss, or other effects belong in the experiment.'
  zh: 让噪声保持可选使得对比清晰易读：先验证目标兼容性，再决定参考误差模型是否回答了你的问题。`AtomArraySimulator` 没有打包的参考噪声模型；当装载、丢失或其他效应属于实验的一部分时，请传入你自己的 [`NoiseModel`][fatqat.NoiseModel]。
  status: retired
- id: 0983c80ac04ea2bb
  en: '[`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] follows the same workflow with a different native gate family. Inspect the selected profile''s implementation map, then make the Program and layout choices that it requires.'
  zh: '[`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] 遵循同样的工作流，只是原生门族不同。检查所选配置文件的实现映射，然后做出它所要求的 Program 和布局选择。'
  status: retired
- id: c63e0e1a690961bc
  en: Track atom occupancy and pairing
  zh: 跟踪原子占据与配对
  status: machine
- id: ae5fbe43086dd1d7
  en: 'The atom-array profile asks a different hardware question. It has no fixed geometry. Instead, `Put` establishes occupancy and `Pair`/`Unpair` change the connectivity on which `CZ` is legal:'
  zh: 原子阵列配置文件问的是另一类硬件问题。它没有固定的几何结构。取而代之的是，`Put` 建立占据状态，而 `Pair`/`Unpair` 改变决定 `CZ` 是否合法的连通性：
  status: retired
- id: f667081a005d4a8a
  en: '![Two occupied atoms begin separated, move together when Pair applies with depolarizing noise, remain paired for CZ, and separate again when Unpair applies with depolarizing noise.](../assets/generated/guide/atom-pairing-lifecycle.svg)'
  zh: '![两个被占据的原子起初彼此分离，在 Pair 施加退极化噪声时相互靠近，在执行 CZ 期间保持配对，并在 Unpair 施加退极化噪声时再次分开。](../assets/generated/guide/atom-pairing-lifecycle.svg)'
  status: machine
- id: c040dfa4d513350e
  en: The changing distance is a picture of the pairing intent, not a simulated trajectory. `AtomArraySimulator` records no coordinates or movement duration; `Pair` declares that the two occupied sites may execute native `CZ`, and `Unpair` removes that eligibility.
  zh: 图中的距离变化用来说明配对关系，不是真实运动轨迹。`AtomArraySimulator` 不记录坐标或移动时长；`Pair` 表示两个有原子的位点已允许执行原生 `CZ`，`Unpair` 则解除这一配对关系。
  status: retired
- id: ca23cfc884492a91
  en: 'Pairing is ideal unless you attach a noise assumption. For example, apply a small depolarizing channel independently to each atom whenever either movement instruction occurs:'
  zh: 不添加噪声时，配对过程按理想情况处理。如果想考虑移动带来的扰动，可以在每次移动指令发生时，分别对两个原子施加一个较弱的退极化信道：
  status: machine
- id: f42cf48e24b225ac
  en: This channel perturbs the quantum state during `Pair` and `Unpair`; it does not remove either atom. Use [`Loss`][fatqat.noise.Loss] instead when movement should change occupancy.
  zh: 该信道会在 `Pair` 和 `Unpair` 期间扰动量子态；它不会移除任何一个原子。当移动应当改变占据状态时，请改用 [`Loss`][fatqat.noise.Loss]。
  status: machine
- id: e401b0a862cced80
  en: 'Omitting `Pair` before `CZ` is a Program error; FatQat does not transport or pair atoms automatically. A missing atom is different: an empty site reports the erasure digit `2`, while supported gates simply have no atom to act on.'
  zh: 在 `CZ` 之前遗漏 `Pair` 是 Program 错误；FatQat 不会自动搬运或配对原子。原子缺失则是另一回事：空位点会报告擦除数字 `2`，而受支持的门只是没有原子可作用。
  status: retired
- id: e400f655a4d1ed4d
  en: For native sets, capacities, and method support, use the [hardware-profile API](../api/simulators/index.md). Continue to [Hamiltonian emulation](hamiltonian-emulation.md) when pulse duration, physical levels, drift, or continuous-time noise becomes relevant.
  zh: 有关原生操作集、容量和方法支持，请使用[设备模型 API](../api/simulators/index.md)。当脉冲时长、物理能级、漂移或连续时间噪声变得重要时，请继续阅读[哈密顿量仿真](hamiltonian-emulation.md)。
  status: retired
- id: d2724fba1a521260
  en: 'Unlike the superconducting profiles, the atom array has no fixed geometry. Program resources define sites that begin empty. `Put` loads the atoms, while `Pair` and `Unpair` reshape the connectivity on which `CZ` is legal:'
  zh: 与超导设备模型文件不同，原子阵列没有固定的几何结构。Program 资源定义的位点起初为空。`Put` 装载原子，而 `Pair` 和 `Unpair` 重塑决定 `CZ` 是否合法的连通性：
  status: retired
- id: c0f48b6c6ad0f481
  en: 'Omitting `Pair` before `CZ` is a program error; FatQat does not transport or pair atoms automatically. A missing atom is different: supported gates find nothing to act on, and measurement reports the erasure digit `2`.'
  zh: 在 `CZ` 之前遗漏 `Pair` 是程序错误；FatQat 不会自动搬运或配对原子。原子缺失则是另一回事：受支持的门找不到可作用的原子，而测量会报告擦除数字 `2`。
  status: retired
- id: 13c4cee676147a90
  en: For native gates, program sizing, and method support, use the [hardware-profile API](../api/simulators/index.md). Continue to [Hamiltonian emulation](hamiltonian-emulation.md) when pulse duration, physical levels, drift, or continuous-time noise becomes relevant.
  zh: 有关原生门、程序规模和方法支持，请使用[设备模型 API](../api/simulators/index.md)。当脉冲时长、物理能级、漂移或连续时间噪声变得重要时，请继续阅读[哈密顿量仿真](hamiltonian-emulation.md)。
  status: retired
- id: 2f43f1d0990cf16e
  en: A hardware-profile simulator checks whether a Program obeys a selected device's rules as written. Like the general [`Simulator`][fatqat.simulator.Simulator], it applies circuit operations and can include noise channels. It also enforces a native operation set, placement, connectivity, capacity, and, for atom arrays, occupancy.
  zh: 硬件约束模拟器检查 Program 按当前写法是否遵守所选设备的规则。与通用 [`Simulator`][fatqat.simulator.Simulator] 一样，它施加线路操作，也可以包含噪声信道；此外还检查原生操作集、放置、连接关系、容量，以及原子阵列的占据情况。
  status: retired
- id: 008702b4b9252727
  en: Use a profile to test choices such as which operations to use and where to place program qubits. The profile validates those choices; you supply the Program and layout.
  zh: 想知道所选操作和量子比特位置是否适合某个设备时，可以使用硬件约束模拟。设备模型定义了支持的门、可用资源和连接规则；你提供 Program 和布局，模拟器会检查它们是否满足这些规则。
  status: retired
- id: c76095c1d6b3f8ed
  en: Compare circuit behavior
  zh: 比较线路行为
  status: retired
- id: 0c360f5f16f4c355
  en: 'The general-purpose simulator can run this Bell Program, which uses `H` and `CX` without specifying device placement:'
  zh: 通用模拟器可以运行这个使用 `H` 和 `CX`、未指定设备放置的 Bell Program：
  status: retired
- id: bb7fc621a68e7a9d
  en: 'Now ask the constrained superconducting profile about the same Program. The profile can report whether it supports `H`, so you do not need to copy its gate table into application code:'
  zh: 要在超导设备上运行这段 Program，可以先查询设备模型是否支持线路中的 `H` 门。
  status: machine
- id: da756325639ec210
  en: This confirms that the operation set and placement are valid. The profile can also apply noise channels, as the next example shows. Use a physical emulator when the question depends on pulse shapes or how the state evolves during a control.
  zh: 把两个量子比特放在相连的位置后，这组门就能运行了。接下来可以在同一组门上加入噪声，看看测量结果有什么变化。如果关心的是脉冲形状如何影响量子态随时间的演化，可以使用物理仿真器。
  status: retired
- id: a05cef06273fc9cb
  en: 'The superconducting profile is ideal unless a noise model is passed. Its packaged model is a useful comparison baseline, not a current hardware characterization:'
  zh: 刚才的模拟考虑了设备的连接关系，门操作仍是理想的。现在给同一台模拟设备加上内置噪声模型，重复测量这两个量子比特。这个模型提供了一组示例噪声参数，适合用来观察噪声的影响。实际芯片的噪声水平要通过实验测量。
  status: retired
- id: bdbe871e6b663591
  en: Compare runs with and without this model to study its effect on the output. `AtomArraySimulator` has no packaged reference noise model; pass a [`NoiseModel`][fatqat.NoiseModel] of your own when loading, loss, or other effects belong in the experiment.
  zh: 比较使用和不使用该模型的运行，可研究它对输出的影响。`AtomArraySimulator` 没有内置参考噪声模型；如果实验需要加载、丢失或其他效应，请传入自己的 [`NoiseModel`][fatqat.NoiseModel]。
  status: retired
- id: fb1f69303ed5d66a
  en: 'Unlike the superconducting profile, the atom array has no fixed geometry. Program resources define sites that begin empty. `Put` loads the atoms, while `Pair` and `Unpair` reshape the connectivity on which `CZ` is legal:'
  zh: 与超导设备模型不同，原子阵列没有固定几何结构。Program 资源定义初始为空的位置。`Put` 加载原子，`Pair` 和 `Unpair` 则改变允许施加 `CZ` 的连接关系：
  status: retired
- id: 9a47173f4a88d627
  en: '![An occupied atom undergoes a matched operation, after which Loss either leaves it present with probability one minus p or removes it with probability p; measurement of the empty site returns 2.](../assets/generated/guide/atom-loss-lifecycle.svg)'
  zh: '![已占据位置上的原子执行匹配的操作后，Loss 以一减 p 的概率保留原子，以 p 的概率移除原子；测量空位置返回 2。](../assets/generated/guide/atom-loss-lifecycle.svg)'
  status: machine
- id: ce3e44b2ed641cd8
  en: 'Loss can be attached to any supported operation. Here it is sampled after `RX`, so surviving atoms return `1`, while lost atoms return `2`:'
  zh: 你可以把丢失效应附加到任意受支持的操作上。这里在 `RX` 之后采样原子是否丢失：留下的原子测得 `1`，丢失的原子则报告 `2`。
  status: machine
- id: 4f6a2b6e6b6ffde4
  en: For native gates, program sizing, and method support, use the [hardware-profile API](../api/simulators/index.md). For pulse duration, physical levels, drift, or continuous-time noise, see [Hamiltonian emulation](hamiltonian-emulation.md).
  zh: 原生门、程序规模和方法支持见[设备模型 API](../api/simulators/index.md)。脉冲时长、物理能级、漂移和连续时间噪声见[哈密顿量仿真](hamiltonian-emulation.md)。
  status: retired
- id: ed9a89ad56f07017
  en: Choose a device model
  zh: 选择设备模型
  status: retired
- id: 668433d42207f707
  en: '[Superconducting simulation](superconducting-simulation.md) checks native gates and placement on a fixed coupling graph.'
  zh: '[超导比特模拟](superconducting-simulation.md)：检查原生门，以及固定耦合图上的量子比特位置。'
  status: retired
- id: 363a6b7d81fcfe1e
  en: '[Neutral-atom simulation](atom-array-simulation.md) tracks loading, pairing, and loss on an atom array.'
  zh: '[中性原子阵列模拟](atom-array-simulation.md)：跟踪原子阵列中的装载、配对和丢失。'
  status: retired
- id: 0e0819c985cdc655
  en: '[Linear optics simulation](linear-optics.md) follows photons through optical modes and interferometers.'
  zh: '[线性光学模拟](linear-optics.md)：研究光子在光学模式和干涉仪中的传播。'
  status: retired
- id: a7ca3c647b513d2c
  en: To adapt a logical circuit to a superconducting or neutral-atom target, see [Compile and run a logical circuit](compiler.md).
  zh: 要将逻辑线路转换为适合超导或中性原子设备执行的形式，请参阅[编译与运行逻辑线路](compiler.md)。
  status: retired
- id: fe9958ca277dcd76
  en: Atom occupancy and pairing
  zh: 原子占据与配对
  status: retired
- id: d8ef93b50b58f685
  en: The atom-array examples are now in [Neutral-atom simulation](atom-array-simulation.md#atom-occupancy-and-pairing).
  zh: 原子阵列示例已移至[中性原子阵列模拟](atom-array-simulation.md#atom-occupancy-and-pairing)。
  status: retired
