- id: aa1a41bfef436bfe
  en: The `>>>` examples below show an interactive Python session. To copy them into a `.py` file, remove the `>>>` and `...` prompts and keep only the code, not the displayed output.
  zh: 下面带 `>>>` 的示例展示的是 Python 交互式会话。你也可以把代码放进 `.py` 文件运行：复制时去掉 `>>>` 和 `...` 提示符，保留代码即可，不要复制示例中的输出结果。
  status: machine
- id: 8e4a41cb00b3ef65
  en: The Program describes *what* to execute. No simulator has been selected, and no state evolution has taken place yet.
  zh: 到这里，Program 已经记录了*要执行哪些操作*，但我们还没有选择模拟器，也没有开始模拟量子态的演化。
  status: machine
- id: 9ba8da39fabe01b8
  en: 'Program uses QuTiP-QIP to draw circuits. By default, it returns a Matplotlib figure that you can display or save:'
  zh: 我们可以先把量子线路画出来。Program 使用 QuTiP-QIP 绘图，默认返回一个 Matplotlib 图对象，你可以显示它，也可以保存为文件：
  status: machine
- id: fb98a7a4d7dbb5cf
  en: '`program.draw("text")` returns a text representation of the circuit; it does not print it to the terminal.'
  zh: 如果想在终端中查看量子线路，可以调用 `program.draw("text")`。它会返回一段表示线路的字符串，需要你自行打印。
  status: machine
- id: d80bcfb861ed4414
  en: For this Bell state, each shot returns either `00` or `11`, with equal probability. Finite sampling introduces random fluctuations, so the two counts are usually close. A fixed random seed makes the results reproducible. Use `Result.draw()` to plot the counts.
  zh: 你会发现，结果只有 `00` 和 `11`。对于本例的贝尔态，这两种结果的概率各为一半。由于采样有随机性，实际出现的次数通常接近，但不一定相等。固定随机种子可以让结果便于复现；调用 `Result.draw()`，就能把这些结果画成统计图。
  status: machine
