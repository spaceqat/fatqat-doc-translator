- id: 72734a3e1fe67af0
  en: 'Open the Command Palette with `Ctrl+Shift+P` on Windows/Linux or `Cmd+Shift+P` on macOS. Choose **Python: Select Interpreter** and select the interpreter in this folder''s `.venv`. If it is not listed, enter its path inside your learning folder: `.venv\Scripts\python.exe` on Windows or `.venv/bin/python` on macOS/Linux.'
  zh: '按 `Ctrl+Shift+P`（Windows/Linux）或 `Cmd+Shift+P`（macOS）打开命令面板，选择 **Python: Select Interpreter**，再选中当前文件夹里 `.venv` 环境的解释器。如果列表中没有它，可以手动输入路径：Windows 使用学习文件夹中的 `.venv\Scripts\python.exe`，macOS/Linux 使用 `.venv/bin/python`。'
  status: machine
