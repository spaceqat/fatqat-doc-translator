  zh: '![Bell 态测量计数，00 和 11 的柱高近似相等](../assets/generated/guide/quickstart-counts.png)'
  status: machine
- id: 7669978ca0e9f0ee
  en: Read basis indices
  zh: 理解基索引
  status: machine
- id: 5eb1d82357e6870a
  en: 'Public subsystem 0 is the most-significant factor. The two-qubit basis is `|00>`, `|01>`, `|10>`, `|11>` at flat indices 0 through 3. Consequently, `X(q0)|00>` has its nonzero amplitude at index 2, while `X(q1)|00>` uses index 1. Count strings use the same left-to-right public slot order: measuring those states into `(c0, c1)` produces `"10"` and `"01"`, respectively.'
  zh: 公共子系统 0 是最高有效位的张量因子。双量子比特基 `|00>`、`|01>`、`|10>`、`|11>` 对应展平索引 0 至 3。因此，`X(q0)|00>` 的非零振幅位于索引 2，`X(q1)|00>` 则位于索引 1。计数字符串采用相同的公共槽位从左到右顺序：将这些态测量到 `(c0, c1)`，分别得到 `"10"` 和 `"01"`。
  status: machine
