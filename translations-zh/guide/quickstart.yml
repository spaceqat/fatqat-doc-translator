- id: 1df35e1c1e518c9b
  en: Create a file named `first_program.py` in your `fatqat-learning` folder using a text editor. Copy the complete example below into the file and save it. Python code belongs in this file; terminal commands belong in the terminal. Avoid naming the file `fatqat.py` or accidentally saving it as `first_program.py.txt`.
  zh: "用文本编辑器在 `fatqat-learning` 文件夹中新建 `first_program.py`。把下面的完整示例复制进去并保存。Python 代码写在文件中，终端命令在终端中输入。不要将文件命名为 `fatqat.py`，也不要误存为 `first_program.py.txt`。"
  status: machine
