- id: 029b3729b776c140
  en: Follow a Program into physical dynamics
  zh: 用 Program 模拟物理动力学
  status: retired
- id: 64602d873716688f
  en: A FatQat emulator still accepts a [`Program`][fatqat.Program], but it changes what execution means. Instead of applying discrete gate transformations, it builds a physical schedule and integrates a time-dependent Hamiltonian (and, when requested, Lindblad evolution).
  zh: FatQat 仿真器仍然接受 [`Program`][fatqat.Program]，但它改变了执行的含义。它不再应用离散的门变换，而是创建物理调度并对时变哈密顿量进行积分（在需要时还包括 Lindblad 演化）。
  status: retired
- id: 9e82fb5edc155f3b
  en: 'Two authoring paths meet at that same schedule:'
  zh: 无论使用校准门还是直接编写脉冲，最终都会生成同一类物理调度：
  status: retired
- id: 1cb2f329da8e71d3
  en: The model supplies the physical levels, units, drift, channels, and coupling. A gate implementation map turns an ordinary gate into calibrated controls. A direct pulse supplies those controls explicitly. The following pages apply this shared workflow to transmons and atoms.
  zh: 模型定义物理能级、单位、漂移、控制通道（control channel）和耦合。门实现映射将普通量子门转换成校准后的控制信号；直接脉冲则由用户给出这些信号。后续页面会分别介绍如何将这一流程用于 transmon 和原子系统。
  status: retired
- id: 32e3064eeba6e018
  en: Run a calibrated gate
  zh: 运行校准过的门
  status: retired
- id: ab22e1776ac34659
  en: 'Use a packaged physical model as a reproducible baseline, then construct its emulator. Here a one-qubit Program is realized on a model containing two three-level transmons:'
  zh: 先用内置物理模型建立可复现的基准，再创建仿真器。下面的 Program 只声明一个量子比特，但运行所用的物理模型包含两个三能级 transmon：
  status: retired
- id: 035fa28c8323af7f
  en: '`RX` remains an ordinary Program operation. At execution time, the emulator''s gate map obtains a pulse recipe from its calibration and binds that recipe to the model''s drive channel. The physical model has two qutrits, so the returned vector covers all $3^2$ basis states, including the unaddressed second transmon. This physical qutrit state is not a logical qutrit Program.'
  zh: '`RX` 仍然是普通的 Program 操作。执行时，仿真器的门映射从其校准中获取脉冲配方，并把该配方绑定到模型的驱动信道上。物理模型有两个 qutrit，因此返回的向量覆盖全部 $3^2$ 个基态，包括未被寻址的第二个 transmon。这个物理 qutrit 态不是逻辑 qutrit Program。'
  status: retired
- id: c1aa9ad6278fd40e
  en: Packaged models and calibrations are reference snapshots. Supply a validated model document and implementation map when the physical system or calibration changes; do not interpret the packaged data as a live-device calibration.
  zh: 内置模型和校准是供参考的固定数据。物理系统或校准发生变化时，应提供经过验证的模型文档和实现映射；内置数据不代表实际设备的当前校准。
  status: retired
- id: 697dc50b09c3d990
  en: Add a pulse directly
  zh: 直接添加脉冲
  status: retired
- id: db7917a37985a929
  en: 'A direct pulse has three pieces: waveform samples, the physical channel they drive, and the duration of the control block. The code below builds them in that order as a [`SampledWaveform`][fatqat.emulator.SampledWaveform], a [`PulseControl`][fatqat.emulator.PulseControl], and finally a [`PulseOperation`][fatqat.operations.PulseOperation]:'
  zh: 直接脉冲由三部分组成：波形样本、它们驱动的物理控制通道，以及控制块的时长。下面的代码按此顺序创建 [`SampledWaveform`][fatqat.emulator.SampledWaveform]、[`PulseControl`][fatqat.emulator.PulseControl]，最后是 [`PulseOperation`][fatqat.operations.PulseOperation]：
  status: retired
- id: d935092160139fc2
  en: Notice that `direct_program.add(pulse)` has no logical target. The channel already names physical transmon `q0`, and a [`ResourceLayout`][fatqat.ResourceLayout] does not remap that address. The model and channel define the time and value units; the API reference records the exact domains for each emulator.
  zh: 注意 `direct_program.add(pulse)` 没有逻辑目标。通道已经指明了物理 transmon `q0`，而 [`ResourceLayout`][fatqat.ResourceLayout] 不会重新映射该地址。模型和通道定义时间与数值单位；API 参考记录了每个仿真器的精确取值域。
  status: retired
- id: bc074eb4e083958f
  en: Read a pulse as continuous evolution
  zh: 把脉冲理解为连续演化
  status: retired
- id: fbceb8bb98a0ff20
  en: The two waveform samples above are not two gate steps. Over the full 20-unit interval, the emulator interpolates the drive, combines it with drift and coupling terms, and integrates the physical state. That is why the result retains every level in the model, including levels that the logical Program did not declare.
  zh: 上面的两个波形样本并不是两个门步骤。在整个 20 个单位的区间内，仿真器对驱动进行插值，将其与漂移项和耦合项合并，并对物理态进行积分。这就是结果保留模型中所有能级（包括逻辑 Program 未声明的能级）的原因。
  status: retired
- id: e428f989cfeba0ac
  en: 'The next chapter turns this mechanism into a concrete transmon experiment: it compares a calibrated rotation with a direct drive and makes the resulting leakage visible.'
  zh: 下一章将通过具体的 transmon 实验，比较校准旋转与直接驱动，并观察两者产生的泄漏。
  status: retired
- id: eb74b3ff33415145
  en: Understand scheduling
  zh: 理解调度
  status: retired
- id: ae8716179ea8ef4a
  en: All controls inside one `PulseOperation` share its interval; `start_offset` can move an individual waveform within that interval. Between operations, the lightweight scheduler preserves source order for blocks that claim the same physical resource and may overlap independent blocks. Choose `"ASAP"` or `"ALAP"` through `simulation_config` when that placement matters.
  zh: 同一个 `PulseOperation` 内的所有控制共享其时间区间；`start_offset` 可以在该区间内移动单个波形。在操作之间，轻量级调度器为占用同一物理资源的块保持源码顺序，而相互独立的块则可能重叠。当这种放置很重要时，通过 `simulation_config` 选择 `"ASAP"` 或 `"ALAP"`。
  status: retired
- id: 5578acc9a8b282fd
  en: Drift and background continuous noise evolve throughout elapsed time. On an emulator that supports classical conditions, a false condition can skip a control block without deleting its duration, so the model still evolves during the interval. Those differences are why a Hamiltonian emulator answers a different question from a hardware-profile simulator.
  zh: 漂移和背景连续噪声在整个经过的时间内持续演化。在支持经典条件的仿真器上，条件为假可以跳过控制块但不会删除其时长，因此模型在该区间内仍然演化。这些差异正是哈密顿量仿真器与设备模型模拟器回答不同问题的原因。
  status: retired
- id: 9e73b4f96f6c735a
  en: 'The constructor''s `method` selects the mathematical representation and Result accessor: `statevector` (the default), `density_matrix`, or `unitary`. It does not select an internal differential-equation solver.'
  zh: 构造函数的 `method` 选择数学表示和 Result 访问器：`statevector`（默认）、`density_matrix` 或 `unitary`。它不选择内部的微分方程求解器。
  status: retired
- id: 966d30c7aad11f15
  en: Continue with [Transmon emulation](transmon-emulation.md) or [Neutral-atom emulation](neutral-atom-emulation.md). For pulse object, schedule, execution-method, and model contracts, use the [pulse-control API](../api/pulse-control/index.md) and [emulator API](../api/emulators/index.md).
  zh: 继续阅读 [超导 Transmon 仿真](transmon-emulation.md)或[中性原子仿真](neutral-atom-emulation.md)。有关脉冲对象、调度、执行方法和模型约定，请使用[脉冲控制 API](../api/pulse-control/index.md)和[仿真器 API](../api/emulators/index.md)。
  status: retired
- id: c40ad61ffde9f03d
  en: A FatQat emulator follows the physical state during timed controls. It accepts a [`Program`][fatqat.Program], builds a physical schedule, and integrates a time-dependent Hamiltonian (and, when requested, Lindblad evolution). Use it to study pulse duration, coupling, leakage, or noise acting continuously over elapsed time. Circuit simulators can include noise channels without resolving this time evolution.
  zh: FatQat 仿真器跟踪带时序控制下的物理态。它接受 [`Program`][fatqat.Program]，生成物理调度，并对含时哈密顿量进行积分；需要时还包括 Lindblad 演化。可用它研究脉冲时长、耦合、泄漏或随时间持续作用的噪声。线路模拟器也能包含噪声信道，但不解析这种时间演化。
  status: retired
- id: e05bbc9366180a3e
  en: '`RX` remains an ordinary Program operation. At execution time, the emulator''s gate map obtains a pulse recipe from its calibration and binds that recipe to the model''s drive channel. The physical model has two qutrits, so the returned vector covers all $3^2$ basis states, including the second transmon. The Program still declares one two-level qubit. Each transmon''s third physical level lets the result show leakage out of its qubit states, `|0>` and `|1>`.'
  zh: '`RX` 仍是 Program 中的普通量子门。执行时，仿真器的门映射从校准中取得脉冲方案，并将其绑定到模型的驱动通道。物理模型有两个 qutrit，因此返回向量覆盖全部 $3^2$ 个基态，包括第二个 transmon。Program 仍只声明一个二能级量子比特。每个 transmon 的第三个物理能级使结果能够显示从量子比特态 `|0>` 和 `|1>` 中产生的泄漏。'
  status: retired
- id: 45f638a78c961d4a
  en: The three waveform samples above specify a drive over the full 20-unit interval. The emulator interpolates between them, combines the drive with drift and coupling terms, and integrates the physical state. The state covers every level in the physical model throughout the pulse, including levels that the Program did not declare.
  zh: 上面的三个波形采样点定义了覆盖完整 20 个时间单位区间的驱动。仿真器在采样点之间插值，将驱动与漂移、耦合项组合，并对物理态积分。在整个脉冲期间，态始终覆盖物理模型中的每个能级，包括 Program 未声明的能级。
  status: retired
- id: 072ebeeb3ecb0bee
  en: All controls inside one `PulseOperation` share its interval; `start_offset` can move an individual waveform within that interval. Between operations, the schedule preserves source order for blocks that use the same physical resource and may overlap independent blocks. Choose `"ASAP"` or `"ALAP"` through `simulation_config` when that placement matters.
  zh: 同一个 `PulseOperation` 中的所有控制共享该脉冲块的时间区间；`start_offset` 可以在区间内平移单个波形。不同脉冲块之间，调度保持共用物理资源的块的源程序顺序，而独立块可以重叠。如果时序安排影响结果，可通过 `simulation_config` 选择 `"ASAP"` 或 `"ALAP"`。
  status: retired
- id: a9369d5400c85395
  en: Drift and background continuous noise evolve throughout elapsed time. On an emulator that supports classical conditions, a false condition can skip a control block without deleting its duration, so the model still evolves during the interval. This lets you study the effect of elapsed time even when no control is active.
  zh: 漂移和背景连续噪声在整个仿真时段内持续作用。对于支持经典条件的仿真器，条件为假时可以跳过控制信号，同时保留该控制块的时长。模型在这段时间内仍会演化，因此你可以研究未施加控制时等待时间的影响。
  status: machine
- id: a1e9e0d780032ee1
  en: '`RX` remains an ordinary Program operation. At execution time, the emulator''s gate map obtains a pulse recipe from its calibration and binds that recipe to the model''s drive channel. The physical model has two qutrits, so the returned state, a QuTiP ket `Qobj`, covers all $3^2$ basis states, including the second transmon. The Program still declares one two-level qubit. Each transmon''s third physical level lets the result show leakage out of its qubit states, `|0>` and `|1>`.'
  zh: '`RX` 仍是普通的 Program 操作。执行时，仿真器的门映射从校准数据中取得脉冲方案，并将其绑定到模型的驱动通道。物理模型包含两个三能级量子单元，因此返回的量子态是一个 QuTiP 右矢 `Qobj`，覆盖全部 $3^2$ 个基态，也包括第二个 transmon。Program 仍只声明一个二能级量子比特。每个 transmon 的第三个物理能级使结果能够体现从量子比特态 `|0>` 和 `|1>` 向外的泄漏。'
  status: retired
- id: 662a021e3ee25783
  en: All controls inside one `PulseOperation` share its interval; `start_offset` can move an individual waveform within that interval. Between operations, the schedule preserves source order for blocks that use the same physical resource and may overlap independent blocks. Choose `"ASAP"` or `"ALAP"` through `execution_config` when that placement matters.
  zh: 同一个 `PulseOperation` 中的所有控制共享该脉冲块的时间区间；`start_offset` 可以在区间内平移单个波形。不同脉冲块之间，调度保持共用物理资源的块的源程序顺序，而独立块可以重叠。如果时序安排影响结果，可通过 `execution_config` 选择 `"ASAP"` 或 `"ALAP"`。
  status: retired
- id: 14b295a7d9d48b5b
  en: Continue with [Transmon emulation](transmon-emulation.md) or [Neutral-atom emulation](neutral-atom-emulation.md). For pulse object, schedule, simulation-method, and model contracts, use the [pulse-control API](../api/pulse-control/index.md) and [emulator API](../api/emulators/index.md).
  zh: 继续阅读 [超导 Transmon 仿真](transmon-emulation.md)或[中性原子仿真](neutral-atom-emulation.md)。有关脉冲对象、调度、模拟方法和模型约定，请使用[脉冲控制 API](../api/pulse-control/index.md)和[仿真器 API](../api/emulators/index.md)。
  status: retired
- id: 8f00dc706b1f71dd
  en: For pulse object, schedule, simulation-method, and model contracts, use the [pulse-control API](../api/pulse-control/index.md) and [emulator API](../api/emulators/index.md).
  zh: 脉冲对象、调度、模拟方法和模型的具体用法，可以查阅[脉冲控制 API](../api/pulse-control/index.md)和[仿真器 API](../api/emulators/index.md)。
  status: machine
- id: 82c98d2f5e047bb8
  en: The model supplies the physical levels, units, drift, channels, and coupling. A gate implementation map turns an ordinary gate into calibrated controls. A direct pulse supplies those controls explicitly.
  zh: 模型定义物理能级、单位、漂移、控制通道和耦合。使用普通量子门时，门实现映射会将它转换为校准后的控制信号；使用直接脉冲时，则由你指定这些信号。
  status: retired
- id: 10024a47766e901a
  en: Quantum computation is ultimately implemented in physical systems. A gate in a circuit may correspond to a control pulse on a device, during which the system also evolves under its own dynamics and interactions. To understand what happens during that pulse, we can describe the system with a physical model and calculate its Hamiltonian evolution over time.
  zh: 量子计算最终需要在物理系统上实现。线路中的一个量子门，在设备上可能对应一段控制脉冲；在脉冲持续期间，系统也会受到自身动力学和相互作用的影响。要理解这段时间内发生了什么，可以用物理模型描述系统，计算它随时间的哈密顿量演化。
  status: retired
- id: 6cbc1d34692469bf
  en: Quantum computation is ultimately implemented in physical systems. A gate in a circuit may correspond to a control pulse on a device, during which the system also evolves under its own dynamics and interactions. To understand what happens during that pulse, we need to model the physical system and calculate how it evolves under its Hamiltonian.
  zh: 量子计算最终要在物理系统上实现。线路中的一个量子门，在设备上可能对应一段控制脉冲。脉冲施加期间，系统自身的动力学和相互作用也会影响量子态。要理解这段时间内发生了什么，需要用物理模型描述系统，再根据哈密顿量计算它随时间的演化。
  status: machine
- id: 6514a3155108cb2d
  en: Whether controls come from a gate calibration or a pulse you write directly, the emulator schedules when to apply them and uses that timing to calculate the system's evolution.
  zh: 无论使用校准过的门，还是直接编写的脉冲，仿真器都会把控制信号排到时间轴上，再按这个时序计算系统的演化。
  status: machine
- id: dc921778a08a0c1e
  en: '![Calibrated gates and direct pulses both supply controls to the physical schedule. The schedule determines when the controls act during Hamiltonian or Lindblad evolution.](../assets/images/pulse-schedule.svg)'
  zh: '![校准门和直接编写的脉冲都为物理调度提供控制信号。调度决定这些信号在哈密顿量或 Lindblad 演化过程中何时施加。](../assets/images/pulse-schedule.svg)'
  status: machine
- id: 61525e7e5dd36beb
  en: A FatQat emulator takes a [`Program`][fatqat.Program] and follows the state while the controls are applied. You can use it to see how pulse duration and coupling affect the result, or how much population leaks into higher levels. It can also include noise that acts continuously during the evolution.
  zh: FatQat 仿真器接收一个 [`Program`][fatqat.Program]，跟踪施加控制信号时量子态的变化。你可以用它观察脉冲时长和耦合如何影响结果，或有多少布居泄漏到了更高的能级。仿真也可以包含演化期间持续作用的噪声。
  status: machine
- id: a862bd73c328c473
  en: In digital quantum computation, you describe the computation with gates. At the pulse level, a gate calibration tells the emulator which control signals realize each gate. In analog quantum computation, you work with the system's evolution directly and can specify control pulses to shape its Hamiltonian over time.
  zh: 数字量子计算用一系列量子门描述计算。到了脉冲层，仿真器根据门的校准数据，确定用哪些控制信号实现这些门。模拟量子计算则直接利用系统的演化来完成计算，可以通过指定控制脉冲来改变系统的含时哈密顿量。
  status: machine
- id: 58d1cc8ee5adc05e
  en: Realize a gate with calibrated pulses
  zh: 用校准脉冲实现量子门
  status: machine
- id: 097e78760378fe3d
  en: Start with a one-qubit Program that applies a single `RX` gate. We run it with a built-in model of two three-level transmons. The model defines the physical levels, units, drift, control channels, and coupling.
  zh: 先写一个 Program，对一个量子比特施加一次 `RX` 门。这里用内置的物理模型来运行它。模型包含两个三能级 Transmon，定义了系统的能级、单位、漂移、控制通道和耦合。
  status: machine
- id: 7025ef57907ef691
  en: When the emulator runs `RX`, its gate implementation map supplies a calibrated pulse on the drive channel for the addressed transmon. The returned state is a QuTiP ket `Qobj` with $3^2$ amplitudes because it describes both three-level transmons in the model. Including the third level lets you see population leak out of the qubit states `|0>` and `|1>`.
  zh: 执行 `RX` 时，仿真器通过门实现映射，找到要施加到目标 Transmon 驱动通道上的校准脉冲。返回的量子态是 QuTiP 的 `Qobj`，包含 $3^2$ 个振幅，因为它描述的是模型里两个三能级 Transmon 的联合状态。有了第三能级，你就能看出有多少布居从量子比特态 `|0>` 和 `|1>` 泄漏出去。
  status: machine
- id: 9563dc68fe860d38
  en: To model a different system or use a different calibration, supply its model document and gate implementation map.
  zh: 要模拟其他物理系统，或使用另一套校准，可以提供相应的模型文档和门实现映射。
  status: machine
- id: 62a4767304ff8fc7
  en: Specify a control pulse directly
  zh: 直接指定控制脉冲
  status: machine
- id: 24bb2019ee05b43e
  en: Use the same model to see how a waveform of your choice drives a transmon. A [`SampledWaveform`][fatqat.emulator.SampledWaveform] sets the signal at three times. A [`PulseControl`][fatqat.emulator.PulseControl] sends it to a physical drive channel, and a [`PulseOperation`][fatqat.operations.PulseOperation] sets the duration of the control block.
  zh: 沿用同一个模型，这次看看自定义波形如何驱动 Transmon。先用 [`SampledWaveform`][fatqat.emulator.SampledWaveform] 指定三个时刻的信号值，再用 [`PulseControl`][fatqat.emulator.PulseControl] 将波形送到物理驱动通道，最后用 [`PulseOperation`][fatqat.operations.PulseOperation] 设定整个控制块的时长。
  status: machine
- id: 12026d136652fd8e
  en: In `direct_program.add(pulse)`, the drive channel already specifies physical transmon `q0`. A [`ResourceLayout`][fatqat.ResourceLayout] maps logical qubits to physical positions. The pulse uses the physical address and the time and signal units defined by the model and its channel.
  zh: 调用 `direct_program.add(pulse)` 时，驱动通道已经指明了物理 Transmon `q0`。[`ResourceLayout`][fatqat.ResourceLayout] 用于把逻辑量子比特映射到物理位置。这里的脉冲直接使用物理地址，时间和信号的单位由模型及其通道定义。
  status: machine
- id: c7e5eb799cf75bd9
  en: How the state evolves during a pulse
  zh: 脉冲期间量子态如何演化
  status: machine
- id: bce5b406a15ebc39
  en: The samples in the example let the drive rise from zero to its peak halfway through the 20-unit pulse and fall back to zero at the end. The emulator interpolates between the samples to calculate the drive at intermediate times. Together with drift and coupling, the drive determines the Hamiltonian used to evolve the full physical state through the pulse.
  zh: 这个脉冲持续 20 个时间单位。驱动从零开始，在中点达到峰值，最后回到零。仿真器在采样点之间插值，算出任意时刻的驱动信号。驱动、漂移和耦合共同决定哈密顿量，仿真器据此计算整个物理系统在脉冲期间的量子态演化。
  status: retired
- id: 24f7bb57e339a3e7
  en: Schedule multiple pulses
  zh: 安排多个脉冲的时序
  status: machine
- id: 2a4077c9f4de041e
  en: A `PulseOperation` sets a time window for all its controls. Use `start_offset` to shift a waveform within that window. Pulse blocks that use the same physical resource run in Program order. Independent blocks can overlap. To place each block as early or as late as the schedule allows, choose `"ASAP"` or `"ALAP"` through `execution_config`.
  zh: 同一个 `PulseOperation` 里的所有控制信号共享一段时间。可以用 `start_offset` 调整其中一个波形的起始时刻。使用同一物理资源的脉冲块按 Program 中的顺序执行，彼此独立的块则可以重叠。要让每个块尽早或尽晚开始，可在 `execution_config` 中选择 `"ASAP"` 或 `"ALAP"`。
  status: retired
- id: f9d011c56b20c016
  en: Choose `method` when creating the emulator to set the representation used for the simulation and the corresponding Result accessor. The options are `statevector` (the default), `density_matrix`, and `unitary`.
  zh: 创建仿真器时，用 `method` 选择仿真采用的表示方式，再从 Result 读取对应的结果。可以选择 `statevector`（默认）、`density_matrix` 或 `unitary`。
  status: machine
- id: dcac8f1c5ddcc0ea
  en: In the example above, the drive is zero at time 0, reaches 0.02 at time 10, and returns to zero at time 20. The emulator interpolates between those three samples to get a continuous waveform. At each instant, the drive combines with drift and coupling to determine the Hamiltonian and how the quantum state changes.
  zh: 在上面的例子中，驱动幅度在时刻 0 为零，到时刻 10 升至 0.02，再在时刻 20 回到零。仿真器在这三个采样点之间插值，得到连续的波形。每一时刻的驱动、漂移和耦合共同决定哈密顿量，仿真器据此计算量子态如何随时间变化。
  status: machine
- id: 170bff526716f555
  en: The schedule determines when each pulse block starts. Two blocks that use the same drive channel run one after the other, in Program order. Blocks can overlap when their physical resources are independent. Use `execution_config` to choose `"ASAP"` or `"ALAP"` for the earliest or latest valid start times. Within one `PulseOperation`, use `start_offset` to delay an individual waveform relative to the start of that block.
  zh: 调度决定每个脉冲块什么时候开始。两个脉冲块如果使用同一个驱动通道，就按 Program 里的顺序依次执行。它们所用的物理资源彼此独立时，就可以在时间上重叠。在 `execution_config` 中选择 `"ASAP"` 或 `"ALAP"`，可以让每个块在约束允许的范围内尽早或尽晚开始。同一个 `PulseOperation` 中，可以用 `start_offset` 让某条波形在块开始后再启动。
  status: machine
- id: 7129ba008180f5a1
  en: Write and run pulse programs
  zh: 编写和运行脉冲程序
  status: machine
