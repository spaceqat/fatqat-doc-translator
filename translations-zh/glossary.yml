# Context-sensitive terms are reviewed in prose, not by the substring checker.
# Add the English term at first mention when needed to distinguish the meaning.
contextual_terms:
  population:
    level_occupation: 量子态在某个能级上的 population 用「占据概率」，也可写成「测得该能级的概率」。不用「布居」。
    state_occupation: 指明具体状态时，直接写「处于该态的概率」，例如「处于里德堡态的概率」。
    state_transfer: population transfer 描述演化过程时用「态转移」或说明占据概率怎样变化。明确给出初态并讨论转移结果时，可写「从初态转移到目标态的概率」。
  register:
    api_object: Register（按名称和索引组织的程序资源）
    general_concept: 量子寄存器或经典寄存器
    verb: 注册
  operation:
    api_object: Operation
    concrete_action: 按上下文使用量子门、旋转、测量或脉冲块，不能一律称为量子门
  channel:
    quantum_noise: 量子信道（quantum channel），后文可简称信道
    classical_readout: 经典信道（classical channel），后文可简称信道
    pulse_control: 控制通道（control channel），后文可简称通道
  slot:
    register_member: 泛指寄存器中的一个元素时，用「寄存器成员」或「成员」，不用「槽位」。
    qubit_or_bit: 明确是二能级量子系统或二值经典数据时，分别用「量子比特」或「经典比特」。
    device_site: 硬件上的 site 或 placement 用「设备上的位置」或「物理位置」，与逻辑寄存器成员区分。
  view:
    register_selection: 保留 RegisterView 类型名。正文说明它表示「从一个寄存器中选出的一组成员」，不用「视图」。
    grid_selection: 按动作说「选中一行／一列／一块」或「选取一组目标」，不用「行视图」。
    heading: 同时介绍 RegisterRef 和 RegisterView 时，可用「单个成员与成组选择」。
  documentation_labels:
    case_studies: 应用案例
    connect_and_debug: 工具对接与排查
    simulation_choices: 选择模拟与仿真方式
    superconducting_qubits: 超导比特模拟
    neutral_atom_arrays: 中性原子阵列模拟
    linear_optics: 线性光学模拟
    transmon_emulation: 超导 Transmon 仿真
  circuit_and_wire:
    quantum_circuit: circuit 用「线路」；在同时出现输电线路的页面（如电网解列案例）中写「量子线路」，避免与输电线路混淆。
    wire: 线路图中的 wire 指某个量子比特，写「量子比特」或「该量子比特上」，不写「每条线路上」。
  shot:
    repetition: shot 指一次重复运行并测量，用「采样」（例如「每次采样」「1000 次采样」）；不用「测量」指代 shot。
  parity:
    bitstring_or_operator: 比特串或算符的 parity 用「奇偶性」，even/odd parity 写「奇偶性为偶／为奇」；parity check 用「奇偶校验」。不用「宇称」或「奇偶值」。
  lattice_site:
    chain_or_array: 自旋链、原子链或晶格模型中的 site 用「格点」，与「设备上的位置」区分。
  surface_code_patch:
    patch: 表面码的 patch 用「码块」。
  revival:
    quantum_revival: 量子态回到初态附近的 revival 用「复苏」，不用「回归」。
  power_systems:
    controlled_islanding: controlled islanding 用「受控解列」，首次出现时括注 controlled islanding；island 用「孤岛」。
    bus: bus 用「节点」，例如「9 节点系统」；不用「母线」。
    cut_lines: cut 用「切断线路」，cut weight 用「割权重」，split 用「划分」。
    obdd: OBDD 用「有序二叉决策图（OBDD）」。
    coherency: coherency 用「同调性」，coherent generator group 用「同调机群」。
    graph_node: 电网页面中，bus 已占用「节点」，图论意义的 node 写「顶点」。
  qubo:
    full_name: QUBO 全称写「二次无约束二元优化」，binary variable 写「二元变量」，binary vector/matrix 写「二元向量／矩阵」，不用「二进制」。只有讲整数的二进制表示时才用「二进制」。
  worker:
    thread: 并行执行中的 worker 是线程时写「工作线程」，不写「工作进程」。
  bulk_term:
    chain_bulk: 链或晶格内部（非边界）的项写「体项」，相应区域写「体区」。
  pair:
    unordered_pair: unordered pair 写「不分先后的格点对」或「所有配对」，不写「无序对」。
  case_study_titles:
    pxp_state_revivals: 观察 PXP 链中 Z₂ 态的复苏与纠缠
    rydberg_spin_correlations: 里德堡链中的反铁磁关联
