# Fixed renderings for unambiguous terms and names. `translate.py check`
# warns when a translated segment mentions an English term but contains
# neither the listed Chinese rendering nor the English term itself.
# These mappings apply to concepts. Exact API identifiers keep their spelling
# even when a lowercase word has a Chinese translation (Estimator vs estimator).
terms:
  FatQat: FatQat
  Qiskit: Qiskit
  OpenQASM: OpenQASM
  QuTiP: QuTiP
  NumPy: NumPy
  SciPy: SciPy
  Matplotlib: Matplotlib
  Numba: Numba
  PyPI: PyPI
  GitHub: GitHub
  Grover: Grover
  QAOA: QAOA
  VQE: VQE
  Pauli: Pauli
  Pauli channel: Pauli 噪声
  Kraus: Kraus
  Lindblad: Lindblad
  qubit: 量子比特
  register: 寄存器
  circuit: 线路
  measurement: 测量
  noise model: 噪声模型
  noise: 噪声
  hardware profile: 设备模型
  hardware-profile simulation: 硬件约束模拟
  hardware-profile simulator: 硬件约束模拟器
  simulator: 模拟器
  emulator: 仿真器
  simulation: 模拟
  emulation: 仿真
  entanglement: 纠缠
  statevector: 态矢量
  density matrix: 密度矩阵
  amplitude damping: 振幅阻尼
  phase damping: 相位阻尼
  depolarizing: 退极化
  thermal relaxation: 热弛豫
  readout: 读出
  coherence: 相干
  level population: 能级占据概率
  leakage: 泄漏
  pulse: 脉冲
  waveform: 波形
  Hamiltonian: 哈密顿量
  backend: 后端
  estimator: 估计器
  observable: 可观测量
  expectation value: 期望值
  neutral atom: 中性原子
  neutral-atom: 中性原子
  Rydberg: 里德堡
  superconducting: 超导
  feedforward: 前馈
  parameter: 参数
  sweep: 扫描
  fusion: 融合

# Context-sensitive terms are reviewed in prose, not by the substring checker.
# Add the English term at first mention when needed to distinguish the meaning.
contextual_terms:
  population:
    level_occupation: 量子态在某个能级上的 population 用「占据概率」，也可写成「测得该能级的概率」。不用「布居」。
    state_occupation: 指明具体状态时，直接写「处于该态的概率」，例如「处于里德堡态的概率」。
    state_transfer: population transfer 描述演化过程时用「态转移」或说明占据概率怎样变化。明确给出初态并讨论转移结果时，可写「从初态转移到目标态的概率」。
  register:
    api_object: Register（按名称和索引组织的程序资源）
    general_concept: 量子寄存器或经典寄存器
    verb: 注册
  operation:
    api_object: Operation
    concrete_action: 按上下文使用量子门、旋转、测量或脉冲块，不能一律称为量子门
  channel:
    quantum_noise: 量子信道（quantum channel），后文可简称信道
    classical_readout: 经典信道（classical channel），后文可简称信道
    pulse_control: 控制通道（control channel），后文可简称通道
  slot:
    register_member: 泛指寄存器中的一个元素时，用「寄存器成员」或「成员」，不用「槽位」。
    qubit_or_bit: 明确是二能级量子系统或二值经典数据时，分别用「量子比特」或「经典比特」。
    device_site: 硬件上的 site 或 placement 用「设备上的位置」或「物理位置」，与逻辑寄存器成员区分。
  view:
    register_selection: 保留 RegisterView 类型名。正文说明它表示「从一个寄存器中选出的一组成员」，不用「视图」。
    grid_selection: 按动作说「选中一行／一列／一块」或「选取一组目标」，不用「行视图」。
    heading: 同时介绍 RegisterRef 和 RegisterView 时，可用「单个成员与成组选择」。
  documentation_labels:
    case_studies: 应用案例
    connect_and_debug: 工具对接与排查
    simulation_choices: 选择模拟与仿真方式
    superconducting_qubits: 超导比特模拟
    neutral_atom_arrays: 中性原子阵列模拟
    linear_optics: 线性光学模拟
    transmon_emulation: 超导 Transmon 仿真
  case_study_titles:
    pxp_state_revivals: PXP 链何时接近初态
    rydberg_spin_correlations: 里德堡链中的反铁磁关联
