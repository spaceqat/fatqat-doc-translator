- id: 29bdf6270af416ab
  en: Simulate linear optics
  zh: ''
  status: pending
- id: 28d325570a2d2bb4
  en: 'Linear optics computes with photons travelling through optical modes, such as the two output ports of a beam splitter. It differs from qubit circuits in three ways:'
  zh: ''
  status: pending
- id: 78f424eaa240c9bb
  en: '**A mode holds any number of photons.** Its level `n` is a photon count, not one of two states.'
  zh: ''
  status: pending
- id: 8765afb750ad701e
  en: '**Photons are moved, never created.** Beam splitters and phase shifters redistribute photons among modes; the total number that entered stays the same.'
  zh: ''
  status: pending
- id: d66be5aca6a75876
  en: '**Photons are identical.** When two photons could have taken different paths to the same outcome, those paths interfere, and some outcomes disappear.'
  zh: ''
  status: pending
- id: ba88fbdb62ec9b5f
  en: This guide shows all three with the Hong–Ou–Mandel experiment, run on [`LOSimulator`][fatqat.simulator.LOSimulator].
  zh: ''
  status: pending
- id: 4e7747fb51373682
  en: One photon on a beam splitter
  zh: ''
  status: pending
- id: 22369d88558515cc
  en: 'A [`ModeRegister`][fatqat.ModeRegister] holds the modes. Measuring a mode records its photon count in a [`CountRegister`][fatqat.CountRegister]. Build a balanced (50:50) [`BeamSplitter`][fatqat.operations.BeamSplitter] between two modes and count the photons in each output:'
  zh: ''
  status: pending
- id: 1412f2452392ed95
  en: 'Photons enter through the run''s `initial_state`: a [`BasisState`][fatqat.simulator.BasisState] gives the photon count of each mode, and unnamed modes start empty. Send one photon into mode 0:'
  zh: ''
  status: pending
- id: a4be380e501a38f7
  en: 'Each key lists the counts in register order: `"10"` is the photon in mode 0, `"01"` in mode 1. The photon leaves through either port with probability ½, like a fair coin.'
  zh: ''
  status: pending
- id: ba1b2c723dcb4056
  en: 'Two photons: Hong–Ou–Mandel interference'
  zh: ''
  status: pending
- id: 61fe9e48969d77a1
  en: 'Now send one photon into each input. If the photons behaved like two independent coins, a quarter of the runs would put both in mode 0, a quarter both in mode 1, and half would put one in each mode, `"11"`:'
  zh: ''
  status: pending
- id: 4c2779c5b49269c4
  en: The outcome `"11"` never occurs; the photons always leave together. To end in `"11"`, both photons must pass straight through or both must be reflected. Because the photons are identical, these two histories lead to the same final state, so their amplitudes add, and at a 50:50 splitter they cancel exactly.
  zh: ''
  status: pending
- id: 1957dc784598f7d4
  en: '![Four beam-splitter diagrams show the histories of two photons entering modes 0 and 1. Both photons passing through and both reflecting each end in outcome 11; their amplitudes cos theta squared and minus sin theta squared add to cos 2 theta, which is zero at 50:50. One photon passing and the other reflecting puts both photons in mode 0 or both in mode 1.](../assets/generated/guide/hong-ou-mandel-histories.svg)'
  zh: ''
  status: pending
- id: 4635efaa3845c7bb
  en: This is Hong–Ou–Mandel interference, and it has no counterpart for classical particles.
  zh: ''
  status: pending
- id: 09be74f349ffead5
  en: Change the reflectivity
  zh: ''
  status: pending
- id: ced71eaa53845b66
  en: The cancellation is exact only for a balanced splitter. `BeamSplitter(theta)` reflects a photon with probability `R = sin(theta)**2`. The two histories that end in `"11"` have amplitudes `cos(theta)**2` and `-sin(theta)**2`, so the coincidence probability is `(1 - 2R)**2`. For distinguishable particles the probabilities would add instead, giving `(1 - R)**2 + R**2`.
  zh: ''
  status: pending
- id: ae86e013cbaf7480
  en: 'An [`Estimator`][fatqat.Estimator] computes the exact probability of `"11"` as the expectation value of [`Projector(1)`][fatqat.observable.Projector] on both modes. Sweep the angle to compare the two:'
  zh: ''
  status: pending
- id: 61683af1d22d3061
  en: 'A finer sweep traces the full curves:'
  zh: ''
  status: pending
- id: 5bb95c691d0519d8
  en: '![Coincidence probability against reflectivity. For distinguishable particles the curve dips to one half at reflectivity one half; for identical photons it dips to zero there. Both curves equal one at reflectivity zero and one.](../assets/generated/guide/hong-ou-mandel-reflectivity.svg)'
  zh: ''
  status: pending
- id: 058c0a2288b58a2e
  en: At `R = 0` and `R = 1` only one history is possible, so the two cases agree. In between, interference suppresses coincidences, and at `R = 0.5` it removes them completely. In the laboratory, the Hong–Ou–Mandel dip is usually traced at a fixed 50:50 splitter by delaying one photon, which makes the photons partly distinguishable and brings the coincidences back.
  zh: ''
  status: pending
- id: 172f3297c1076246
  en: Simulate larger interferometers
  zh: ''
  status: pending
- id: 283ed7a12dd9a492
  en: 'A statevector stores every combination of photon counts, from `0` to the cutoff in each mode. Twelve modes with four photons would need `5**12`, about 244 million amplitudes or 3.9 GB, although almost all of them stay zero: beam splitters never change the total photon number.'
  zh: ''
  status: pending
- id: 083de9f8f22ea8b8
  en: '`LOSimulator`''s default method, `"fixed_photon_state"`, stores only the arrangements of the photons you sent in, 1365 for four photons in twelve modes. All runs in this guide use it. This interferometer mixes neighboring modes in twelve layers:'
  zh: ''
  status: pending
- id: dc75b0535bdfc44a
  en: Each amplitude belongs to one arrangement of the four photons. [`fixed_photon_index`][fatqat.simulator.fixed_photon_index] finds the amplitude of an arrangement, given as photon counts in mode order. The probability that the photons leave in the four modes they entered is
  zh: ''
  status: pending
- id: 17f3966500113b69
  en: The method needs a `BasisState` start and modes only, and it rejects noise. For qubits alongside modes, dense initial states, or noise, choose `LOSimulator("statevector")` or `LOSimulator("density_matrix")`; see [`LOSimulator`][fatqat.simulator.LOSimulator] for the full rules.
  zh: ''
  status: pending
