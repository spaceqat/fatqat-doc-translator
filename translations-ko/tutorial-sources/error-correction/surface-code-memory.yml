  ko: 검출 사건은 안정자 결과의 변화를 보여 줍니다. 판독 오류는 데이터 상태를 바꾸지 않고도 검출기를 발화시킬 수 있고, 논리 X 오류는 신드롬 없이 저장된 논리 Z 값을 뒤집을 수 있습니다. 디코더가 잘못된 논리 등급의 복구를 선택할 수도 있습니다. 이 디코더는 게이트 수준 및 상관 오류를 독립적인 데이터 X 오류와 보조 판독 오류로 근사합니다.
