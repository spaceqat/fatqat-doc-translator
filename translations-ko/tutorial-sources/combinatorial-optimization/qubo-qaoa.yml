  en: Solve a QUBO with QAOA
  ko: QAOA로 QUBO 풀기
  status: machine
- id: 189befbced8301ba
  en: Map a constrained combinatorial problem to a QUBO, turn it into an Ising Hamiltonian and a FatQat program, and read the answer back out of the measured distribution.
  ko: 제약이 있는 조합 문제를 QUBO로 표현하고 Ising 해밀토니안과 FatQat 프로그램으로 변환한 뒤, 측정 분포에서 답을 읽어 냅니다.
  status: machine
- id: 098905eee48c3592
  en: One QAOA layer drawn as a circuit on nine qubits
  ko: 9큐비트 회로로 그린 QAOA 한 층
  status: machine
- id: ac4a29094ab0a6fe
  en: Energy landscape of a depth-one QAOA over its two angles
  ko: 두 각도에 따른 깊이 1 QAOA의 에너지 지형
  status: machine
- id: 10d40df4b16d4846
  en: Mean energy and optimal-solution probability against QAOA depth
  ko: QAOA 깊이에 따른 평균 에너지와 최적해 확률
  status: machine
- id: 8c69774fca9a76cf
  en: Sampled outcome histogram with the optimal bitstrings highlighted
  ko: 최적 비트열을 강조한 샘플링 결과 히스토그램
  status: machine
- id: 30a4e133c372f300
  en: 'Most discrete optimization problems that matter in practice — scheduling, routing, partitioning, portfolio selection — can be written as a *quadratic unconstrained binary optimization* problem:'
  ko: 스케줄링, 라우팅, 분할, 포트폴리오 선택 등 실용적인 이산 최적화 문제 대부분은 *이차 무제약 이진 최적화* 문제로 쓸 수 있습니다.
  status: machine
- id: 36b3837ffbc576ab
  en: 'QUBO is the lingua franca of quantum optimization because the map from $f$ to a quantum circuit is mechanical, and because the "unconstrained" part is a modeling convention rather than a limitation: a constraint becomes a penalty term that costs energy exactly when it is violated.'
  ko: QUBO가 양자 최적화의 공통 표현으로 쓰이는 이유는 $f$에서 양자 회로로 변환하는 절차가 명확하기 때문입니다. 또한 ‘무제약’은 표현 방식일 뿐 한계가 아닙니다. 제약을 위반할 때만 에너지 비용이 생기는 벌점 항으로 바꾸면 됩니다.
  status: machine
- id: 145a5502a50967ff
  en: 'This tutorial walks the whole path on a problem small enough to check by hand: splitting a nine-node weighted graph into two balanced halves while keeping two specific nodes apart. The graph is the WSCC 9-bus power network, with edge weights equal to the power flowing on each line, but nothing below uses that reading — it is simply a weighted graph with a partitioning problem on it. [Model controlled islanding as a QUBO](islanding-model.md) takes the same network and asks the full engineering question.'
  ko: 이 튜토리얼은 손으로 검증할 만큼 작은 문제로 전체 과정을 살펴봅니다. 가중치가 있는 9노드 그래프를 크기가 균형 잡힌 두 부분으로 나누면서 특정 두 노드를 서로 분리합니다. 그래프는 WSCC 9모선 전력망이며 간선 가중치는 선로의 전력 흐름입니다. 다만 아래에서는 전력망이라는 해석을 쓰지 않고 단순한 가중 그래프 분할 문제로 다룹니다. 실제 공학적 문제는 [제어된 계통 분리를 QUBO로 모델링하기](islanding-model.md)에서 다룹니다.
  status: machine
- id: 869e1f1dc83e37c6
  en: 'Along the way this tutorial establishes the pieces every QUBO application reuses:'
  ko: 이 과정에서 모든 QUBO 응용에 재사용할 요소를 익힙니다.
  status: machine
- id: 80e5d442e56715f2
  en: '**Model.** Write the objective and every constraint as one quadratic function of binary variables.'
  ko: '**모델링.** 목적함수와 모든 제약을 이진 변수의 하나의 이차 함수로 작성합니다.'
  status: machine
- id: 9a468021750a2ef5
  en: '**Map.** Substitute $x_i = (1 - z_i)/2$ to get an Ising Hamiltonian whose ground state is the answer.'
  ko: '**변환.** $x_i = (1 - z_i)/2$를 대입해 바닥 상태가 답이 되는 Ising 해밀토니안을 얻습니다.'
  status: machine
- id: 18be77b87f0337d7
  en: '**Build.** Turn each Ising term into gates: an `RZ` per field term, a `CX`-`RZ`-`CX` ladder per coupling, and an `RX` mixer.'
  ko: '**구성.** Ising 항을 게이트로 바꿉니다. 장 항에는 `RZ`, 결합 항에는 `CX`-`RZ`-`CX`, 혼합기에는 `RX`를 사용합니다.'
  status: machine
- id: 42cdb00b080fe2a6
  en: '**Evaluate.** Get the energy from `fatqat.Estimator`, or read the whole outcome distribution from the simulator.'
  ko: '**평가.** `fatqat.Estimator`로 에너지를 얻거나 시뮬레이터에서 전체 결과 분포를 읽습니다.'
  status: machine
- id: 8e6c0e5114807953
  en: '**Optimize and read out.** Move the angles downhill, then sample and decode.'
  ko: '**최적화와 판독.** 에너지가 낮아지는 방향으로 각도를 조정한 뒤 샘플링하고 디코딩합니다.'
  status: machine
- id: 51cb881bfdcd17bc
  en: Everything is seeded, exact where it can be, and runs in a few seconds on a laptop CPU.
  ko: 모든 난수에 시드를 지정하고 가능한 계산은 정확하게 수행합니다. 노트북 CPU에서도 몇 초 안에 실행됩니다.
  status: machine
- id: d14703d1c84265e4
  en: The problem, as a QUBO
  ko: 문제를 QUBO로 표현하기
  status: machine
- id: c7b55042de7dddf1
  en: 'The graph has nine nodes and nine weighted edges. A partition assigns each node to side 0 or side 1, and its cost is the total weight of the edges it cuts. Two requirements come along with it: the two halves must be as equal as nine nodes allow, and nodes 1 and 7 must end up on opposite sides.'
  ko: 그래프에는 아홉 노드와 아홉 가중 간선이 있습니다. 분할은 각 노드를 0번 또는 1번 부분에 배정하며, 비용은 잘린 간선의 총 가중치입니다. 추가 조건은 두 가지입니다. 아홉 노드로 가능한 한 두 부분의 크기를 같게 하고, 노드 1과 7은 반대쪽에 두어야 합니다.
  status: machine
- id: 0f62a0d28fb22fe0
  en: 'One binary variable per node is enough, because with two sides the variable''s value *is* the side. That is worth noticing early: an encoding that cannot represent an invalid assignment needs no penalty to forbid one.'
  ko: 두 부분만 있으므로 변수값 자체가 소속 부분이며 노드당 이진 변수 하나면 충분합니다. 처음부터 중요한 선택입니다. 잘못된 배정을 표현할 수 없는 인코딩이라면 이를 금지할 벌점도 필요 없습니다.
  status: machine
- id: a4cf555959e44e6a
  en: Nine nodes do not divide evenly into two halves, so the balance target is 4.5 and the penalty cannot reach zero. It contributes a constant floor of $2 \times 0.25$ to every energy, and still prefers a 4/5 split over any other.
  ko: 아홉 노드를 정확히 반으로 나눌 수 없으므로 균형 목표는 4.5이며 벌점은 0이 될 수 없습니다. 모든 에너지에 $2 \times 0.25$의 최소 상수 비용이 더해지지만, 여전히 다른 분할보다 4/5 분할을 선호합니다.
  status: machine
- id: 9370ea11f5b3875c
  en: 'A QUBO is just three containers: a constant, a vector of linear coefficients, and a dictionary of pair coefficients. Building it by hand keeps the algebra visible, and every term below is one line of the model.'
  ko: QUBO는 상수, 선형 계수 벡터, 쌍 계수 사전이라는 세 자료구조로 표현할 수 있습니다. 직접 구성하면 대수가 드러나며, 아래 각 항은 모델의 한 줄에 해당합니다.
  status: machine
- id: 6bed240a6f5c8828
  en: The cut term uses the identity $x_i + x_j - 2 x_i x_j$, which is 1 when the two endpoints disagree and 0 when they agree. The balance term squares $\sum_i x_i - N/2$. The separation term is $1 - (x_i + x_j - 2 x_i x_j)$, which charges the penalty exactly when the two nodes agree.
  ko: 절단 항은 두 끝점이 다르면 1, 같으면 0인 항등식 $x_i + x_j - 2 x_i x_j$를 사용합니다. 균형 항은 $\sum_i x_i - N/2$를 제곱합니다. 분리 항은 $1 - (x_i + x_j - 2 x_i x_j)$로, 두 노드가 같은 쪽일 때만 벌점을 줍니다.
  status: machine
- id: 206303448c670604
  en: With nine variables there are only 512 assignments, so the exact answer is one enumeration away. Every later result is measured against it.
  ko: 변수가 아홉 개이면 배정은 512개뿐이므로 전수 조사로 정확한 답을 구할 수 있습니다. 이후 모든 결과를 이 답과 비교합니다.
  status: machine
- id: 1fd8819fdbce8397
  en: 'The enumeration also fixes a convention that matters everywhere else: **row $k$ is the binary expansion of $k$ with variable 0 in the most significant position**. That is exactly how FatQat orders a counts string and a statevector index, so the same array serves as the cost of each measurement outcome without any reindexing.'
  ko: 전수 조사에서 사용할 순서도 정합니다. **행 $k$는 변수 0을 최상위 자리에 놓은 $k$의 이진 표현입니다.** FatQat의 측정 횟수 문자열과 상태 벡터 인덱스도 같은 순서이므로, 인덱스를 다시 정렬하지 않고 이 배열을 각 측정 결과의 비용으로 사용할 수 있습니다.
  status: machine
- id: b8dfbc8bc7bf8b34
  en: 'Two optimal assignments, not one: relabeling the two sides gives back the same partition. That symmetry stays with us — it will show up again as an exactly zero magnetic field in the Ising model, and as two equally tall bars in the final histogram.'
  ko: 최적 배정은 하나가 아니라 두 개입니다. 두 부분의 이름을 바꾸어도 같은 분할이기 때문입니다. 이 대칭은 Ising 모델에서 정확히 0인 자기장으로, 최종 히스토그램에서는 높이가 같은 두 막대로 다시 나타납니다.
  status: machine
- id: 70a16e09b859bb95
  en: From binary variables to a Hamiltonian
  ko: 이진 변수에서 해밀토니안으로
  status: machine
- id: de76cab3fe0a3e5a
  en: QAOA works with spins, not bits. Substituting $x_i = (1 - z_i)/2$ with $z_i = \pm 1$ turns the QUBO into
  ko: QAOA는 비트 대신 스핀을 사용합니다. $z_i = \pm 1$에 대해 $x_i = (1 - z_i)/2$를 대입하면 QUBO는 다음과 같이 바뀝니다.
  status: machine
- id: b53e4fd65e6c363c
  en: 'and the value of $H$ on a spin string equals the value of $f$ on the corresponding bit string. The convention $z = +1$ for $x = 0$ means the spin string reads directly off a measurement: qubit measured 0 is spin $+1$.'
  ko: 스핀열에서의 $H$ 값은 대응하는 비트열에서의 $f$ 값과 같습니다. $x = 0$에 $z = +1$을 대응시키므로 측정 결과에서 스핀열을 바로 읽을 수 있습니다. 큐비트 측정값 0은 스핀 $+1$입니다.
  status: machine
- id: 7e8e0da36930d7fc
  en: Working out the substitution term by term gives the coefficients below. The offset collects everything constant; it shifts every energy equally, so it never reaches a gate, but it must be added back before an energy is reported.
  ko: 각 항에 치환을 적용하면 아래 계수를 얻습니다. 오프셋은 모든 상수 항을 모은 값입니다. 모든 에너지를 똑같이 옮기므로 게이트로 구현할 필요는 없지만, 에너지를 보고할 때는 다시 더해야 합니다.
  status: machine
- id: 65fef8a013e37e82
  en: 'The field is identically zero. That is the side-relabeling symmetry again: the problem cannot prefer $z$ over $-z$, so no single-spin term survives, and the whole Hamiltonian lives in the couplings. Nothing in what follows depends on that, but it is a useful check that the model says what it was meant to say.'
  ko: 장은 모든 위치에서 0입니다. 두 부분의 이름을 바꾸는 대칭 때문입니다. 문제는 $z$와 $-z$ 중 하나를 선호할 수 없으므로 단일 스핀 항이 남지 않고 해밀토니안 전체가 결합 항으로 이루어집니다. 이후 절차가 이 성질에 의존하지는 않지만 모델이 의도대로 표현되었는지 확인하는 데 유용합니다.
  status: machine
- id: 52df780071c96174
  en: The QAOA program
  ko: QAOA 프로그램
  status: machine
- id: b92b8e454c9f987d
  en: 'QAOA prepares the equal superposition, then alternates two evolutions $p$ times: a phase separator $e^{-i\gamma H}$ that stamps a phase proportional to each assignment''s cost, and a mixer $e^{-i\beta \sum_i X_i}$ that moves amplitude between assignments.'
  ko: QAOA는 균일 중첩을 준비한 뒤 두 시간 진화를 $p$번 번갈아 적용합니다. 위상 분리기 $e^{-i\gamma H}$는 각 배정의 비용에 비례하는 위상을 부여하고, 혼합기 $e^{-i\beta \sum_i X_i}$는 배정 사이로 진폭을 이동시킵니다.
  status: machine
- id: 763583154f288566
  en: Both pieces are elementary gates. FatQat's `RZ(theta)` is $\mathrm{diag}(e^{-i\theta/2}, e^{+i\theta/2})$, so a field term needs `RZ(2*gamma*h)`. A coupling term is the same rotation conjugated by a `CX` pair, which writes the parity of the two qubits onto the target before rotating it. The mixer is `RX(2*beta)` on every qubit.
  ko: 둘 다 기본 게이트로 구현합니다. FatQat의 `RZ(theta)`는 $\mathrm{diag}(e^{-i\theta/2}, e^{+i\theta/2})$이므로 장 항에는 `RZ(2*gamma*h)`가 필요합니다. 결합 항에는 같은 회전 앞뒤에 `CX`를 놓습니다. 회전 전에 두 큐비트의 패리티를 타깃에 기록하는 방식입니다. 혼합기는 모든 큐비트에 적용하는 `RX(2*beta)`입니다.
  status: machine
- id: 2e08ba49437a0646
  en: Program qubit $i$ is variable $i$, and FatQat keeps qubit 0 leftmost in a counts string and most significant in a statevector index — the same order the enumeration above already uses.
  ko: 프로그램의 큐비트 $i$는 변수 $i$입니다. FatQat은 측정 횟수 문자열에서 큐비트 0을 맨 왼쪽에, 상태 벡터 인덱스에서는 최상위 자리에 둡니다. 앞의 전수 조사와 같은 순서입니다.
  status: machine
- id: 0fce656469c0cefe
  en: A parameter cannot be scaled inside a gate argument — FatQat gate angles take a number or a bare `fatqat.Parameter`, not an expression — and every phase rotation here needs $\gamma$ multiplied by its own coupling. The program is therefore rebuilt for each set of angles, which costs about a millisecond and disappears next to the simulation.
  ko: 게이트 인수 안에서 매개변수에 배율을 곱할 수는 없습니다. FatQat의 게이트 각도는 수치나 단독 `fatqat.Parameter`를 받으며 표현식은 받지 않습니다. 여기서는 각 위상 회전마다 $\gamma$에 해당 결합값을 곱해야 하므로 각도 집합이 바뀔 때마다 프로그램을 다시 만듭니다. 약 1밀리초의 비용으로 시뮬레이션 시간에 비하면 작습니다.
  status: machine
- id: 6a488f9a52e374bb
  en: Two ways to get the energy
  ko: 에너지를 얻는 두 방법
  status: machine
- id: 0de10e789b248a69
  en: The quantity to minimize is $\langle \psi(\beta,\gamma) | H | \psi(\beta,\gamma) \rangle$. FatQat offers two routes to it, and they are worth comparing once before trusting either.
  ko: 최소화할 양은 $\langle \psi(\beta,\gamma) | H | \psi(\beta,\gamma) \rangle$입니다. FatQat에서 이를 얻는 방법은 두 가지이며, 결과를 신뢰하기 전에 한 번 비교해 볼 만합니다.
  status: machine
- id: 63eb163947e91dc6
  en: '`fatqat.Estimator` takes the Hamiltonian as an `Observable` and returns the expectation directly. `Observable.from_sparse` names only the non-identity factors of each term, which suits a Hamiltonian with many two-body terms, and the identity term carries the offset.'
  ko: '`fatqat.Estimator`는 해밀토니안을 `Observable`로 받아 기댓값을 직접 반환합니다. `Observable.from_sparse`는 각 항에서 항등 연산이 아닌 인자만 지정하므로 이체 항이 많은 해밀토니안에 적합합니다. 항등 항에 오프셋을 넣습니다.'
  status: machine
- id: d6e6e6f73de24c37
  en: 'The second route exploits a property specific to QUBO: $H$ is diagonal, so its expectation is just the cost of each outcome averaged over the output distribution. One statevector, one dot product against the spectrum computed earlier — and it is exact, cheaper, and gives the whole distribution rather than only its mean.'
  ko: 두 번째 방법은 QUBO의 특성을 이용합니다. $H$가 대각 행렬이므로 기댓값은 출력 분포로 각 결과의 비용을 평균한 값입니다. 상태 벡터 하나와 앞서 계산한 스펙트럼의 내적이면 됩니다. 정확하고 더 저렴하며 평균뿐 아니라 전체 분포도 얻습니다.
  status: machine
- id: df72a652a18c71c4
  en: The two agree to machine precision, which confirms the observable, the gate construction, and the bit ordering all at once. From here on the distribution route is used, because it also reports how much probability sits on the optimum — the number that actually decides whether a run succeeded.
  ko: 두 값은 기계 정밀도까지 일치합니다. 관측량, 게이트 구성, 비트 순서가 모두 맞음을 동시에 확인한 것입니다. 이후에는 분포를 사용하는 방법을 택합니다. 실제 성공을 판단하는 값인 최적해의 확률도 알 수 있기 때문입니다.
  status: machine
- id: fd8ced18236c71d3
  en: The depth-one landscape
  ko: 깊이 1의 에너지 지형
  status: machine
- id: 03451b75f080b63a
  en: 'At $p = 1$ there are only two angles, so the entire landscape can be drawn. This is the cheapest way to learn the scale a problem wants: $\gamma$ enters the circuit multiplied by a coupling, so a Hamiltonian with large couplings has its structure squeezed into small $\gamma$, and an optimizer started on the wrong scale will wander over featureless terrain.'
  ko: $p = 1$에서는 각도가 두 개뿐이므로 전체 지형을 그릴 수 있습니다. 문제에 맞는 척도를 알아보는 가장 저렴한 방법입니다. 회로에서 $\gamma$는 결합 계수와 곱해지므로 결합이 큰 해밀토니안의 구조는 작은 $\gamma$ 영역에 압축됩니다. 잘못된 척도에서 시작한 최적화기는 특징 없는 영역을 헤맬 수 있습니다.
  status: machine
- id: a191f3c66af164f9
  en: The landscape is smooth and periodic in $\beta$ with period $\pi$, and its structure in $\gamma$ repeats on the scale set by the couplings. The minimum is a broad basin, which is why a gradient-free optimizer started anywhere sensible finds it.
  ko: 지형은 매끄럽고 $\beta$에 대해 주기 $\pi$를 가지며, $\gamma$ 방향의 구조는 결합 계수가 정하는 척도에서 반복됩니다. 최솟값 주변이 넓은 골짜기이므로 합리적인 위치에서 시작한 무미분 최적화기가 이를 찾을 수 있습니다.
  status: machine
- id: 513f1d4f6822692c
  en: Optimizing, one layer at a time
  ko: 한 층씩 최적화하기
  status: machine
- id: cfc427e89b749e09
  en: 'Depth is what makes QAOA work: as $p$ grows the ansatz can concentrate more amplitude on low-energy assignments. The angles at depth $p$, however, are hard to find from a cold start, because the landscape grows a local minimum for roughly every new dimension.'
  ko: 깊이는 QAOA의 표현력을 높입니다. $p$가 커질수록 변분 회로는 저에너지 배정에 더 많은 진폭을 모을 수 있습니다. 하지만 차원이 늘 때마다 국소 최솟값도 늘어나므로, 깊이 $p$의 각도를 처음부터 찾기는 어렵습니다.
  status: machine
- id: 39a9ba7b78f6bd0b
  en: 'The standard remedy is to grow the depth: solve $p = 1$ from several random starts, then seed $p = 2$ from that solution, and so on. Two seeds are worth trying at each step. Repeating the last layer''s angles usually reaches a deeper basin, while setting the new layer''s angles to zero makes it the identity, so the deeper ansatz begins exactly at the shallower optimum and cannot do worse. Taking the better of the two — plus a couple of perturbed variants — keeps the curve monotone without an expensive global search at every depth.'
  ko: 일반적인 해결책은 깊이를 점진적으로 늘리는 것입니다. 여러 무작위 시작점에서 $p = 1$을 푼 뒤 그 해로 $p = 2$를 초기화하는 식입니다. 각 단계에서 두 초기값을 시도할 만합니다. 마지막 층의 각도를 반복하면 더 깊은 골짜기에 도달하는 경우가 많고, 새 층의 각도를 0으로 두면 항등 연산이 되어 얕은 회로의 최적해에서 정확히 시작하므로 결과가 나빠질 수 없습니다. 두 방법과 약간 교란한 후보 중 가장 좋은 것을 고르면 깊이마다 비싼 전역 탐색을 하지 않고도 단조롭게 개선되는 곡선을 얻습니다.
  status: machine
- id: 5aa6e7e4b1557d2e
  en: COBYLA suits the inner loop because it needs no gradient, which matters as soon as the energy comes from finite sampling rather than exact simulation.
  ko: COBYLA는 기울기가 필요 없어 내부 반복에 적합합니다. 정확한 시뮬레이션 대신 유한 샘플링으로 에너지를 얻을 때 특히 중요합니다.
  status: machine
- id: 76d7809a6e237a65
  en: Both numbers improve with every layer, and they measure different things. The mean energy is what the optimizer sees; it falls toward the exact minimum but never reaches it, because the state stays a superposition over many assignments. The probability of measuring an optimal assignment is what actually matters for solving the problem, and it is the number to quote.
  ko: 두 수치는 층을 늘릴 때마다 개선되지만 서로 다른 것을 측정합니다. 최적화기가 보는 평균 에너지는 정확한 최솟값에 가까워지되, 상태가 여러 배정의 중첩이므로 거기에 도달하지는 않습니다. 문제를 푸는 데 실제로 중요한 값, 그리고 보고해야 할 값은 최적 배정을 측정할 확률입니다.
  status: machine
- id: 7259673d1e96db73
  en: Reading the answer out
  ko: 답 읽어 내기
  status: machine
- id: 32e7c8be68d6be81
  en: 'A QAOA circuit is a sampler, not an oracle: it returns a distribution in which good assignments are over-represented. The practical procedure is to measure a few thousand shots, evaluate the true objective on each distinct outcome, and keep the best. Evaluating the objective is classical and cheap, so a run succeeds as soon as *one* shot lands on a good assignment — a far weaker requirement than the mean energy reaching the minimum.'
  ko: QAOA 회로는 정답을 바로 주는 장치가 아니라 좋은 배정이 더 자주 나오는 분포를 만드는 샘플러입니다. 실제로는 수천 샷을 측정하고 서로 다른 각 결과에서 원래 목적함수를 계산한 뒤 가장 좋은 것을 고릅니다. 목적함수 평가는 고전적으로 저렴하므로 좋은 배정이 *한 샷*만 나와도 성공입니다. 평균 에너지가 최솟값에 도달해야 한다는 조건보다 훨씬 약합니다.
  status: machine
- id: c7c21a98e8771a64
  en: The two optimal assignments are among the most frequent outcomes, and they are each other's bitwise complement — the side-relabeling symmetry, surviving all the way from the Hamiltonian's zero field to the measured histogram.
  ko: 두 최적 배정은 가장 자주 나오는 결과에 속하며 서로 비트별 보수입니다. 두 부분의 이름을 바꾸는 대칭이 해밀토니안의 0인 장에서부터 측정 히스토그램까지 유지됩니다.
  status: machine
- id: e953eea81def0772
  en: What carries over
  ko: 다른 문제에 재사용하기
  status: machine
- id: e5adff9d8fa863df
  en: 'Nothing above was specific to graph partitioning. The QUBO containers, the substitution to spins, the phase-separator and mixer construction, the two ways of getting an energy, the depth-growing optimizer, and the sample-and-decode readout are the same for any QUBO. Applying them to a new problem means writing one function: the one that turns the application''s objective and constraints into `constant`, `linear`, and `quadratic`.'
  ko: 앞의 절차는 그래프 분할에만 한정되지 않습니다. QUBO 자료구조, 스핀 치환, 위상 분리기와 혼합기 구성, 두 가지 에너지 평가, 깊이를 늘리는 최적화, 샘플링과 디코딩은 모든 QUBO에 동일합니다. 새 문제에 적용할 때는 응용의 목적과 제약을 `constant`, `linear`, `quadratic`으로 바꾸는 함수 하나를 작성하면 됩니다.
  status: machine
- id: 1a6535745dc77e82
  en: 'Three lessons generalize with them:'
  ko: 다음 세 가지 교훈도 함께 적용됩니다.
  status: machine
- id: bee5bad99482cb9a
  en: '**The encoding is the first optimization.** Choosing one variable per node rather than one per node-and-side halved the qubit count *and* removed a penalty term, before any quantum work happened.'
  ko: '**인코딩이 첫 번째 최적화입니다.** 노드와 소속 부분마다 변수를 두는 대신 노드당 하나를 사용하면 양자 계산을 시작하기도 전에 큐비트 수를 절반으로 줄이고 벌점 항 하나도 제거합니다.'
  status: machine
- id: 47a1b66fb9e7ace9
  en: '**Penalty weights must dominate what they forbid.** A violation has to cost more than the objective improvement it could buy, or the ground state will simply be infeasible.'
  ko: '**벌점 가중치는 금지하려는 이득보다 커야 합니다.** 위반으로 얻을 수 있는 목적함수 개선보다 위반 비용이 커야 합니다. 그렇지 않으면 바닥 상태가 실행 불가능한 해가 됩니다.'
  status: machine
- id: dd7d7eb24be97e29
  en: '**Not every constraint belongs in the QUBO.** Requirements that are awkward to write quadratically are often cheaper to check classically after measurement, since decoding is free compared with the circuit.'
  ko: '**모든 제약을 QUBO에 넣을 필요는 없습니다.** 이차식으로 쓰기 어려운 조건은 측정 후 고전적으로 검사하는 편이 저렴한 경우가 많습니다. 회로 실행에 비하면 디코딩 비용은 작기 때문입니다.'
  status: machine
- id: 2c3f526f2e98c43a
  en: '[Model controlled islanding as a QUBO](islanding-model.md) puts all three to work on a real application, where the choice of encoding decides whether the problem fits on the hardware at all, and [Split a power grid into islands with QAOA](islanding-qaoa.md) runs it.'
  ko: '[제어된 계통 분리를 QUBO로 모델링하기](islanding-model.md)는 이 세 원칙을 실제 응용에 적용합니다. 인코딩 선택이 문제를 하드웨어에 올릴 수 있는지까지 결정합니다. [QAOA로 전력망을 독립 계통으로 나누기](islanding-qaoa.md)에서는 이를 실행합니다.'
  status: machine
