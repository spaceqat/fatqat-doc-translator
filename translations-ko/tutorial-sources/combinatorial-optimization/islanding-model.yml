  en: Show why splitting a power grid to stop a cascading failure is a combinatorial optimization problem, and write it as a QUBO for a quantum optimizer.
  ko: 연쇄 고장을 막기 위해 전력망을 분할하는 일이 왜 조합 최적화 문제인지 살펴보고, 이를 양자 최적화기에 넣을 QUBO로 작성합니다.
  status: machine
- id: b0b021e6b8f657c6
  en: '**Islands should be balanced.** The model asks for islands of roughly equal size, which rules out the degenerate split that cuts off a single bus.'
  ko: '**섬은 균형을 이루어야 합니다.** 이 모델은 섬의 크기가 대략 같기를 요구하므로, 모선 하나만 떼어 내는 퇴화된 분할을 배제합니다.'
  status: machine
- id: bdcfb616c2363463
  en: The formulation developed here follows REGRID-QAOA [1], which introduces this coherency-informed model of controlled islanding together with the structured postprocessing the companion tutorial uses.
  ko: 여기서 전개하는 정식화는 REGRID-QAOA [1]을 따릅니다. 이 논문은 동조성을 반영한 제어된 계통 분리 모델과 함께, 후속 튜토리얼에서 사용하는 구조화된 후처리를 제안합니다.
  status: retired
- id: d738a90bd2fd0f9f
  en: 'The textbook encoding gives every bus one binary variable per island: $y_{i,g} = 1$ when bus $i$ joins island $g$. It handles any number of islands, but most of its bitstrings are nonsense — a bus can be assigned to two islands, or to none — so it needs a one-hot penalty $\sum_i (\sum_g y_{i,g} - 1)^2$ to forbid them, written in the standard way of turning a constraint into a quadratic penalty [4], and it costs $n_\text{buses} \times k$ qubits.'
  ko: 교과서적인 인코딩은 모선마다 섬별로 이진 변수를 하나씩 둡니다. 모선 $i$가 섬 $g$에 속하면 $y_{i,g} = 1$입니다. 섬이 몇 개든 다룰 수 있지만, 비트열 대부분은 의미가 없습니다. 한 모선이 두 섬에 배정되거나 어느 섬에도 배정되지 않을 수 있기 때문입니다. 따라서 이를 금지하는 원-핫 벌점 $\sum_i (\sum_g y_{i,g} - 1)^2$이 필요하며, 이 벌점은 제약을 이차 벌점으로 바꾸는 표준 방식[4]으로 작성합니다. 필요한 큐비트 수는 $n_\text{buses} \times k$입니다.
  status: machine
- id: 79146811beeb2d45
  en: This is not a modeling mistake but a deliberate trade. Writing connectivity as a quadratic penalty needs auxiliary variables and a great many terms, which costs width and depth on a device that has neither to spare. Checking it after decoding costs nothing. The consequence is that minimizing the QUBO is not the same as solving the problem, and the gap has to be closed somewhere else. That is the job of the postprocessing in [Split a power grid into islands with QAOA](islanding-qaoa.md).
  ko: 이는 모델링 실수가 아니라 의도한 절충입니다. 연결성을 이차 벌점으로 쓰려면 보조 변수와 매우 많은 항이 필요하며, 폭과 깊이에 여유가 없는 장치에서는 그만큼 부담이 됩니다. 반면 디코딩한 뒤 검사하는 데는 비용이 들지 않습니다. 그 결과 QUBO를 최소화하는 것이 곧 문제를 푸는 것은 아니며, 그 간극은 다른 곳에서 메워야 합니다. 이것이 [QAOA로 전력망을 섬 계통으로 나누기](islanding-qaoa.md)에서 다루는 후처리의 역할입니다.
  status: retired
- id: 167db6b80e08c703
  en: On the 14-bus system the cheapest split already separates the coherent groups correctly; it fails the connectivity check instead, as shown above. In both systems the cheapest answer is not the usable one.
