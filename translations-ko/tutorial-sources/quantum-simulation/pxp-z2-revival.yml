  ko: 표본 사이의 구간에 대해 Trotter 프로그램을 하나 만듭니다. $|Z_2\rangle$에서 시작해 각 실행의 최종 상태를 다음 실행의 `initial_state`로 넘깁니다. 노이즈가 없고 시간에 무관한 이 퀜치에서는 Trotter 단계에 맞춘 균일한 격자를 쓰면, 매 표본에서 초기 상태부터 다시 실행한 것과 같은 순서의 진화를 얻습니다.
