- id: f776b45517b352b9
  en: We prepare $|Z_2\rangle$, let it go, and watch the return probability $F(t)=|\langle Z_2|\psi(t)\rangle|^2$. A handful of special scarred eigenstates dominate this quench, so $F(t)$ oscillates with a period near $T\approx 4.7/g$, where $g=\Omega/2$ is the PXP coefficient. For the drive used below that means $T\approx 1.5$ µs -- but rather than trusting the estimate, we will simply measure where the peaks actually land.
  ko: $|Z_2\rangle$를 준비해 그대로 진화시키면서 되돌아올 확률 $F(t)=|\langle Z_2|\psi(t)\rangle|^2$를 관찰합니다. 이 퀜치는 소수의 특별한 스카 고유 상태가 지배하므로 $F(t)$는 $T\approx 4.7/g$에 가까운 주기로 진동합니다. 여기서 $g=\Omega/2$는 PXP 계수입니다. 아래에서 사용하는 구동에서는 $T\approx 1.5$ µs에 해당하지만, 이 추정값에 의존하지 않고 봉우리가 실제로 나타나는 위치를 직접 측정합니다.
  status: machine
- id: e7e53de75a66f1ad
  en: 'Ten sites, working in rad/µs and µs units, and the familiar drive scale $\Omega=2\pi$ rad/µs, so the PXP coefficient is $g=\pi$ rad/µs. One convention to keep straight: FatQat stores the amplitude of $|b_0\ldots b_9\rangle$ at index $\sum_i b_i 2^{N-1-i}$ (site 0 is the most significant bit), so each Néel state is a single basis vector -- just two index numbers to remember.'
  ko: 사이트 열 개를 사용하고 단위는 rad/µs와 µs이며, 익숙한 구동 척도 $\Omega=2\pi$ rad/µs를 쓰므로 PXP 계수는 $g=\pi$ rad/µs입니다. 한 가지 규약에 유의하세요. FatQat은 $|b_0\ldots b_9\rangle$의 진폭을 인덱스 $\sum_i b_i 2^{N-1-i}$에 저장합니다(사이트 0이 최상위 비트). 따라서 각 Néel 상태는 기저 벡터 하나이며, 기억할 인덱스는 두 개뿐입니다.
  status: machine
