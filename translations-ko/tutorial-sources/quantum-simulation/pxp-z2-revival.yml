- id: bc70ac1035891004
  en: We prepare $|Z_2\rangle$, evolve it under $H_{\mathrm{PXP}}$, and track the return probability $F(t)=|\langle Z_2|\psi(t)\rangle|^2$. A small number of scarred eigenstates dominate this quench, so $F(t)$ oscillates with a period near $T\approx 4.7/g$, where $g=\Omega/2$ is the PXP coefficient. For the drive used below, this estimate gives $T\approx 1.5$ µs; we locate the revival peaks directly from the simulated data.
  ko: $|Z_2\rangle$를 준비해 $H_{\mathrm{PXP}}$로 시간 진화시키면서 되돌아올 확률 $F(t)=|\langle Z_2|\psi(t)\rangle|^2$를 추적합니다. 이 퀜치는 소수의 스카 고유 상태가 지배하므로 $F(t)$는 $T\approx 4.7/g$에 가까운 주기로 진동합니다. 여기서 $g=\Omega/2$는 PXP 계수입니다. 아래에서 사용하는 구동에서는 이 추정값이 $T\approx 1.5$ µs이며, 재현 봉우리는 시뮬레이션 데이터에서 직접 찾습니다.
  status: retired
