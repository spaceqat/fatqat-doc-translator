  ko: 모듈, 상수, Z2 벡터
  status: machine
- id: 735ebb315bf89414
  en: 'Ten sites, working in rad/us and us units, and the familiar drive scale $\Omega=2\pi$ rad/us, so the PXP coefficient is $g=\pi$ rad/us. One convention to keep straight: FATQAT stores the amplitude of $|b_0\ldots b_9\rangle$ at index $\sum_i b_i 2^{N-1-i}$ (site 0 is the most significant bit), so each Neel state is a single basis vector -- just two index numbers to remember.'
  ko: 열 위치를 사용하며 단위는 rad/us와 us입니다. 익숙한 구동 척도 $\Omega=2\pi$ rad/us를 쓰므로 PXP 계수는 $g=\pi$ rad/us입니다. 기저 순서에 유의하세요. FATQAT은 $|b_0\ldots b_9\rangle$의 진폭을 인덱스 $\sum_i b_i 2^{N-1-i}$에 저장합니다. 위치 0이 최상위 비트이므로 각 Neel 상태는 기저 벡터 하나이며, 해당하는 두 인덱스만 정하면 됩니다.
  status: machine
- id: 358c7c83cbe273ed
  en: 3. Trotterizing PXP into a fatqat program
  ko: 3. PXP를 fatqat 프로그램으로 Trotter 분해하기
  status: machine
- id: f8c161b6503ae29e
  en: Two constraints decided the approach. First, the pulse emulators always start from $|g\ldots g\rangle$ and only offer global controls, so a quench from $|Z_2\rangle$ is simply not expressible there; the gate-level [`Simulator`][fatqat.simulator.Simulator], on the other hand, happily accepts an `initial_state`. Second, no native gate set contains a PXP term, so we use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to supply a local matrix for each PXP operation.
  ko: 두 제약 때문에 이 접근을 선택했습니다. 첫째, 펄스 에뮬레이터는 항상 $|g\ldots g\rangle$에서 시작하고 전역 제어만 제공하므로 $|Z_2\rangle$에서 시작하는 퀀치를 표현할 수 없습니다. 반면 게이트 수준 [`Simulator`][fatqat.simulator.Simulator]는 `initial_state`를 받습니다. 둘째, 네이티브 게이트 집합에는 PXP 항이 없으므로 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]으로 각 PXP 연산의 국소 행렬을 제공합니다.
  status: machine
- id: 3844729635724a7b
  en: The exponentials we need are easy to write down. With $M=PXP$ and $M^2=P\otimes I\otimes P$,
  ko: 필요한 지수 연산자는 간단히 쓸 수 있습니다. $M=PXP$이고 $M^2=P\otimes I\otimes P$이면
  status: machine
- id: c5d1095ee4717ed0
  en: Concretely, that is a $2\times 2$ rotation between $|ggg\rangle$ and $|grg\rangle$ for a bulk term, and between $|gg\rangle$ and $|rg\rangle$ (left edge) or $|gg\rangle$ and $|gr\rangle$ (right edge) for the boundary terms. Each matrix is built once, checked to be unitary, and registered under its operation class.
  ko: 구체적으로 내부 항은 $|ggg\rangle$와 $|grg\rangle$ 사이의 $2\times 2$ 회전입니다. 경계 항은 왼쪽에서 $|gg\rangle$와 $|rg\rangle$, 오른쪽에서 $|gg\rangle$와 $|gr\rangle$ 사이의 회전입니다. 각 행렬은 한 번 만들고 유니터리인지 검사한 뒤 해당 연산 클래스에 등록합니다.
  status: machine
- id: 38cb3c48923c07f4
  en: Now for the actual time evolution. We want $e^{-iH_{\mathrm{PXP}}dt}$, where $H_{\mathrm{PXP}}=\sum_j h_j$ with $h_j=(\Omega/2)M_j$. The $h_j$'s do not commute, so the exponential does not factor into a product of the individual $e^{-ih_j dt}$'s -- it has to be approximated. The first-order Trotter formula just sweeps the terms once,
  ko: 이제 실제 시간 진화를 구성합니다. 목표는 $e^{-iH_{\mathrm{PXP}}dt}$이며 $H_{\mathrm{PXP}}=\sum_j h_j$, $h_j=(\Omega/2)M_j$입니다. $h_j$들은 서로 교환하지 않으므로 전체 지수를 개별 $e^{-ih_j dt}$의 곱으로 정확히 분해할 수 없고 근사가 필요합니다. 1차 Trotter 공식은 각 항을 한 번씩 적용합니다.
  status: machine
- id: 8bb547b29d7342b9
  en: 'and its leading error is a commutator of the $h_j$''s. A symmetric (Strang) step removes that leading error: split every term into two half angles, sweep forward, then sweep the same half angles backward,'
  ko: 이때 주된 오차는 $h_j$들의 교환자에서 생깁니다. 대칭적인 Strang 단계는 이 주된 오차를 제거합니다. 모든 항의 각도를 절반으로 나누어 정방향으로 적용한 뒤, 같은 반각을 역순으로 적용합니다.
  status: machine
- id: 403d59f01d13d8cf
  en: In code, the forward pass is `for site in range(NUM_SITES)` -- left edge, then the bulk terms, then the right edge -- and the backward pass is the same loop in reverse. Each half-step exponent is $h_j\,dt/2$, and $h_j$ already carries $\Omega/2$, so every registered matrix uses the one angle $\theta=\Omega\,dt/4$. Repeating this symmetric step `round(duration / dt)` times walks the quench out to durations that are integer multiples of `dt`.
  ko: 코드의 정방향 적용은 `for site in range(NUM_SITES)`이며 왼쪽 경계, 내부 항, 오른쪽 경계 순서입니다. 역방향은 같은 반복을 거꾸로 수행합니다. 각 반단계의 지수는 $h_j\,dt/2$이고 $h_j$에 이미 $\Omega/2$가 포함되므로, 등록하는 모든 행렬에 각도 $\theta=\Omega\,dt/4$ 하나를 사용합니다. 이 대칭 단계를 `round(duration / dt)`번 반복하면 `dt`의 정수배인 지속 시간까지 퀀치를 진행할 수 있습니다.
  status: machine
- id: 9d1f96b180a23ce4
  en: 'A small warning from experience: when fatqat flattens a local matrix, the FIRST target is the most significant bit -- index $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$. It is easy to get this backwards (we did), and the result is silently wrong dynamics rather than an error message.'
  ko: 직접 겪은 실수를 하나 짚고 넘어가겠습니다. fatqat이 국소 행렬을 평탄화할 때 **첫 번째** 타깃이 최상위 비트입니다. 즉 인덱스는 $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$입니다. 이 순서를 반대로 넣기 쉽고, 실제로 저자도 그랬습니다. 이 경우 오류 메시지 없이 잘못된 동역학이 나옵니다.
  status: machine
