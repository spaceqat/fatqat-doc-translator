  en: 'A Trotterized PXP chain on FatQat''s gate-level simulator reproduces the exact quench dynamics from $|Z_2\rangle$: periodic, slowly decaying returns to the initial state, and entanglement that grows more slowly near each return. Custom operations with a `MatrixImplementationMap` and a chosen `initial_state` make it possible to study a constrained model that the pulse emulators cannot start from.'
  ko: FatQat의 게이트 수준 시뮬레이터에서 Trotter 분해한 PXP 사슬은 $|Z_2\rangle$에서 시작하는 정확한 퀜치 동역학을 재현합니다. 초기 상태로 주기적으로 되돌아오면서 그 크기가 천천히 줄고, 되돌아올 때마다 얽힘의 증가가 느려집니다. `MatrixImplementationMap`으로 정의한 사용자 정의 연산과 직접 지정한 `initial_state` 덕분에, 펄스 에뮬레이터로는 시작 상태를 만들 수 없는 제약된 모델도 다룰 수 있습니다.
