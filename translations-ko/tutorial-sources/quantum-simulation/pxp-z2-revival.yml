- id: 336cb8cd2d2749cd
  en: This is a $2\times 2$ rotation between $|ggg\rangle$ and $|grg\rangle$ for a bulk term, and between $|gg\rangle$ and $|rg\rangle$ (left edge) or $|gg\rangle$ and $|gr\rangle$ (right edge) for the boundary terms. We build each matrix once and register it under its operation class.
  ko: 이는 벌크 항에서는 $|ggg\rangle$와 $|grg\rangle$ 사이의 회전이고, 경계 항에서는 $|gg\rangle$와 $|rg\rangle$(왼쪽 끝) 또는 $|gg\rangle$와 $|gr\rangle$(오른쪽 끝) 사이의 $2\times 2$ 회전입니다. 각 행렬은 한 번만 만들어 해당 연산 클래스에 등록합니다.
  status: retired
- id: 43345ec6a8db29ab
  en: The time evolution we need is $e^{-iH_{\mathrm{PXP}}dt}$, where $H_{\mathrm{PXP}}=\sum_j h_j$ with $h_j=(\Omega/2)M_j$. The $h_j$ do not commute, so the exponential does not factor into a product of the individual $e^{-ih_j dt}$ and must be approximated. The first-order Trotter formula applies each term once,
  ko: 필요한 시간 진화는 $e^{-iH_{\mathrm{PXP}}dt}$이며, $H_{\mathrm{PXP}}=\sum_j h_j$이고 $h_j=(\Omega/2)M_j$입니다. $h_j$들은 서로 교환하지 않으므로 이 지수 함수는 개별 $e^{-ih_j dt}$의 곱으로 분해되지 않아 근사해야 합니다. 1차 Trotter 공식은 각 항을 한 번씩 적용합니다.
  status: retired
- id: d79fd422fc4e3698
  en: 'and its leading error is a commutator of the $h_j$. A symmetric (Strang) step removes that leading error: it splits every term into two half angles, applies them in forward order, and then applies the same half angles in reverse order,'
  ko: 이때 선도 오차는 $h_j$들의 교환자입니다. 대칭(Strang) 단계는 이 선도 오차를 없앱니다. 모든 항을 절반 각도 두 개로 나누어 정방향으로 적용한 뒤, 같은 절반 각도를 역순으로 적용합니다.
  status: retired
- id: 15ad972da6cad45e
  en: In the code, the forward pass is `for site in range(NUM_SITES)` (left edge, bulk terms, right edge), and the backward pass is the same loop in reverse. Each half-step exponent is $h_j\,dt/2$, and $h_j$ already contains $\Omega/2$, so every registered matrix uses the angle $\theta=\Omega\,dt/4$. Repeating the symmetric step `round(duration / dt)` times evolves the state for durations that are integer multiples of `dt`.
  ko: 코드에서 정방향 진행은 `for site in range(NUM_SITES)`(왼쪽 끝, 벌크 항, 오른쪽 끝)이고, 역방향 진행은 같은 반복문을 거꾸로 도는 것입니다. 반 단계의 지수는 $h_j\,dt/2$이고 $h_j$에 이미 $\Omega/2$가 들어 있으므로, 등록하는 모든 행렬은 각도 $\theta=\Omega\,dt/4$를 사용합니다. 대칭 단계를 `round(duration / dt)`번 반복하면 `dt`의 정수배에 해당하는 시간만큼 상태가 진화합니다.
  status: retired
- id: e907e20350c090df
  en: 'When FatQat flattens a local matrix, the first target is the most significant bit: the index is $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$. Reversing this order would make the edge terms act on the wrong site. The result would be incorrect dynamics, not an error message.'
  ko: FatQat이 국소 행렬을 평탄화할 때는 첫 번째 타깃이 최상위 비트이며, 인덱스는 $b_{t_0}\cdot 2^{k-1} + \cdots + b_{t_{k-1}}$입니다. 이 순서를 뒤집으면 경계 항이 엉뚱한 사이트에 작용합니다. 그래도 오류 메시지는 나오지 않고 동역학만 틀리게 됩니다.
  status: retired
