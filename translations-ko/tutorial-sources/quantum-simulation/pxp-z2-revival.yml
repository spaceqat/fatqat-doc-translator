- id: 56eec14fd9735561
  en: FatQat's pulse emulators do not accept an `initial_state`; every run starts with all sites in the ground state. The two-level Rydberg emulator also provides only global drive and detuning controls, so it cannot prepare $|Z_2\rangle$ by addressing alternate sites. The gate-level [`Simulator`][fatqat.simulator.Simulator], in contrast, accepts an `initial_state`. No native gate set contains a PXP term, so we use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to supply a local matrix for each PXP operation.
  ko: FatQat의 펄스 에뮬레이터는 `initial_state`를 받지 않으며, 모든 실행이 전체 사이트가 바닥 상태인 데서 시작합니다. 2준위 Rydberg 에뮬레이터는 전역 구동과 디튜닝 제어만 제공하므로 사이트를 하나씩 지정해 $|Z_2\rangle$를 준비할 수도 없습니다. 반면 게이트 수준 [`Simulator`][fatqat.simulator.Simulator]는 `initial_state`를 받습니다. PXP 항을 담은 네이티브 게이트 집합은 없으므로, [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]으로 각 PXP 연산에 국소 행렬을 지정합니다.
  status: retired
