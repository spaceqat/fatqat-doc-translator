  ko: $\Delta=0$으로 두고 최근접 이웃 상호작용 $U$를 구동보다 훨씬 크게 만듭니다. 그러면 이웃한 두 여기가 다른 어떤 과정보다 큰 에너지를 요구하므로, 동역학은 이웃한 두 원자가 동시에 $|r\rangle$에 있지 않은 부분공간에 머무릅니다. 이 부분공간에서 1차 섭동 이론을 적용하면 다음을 얻습니다.
