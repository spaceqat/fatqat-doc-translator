  en: We Trotterize the PXP Hamiltonian into small custom gates and run them on FatQat's gate-level simulator, starting from $|Z_2\rangle$. An independent QuTiP solution of the exact PXP model provides a reference for every curve.
  ko: PXP 해밀토니안을 Trotter 분해해 작은 사용자 정의 게이트로 만들고, $|Z_2\rangle$에서 출발해 FatQat의 게이트 수준 시뮬레이터에서 실행합니다. 정확한 PXP 모델을 QuTiP으로 따로 푼 해가 모든 곡선의 기준이 됩니다.
