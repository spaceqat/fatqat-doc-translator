  en: In the strong-coupling limit of the Rydberg blockade, the Rydberg Hamiltonian reduces to the PXP model, and quenching it from the Néel state produces persistent many-body revivals.
  ko: Rydberg 봉쇄의 강한 커플링 극한에서 Rydberg 해밀토니안은 PXP 모델로 줄어들며, 이 모델을 Néel 상태에서 퀜치하면 오래 지속되는 다체 재현이 나타납니다.
  status: machine
- id: 1effcdc262d4fe66
  en: 'One practical wrinkle: FatQat''s pulse emulators reject `initial_state`, so every run starts from the ground state, and the two-level Rydberg emulator offers only global drive and detuning controls, so a quench from $|Z_2\rangle$ cannot be expressed there. The workaround below is to Trotterize the PXP Hamiltonian into small custom gates and run them on the gate-level simulator, which does accept an arbitrary `initial_state`. An independent QuTiP solve of the exact PXP model checks every curve along the way.'
  ko: 실제로는 한 가지 걸림돌이 있습니다. FatQat의 펄스 에뮬레이터는 `initial_state`를 받지 않으므로 모든 실행이 바닥 상태에서 시작하고, 2준위 Rydberg 에뮬레이터는 전역 구동과 디튜닝 제어만 제공하므로 $|Z_2\rangle$에서 시작하는 퀜치를 표현할 수 없습니다. 아래에서는 PXP 해밀토니안을 Trotter 분해해 작은 사용자 정의 게이트로 만들고, 임의의 `initial_state`를 받는 게이트 수준 시뮬레이터에서 실행해 이 문제를 우회합니다. 정확한 PXP 모델을 QuTiP으로 따로 푼 해로 모든 곡선을 검증합니다.
  status: machine
