- id: 201231e5d3f5c3ee
  en: 'The one-site profile is reflection symmetric and visibly influenced by the open edges; it does not pretend that the finite chain selected one perfect bit string. The connected-correlation matrix carries the clearer many-body signature: its signs alternate with separation, while neighbouring double excitations are strongly suppressed. Retaining all $C_6/R^6$ pairs and keeping only nearest pairs lead to the same qualitative state; their small quantitative difference comes from the long-range tails and the associated site-dependent Z shifts. The all-pair result is the physical default. The truncated result is useful because it exposes the familiar nearest-neighbour Ising interpretation.'
  ko: 위치별 점유 분포는 반사 대칭이며 열린 경계의 영향을 분명히 받습니다. 유한한 사슬이 완벽한 비트열 하나를 선택했다고 해석해서는 안 됩니다. 다체 특성은 연결 상관 행렬에서 더 선명하게 보입니다. 거리에 따라 부호가 번갈아 나타나고, 이웃한 두 위치의 동시 여기는 강하게 억제됩니다. 모든 $C_6/R^6$ 쌍을 유지하든 최근접 쌍만 남기든 정성적으로 같은 상태를 얻습니다. 작은 정량적 차이는 장거리 꼬리와 그에 따른 위치별 Z 이동에서 비롯됩니다. 물리 모델의 기본 결과는 모든 쌍을 포함한 것입니다. 절단한 결과는 익숙한 최근접 이웃 Ising 모형으로 해석할 수 있다는 점에서 유용합니다.
  status: machine
