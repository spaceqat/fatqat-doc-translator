- id: 575b5f9816c0aadd
  en: 'For the nearest-neighbour approximation, an interior chain site has two neighbours. Choosing $\Delta=U$ cancels its induced longitudinal field. Our chosen peak drive makes the transverse and ZZ coefficients equal:'
  ko: 최근접 이웃 근사에서 사슬 내부의 각 위치는 이웃이 두 개입니다. $\Delta=U$로 정하면 유도된 종방향 자기장이 상쇄됩니다. 앞서 정한 최대 구동에서는 횡장 계수와 ZZ 계수가 같습니다.
  status: machine
- id: 9d29729d74c80b30
  en: This cancellation is exact for the bulk of a periodic nearest-neighbour chain, but not for our finite open chain. An edge has only one neighbour and retains a $+U Z/4$ field. The full $1/R^6$ model adds smaller, position-dependent shifts as well. A single global detuning cannot cancel every site, and the tutorial will not hide that boundary effect.
  ko: 이 상쇄는 주기적 최근접 이웃 사슬의 벌크에서는 정확하지만, 여기서 사용하는 유한한 열린 사슬에서는 그렇지 않습니다. 끝에는 이웃이 하나뿐이므로 $+U Z/4$의 자기장이 남습니다. 전체 $1/R^6$ 모델은 위치에 따라 달라지는 더 작은 이동도 추가합니다. 하나의 전역 디튜닝으로 모든 위치의 자기장을 상쇄할 수는 없으므로, 이 경계 효과를 그대로 반영합니다.
  status: machine
- id: c84d2e0b11cf968c
  en: 'More importantly, bulk cancellation is not the best final point for this preparation. At zero drive, adding one excitation while creating one adjacent pair changes the energy by $-\Delta+U$; it costs nothing at $\Delta=U$. We instead finish at $\Delta=U/3$: positive detuning rewards Rydberg occupation, while one nearest-neighbour pair still costs more than the extra excitation gains. This suppresses adjacent excitations, but it does not leave only the two perfect Néel strings: a finite open chain also admits maximum-occupation patterns containing a domain wall. Nearest-pair interactions leave those patterns degenerate, while the full $1/R^6$ tails weakly split them. The goal is therefore short-range antiferromagnetic correlation, not perfect Néel-state preparation. The cancellation formula remains useful for interpreting the Hamiltonian even though we do not end at its bulk value.'
  ko: 또한 벌크 자기장을 상쇄하는 지점이 이번 상태 준비에 가장 좋은 종착점은 아닙니다. 구동이 0일 때 여기 하나를 추가하면서 인접한 여기 쌍을 하나 만들면 에너지는 $-\Delta+U$만큼 변합니다. $\Delta=U$에서는 에너지 비용이 없습니다. 대신 $\Delta=U/3$에서 끝내겠습니다. 양의 디튜닝은 Rydberg 점유를 유리하게 만들지만, 최근접 여기 쌍을 만드는 비용은 여기 하나를 더해 얻는 이득보다 여전히 큽니다. 이렇게 하면 인접 여기를 억제할 수 있지만, 완벽한 두 Néel 비트열만 남지는 않습니다. 유한한 열린 사슬에는 도메인 벽을 포함하면서도 최대 점유를 이루는 배열이 가능합니다. 최근접 쌍 상호작용만 있으면 이 배열들은 축퇴되어 있고, 전체 $1/R^6$ 꼬리가 있으면 약하게 갈라집니다. 따라서 목표는 완벽한 Néel 상태 준비가 아니라 단거리 반강자성 상관입니다. 벌크 상쇄 값에서 끝내지는 않더라도, 상쇄 공식은 해밀토니안을 해석하는 데 유용합니다.
  status: machine
