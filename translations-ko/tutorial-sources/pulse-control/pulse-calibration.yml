- id: 512d71a9d53c2893
  en: Calibrating a quantum gate
  ko: 양자 게이트 보정하기
  status: machine
- id: d79c6a0705d8bec6
  en: Build a control pulse, collect amplitude-calibration data, and verify an X rotation on several input states.
  ko: 제어 펄스를 만들고 진폭 보정 데이터를 모은 뒤, 여러 입력 상태에서 X 회전을 검증합니다.
  status: machine
- id: 7f0ba206b7a49ec4
  en: Desired-level population and leakage versus amplitude scale, marking the initial pulse at 0.8 and the best tested state-transfer amplitude near one.
  ko: 진폭 배율에 따른 목표 준위 점유율과 누설입니다. 초기 펄스 0.8과 1 부근의 최적 시험 진폭을 표시합니다.
  status: machine
- id: 80d1c749457c3520
  en: 'Input-state overlaps and leakage for initial, selected, and phase-rotated pulses: the phase-rotated pulse transfers basis states but fails the superposition checks.'
  ko: 초기 펄스, 선택한 펄스, 위상을 회전한 펄스의 입력 상태 겹침과 누설입니다. 위상을 회전한 펄스는 기저 상태를 옮기지만 중첩 검사에는 실패합니다.
  status: machine
- id: db8e724ef9a14228
  en: Coherent X error and mean input leakage versus derivative-correction coefficient at fixed amplitude; their minima occur at different coefficients.
  ko: 진폭을 고정했을 때 미분 보정 계수에 따른 결맞은 X 오차와 평균 입력 누설입니다. 두 최솟값은 서로 다른 계수에서 나타납니다.
  status: machine
- id: 21554a44f9a1030d
  en: In this tutorial, we calibrate a control pulse to approximate an X gate. Starting with an imperfect amplitude, we run a series of trial pulses and select the one that best transfers population from \(|0\rangle\) to \(|1\rangle\). We then check its action on superpositions to see how well it implements the desired operation.
  ko: 이 튜토리얼에서는 X 게이트를 근사하도록 제어 펄스를 보정합니다. 부정확한 진폭에서 시작해 여러 시험 펄스를 실행하고, \(|0\rangle\)에서 \(|1\rangle\)로 점유를 가장 잘 옮기는 펄스를 고릅니다. 이어서 중첩 상태에 대한 작용을 검사해 원하는 연산을 얼마나 잘 구현하는지 확인합니다.
  status: machine
- id: 6729271bb3084c4a
  en: You need basic Python, qubit states, and X rotations. The [quickstart](../guide/quickstart.md) introduces the program and result workflow. We use FatQat's supplied single-transmon model, which includes an extra energy level \(|2\rangle\) beyond the two qubit states. Population can enter this level during a pulse; we call it **leakage**. All calibration results here refer to this simulation model.
  ko: 기본 Python, 큐비트 상태, X 회전을 알고 있다고 가정합니다. 프로그램과 결과 처리 흐름은 [빠른 시작](../guide/quickstart.md)에서 소개합니다. FatQat의 단일 transmon 모델은 두 큐비트 상태 외에 추가 에너지 준위 \(|2\rangle\)를 포함합니다. 펄스 도중 점유가 이 준위로 들어갈 수 있으며 이를 **누설**이라 부릅니다. 여기의 보정 결과는 모두 이 시뮬레이션 모델에 대한 것입니다.
  status: machine
- id: 2f275d3f5c7d4921
  en: Define the target
  ko: 목표 정의하기
  status: machine
- id: 98395c00ef9dc17e
  en: Our target is \(R_X(\pi)\), an X gate up to a global phase. Besides exchanging the basis states, it preserves \(|+\rangle=(|0\rangle+|1\rangle)/\sqrt{2}\) up to a global phase. A common phase on all amplitudes has no observable effect, so our comparisons will ignore it.
  ko: 목표는 전역 위상을 제외하면 X 게이트인 \(R_X(\pi)\)입니다. 기저 상태를 교환할 뿐 아니라 \(|+\rangle=(|0\rangle+|1\rangle)/\sqrt{2}\)도 전역 위상을 제외하고 보존합니다. 모든 진폭에 공통인 위상은 관측에 영향을 주지 않으므로 비교할 때 무시합니다.
  status: machine
- id: 0a725e67e9d254e9
  en: We first build the ideal rotation as a `Program` and run it with the general `Simulator`. In unitary mode, the result is the \(2\times2\) matrix that we will use as our reference.
  ko: 먼저 이상적인 회전을 `Program`으로 만들고 일반 `Simulator`에서 실행합니다. 유니터리 모드의 결과인 \(2\times2\) 행렬을 기준으로 사용합니다.
  status: machine
- id: 57ccda8b6647a7bb
  en: Build an imperfect pulse
  ko: 불완전한 펄스 만들기
  status: machine
- id: 8d2bd3978e308737
  en: Next, load the transmon model and create a statevector emulator. Each run starts in physical \(|0\rangle\). We leave noise and measurement out of these runs so that we can inspect the pulse's final amplitudes. See the [transmon guide](../guide/transmon-emulation.md) for more on the model setup.
  ko: 다음으로 transmon 모델을 불러와 상태 벡터 에뮬레이터를 만듭니다. 각 실행은 물리적 \(|0\rangle\)에서 시작합니다. 펄스의 최종 진폭을 살펴보기 위해 잡음과 측정을 넣지 않습니다. 모델 설정은 [transmon 안내](../guide/transmon-emulation.md)를 참고하세요.
  status: machine
- id: 7e3faeb954204653
  en: 'We use a smooth envelope that starts and ends at zero. The duration \(T\) stays fixed at 12 nanoseconds (ns); the dimensionless scale \(a\) controls the amplitude:'
  ko: 시작과 끝이 0인 매끄러운 포락선을 사용합니다. 지속 시간 \(T\)는 12나노초(ns)로 고정하고 무차원 배율 \(a\)로 진폭을 조절합니다.
  status: machine
- id: cd8033dad0775129
  en: \[ \Omega_x(t)=a\frac{2\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T. \]
  ko: \[ \Omega_x(t)=a\frac{2\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T. \]
  status: machine
- id: 07739155afb9a2f0
  en: The waveform gives the full Rabi rate in radians per nanosecond (rad/ns). FatQat includes the factor of one half when applying the drive Hamiltonian. At \(a=1\), the envelope has area \(\pi\), which would give the desired rotation for an ideal resonantly driven two-level system. Coupling to the third level makes this a starting estimate for the transmon pulse.
  ko: 파형은 전체 Rabi 각주파수를 rad/ns 단위로 지정합니다. FatQat은 구동 해밀토니안을 적용할 때 1/2 계수를 포함합니다. \(a=1\)이면 포락선 면적은 \(\pi\)이며, 이상적인 공명 구동 2준위 계에서는 원하는 회전을 만듭니다. transmon은 세 번째 준위에도 결합하므로 이 값은 transmon 펄스의 초기 추정으로 사용합니다.
  status: machine
- id: 9b53d2f34c5d5b88
  en: We sample the envelope at 81 times and connect it to the drive on `q0` through `PulseControl`. `SampledWaveform` interpolates between the samples. The helpers below put the pulse in a `Program` with `PulseOperation` and return its final statevector. We start at an amplitude scale of 0.8.
  ko: 81개 시점에서 포락선을 표본화하고 `PulseControl`로 `q0`의 구동에 연결합니다. `SampledWaveform`은 표본 사이를 보간합니다. 아래 헬퍼는 `PulseOperation`으로 펄스를 `Program`에 넣고 최종 상태 벡터를 반환합니다. 진폭 배율은 0.8에서 시작합니다.
  status: machine
- id: d23de4d73bd41c60
  en: The statevector contains three amplitudes, one for each physical level. Their squared magnitudes give `P0`, `P1`, and `P2`. Most of the population reaches \(|1\rangle\), but some remains in \(|0\rangle\) and a small amount leaks into \(|2\rangle\). We will use `P1` to choose the amplitude and track `P2` alongside it.
  ko: 상태 벡터에는 각 물리 준위에 대응하는 세 진폭이 있습니다. 절댓값을 제곱하면 `P0`, `P1`, `P2`를 얻습니다. 대부분의 점유는 \(|1\rangle\)에 도달하지만 일부는 \(|0\rangle\)에 남고 소량은 \(|2\rangle\)로 샙니다. `P1`으로 진폭을 고르고 `P2`도 함께 추적합니다.
  status: machine
- id: 4b58eafedf0a4e95
  en: Collect data and select an amplitude
  ko: 데이터 수집과 진폭 선택
  status: machine
- id: 7da6186ececb6e80
  en: Our selection rule is to choose the **tested amplitude with the largest `P1`**. We scan from 0.7 to 1.3, around the first intended rotation; extending the range much further could include additional rotation cycles.
  ko: 선택 기준은 **시험한 진폭 중 `P1`이 가장 큰 값**입니다. 첫 번째 목표 회전 부근인 0.7~1.3을 스캔합니다. 범위를 훨씬 넓히면 추가 회전 주기가 포함될 수 있습니다.
  status: machine
- id: 977b91555f87001c
  en: For each amplitude, the loop builds a pulse program and collects its populations through `run().result()`. After finding the maximum, we rerun that pulse and record its parameters in a dictionary.
  ko: 각 진폭마다 반복문이 펄스 프로그램을 만들고 `run().result()`로 점유율을 수집합니다. 최댓값을 찾으면 해당 펄스를 다시 실행하고 매개변수를 사전에 기록합니다.
  status: machine
- id: aed530ccbac9cbd5
  en: The selected pulse transfers more population to \(|1\rangle\), with more leakage than the initial pulse. It is the best tested amplitude for our state-transfer objective, with some population still outside the desired level.
  ko: 선택한 펄스는 초기 펄스보다 더 많은 점유를 \(|1\rangle\)로 옮기지만 누설도 더 큽니다. 상태 전이 목적에 대해서는 시험한 진폭 중 최선이지만 원하는 준위 밖에 일부 점유가 남습니다.
  status: machine
- id: b9eda2618b1d3e1e
  en: The scan uses probabilities calculated from the statevector, so it has no shot noise. Numerical integration error remains. Our selection applies to this model, pulse duration, and grid; a finer grid could refine the amplitude.
  ko: 스캔은 상태 벡터에서 계산한 확률을 사용하므로 샷 잡음은 없습니다. 수치 적분 오차는 남습니다. 선택 결과는 이 모델, 펄스 지속 시간, 격자에 대한 것이며 더 촘촘한 격자로 진폭을 세밀하게 조정할 수 있습니다.
  status: machine
- id: f00b2a42ab6f318c
  en: Validate the operation on other inputs
  ko: 다른 입력에서 연산 검증하기
  status: machine
- id: e9fc347302327411
  en: The amplitude scan used only \(|0\rangle\). A gate must also act correctly on other inputs. We run the initial and selected pulses with a second emulator in unitary mode. The returned \(3\times3\) operator describes the full physical evolution; multiplying it by an input state gives the corresponding output.
  ko: 진폭 스캔에는 \(|0\rangle\)만 사용했습니다. 게이트는 다른 입력에도 올바르게 작용해야 합니다. 두 번째 에뮬레이터를 유니터리 모드로 만들어 초기 펄스와 선택한 펄스를 실행합니다. 반환된 \(3\times3\) 연산자는 전체 물리적 진화를 나타내며 입력 상태에 곱하면 해당 출력을 얻습니다.
  status: machine
- id: 2a7beb4dd795d57a
  en: We test \(|0\rangle\), \(|1\rangle\), \(|+\rangle\), and \(|+i\rangle=(|0\rangle+i|1\rangle)/\sqrt{2}\). For each input, we compare the pulse output with the ideal output using their **input-state overlap**, the squared magnitude of their inner product. An overlap of one means the states agree up to a global phase.
  ko: \(|0\rangle\), \(|1\rangle\), \(|+\rangle\), \(|+i\rangle=(|0\rangle+i|1\rangle)/\sqrt{2}\)를 시험합니다. 각 입력에서 펄스 출력과 이상적인 출력의 내적 절댓값을 제곱한 **입력 상태 겹침**을 비교합니다. 겹침이 1이면 전역 위상을 제외하고 두 상태가 같습니다.
  status: machine
- id: b97a04f22ec7553f
  en: The helper appends a zero amplitude for \(|2\rangle\) to each logical input and target state. It keeps the full pulse output without renormalizing, so leakage reduces the overlap.
  ko: 헬퍼는 각 논리 입력과 목표 상태에 \(|2\rangle\) 진폭 0을 추가합니다. 전체 펄스 출력을 재정규화하지 않고 유지하므로 누설이 있으면 겹침이 줄어듭니다.
  status: machine
- id: a51d27e612f2d654
  en: Alongside the individual states, we compare the whole logical operation using `coherent_x_overlap_and_leakage`. Its first result, **coherent X overlap**, equals one for the target operation up to a global phase and decreases with coherent error or leakage. This quantity differs from average gate fidelity. The second result is the mean leakage over the two logical basis inputs.
  ko: 개별 상태 검사와 함께 `coherent_x_overlap_and_leakage`로 전체 논리 연산을 비교합니다. 첫 번째 결과인 **결맞은 X 겹침**은 목표 연산과 전역 위상을 제외하고 같으면 1이며 결맞은 오차나 누설이 있으면 감소합니다. 평균 게이트 충실도와는 다른 양입니다. 두 번째 결과는 두 논리 기저 입력에 대한 평균 누설입니다.
  status: machine
- id: 04dd63338f48e269
  en: The operator comparison
  ko: 연산자 비교
  status: machine
- id: 6c32559072d5dab6
  en: 'Let \(A=U[:2,:2]\) be the logical block of the physical operator and \(V\) the ideal rotation. The matrix inner product is \(\mathrm{Tr}(V^\dagger A)\). Dividing its squared magnitude by \(2^2\) gives \[ C_X=\frac{|\mathrm{Tr}(V^\dagger A)|^2}{4}. \] A global phase multiplies the trace by a number of magnitude one, so it leaves \(C_X\) unchanged. We keep \(A\) unnormalized: any leakage reduces its norm. The average survival probability of the two logical basis inputs is \(\mathrm{Tr}(A^\dagger A)/2\), giving mean leakage \(L=1-\mathrm{Tr}(A^\dagger A)/2\).'
  ko: 물리 연산자의 논리 블록을 \(A=U[:2,:2]\), 이상적인 회전을 \(V\)라 두면 행렬 내적은 \(\mathrm{Tr}(V^\dagger A)\)입니다. 그 절댓값의 제곱을 \(2^2\)로 나누면 \[ C_X=\frac{|\mathrm{Tr}(V^\dagger A)|^2}{4}. \] 전역 위상은 대각합에 크기 1인 수를 곱할 뿐이므로 \(C_X\)를 바꾸지 않습니다. \(A\)는 정규화하지 않아 누설이 있으면 노름이 줄어듭니다. 두 논리 기저 입력의 평균 생존 확률은 \(\mathrm{Tr}(A^\dagger A)/2\)이므로 평균 누설은 \(L=1-\mathrm{Tr}(A^\dagger A)/2\)입니다.
  status: machine
- id: 8724b597120f0ff6
  en: Check sensitivity to the drive phase
  ko: 구동 위상에 대한 민감도 확인
  status: machine
- id: 45caf63051252b6a
  en: Before comparing the results, we add a pulse with a deliberate phase error. Multiplying the selected waveform by `1j` shifts its drive phase by a quarter turn, from the X to the Y quadrature, while keeping its amplitude unchanged. This gives us a way to test whether the population check can distinguish rotations about different axes.
  ko: 결과를 비교하기 전에 의도적인 위상 오류가 있는 펄스를 추가합니다. 선택한 파형에 `1j`를 곱하면 진폭은 그대로이고 구동 위상만 1/4회전하여 X에서 Y 직교 성분으로 바뀝니다. 이를 통해 점유율 검사로 서로 다른 축의 회전을 구별할 수 있는지 시험합니다.
  status: machine
- id: 8651ed75b527ac78
  en: The selected pulse improves both population transfer and coherent X overlap. For the initial and selected pulses, these two values agree to numerical precision, a property of this symmetric pulse family.
  ko: 선택한 펄스는 점유 전이와 결맞은 X 겹침을 모두 개선합니다. 초기 펄스와 선택한 펄스에서는 이 두 값이 수치 정밀도 내에서 일치하며, 이는 이 대칭 펄스 계열의 특성입니다.
  status: machine
- id: c89a06912df0f9a8
  en: The phase-rotated pulse gives the same basis-state transfer, but its action on \(|+\rangle\) is close to orthogonal to the target output. Its coherent X overlap is also near zero. The superposition checks distinguish the two drive axes even though the population calibration cannot.
  ko: 위상을 회전한 펄스는 같은 기저 상태 전이를 만들지만, \(|+\rangle\)에 작용한 결과는 목표 출력과 거의 직교합니다. 결맞은 X 겹침도 0에 가깝습니다. 점유율 보정으로는 구별할 수 없는 두 구동 축을 중첩 검사로 구별합니다.
  status: machine
- id: 403fa11adb274a23
  en: Compare with a measured bit
  ko: 측정 비트와 비교하기
  status: machine
- id: 7a991f12f60b6f73
  en: We can also sample the selected pulse's measurement outcomes. For this, we build a separate program with a classical bit and terminal measurement and return to the statevector backend; unitary execution requires an unmeasured program.
  ko: 선택한 펄스의 측정 결과를 샘플링할 수도 있습니다. 이를 위해 고전 비트와 마지막 측정을 포함한 별도 프로그램을 만들고 상태 벡터 백엔드로 돌아갑니다. 유니터리 실행에는 측정이 없는 프로그램이 필요합니다.
  status: machine
- id: 18506d426b92e9c6
  en: This backend reports physical level `0` as bit `0`, and both levels `1` and `2` as bit `1`. We therefore expect the frequency of `1` to approach `P1 + P2` as we increase the number of shots. This binary readout groups successful transfer and leakage into the same outcome.
  ko: 이 백엔드는 물리 준위 `0`을 비트 `0`으로, 준위 `1`과 `2`를 모두 비트 `1`로 보고합니다. 따라서 샷 수가 늘면 `1`의 빈도는 `P1 + P2`에 가까워집니다. 이 이진 판독은 성공적인 전이와 누설을 같은 결과로 묶습니다.
  status: machine
- id: 1ff8dd44510e7a8d
  en: The measured frequency agrees with `P1 + P2` within shot noise. For this pulse and shot count, the sampling uncertainty exceeds the leakage contribution, so the counts cannot resolve the difference between `P1` and `P1 + P2`.
  ko: 측정 빈도는 샷 잡음 범위에서 `P1 + P2`와 일치합니다. 이 펄스와 샷 수에서는 샘플링 불확실성이 누설 기여보다 크므로 측정 횟수만으로 `P1`과 `P1 + P2`의 차이를 구분할 수 없습니다.
  status: machine
- id: 56ac7c4d33c5b5bb
  en: Amplitude tuning has improved transfer and coherent X overlap, with some coherent error and leakage remaining. The optional extension below uses a second pulse parameter to reduce those errors.
  ko: 진폭 조정으로 전이와 결맞은 X 겹침이 개선되었지만 결맞은 오차와 누설이 일부 남습니다. 아래 선택 확장에서는 두 번째 펄스 매개변수로 이를 줄입니다.
  status: machine
- id: 99d70244ed84a12e
  en: 'Optional: correct the pulse shape'
  ko: '선택 확장: 펄스 모양 보정하기'
  status: machine
- id: 5108e00e608088b4
  en: 'We now add an imaginary component proportional to the envelope''s derivative, giving a drive in the Y quadrature. This is a DRAG correction. We keep the duration and selected amplitude fixed and vary the dimensionless coefficient \(\beta\):'
  ko: 이제 포락선의 미분에 비례하는 허수 성분을 추가해 Y 직교 성분의 구동을 만듭니다. 이것이 DRAG 보정입니다. 지속 시간과 선택한 진폭은 고정하고 무차원 계수 \(\beta\)를 바꿉니다.
  status: machine
- id: e71b7d63e0fbd8c2
  en: \[ \Omega(t)=\Omega_x(t)-i\frac{\beta}{\alpha} \frac{d\Omega_x(t)}{dt}. \]
  ko: \[ \Omega(t)=\Omega_x(t)-i\frac{\beta}{\alpha} \frac{d\Omega_x(t)}{dt}. \]
  status: machine
- id: 473b0e2db477886d
  en: Here \(\alpha\) is the signed difference between adjacent transition frequencies. The model document stores it in gigahertz (GHz, or cycles/ns); we multiply by \(2\pi\) to obtain an angular rate in rad/ns. The derivative term divided by \(\alpha\) then has the same rad/ns units as the original drive.
  ko: 여기서 \(\alpha\)는 인접한 전이 주파수의 부호 있는 차이입니다. 모델 문서는 이를 기가헤르츠(GHz, 즉 cycles/ns)로 저장하므로 \(2\pi\)를 곱해 rad/ns의 각주파수로 바꿉니다. 그러면 미분 항을 \(\alpha\)로 나눈 값도 원래 구동과 같은 rad/ns 단위를 갖습니다.
  status: machine
- id: 13ab16946ed219bf
  en: Why a derivative quadrature?
  ko: 미분 직교 성분을 쓰는 이유
  status: machine
- id: c17a6b43826bef9e
  en: A short pulse can excite the third level and shift phases within the qubit space. Adding a derivative quadrature allows us to adjust these effects. Motzoi et al. introduced this method in [Simple pulses for elimination of leakage in weakly nonlinear qubits](https://arxiv.org/abs/0901.0534). We use its derivative correction here; the paper develops further corrections and their physical motivation. The choice of coefficient depends on the model, pulse, and calibration objective.
  ko: 짧은 펄스는 세 번째 준위를 여기하고 큐비트 공간의 위상을 바꿀 수 있습니다. 미분 직교 성분을 추가하면 이런 효과를 조절할 수 있습니다. Motzoi 등의 [Simple pulses for elimination of leakage in weakly nonlinear qubits](https://arxiv.org/abs/0901.0534)에서 소개한 방법입니다. 여기서는 미분 보정만 사용하며, 논문은 추가 보정과 물리적 근거도 설명합니다. 계수 선택은 모델, 펄스, 보정 목적에 따라 달라집니다.
  status: machine
- id: 24c8a9b61e74b339
  en: For this scan, our objective is the coherent X overlap. We choose the tested coefficient with the largest overlap, then rerun the pulse and check the same four input states. Holding amplitude fixed makes this a one-parameter shape calibration.
  ko: 이번 스캔의 목적은 결맞은 X 겹침입니다. 시험한 계수 중 겹침이 가장 큰 값을 고른 뒤 펄스를 다시 실행해 같은 네 입력 상태를 확인합니다. 진폭을 고정하므로 매개변수 하나의 모양 보정입니다.
  status: machine
- id: 67ce4f90492ea63b
  en: 'The selected correction improves coherent X overlap and reduces mean leakage. The two curves reach their minima at different coefficients: the pulse with the least leakage has a larger X error. Our choice follows the operation we want to implement, and the input-state checks confirm the improvement.'
  ko: 선택한 보정은 결맞은 X 겹침을 개선하고 평균 누설을 줄입니다. 두 곡선의 최솟값은 서로 다른 계수에서 나타납니다. 누설이 가장 작은 펄스는 X 오차가 더 큽니다. 구현하려는 연산을 기준으로 계수를 선택했으며 입력 상태 검사도 개선을 확인합니다.
  status: machine
