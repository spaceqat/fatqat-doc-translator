  ko: \[ \begin{aligned} \{|01\rangle,|0r\rangle\}:&\qquad H_{01}(t)=\frac{1}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix},\\[4pt] \{|11\rangle,|W\rangle\}:&\qquad H_{11}(t)=\frac{\sqrt2}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix}, \end{aligned} \]
  status: machine
- id: b0e51627b9de04b4
  en: 'where \(|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2\). The \(|10\rangle\) block is identical to the \(|01\rangle\) block. We can therefore use a one-site `Atom2LevelEmulator` as an exact simulator for each reduced block: use the authored drive once at its original strength and once multiplied by \(\sqrt2\). The second factor is a collective coupling, not a stronger physical laser.'
  ko: 여기서 \(|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2\)입니다. \(|10\rangle\) 블록은 \(|01\rangle\) 블록과 같습니다. 따라서 단일 위치의 `Atom2LevelEmulator`로 각 축약 블록을 정확히 시뮬레이션할 수 있습니다. 작성한 구동을 원래 세기로 한 번, \(\sqrt2\)를 곱한 세기로 한 번 적용합니다. 두 번째 계수는 더 강한 실제 레이저가 아니라 집단적 결합을 나타냅니다.
  status: machine
