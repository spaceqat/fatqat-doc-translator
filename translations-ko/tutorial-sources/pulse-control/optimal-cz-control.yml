  en: 'where $|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2$. The $|10\rangle$ block is identical to the $|01\rangle$ block. We can therefore use a one-site `Atom2LevelEmulator` as an exact simulator for each reduced block: use the same drive once at its original strength and once multiplied by $\sqrt2$. The second factor is a collective coupling, not a stronger physical laser.'
  ko: 여기서 $|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2$입니다. $|10\rangle$ 블록은 $|01\rangle$ 블록과 같습니다. 따라서 단일 사이트 `Atom2LevelEmulator`를 각 축약 블록의 정확한 시뮬레이터로 쓸 수 있습니다. 같은 구동을 한 번은 원래 세기로, 한 번은 $\sqrt2$를 곱해 적용하면 됩니다. 두 번째 인자는 집단 커플링이며, 물리적으로 더 강한 레이저를 뜻하지 않습니다.
  status: retired
- id: f78b4a1ab6dcb70d
  en: The return amplitudes must also have magnitude one. A phase crossing by itself is not sufficient if population remains in $|0r\rangle$ or $|W\rangle$.
  ko: 복귀 진폭의 크기도 1이어야 합니다. $|0r\rangle$이나 $|W\rangle$에 점유가 남아 있으면 위상 교차만으로는 충분하지 않습니다.
  status: retired
- id: 1b6898924f03b446
  en: In dimensionless time $s=t/T$, the paper's time-optimal ansatz is
  ko: 무차원 시간 $s=t/T$에서 논문이 제시한 시간 최적 펄스 형태는 다음과 같습니다.
  status: retired
- id: f07f72d239a83740
  en: 'Keeping the amplitude below $\Omega_{\max}$ cannot be time-optimal in the ideal blockade-limit model: increasing the whole Hamiltonian and shortening the duration traces the same trajectory faster. The phase remains the useful control. It rotates the drive axis in the equatorial plane of each effective two-level system; equivalently, in a frame following the phase, $\dot\varphi(t)$ acts as a detuning.'
  ko: 이상적인 봉쇄 극한 모델에서는 진폭을 $\Omega_{\max}$보다 낮게 유지하면 시간 최적이 될 수 없습니다. 해밀토니안 전체를 키우고 지속 시간을 줄이면 같은 궤적을 더 빨리 따라가기 때문입니다. 따라서 쓸모 있는 제어 변수는 위상입니다. 위상은 각 유효 2준위계의 적도면에서 구동 축을 회전시킵니다. 위상을 따라 회전하는 좌표계에서 보면 $\dot\varphi(t)$가 디튜닝으로 작용하는 것과 같습니다.
  status: retired
- id: 3421aa2bee35cd50
  en: The two blocks rotate at different rates because their couplings differ by $\sqrt2$. A shaped phase can steer both trajectories back to their starting states while leaving the non-additive phase $\Phi_{\mathrm{CZ}}=\pi$.
  ko: 두 블록은 커플링이 $\sqrt2$배 다르므로 서로 다른 속도로 회전합니다. 위상을 적절히 성형하면 두 궤적을 모두 시작 상태로 되돌리면서 비가산 위상 $\Phi_{\mathrm{CZ}}=\pi$를 남길 수 있습니다.
  status: retired
- id: dae5d1b73e1e8c52
  en: with the coefficients below. In the reduced model it reaches an average CZ fidelity indistinguishable from one at $T\Omega_{\max}\simeq7.614$, within $0.03\%$ of the paper's optimized value $7.612$.
  ko: 계수는 아래와 같습니다. 축약 모델에서 이 펄스는 $T\Omega_{\max}\simeq7.614$에서 1과 구별할 수 없는 평균 CZ 충실도에 도달하며, 이는 논문의 최적값 $7.612$와 $0.03\%$ 이내로 일치합니다.
  status: retired
- id: 7c248b9b11e37aa9
  en: The amplitude plot is intentionally a horizontal line. The ideal pulse turns on at $\Omega_{\max}$, stays there for the whole gate, and turns off at the end. Only the phase is shaped.
  ko: 진폭 그래프가 수평선인 것은 의도한 것입니다. 이상적인 펄스는 $\Omega_{\max}$로 켜져 게이트 내내 그 값을 유지하다가 끝에서 꺼집니다. 성형하는 것은 위상뿐입니다.
  status: retired
- id: 1fd187f986df13cb
  en: This curve is one member of the symmetry pair discussed in the paper. Complex conjugation negates the phase profile, $\varphi\to-\varphi$, and changes the removable single-qubit phase, but implements the same CZ gate in the infinite-blockade limit. The matrix convention above selects the member used by FatQat's drive channel.
  ko: 이 곡선은 논문에서 다루는 대칭 쌍 중 하나입니다. 복소 켤레를 취하면 위상 프로파일의 부호가 바뀌고($\varphi\to-\varphi$) 제거 가능한 단일 큐비트 위상도 달라지지만, 무한 봉쇄 극한에서는 같은 CZ 게이트를 구현합니다. 위의 행렬 규약은 FatQat 구동 채널에서 쓰는 쪽을 선택합니다.
  status: retired
- id: 42d0c13493d91400
  en: The fidelity is not inferred from the phase alone. Equation (7) also penalizes failure to return $|01\rangle$ and $|11\rangle$ from their Rydberg-coupled blocks, which is why the return probability is reported separately.
  ko: 충실도는 위상만으로 추론하지 않습니다. 식 (7)은 $|01\rangle$과 $|11\rangle$이 Rydberg 상태와 결합된 블록에서 돌아오지 못하는 경우에도 벌점을 주므로, 복귀 확률을 따로 보고합니다.
  status: retired
- id: 2271d5a1dc8bac63
  en: A wide duration scan mixes several wrapped copies of the phase and makes the result look irregular. The paper resolves the optimum in the narrow interval $7.5\leq T\Omega_{\max}\leq7.7$; we use the same interval. Stretching the fixed normalized phase profile across this window produces one nearly linear crossing.
  ko: 지속 시간을 넓게 스캔하면 감긴 위상의 여러 사본이 섞여 결과가 불규칙해 보입니다. 논문은 좁은 구간 $7.5\leq T\Omega_{\max}\leq7.7$에서 최적값을 찾으며, 여기서도 같은 구간을 사용합니다. 정규화된 고정 위상 프로파일을 이 구간에서 늘이면 거의 선형인 교차가 하나 나타납니다.
  status: retired
