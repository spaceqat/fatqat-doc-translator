- id: e9f77551b4f5db93
  en: A wide duration scan mixes several wrapped copies of the phase and makes the result look irregular. The paper resolves the optimum in the narrow interval \(7.5\leq T\Omega_{\max}\leq7.7\); we use the same interval. Stretching the fixed normalized phase profile across this window produces one nearly linear crossing.
  ko: 지속 시간을 넓게 스캔하면 감긴 위상의 여러 주기가 섞여 결과가 불규칙해 보입니다. 논문은 \(7.5\leq T\Omega_{\max}\leq7.7\)이라는 좁은 구간에서 최적점을 찾으며 여기서도 같은 구간을 사용합니다. 정규화한 위상 모양을 고정하고 이 구간에서 늘이거나 줄이면 거의 선형인 교차점 하나를 얻습니다.
