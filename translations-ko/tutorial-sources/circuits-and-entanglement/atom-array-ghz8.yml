- id: 2e54a6ffa5838720
  en: Entangle eight atoms into a GHZ state
  ko: 원자 8개를 얽어 GHZ 상태 만들기
  status: machine
- id: d9b3fc77fc4a2779
  en: Use dynamic Pair and Unpair operations to build an eight-atom GHZ state, then test both its correlations and coherent phase.
  ko: 동적 Pair, Unpair 연산으로 8원자 GHZ 상태를 만들고, 그 상관과 결맞은 위상을 모두 검증합니다.
  status: machine
- id: 39c2bd539a54affe
  en: Eight-atom GHZ measurement frequencies
  ko: 8원자 GHZ 측정 빈도
  status: machine
- id: b77cc4d7d4a86b9e
  en: 'This tutorial builds an eight-atom Greenberger-Horne-Zeilinger (GHZ) state on [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator], fatqat''s neutral-atom execution target. It builds on the [quickstart](../guide/quickstart.md) in two ways: the state spans eight atoms instead of two, and the circuit runs on a backend whose two-qubit-gate connectivity is *reconfigured mid-circuit* rather than fixed.'
  ko: 이 튜토리얼은 fatqat의 중성 원자 실행 타깃인 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서 8원자 Greenberger-Horne-Zeilinger(GHZ) 상태를 만듭니다. [빠른 시작](../guide/quickstart.md)을 두 방향으로 확장합니다. 상태를 두 원자에서 여덟 원자로 늘리고, 고정된 연결 대신 *회로 중간에 2큐비트 게이트 연결을 재구성하는* 백엔드에서 실행합니다.
  status: retired
- id: 77d0ab522b46a87b
  en: The GHZ state generalises the Bell state to $n$ qubits,
  ko: GHZ 상태는 벨 상태를 $n$개의 큐비트로 일반화한 것입니다.
  status: retired
- id: de4d7d92069e01ea
  en: Like the Bell state it cannot be factored into independent single-atom states. Measuring all eight atoms yields *only* `00000000` or `11111111`, each with probability one half, so every atom's outcome is perfectly correlated with every other. That correlation alone, however, is also produced by a classical coin flip that sets all eight bits together; what makes the GHZ state quantum is that the two branches are held in *coherent superposition*, with a definite relative phase. We will confirm the correlations with sampled counts and then confirm the coherence with exact expectation values.
  ko: 벨 상태처럼 이 상태도 서로 독립인 단일 원자 상태의 곱으로 분해할 수 없습니다. 원자 8개를 모두 측정하면 *오직* `00000000` 또는 `11111111`만 각각 1/2 확률로 나오므로, 모든 원자의 결과가 서로 완벽하게 상관됩니다. 그러나 이런 상관만으로는 부족합니다. 여덟 비트를 한꺼번에 정하는 고전적인 동전 던지기도 같은 상관을 만들기 때문입니다. GHZ 상태가 양자적인 이유는 두 분기가 일정한 상대 위상을 갖는 *결맞은 중첩*을 이룬다는 데 있습니다. 샘플링한 카운트로 상관을 확인한 뒤, 정확한 기댓값으로 결맞음을 확인하겠습니다.
  status: machine
- id: 01a623fbeec22d0c
  en: The neutral-atom twist is connectivity. On this backend a `CZ` acts only on a pair of atoms that is currently *paired*. The [`Pair`][fatqat.operations.Pair] / [`Unpair`][fatqat.operations.Unpair] operations update that pairing state as the circuit runs. Physically, `Pair` stands for "move these two atoms into a shared entangling zone" and `Unpair` for "move them apart again" -- the atom transport that gives a reconfigurable neutral-atom processor its programmable connectivity. We exploit exactly this to entangle atoms that no fixed one-dimensional layout would place next to each other.
  ko: 중성 원자에서 중요한 점은 연결 구조입니다. 이 백엔드에서 `CZ`는 현재 *쌍으로 연결된* 두 원자에만 작용합니다. [`Pair`][fatqat.operations.Pair] / [`Unpair`][fatqat.operations.Unpair] 연산은 회로 실행 중 이 연결 상태를 갱신합니다. 물리적으로 `Pair`는 두 원자를 같은 얽힘 영역으로 옮기는 동작, `Unpair`는 다시 떨어뜨리는 동작을 뜻합니다. 이러한 원자 이동 덕분에 재구성 가능한 중성 원자 프로세서는 연결 구조를 프로그래밍할 수 있습니다. 이를 이용해 고정된 1차원 배치에서는 모두 이웃으로 둘 수 없는 원자들을 얽히게 합니다.
  status: retired
- id: 765805113af4d820
  en: Imports and display settings
  ko: 가져오기와 표시 설정
  status: machine
- id: d75587ca82ded376
  en: A [`fatqat.Program`][fatqat.Program] is the backend-independent circuit description. Gate values live in [`fatqat.operations`](../api/operations.md). NumPy helps us tabulate expectation values, and Matplotlib supplies the captured runtime figure.
  ko: '[`fatqat.Program`][fatqat.Program]은 백엔드와 독립적인 회로 표현입니다. 게이트 값은 [`fatqat.operations`](../api/operations.md)에 있습니다. NumPy로 기댓값을 표로 정리하고, Matplotlib으로 실행 시 생성되는 그림을 그립니다.'
  status: machine
- id: beb520b9b0176ac8
  en: The native gate set
  ko: 네이티브 게이트 집합
  status: machine
- id: 6855f73611c2f0dd
  en: 'The atom-array backend accepts only its native gates: [`RX`][fatqat.operations.RX], [`RY`][fatqat.operations.RY], [`RZ`][fatqat.operations.RZ], and [`CZ`][fatqat.operations.CZ]. Convenience gates such as `H` and `CX` are not native here, so we compile them by hand -- exactly what a hardware-aware transpiler would do. A Hadamard equals $R_Z(\pi)$ followed by $R_Y(\pi/2)$ up to an irrelevant global phase, and a controlled-X is a Hadamard-conjugated `CZ`:'
  ko: 원자 배열 백엔드는 네이티브 게이트인 [`RX`][fatqat.operations.RX], [`RY`][fatqat.operations.RY], [`RZ`][fatqat.operations.RZ], [`CZ`][fatqat.operations.CZ]만 받습니다. `H`나 `CX` 같은 편의 게이트는 여기서 네이티브 게이트가 아니므로 직접 컴파일합니다. 하드웨어를 고려하는 트랜스파일러가 하는 일과 똑같습니다. Hadamard는 무관한 전역 위상을 제외하면 $R_Z(\pi)$ 다음에 $R_Y(\pi/2)$를 적용한 것과 같고, 제어 X는 `CZ` 앞뒤에 Hadamard를 적용한 것입니다.
  status: machine
- id: c0b3b0e4427d8dc4
  en: Writing these as small helpers keeps the circuit-building code below readable.
  ko: 이 연산들을 작은 헬퍼로 작성하면 아래 회로 구성 코드가 읽기 쉬워집니다.
  status: machine
- id: 201659d345e0999f
  en: A log-depth entangling tree
  ko: 로그 깊이의 얽힘 트리
  status: machine
- id: f73480384b24871e
  en: 'We could grow the GHZ state with a chain of seven controlled-X gates, atom `0` reaching each neighbour in turn. Instead we use a *binary tree*, which reaches all eight atoms in only three layers and lets the gates within each layer run in parallel on independent atom pairs:'
  ko: 원자 `0`에서 이웃으로 차례로 연결하는 일곱 개의 제어 X 게이트로 GHZ 상태를 만들 수도 있습니다. 여기서는 *이진 트리*를 사용합니다. 세 층만으로 여덟 원자에 도달하며, 각 층에서는 서로 독립인 원자 쌍의 게이트를 병렬로 실행할 수 있습니다.
  status: retired
- id: 805a0d8122634fbe
  en: Every pair inside a layer is disjoint, so those controlled-X gates act on separate atoms and could be executed simultaneously by the hardware.
  ko: 같은 층의 쌍들은 서로 겹치지 않으므로 제어 X 게이트들이 서로 다른 원자에 작용하며, 하드웨어에서 동시에 실행할 수 있습니다.
  status: machine
- id: 27b6141739b5de96
  en: Why the pairs must move between layers
  ko: 층 사이에 원자 쌍을 옮겨야 하는 이유
  status: machine
- id: 649730ce33d9358e
  en: The tree deliberately couples atoms that are far apart. Layer 1 entangles atoms `0` and `4`; layer 2 needs `0` with `2` and `4` with `6`. No fixed nearest-neighbour layout can offer all of those adjacencies at once.
  ko: 트리는 일부러 멀리 떨어진 원자를 연결합니다. 1층에서는 원자 `0`과 `4`를 얽히게 하고, 2층에서는 `0`과 `2`, `4`와 `6`을 연결해야 합니다. 고정된 최근접 이웃 배치로는 이 모든 인접 관계를 동시에 제공할 수 없습니다.
  status: retired
- id: 5f900010505249db
  en: This is where the reconfigurable connectivity earns its place. Just before a layer's gates we [`Pair`][fatqat.operations.Pair] its atoms -- transporting each pair into a shared entangling zone -- and just after we [`Unpair`][fatqat.operations.Unpair] them, freeing the atoms for the next layer's regrouping. If we skipped this rearrangement, the layer-2 and layer-3 `CZ` gates would target atoms that are not paired and the backend would reject the program with [`BackendValidationError`][fatqat.errors.BackendValidationError]. The transport is not incidental to the algorithm; it *is* the algorithm's wiring.
  ko: 이때 재구성 가능한 연결이 필요합니다. 각 층의 게이트를 실행하기 직전에 [`Pair`][fatqat.operations.Pair]로 원자 쌍을 같은 얽힘 영역으로 옮기고, 직후에는 [`Unpair`][fatqat.operations.Unpair]로 분리해 다음 층에서 다시 묶을 수 있게 합니다. 재배치를 생략하면 2층과 3층의 `CZ`가 연결되지 않은 원자를 대상으로 삼으므로 백엔드는 [`BackendValidationError`][fatqat.errors.BackendValidationError]로 프로그램을 거부합니다. 원자 이동은 부수적인 작업이 아니라 알고리즘의 *배선 자체*입니다.
  status: retired
- id: 1912a43ea0dc06f3
  en: Sample the eight-atom experiment
  ko: 8원자 실험 샘플링하기
  status: machine
- id: 480ed78355df5857
  en: We run the measured program on [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]; its eight quantum resources also determine the array size. A fixed seed keeps the numbers stable across tutorial runs, while omitting it produces independent samples. Because the circuit is noiseless, all 2000 shots land on one of the two GHZ branches and no other bitstring appears.
  ko: 측정을 포함한 프로그램을 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서 실행합니다. 프로그램의 양자 자원 8개가 배열 크기도 결정합니다. 고정 시드를 쓰면 튜토리얼을 다시 실행해도 수치가 그대로이고, 시드를 생략하면 독립적인 표본을 얻습니다. 회로에 노이즈가 없으므로 2000샷 모두 GHZ 상태의 두 분기 중 하나로 나오며 다른 비트열은 나타나지 않습니다.
  status: machine
- id: 404426e0944e91ee
  en: Only `00000000` and `11111111` occur, each in roughly half the shots. The bars below show the observed frequencies against the ideal $1/2$; finite-shot sampling nudges each bar slightly off that line, while every intermediate bitstring stays empty.
  ko: '`00000000`과 `11111111`만 나오며, 각각 샷의 약 절반을 차지합니다. 아래 막대그래프는 관측 빈도를 이상적인 값 $1/2$과 비교합니다. 유한한 샷 수 때문에 막대가 기준선에서 조금씩 벗어나지만, 그 사이의 다른 비트열은 전혀 나타나지 않습니다.'
  status: machine
- id: b86760df704fd29f
  en: Correlated is not the same as coherent
  ko: 상관과 결맞음의 차이
  status: machine
- id: 2f01290f46aa8415
  en: The counts prove the eight atoms are perfectly *correlated*, but a classical mixture -- an even coin flip between "all zero" and "all one" -- would give the identical histogram. To see the quantum coherence we measure observables the mixture and the superposition disagree on, using the exact [`Estimator`][fatqat.Estimator] on the unmeasured state.
  ko: 카운트는 원자 8개가 완벽하게 *상관*되어 있음을 증명합니다. 하지만 “모두 0”과 “모두 1”을 반반의 확률로 고르는 고전적 혼합도 똑같은 히스토그램을 만듭니다. 양자 결맞음을 확인하려면 혼합과 중첩이 서로 다른 값을 주는 관측량을 측정해야 합니다. 이를 위해 측정 전 상태에 정확한 [`Estimator`][fatqat.Estimator]를 적용합니다.
  status: machine
- id: cc8db912b38fba3a
  en: 'Two families pin down $|\mathrm{GHZ}_8\rangle$. Each neighbour parity $\langle Z_i Z_{i+1}\rangle = 1$ says adjacent atoms always agree -- something the classical mixture also satisfies. The global $X$-parity $\langle X_0 X_1 \cdots X_7\rangle = 1$ is the discriminator: it equals $+1$ only for the coherent superposition and averages to $0$ for the mixture. Observing both confirms a true GHZ state.'
  ko: 두 종류의 관측량으로 $|\mathrm{GHZ}_8\rangle$을 확인합니다. 이웃 패리티 $\langle Z_i Z_{i+1}\rangle = 1$은 인접 원자의 결과가 항상 같다는 뜻이며 고전적 혼합도 이를 만족합니다. 두 상태를 구별하는 값은 전체 $X$ 패리티 $\langle X_0 X_1 \cdots X_7\rangle = 1$입니다. 결맞은 중첩에서는 $+1$이지만 혼합에서는 평균이 $0$입니다. 둘을 함께 확인하면 실제 GHZ 상태임을 검증할 수 있습니다.
  status: retired
- id: 65c5c2e0e2e3cd81
  en: Every witness returns $+1$, including the global $X$-parity, so the state is the coherent GHZ superposition rather than a classical mixture that would merely reproduce its counts.
  ko: 전역 $X$ 패리티를 포함한 모든 증인 관측량이 $+1$을 반환합니다. 따라서 이 상태는 카운트만 재현하는 고전적 혼합이 아니라 결맞은 GHZ 중첩입니다.
  status: machine
- id: ff5c8f1a1c5f3ce2
  en: A cost of moving atoms around
  ko: 원자 이동의 비용
  status: machine
- id: 647d8b9ec9fd13f5
  en: 'Reconfigurable connectivity is not free: each transport step risks losing an atom from its trap. We model that by attaching [`Loss`][fatqat.noise.Loss] to the `Pair` and `Unpair` operations, which ejects an atom with some probability whenever it is moved. Only this neutral-atom backend models atom loss; a generic simulator rejects the same noise model.'
  ko: 연결 구조를 재구성하는 데에는 대가가 따릅니다. 원자를 옮길 때마다 트랩에서 잃을 위험이 있습니다. 이를 모델링하기 위해 `Pair`와 `Unpair` 연산에 [`Loss`][fatqat.noise.Loss]를 붙여, 원자를 옮길 때마다 일정 확률로 원자가 빠져나가게 합니다. 원자 손실은 이 중성 원자 백엔드에서만 모델링하며, 일반 시뮬레이터는 같은 노이즈 모델을 거부합니다.
  status: machine
- id: d81ba845d3a73382
  en: 'A lost atom is not a `|0>` and not a `|1>`: it is *gone*, and reads out as the erasure digit `2`, distinct from either computational outcome. Any shot whose bitstring contains a `2` therefore had at least one atom fall out during transport.'
  ko: 잃은 원자는 `|0>`도 `|1>`도 아닙니다. 원자가 *사라졌으므로* 두 계산 결과와 구별되는 소거 숫자 `2`로 판독됩니다. 따라서 비트열에 `2`가 있는 샷에서는 이동 중에 원자가 적어도 하나 빠져나간 것입니다.
  status: machine
- id: 7a75bef3d4ffa30a
  en: Takeaways and next steps
  ko: 정리와 다음 단계
  status: machine
- id: 9ab3c992258dc0ad
  en: This tutorial assembled a genuine eight-atom GHZ state, verified its correlations from sampled counts and its coherence from exact expectation values, and saw how moving atoms to reconfigure connectivity both enables the log-depth entangling tree and introduces a realistic loss channel.
  ko: 이 튜토리얼에서는 실제 8원자 GHZ 상태를 만들고, 샘플링한 카운트로 상관을, 정확한 기댓값으로 결맞음을 검증했습니다. 또한 원자를 옮겨 연결 구조를 재구성하면 로그 깊이 얽힘 트리를 만들 수 있지만, 동시에 현실적인 손실 채널도 생긴다는 점을 확인했습니다.
  status: machine
- id: 417daac31f855361
  en: 'From here, try widening the tree to sixteen atoms by adding a fourth layer, raising the loss probability to watch erasures grow, or intentionally dropping the `Pair` / `Unpair` calls from one layer to see [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] reject the first unpaired `CZ` with [`BackendValidationError`][fatqat.errors.BackendValidationError]. Restore the pairing before exploring physical loss: an unpaired gate is a program error, while a gate skipped after atom loss is a per-shot physical effect. The downloadable Python is generated from these Markdown cells, so the variations can be made directly in runnable code.'
  ko: 여기서 더 나아가 네 번째 층을 추가해 트리를 원자 16개로 넓히거나, 손실 확률을 높여 소거가 늘어나는 모습을 살펴보세요. 한 층에서 `Pair` / `Unpair` 호출을 일부러 빼면 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]가 페어링되지 않은 첫 `CZ`를 [`BackendValidationError`][fatqat.errors.BackendValidationError]로 거부하는 것도 볼 수 있습니다. 물리적 손실을 살펴보기 전에는 페어링을 복원하세요. 페어링되지 않은 게이트는 프로그램 오류이지만, 원자 손실 뒤에 게이트를 건너뛰는 것은 샷마다 일어나는 물리적 효과입니다. 내려받는 Python 파일은 이 Markdown 셀에서 생성되므로, 실행 가능한 코드에서 바로 실험을 바꿔 볼 수 있습니다.
  status: machine
- id: fa5448bcaaef60d3
  en: 'This tutorial builds an eight-atom Greenberger-Horne-Zeilinger (GHZ) state on [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator], FatQat''s neutral-atom execution target. It builds on the [quickstart](../guide/quickstart.md) in two ways: the state spans eight atoms instead of two, and the circuit runs on a backend whose two-qubit-gate connectivity is *reconfigured mid-circuit* rather than fixed.'
  ko: 이 튜토리얼에서는 FatQat의 중성 원자 실행 대상인 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서 8원자 GHZ(Greenberger-Horne-Zeilinger) 상태를 만듭니다. [빠른 시작 가이드](../guide/quickstart.md)보다 두 가지가 더 나아갑니다. 상태가 원자 2개가 아니라 8개에 걸쳐 있고, 2큐비트 게이트의 연결 구조가 고정되지 않고 *회로 도중에 재구성*되는 백엔드에서 회로를 실행합니다.
  status: machine
- id: 1e08f527cfb0d7d6
  en: The GHZ state generalizes the Bell state to $n$ qubits,
  ko: GHZ 상태는 벨 상태를 $n$큐비트로 일반화한 것입니다.
  status: machine
- id: 1a514236c5c46854
  en: On this backend a `CZ` acts only on a pair of atoms that is currently *paired*. The [`Pair`][fatqat.operations.Pair] / [`Unpair`][fatqat.operations.Unpair] operations update that pairing state as the circuit runs. Physically, `Pair` stands for "move these two atoms into a shared entangling zone" and `Unpair` for "move them apart again" -- the atom transport that gives a reconfigurable neutral-atom processor its programmable connectivity. We exploit exactly this to entangle atoms that no fixed one-dimensional layout would place next to each other.
  ko: 이 백엔드에서 `CZ`는 현재 *페어링된* 원자 쌍에만 작용합니다. [`Pair`][fatqat.operations.Pair] / [`Unpair`][fatqat.operations.Unpair] 연산은 회로가 실행되는 동안 이 페어링 상태를 갱신합니다. 물리적으로 `Pair`는 “두 원자를 공유 얽힘 구역으로 옮긴다”는 뜻이고, `Unpair`는 “다시 떼어 놓는다”는 뜻입니다. 재구성 가능한 중성 원자 프로세서는 이러한 원자 이동으로 연결 구조를 프로그래밍할 수 있습니다. 이 튜토리얼은 바로 이 기능을 이용해, 고정된 1차원 배치에서는 서로 이웃할 수 없는 원자들을 얽습니다.
  status: machine
- id: 780117b2321a8deb
  en: 'We could grow the GHZ state with a chain of seven controlled-X gates, atom `0` reaching each neighbor in turn. Instead we use a *binary tree*, which reaches all eight atoms in only three layers and lets the gates within each layer run in parallel on independent atom pairs:'
  ko: 원자 `0`이 이웃 원자에 차례로 작용하는 제어 X 게이트 7개의 사슬로 GHZ 상태를 키울 수도 있습니다. 여기서는 그 대신 *이진 트리*를 사용합니다. 이진 트리는 세 층만으로 원자 8개 모두에 도달하며, 각 층의 게이트를 서로 독립된 원자 쌍에서 병렬로 실행할 수 있습니다.
  status: machine
- id: 99d60985f9bb1f3d
  en: The tree deliberately couples atoms that are far apart. Layer 1 entangles atoms `0` and `4`; layer 2 needs `0` with `2` and `4` with `6`; layer 3 needs `0` with `1`. Atom `0` therefore needs three partners, which no fixed one-dimensional layout can provide, because each site in a line has at most two neighbors.
  ko: 이 트리는 일부러 멀리 떨어진 원자들을 결합합니다. 1층은 원자 `0`과 `4`를 얽고, 2층에서는 `0`과 `2`, `4`와 `6`을, 3층에서는 `0`과 `1`을 얽어야 합니다. 따라서 원자 `0`에는 상대 원자가 셋 필요합니다. 일렬로 놓인 사이트에는 이웃이 많아야 둘이므로 고정된 1차원 배치로는 이를 제공할 수 없습니다.
  status: machine
- id: 623938f83bc5d95d
  en: Reconfigurable connectivity solves this. Just before a layer's gates we [`Pair`][fatqat.operations.Pair] its atoms -- transporting each pair into a shared entangling zone -- and just after we [`Unpair`][fatqat.operations.Unpair] them, freeing the atoms for the next layer's regrouping. If we skipped this rearrangement, the layer-2 and layer-3 `CZ` gates would target atoms that are not paired and the backend would reject the program with [`BackendValidationError`][fatqat.errors.BackendValidationError].
  ko: 재구성 가능한 연결 구조가 이 문제를 해결합니다. 각 층의 게이트 직전에 해당 원자들을 [`Pair`][fatqat.operations.Pair]로 페어링해 쌍마다 공유 얽힘 구역으로 옮기고, 게이트 직후에는 [`Unpair`][fatqat.operations.Unpair]로 페어링을 해제해 다음 층에서 원자들을 다시 묶을 수 있게 합니다. 이 재배치를 생략하면 2층과 3층의 `CZ` 게이트가 페어링되지 않은 원자를 대상으로 하게 되어, 백엔드가 [`BackendValidationError`][fatqat.errors.BackendValidationError]로 프로그램을 거부합니다.
  status: machine
- id: 442b2b49e0f342c0
  en: We run the measured program on [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]; the program's eight qubits set the array size. A fixed seed keeps the numbers stable across tutorial runs, while omitting it produces independent samples. Because the circuit is noiseless, all 2000 shots land on one of the two GHZ branches and no other bitstring appears.
  ko: 측정을 포함한 프로그램을 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서 실행합니다. 배열 크기는 프로그램의 큐비트 8개로 정해집니다. 고정 시드를 쓰면 튜토리얼을 다시 실행해도 수치가 그대로이고, 시드를 생략하면 독립적인 표본을 얻습니다. 회로에 노이즈가 없으므로 2000샷 모두 GHZ 상태의 두 분기 중 하나로 나오며 다른 비트열은 나타나지 않습니다.
  status: retired
- id: 54027e6812e01b5a
  en: 'Two families pin down $|\mathrm{GHZ}_8\rangle$. Each neighbor parity $\langle Z_i Z_{i+1}\rangle = 1$ says adjacent atoms always agree -- something the classical mixture also satisfies. The global $X$-parity $\langle X_0 X_1 \cdots X_7\rangle = 1$ is the discriminator: it equals $+1$ only for the coherent superposition and averages to $0$ for the mixture. Observing both confirms a true GHZ state.'
  ko: $|\mathrm{GHZ}_8\rangle$은 두 종류의 관측량으로 확정할 수 있습니다. 이웃 패리티 $\langle Z_i Z_{i+1}\rangle = 1$은 인접한 원자의 값이 항상 같다는 뜻이며, 고전적 혼합도 이 조건을 만족합니다. 둘을 구별하는 것은 전역 $X$ 패리티 $\langle X_0 X_1 \cdots X_7\rangle = 1$입니다. 이 값은 결맞은 중첩에서만 $+1$이고, 혼합에서는 평균이 $0$입니다. 두 조건을 모두 관측하면 진정한 GHZ 상태임이 확인됩니다.
  status: machine
- id: 38ce5b51e9de9c9d
  en: Every observable returns $+1$, including the global $X$-parity, so the state is the coherent GHZ superposition rather than a classical mixture that would merely reproduce its counts.
  ko: 전역 $X$ 패리티를 포함한 모든 관측량이 $+1$을 반환합니다. 따라서 이 상태는 카운트만 재현하는 고전적 혼합이 아니라 결맞은 GHZ 중첩입니다.
  status: retired
- id: 898a53cc5fc106ed
  en: 'A lost atom is neither in $|0\rangle$ nor in $|1\rangle$: it is *gone*, and reads out as the erasure digit `2`, distinct from either computational outcome. Any shot whose bitstring contains a `2` therefore had at least one atom fall out during transport.'
  ko: 잃은 원자는 $|0\rangle$도 $|1\rangle$도 아닙니다. 원자가 *사라졌으므로* 두 계산 결과와 구별되는 소거 숫자 `2`로 판독됩니다. 따라서 비트열에 `2`가 있는 샷에서는 이동 중에 원자가 적어도 하나 빠져나간 것입니다.
  status: retired
- id: ad715a1db01c70cf
  en: In this run 469 of the 2000 shots, 23.5%, contain a `2`. Counting each atom in each `Pair` and `Unpair`, the program makes 28 atom moves, so with a 1% loss per move about $1 - 0.99^{28} \approx 25\%$ of shots should lose at least one atom. The most frequent loss outcomes have a single `2` at atom `0` or `4`, which move six times each, followed by atoms `2` and `6`, which move four times.
  ko: 이번 실행에서는 2000샷 중 469샷(23.5%)에 `2`가 있습니다. `Pair`와 `Unpair`마다 참여한 원자를 하나씩 세면 프로그램은 원자를 28번 이동시키므로, 이동당 손실 확률이 1%이면 약 $1 - 0.99^{28} \approx 25\%$의 샷에서 원자를 적어도 하나 잃을 것으로 예상됩니다. 가장 흔한 손실 결과는 각각 여섯 번 이동하는 원자 `0` 또는 `4` 자리에 `2`가 하나 있는 경우이고, 그다음은 네 번 이동하는 원자 `2`와 `6`입니다.
  status: retired
