  ko: 이번 실행에서는 2000샷 중 469샷(23.5%)에 `2`가 있습니다. `Pair`와 `Unpair`마다 참여한 원자를 하나씩 세면 프로그램은 원자를 28번 이동시키므로, 이동당 손실 확률이 1%이면 약 $1 - 0.99^{28} \approx 25\%$의 샷에서 원자를 적어도 하나 잃을 것으로 예상됩니다.
