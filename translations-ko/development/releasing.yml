- id: a96b8ab5e6df7fd3
  en: Making a release
  ko: 릴리스 만들기
  status: machine
- id: 517c044e8d6ec4b1
  en: Use this guide when you are preparing a FatQat release. It walks you through choosing which changes to ship, checking the package that users will install, publishing it, and getting `main` ready for further development.
  ko: FatQat 릴리스를 준비할 때 이 가이드를 사용하세요. 배포할 변경 사항을 고르고, 사용자가 설치할 패키지를 확인하고, 게시한 뒤 `main`에서 다음 개발을 준비하는 과정을 설명합니다.
  status: machine
- id: c985637655e4b634
  en: A release has three names you will use along the way. For example, the **release branch** `v0.2.x` can carry several releases in the same series. The **Git tag** `v0.2.0` identifies the exact commit used for one of them. The **package version** `0.2.0` is what a user gives to pip. For a prerelease such as `0.2.0rc1`, the branch stays the same and the tag becomes `v0.2.0rc1`.
  ko: 릴리스 과정에서는 세 가지 이름을 사용합니다. 예를 들어 **릴리스 브랜치** `v0.2.x`에는 같은 계열의 여러 릴리스를 담을 수 있습니다. **Git 태그** `v0.2.0`은 그중 한 릴리스에 사용한 정확한 커밋을 가리킵니다. **패키지 버전** `0.2.0`은 사용자가 pip에 지정하는 값입니다. `0.2.0rc1` 같은 사전 릴리스에서는 브랜치는 그대로 두고 태그를 `v0.2.0rc1`로 지정합니다.
  status: machine
- id: 887fe405cf89ff20
  en: You will open two pull requests. The first prepares the package on its release branch while development continues on `main`. After publication, the second brings the release notes and any release fixes back to `main`.
  ko: 풀 리퀘스트를 두 번 엽니다. 첫 번째는 릴리스 브랜치에서 패키지를 준비하며, 그동안 `main`에서는 개발을 계속합니다. 게시 후에는 두 번째 풀 리퀘스트로 릴리스 노트와 릴리스 과정의 수정 사항을 `main`에 반영합니다.
  status: machine
- id: ba4ab3fb9dcbbd6a
  en: Choose what to release
  ko: 릴리스할 내용 선택하기
  status: machine
- id: fbddf0636523cf2d
  en: Start with the intended package version. It determines which branch to use and which changes belong in the release.
  ko: 먼저 배포할 패키지 버전을 정하세요. 이 버전에 따라 사용할 브랜치와 릴리스에 포함할 변경 사항이 결정됩니다.
  status: machine
- id: 8e11ae2d04c6b4e4
  en: '| What are you releasing? | Where to start |'
  ko: '| 어떤 릴리스인가요? | 시작점 |'
  status: machine
- id: ac52447093600225
  en: '| A patch such as `0.1.1` | Start from `v0.1.x` and backport the fixes intended for users of that series. |'
  ko: '| `0.1.1` 같은 패치 버전 | `v0.1.x`에서 시작해 해당 계열 사용자를 위한 수정 사항을 백포트합니다. |'
  status: machine
- id: 6c534ab92e9eef2e
  en: '| A new minor or major version such as `0.2.0` or `1.0.0` | Use the series branch if one already exists from a prerelease. Otherwise, create `v0.2.x` or `v1.0.x` from the commit on `main` that contains the intended changes. |'
  ko: '| `0.2.0` 또는 `1.0.0` 같은 새 마이너 또는 메이저 버전 | 사전 릴리스에서 만든 계열 브랜치가 있다면 사용합니다. 없다면 원하는 변경 사항이 포함된 `main`의 커밋에서 `v0.2.x` 또는 `v1.0.x`를 만듭니다. |'
  status: machine
- id: 5e88888134480c20
  en: '| An alpha, beta, or release candidate | Use the branch for the intended final release. Create it for the first prerelease if necessary, then reuse it throughout the series. |'
  ko: '| 알파, 베타 또는 릴리스 후보 | 목표 정식 릴리스의 브랜치를 사용합니다. 필요하면 첫 사전 릴리스에서 만들고 해당 계열 전체에서 계속 사용합니다. |'
  status: machine
- id: 5d3b1208121a145e
  en: Create any new series branch in `spaceqat/fatqat` so it can be the base of a PR. Check the repository's branch rules and the PyPI environment's allowed branches and tags for the new series. Keep earlier series branches available for maintenance.
  ko: 새 계열 브랜치는 PR의 대상이 될 수 있도록 `spaceqat/fatqat`에 만드세요. 저장소의 브랜치 규칙과 PyPI 환경에서 새 계열에 허용하는 브랜치 및 태그를 확인하세요. 이전 계열 브랜치는 유지보수를 위해 남겨 두세요.
  status: machine
- id: 15cdc9bf343e51ad
  en: Create your working branch from the selected release branch. During a prerelease cycle you can bring in further changes from `main` while they belong to the same series. Once development on `main` moves ahead, backport the individual fixes needed for the release.
  ko: 선택한 릴리스 브랜치에서 작업 브랜치를 만드세요. 사전 릴리스 주기에는 같은 계열에 속하는 변경 사항을 `main`에서 계속 가져올 수 있습니다. `main`의 개발이 다음 단계로 넘어가면 릴리스에 필요한 수정 사항만 개별적으로 백포트하세요.
  status: machine
- id: 463f523342d69a05
  en: Prepare the release PR
  ko: 릴리스 PR 준비하기
  status: machine
- id: 97367bb012e60c62
  en: Set `__version__` in `src/fatqat/__init__.py` to the version you want users to install. Drop the development suffix and retain any prerelease identifier, for example `0.2.0rc1`.
  ko: '`src/fatqat/__init__.py`의 `__version__`을 사용자가 설치할 버전으로 설정하세요. 개발 버전 접미사는 제거하고 `0.2.0rc1`처럼 사전 릴리스 식별자는 유지하세요.'
  status: machine
- id: ac03542b42378432
  en: Add a dated entry to `CHANGELOG.md`. Choose the comparison point from the reader's perspective. Someone moving from one alpha or patch to the next needs the changes since the preceding tag in that series. Someone upgrading from one stable series to the next also needs the features introduced during the intervening prereleases. Compare the tagged contents when deciding whether a feature is new or an existing feature was updated. Include migration steps where an API changed, and credit external contributors alongside their changes with links to the relevant PRs.
  ko: '`CHANGELOG.md`에 날짜가 있는 항목을 추가하세요. 비교 기준은 독자의 관점에서 선택합니다. 한 알파 또는 패치 버전에서 다음 버전으로 이동하는 사용자는 같은 계열의 이전 태그 이후 변경 사항이 필요합니다. 한 안정 계열에서 다음 계열로 업그레이드하는 사용자에게는 그 사이의 사전 릴리스에서 도입한 기능도 필요합니다. 기능이 새로 추가되었는지 기존 기능이 수정되었는지 판단할 때는 태그의 내용을 비교하세요. API가 바뀌었다면 마이그레이션 절차를 포함하고, 외부 기여자는 해당 변경 사항 옆에 관련 PR 링크와 함께 명시하세요.'
  status: machine
- id: f2d5dbab44c605fc
  en: Open the PR against the release branch. Run the [contribution checks](https://github.com/spaceqat/fatqat/blob/main/CONTRIBUTING.md#code-changes-and-validation) and [documentation validation](https://github.com/spaceqat/fatqat/blob/main/docs/mkdocs/README.md#validate-before-submission). After review and merge, confirm tests and lint pass and note the merged commit SHA. You will use it to check the release tag.
  ko: 릴리스 브랜치를 대상으로 PR을 여세요. [기여 검사](https://github.com/spaceqat/fatqat/blob/main/CONTRIBUTING.md#code-changes-and-validation)와 [문서 검증](https://github.com/spaceqat/fatqat/blob/main/docs/mkdocs/README.md#validate-before-submission)을 실행하세요. 검토와 병합 후 테스트와 린트가 통과했는지 확인하고 병합된 커밋 SHA를 기록하세요. 나중에 릴리스 태그를 확인할 때 사용합니다.
  status: machine
- id: fbbc3a944a551073
  en: Try the package before publishing
  ko: 게시 전에 패키지 시험하기
  status: machine
- id: f96dd350fede5890
  en: The release workflow produces two files, a wheel for installation and a source archive. Build them from the merged release branch first so you can try a clean installation before publishing.
  ko: 릴리스 워크플로는 설치용 wheel과 소스 아카이브 두 파일을 생성합니다. 게시 전에 새 환경에서 설치를 시험할 수 있도록 먼저 병합된 릴리스 브랜치에서 두 파일을 만드세요.
  status: machine
- id: 0bac0c220d1a3106
  en: Open [Build and optionally publish to PyPI](https://github.com/spaceqat/fatqat/actions/workflows/build.yaml) in `spaceqat/fatqat`.
  ko: '`spaceqat/fatqat`에서 [Build and optionally publish to PyPI](https://github.com/spaceqat/fatqat/actions/workflows/build.yaml)를 여세요.'
  status: machine
- id: 8358efb7b69afbe6
  en: Choose **Run workflow**, select the release branch, and leave `confirm_ref` blank. This runs the build and Twine checks only.
  ko: '**Run workflow**를 선택하고 릴리스 브랜치를 고른 뒤 `confirm_ref`는 비워 두세요. 이렇게 하면 빌드와 Twine 검사만 실행됩니다.'
  status: machine
- id: 93faa045b7f394b5
  en: When the run succeeds, download and unpack the **distributions** artifact. Check that it contains the wheel and source archive for the intended version.
  ko: 실행이 성공하면 **distributions** 아티팩트를 다운로드하고 압축을 푸세요. 목표 버전의 wheel과 소스 아카이브가 있는지 확인하세요.
  status: machine
- id: 9126ac8cdd8cbd37
  en: Install the downloaded wheel in a fresh Python environment, from a directory outside the source checkout. Replace the example path below with the path to the wheel.
  ko: 새 Python 환경에서 다운로드한 wheel을 설치하세요. 소스 체크아웃 밖의 디렉터리에서 실행하고, 아래 예제 경로를 실제 wheel 경로로 바꾸세요.
  status: machine
- id: 0c76e950c08493d4
  en: Confirm that the printed version matches the release PR, then run a small simulation from the quickstart. This exercises the installed package and its dependencies. Resolve any problems before tagging the release.
  ko: 출력된 버전이 릴리스 PR과 일치하는지 확인한 뒤 빠른 시작의 작은 시뮬레이션을 실행하세요. 설치된 패키지와 의존성이 함께 동작하는지 확인하는 과정입니다. 문제를 모두 해결한 뒤 릴리스 태그를 만드세요.
  status: machine
- id: 27e7da91503af700
  en: Tag the tested commit on GitHub
  ko: GitHub에서 테스트한 커밋에 태그 만들기
  status: machine
- id: d3915b41942dd2a4
  en: Open [New release](https://github.com/spaceqat/fatqat/releases/new). Enter the tag (the package version prefixed with `v`), select the release branch as the target, and copy the changelog entry into the release notes. For an alpha, beta, or release candidate, select **Set as a pre-release**. Leave that option unchecked for a stable version.
  ko: '[New release](https://github.com/spaceqat/fatqat/releases/new)를 여세요. 태그 이름(패키지 버전 앞에 `v`를 붙인 값)을 입력하고 릴리스 브랜치를 대상으로 선택한 뒤 변경 로그 항목을 릴리스 노트에 복사하세요. 알파, 베타 또는 릴리스 후보라면 **Set as a pre-release**를 선택하세요. 안정 버전에서는 선택하지 마세요.'
  status: machine
- id: c2f30e7cf8d38b3d
  en: Save the draft so the notes can be reviewed. A new tag entered in the draft is created when you click **Publish release**. Before publishing, check the release date and confirm the target still points to the commit you tested. If you selected an existing tag, check the commit that tag already identifies.
  ko: 노트를 검토할 수 있도록 초안을 저장하세요. 초안에 입력한 새 태그는 **Publish release**를 클릭할 때 만들어집니다. 게시 전에 릴리스 날짜를 확인하고 대상이 여전히 테스트한 커밋을 가리키는지 확인하세요. 기존 태그를 선택했다면 그 태그가 가리키는 커밋을 확인하세요.
  status: machine
- id: a5f160f4931fcd26
  en: Publish the tagged version to PyPI
  ko: 태그된 버전을 PyPI에 게시하기
  status: machine
- id: 0282ae1c535949af
  en: Run the build workflow again, this time using the published tag. The workflow rebuilds the distributions from that tag and submits them to the PyPI publishing environment for approval.
  ko: 이번에는 게시한 태그를 사용해 빌드 워크플로를 다시 실행하세요. 워크플로는 해당 태그에서 배포 파일을 다시 만들고 승인을 받기 위해 PyPI 게시 환경에 제출합니다.
  status: machine
- id: 1ae81d2abd36864e
  en: In the workflow's branch/tag selector, select the **tag**. Enter the same tag, including the initial `v`, in `confirm_ref`. For example, for `0.2.0rc1`, both fields should read `v0.2.0rc1`.
  ko: 워크플로의 브랜치/태그 선택기에서 **태그**를 선택하세요. `confirm_ref`에 맨 앞의 `v`까지 포함한 같은 태그를 입력하세요. 예를 들어 `0.2.0rc1`을 게시한다면 두 필드 모두 `v0.2.0rc1`이어야 합니다.
  status: machine
- id: ed020badee2389ef
  en: Start the run. The workflow checks that the confirmation matches the selected ref and that the tag matches the version in the built package. Development versions and versions with a local suffix are rejected.
  ko: 실행을 시작하세요. 워크플로는 확인 값이 선택한 ref와 일치하는지, 태그가 빌드한 패키지의 버전과 일치하는지 검사합니다. 개발 버전과 로컬 접미사가 있는 버전은 거부됩니다.
  status: machine
- id: 7006e00c31fd5338
  en: When the **publish** job requests approval, an authorized reviewer opens **Review deployments**, selects `pypi`, and clicks **Approve and deploy**. Allow for any wait timer configured on the environment.
  ko: '**publish** 작업이 승인을 요청하면 권한이 있는 검토자가 **Review deployments**를 열고 `pypi`를 선택한 뒤 **Approve and deploy**를 클릭합니다. 환경에 대기 타이머가 설정되어 있다면 해당 시간도 기다려야 합니다.'
  status: machine
- id: 543dd7b898a061e7
  en: After the job succeeds, find the version in the [PyPI release history](https://pypi.org/project/fatqat/#history) and check that both files are listed. In a fresh environment, install the published version, substituting its package version for `<version>`. Repeat the version check and the small simulation you ran with the downloaded wheel.
  ko: 작업이 성공하면 [PyPI 릴리스 기록](https://pypi.org/project/fatqat/#history)에서 해당 버전을 찾고 두 파일이 모두 표시되는지 확인하세요. 새 환경에서 `<version>`을 패키지 버전으로 바꿔 게시된 버전을 설치하세요. 다운로드한 wheel로 수행했던 버전 확인과 작은 시뮬레이션을 반복하세요.
  status: machine
- id: e3e5c9e82e392c3e
  en: If the workflow fails, inspect the failed job and check which files, if any, reached PyPI before retrying.
  ko: 워크플로가 실패하면 재시도 전에 실패한 작업을 살펴보고 PyPI에 이미 올라간 파일이 있는지, 있다면 어떤 파일인지 확인하세요.
  status: machine
- id: 56343dc9801e1acd
  en: Bring the release back to main
  ko: 릴리스 변경 사항을 main에 반영하기
  status: machine
- id: e8e3f1f243ea19d6
  en: Open the second PR against `main`. Include the published notes and any fixes made only on the release branch. Preserve newer changes already on `main`. The development version should tell someone installing from `main` what release series they are testing.
  ko: '`main`을 대상으로 두 번째 PR을 여세요. 게시된 노트와 릴리스 브랜치에서만 수정한 내용을 포함하되, `main`에 이미 있는 더 새로운 변경 사항은 유지하세요. 개발 버전은 `main`에서 설치하는 사람이 어떤 릴리스 계열을 테스트하는지 알 수 있어야 합니다.'
  status: machine
- id: d613ba9b24659e4a
  en: If the next target is another prerelease of the same version, use its planned identifier followed by `.dev0`, for example `0.2.0rc2.dev0` after `0.2.0rc1`.
  ko: 다음 목표가 같은 버전의 또 다른 사전 릴리스라면 예정된 식별자 뒤에 `.dev0`을 붙이세요. 예를 들어 `0.2.0rc1` 다음에는 `0.2.0rc2.dev0`을 사용합니다.
  status: machine
- id: 3890bb0da315e318
  en: After a stable minor or major release, use the next planned development version, for example `0.3.0.dev0` if development moves to `0.3`.
  ko: 안정 마이너 또는 메이저 릴리스 후에는 다음에 계획한 개발 버전을 사용하세요. 예를 들어 개발이 `0.3`으로 넘어가면 `0.3.0.dev0`을 사용합니다.
  status: machine
- id: 9ac20f3b1062dd49
  en: After a maintenance release, keep the current development version if `main` already targets a later series.
  ko: 유지보수 릴리스 후 `main`이 이미 더 뒤의 계열을 대상으로 한다면 현재 개발 버전을 유지하세요.
  status: machine
- id: 52fc41f49829b17b
  en: Review and merge this PR after its checks pass. The release tag stays on the commit used to build the published package.
  ko: 검사가 통과하면 이 PR을 검토하고 병합하세요. 릴리스 태그는 게시된 패키지를 빌드한 커밋에 그대로 둡니다.
  status: machine
