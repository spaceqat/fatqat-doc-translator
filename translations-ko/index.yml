- id: f120da887dfac25a
  en: This three-qubit Grover search begins with all eight bit strings equally likely. Two iterations mark `101` and amplify it. The results below show how three execution levels change the outcome as hardware constraints and physical dynamics are introduced.
  ko: 이 3큐비트 Grover 탐색은 여덟 비트열의 확률이 같은 상태에서 시작합니다. 두 번의 반복으로 `101`을 표시하고 증폭합니다. 아래 결과는 하드웨어 제약과 물리적 동역학을 도입할 때 세 실행 수준에서 결과가 어떻게 달라지는지 보여 줍니다.
  status: machine
- id: b170b51d33a291b7
  en: '![A compact three-qubit Grover search uses fused RY and RZ rotations with four Toffoli gates to amplify 101.](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  ko: '![간결한 3큐비트 Grover 탐색이 융합된 RY 및 RZ 회전과 네 개의 Toffoli 게이트로 101을 증폭합니다.](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  status: machine
- id: e55b1f00b665bfa1
  en: :material-chart-box-outline:{ .lg .middle } **General `Simulator`**
  ko: :material-chart-box-outline:{ .lg .middle } **일반 `Simulator`**
  status: machine
- id: 608541444ee76532
  en: '![The ideal Simulator result gives the target outcome 101 a probability of 94.53 percent.](assets/generated/home/grover-general.png){ loading=lazy width=714 height=515 }'
  ko: '![이상적인 Simulator에서는 목표 결과 101의 확률이 94.53퍼센트입니다.](assets/generated/home/grover-general.png){ loading=lazy width=714 height=515 }'
  status: machine
- id: ed4bfdc92ec8b7c4
  en: Circuit-level evolution returns `101` with **94.53%** probability.
  ko: 회로 수준의 시간 진화에서는 **94.53%**의 확률로 `101`을 얻습니다.
  status: machine
- id: fa32672227a9ed82
  en: '![The SCQubitSimulator result gives the target outcome 101 a probability of 81.65 percent with 200-microsecond coherence times and additional CZ depolarizing noise of 0.003 on both edges.](assets/generated/home/grover-sc-profile.png){ loading=lazy width=714 height=515 }'
  ko: '![SCQubitSimulator에서 결맞음 시간을 200마이크로초로 두고 양쪽 연결에 0.003의 CZ 탈분극 잡음을 추가하면 목표 결과 101의 확률은 81.65퍼센트입니다.](assets/generated/home/grover-sc-profile.png){ loading=lazy width=714 height=515 }'
  status: machine
- id: e0dd853dd661f302
  en: With `T1 = T2 = 200 µs`, we add CZ depolarizing noise with `p = 0.003`. Compiled native-gate simulation then returns `101` with **81.65%** probability.
  ko: '`T1 = T2 = 200 µs`로 두고 `p = 0.003`의 CZ 탈분극 잡음을 추가합니다. 컴파일된 네이티브 게이트 시뮬레이션에서는 **81.65%**의 확률로 `101`을 얻습니다.'
  status: machine
- id: 5727a0b51520e3b5
  en: '![The three-level TransmonEmulator result gives the target outcome 101 a probability of about 64.05 percent with the same coherence times.](assets/generated/home/grover-transmon.png){ loading=lazy width=714 height=515 }'
  ko: '![같은 결맞음 시간을 사용한 3준위 TransmonEmulator에서 목표 결과 101의 확률은 약 64.05퍼센트입니다.](assets/generated/home/grover-transmon.png){ loading=lazy width=714 height=515 }'
  status: machine
- id: c0722ef9790a984b
  en: Calibrated pulses, three physical levels, and the same coherence times return `101` with about **64.05%** probability; physical leakage is **0.0649%**. This run realizes the compiled X/SX/RZ/CZ gates with calibrated pulses.
  ko: 보정된 펄스, 세 물리적 준위, 같은 결맞음 시간을 사용하면 `101`의 확률은 약 **64.05%**이고 물리적 누설은 **0.0649%**입니다. 이 실행에서는 컴파일된 X/SX/RZ/CZ 게이트를 보정된 펄스로 구현합니다.
  status: machine
- id: 7b314aaff7ff66e9
  en: With the fixed routing seed, compilation produces **51 CZ**, **172 SX**, and **383 RZ** gates. These results use the same compiled circuit for both hardware models; the SC noise channels and the Transmon pulse dynamics model different physical effects. The Transmon model also uses 60 ns CZ pulses, while the SC coherence channels use a 50 ns CZ duration. Compilation preserves ideal algorithm behavior, but the gate decomposition and routing affect noisy results.
  ko: 라우팅 시드를 고정하면 컴파일 결과는 **51개의 CZ**, **172개의 SX**, **383개의 RZ** 게이트입니다. 두 하드웨어 모델은 같은 컴파일된 회로를 사용하지만, SC 잡음 채널과 Transmon 펄스 동역학은 서로 다른 물리적 효과를 모델링합니다. Transmon 모델의 CZ 펄스 길이는 60 ns이며 SC 결맞음 채널의 CZ 지속 시간은 50 ns입니다. 컴파일은 이상적인 알고리즘 동작을 보존하지만, 게이트 분해와 라우팅은 잡음이 있는 결과에 영향을 줍니다.
  status: machine
- id: 51ffc6eebdfdbcd9
  en: Shared algorithm source — `home_grover_program.py`
  ko: 공통 알고리즘 소스 — `home_grover_program.py`
  status: machine
- id: 7cc9bf4b96af55d4
  en: All three scripts start from the same compact `LogicalProgram` shown above. General simulation runs it directly; the SC and Transmon scripts use `compile_to_sc()` to decompose its Toffoli gates and route the circuit onto the three-site line. The routing seed is fixed for reproducible results. The shared axis helper restores logical qubit order when reading a compiled final state.
  ko: 세 스크립트는 모두 위에 보인 간결한 `LogicalProgram`에서 시작합니다. 일반 시뮬레이션은 이를 직접 실행하고, SC 및 Transmon 스크립트는 `compile_to_sc()`로 Toffoli 게이트를 분해한 뒤 회로를 세 위치의 선형 연결에 라우팅합니다. 재현성을 위해 라우팅 시드를 고정합니다. 공통 축 헬퍼는 컴파일된 최종 상태를 읽을 때 논리 큐비트 순서를 복원합니다.
  status: machine
- id: 3c5e118fd497f10a
  en: Run each execution model independently
  ko: 각 실행 모델을 독립적으로 실행하기
  status: machine
- id: 68adc938030ac905
  en: Each tab is a top-to-bottom script. The general script also verifies that ideal compiled execution matches the source state up to a global phase. The Transmon script binds compiled sites to model subsystems and supplies X/SX pulse definitions using its calibrated RX recipe.
  ko: 각 탭은 위에서 아래로 실행하는 완전한 스크립트입니다. 일반 스크립트는 이상적인 컴파일 실행이 전역 위상을 제외하고 원본 상태와 일치하는지도 검증합니다. Transmon 스크립트는 컴파일된 위치를 모델의 부분계에 연결하고, 보정된 RX 구현으로 X/SX 펄스를 정의합니다.
  status: machine
- id: 960c98ad9d1c39bc
  en: General `Simulator`
  ko: 일반 `Simulator`
  status: machine
- id: e9a2ce2d270e9d64
  en: Encode hardware behavior when needed
  ko: 필요할 때 하드웨어 동작 표현하기
  status: machine
- id: 6151f40ae62df51e
  en: Algorithm developers can stay with general simulation. When their work requires more detail, compiler and hardware developers can add device-specific operations to a `Program`. The backend validates when those operations are allowed and tracks their effects.
  ko: 알고리즘 개발자는 일반 시뮬레이션만으로 작업할 수 있습니다. 더 세밀한 모델이 필요하다면 컴파일러 및 하드웨어 개발자가 장치별 연산을 `Program`에 추가할 수 있습니다. 백엔드는 해당 연산이 허용되는 조건을 검증하고 그 효과를 추적합니다.
  status: machine
- id: bbae73316352950c
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] provides one example. Sites begin empty, so `Put` loads the atoms; `Pair` makes native `CZ` available, and `Unpair` removes that connection. Noise attached to these operations can perturb the state or remove an atom from the array.'
  ko: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]가 그 예입니다. 각 위치는 비어 있는 상태로 시작하므로 `Put`으로 원자를 적재합니다. `Pair`는 네이티브 `CZ`를 사용할 수 있게 연결하고, `Unpair`는 그 연결을 해제합니다. 이 연산에 붙인 잡음은 상태를 교란하거나 배열에서 원자를 제거할 수 있습니다.'
  status: machine
- id: 7a8db953a972dfce
  en: '![Two occupied atoms begin separated, pair so that CZ becomes legal, and unpair while optional depolarizing noise follows the pairing operations.](assets/generated/guide/atom-pairing-lifecycle.svg){ loading=lazy width=960 height=306 }'
  ko: '![처음에는 떨어져 있던 두 원자를 쌍으로 묶어 CZ를 허용한 뒤 다시 분리합니다. 선택적으로 쌍 구성 연산 뒤에 탈분극 잡음을 적용할 수 있습니다.](assets/generated/guide/atom-pairing-lifecycle.svg){ loading=lazy width=960 height=306 }'
  status: machine
- id: 680d0ffc9139960f
  en: Occupancy stays explicit while pairing changes which native interactions are legal.
  ko: 원자 점유 여부를 명시적으로 관리하면서, 쌍 구성에 따라 허용되는 네이티브 상호작용을 바꿉니다.
  status: machine
- id: b5a069470af040be
  en: Run the atom-array Program
  ko: 원자 배열 Program 실행하기
  status: machine
- id: 4893e0adf8bc0ab0
  en: '[`Loss`][fatqat.noise.Loss] models the second outcome. It removes a present atom after a matched operation. Occupancy is tracked independently for every shot, and measuring an empty site returns the erasure digit `2`.'
  ko: '[`Loss`][fatqat.noise.Loss]는 원자가 제거되는 경우를 모델링합니다. 일치하는 연산 뒤에 존재하던 원자를 제거합니다. 점유 여부는 각 샷에서 독립적으로 추적하며, 빈 위치를 측정하면 소실을 나타내는 숫자 `2`를 반환합니다.'
  status: machine
- id: e512e5a816ce5523
  en: '![An occupied atom undergoes a matched operation, after which Loss either leaves it present with probability one minus p or removes it with probability p; measurement of the empty site returns 2.](assets/generated/guide/atom-loss-lifecycle.svg){ loading=lazy width=960 height=306 }'
  ko: '![원자가 있는 위치에서 일치하는 연산을 수행한 뒤 Loss가 1-p의 확률로 원자를 남기거나 p의 확률로 제거합니다. 빈 위치를 측정하면 2를 반환합니다.](assets/generated/guide/atom-loss-lifecycle.svg){ loading=lazy width=960 height=306 }'
  status: machine
- id: c36f14b8cf2fc5c9
  en: Loss is sampled after the matched operation and changes per-shot occupancy.
  ko: Loss는 일치하는 연산 뒤에 샘플링되며 각 샷의 점유 상태를 바꿉니다.
  status: machine
- id: 96345ea52a5340eb
  en: Simulate atom loss
  ko: 원자 손실 시뮬레이션
  status: machine
