- id: d07fb82dc004c488
  en: Diagnose a Program workflow
  ko: Program 실행 과정의 문제 진단하기
  status: machine
- id: 8636df5374a4ad47
  en: 'Most first-run problems occur at one of four boundaries:'
  ko: 첫 실행에서 겪는 문제는 대부분 다음 네 단계 중 하나에서 발생합니다.
  status: machine
- id: f34ebdd30c568a6b
  en: Start with the symptom below. You should not need to inspect FatQat's internal execution engine.
  ko: 아래 증상부터 확인하세요. FatQat의 내부 실행 엔진까지 살펴볼 필요는 없습니다.
  status: machine
- id: e04f9228880ac7fd
  en: Writing the Program
  ko: Program 작성
  status: machine
- id: 17b6aa23c0286d8e
  en: An integer target is ambiguous
  ko: 정수 대상이 모호하다는 오류
  status: machine
- id: 21e364de512be153
  en: 'Bare integers are convenient for `Program(2)`, where there is only one quantum register. Once a Program contains several registers, use the register references you created:'
  ko: 양자 레지스터가 하나뿐인 `Program(2)`에서는 정수만으로 대상을 지정하기 편리합니다. Program에 여러 레지스터가 있다면 생성한 레지스터 참조를 사용하세요.
  status: machine
- id: fa1dda001e9d7328
  en: This also makes each target's local dimension unambiguous. See [Write quantum computations with Program](program.md).
  ko: 이렇게 하면 각 대상의 국소 차원도 명확해집니다. [Program으로 양자 계산 작성하기](program.md)를 참고하세요.
  status: machine
- id: 7f207fe33c42308b
  en: Measurement reports a dimension mismatch
  ko: 측정에서 차원 불일치가 보고됨
  status: machine
- id: 6fcf6df6fc465d91
  en: 'A measured quantum resource and its classical destination must have the same local dimension. A qutrit needs a classical trit, not an ordinary bit:'
  ko: 측정할 양자 자원과 결과를 저장할 고전 자원의 국소 차원은 같아야 합니다. 큐트릿에는 일반 비트가 아니라 고전 트리트가 필요합니다.
  status: machine
- id: 4b3bb80dbafdf941
  en: The Program still contains an unbound parameter
  ko: Program에 바인딩되지 않은 매개변수가 남음
  status: machine
- id: f10a339c4c5a3d4f
  en: 'Binding returns a new Program; it does not modify the template in place. Keep the returned value and submit that one:'
  ko: 바인딩은 템플릿을 직접 수정하지 않고 새 Program을 반환합니다. 반환된 값을 저장해 제출하세요.
  status: machine
- id: 925426e167c3339f
  en: For a batch of bindings, use the sweep workflow in [Simulate a quantum program](simulation.md).
  ko: 여러 바인딩을 한꺼번에 실행하려면 [양자 프로그램 시뮬레이션하기](simulation.md)의 스윕 과정을 사용하세요.
  status: machine
- id: ecf299635b276acc
  en: Matching the execution target
  ko: 실행 타깃과의 호환성
  status: machine
- id: 13a948cdb96e44f6
  en: An operation works on Simulator but is unsupported here
  ko: Simulator에서는 되지만 여기서는 지원되지 않는 연산
  status: machine
- id: f9546d1afd71b66a
  en: That usually means the selected hardware profile or emulator cannot realize the instruction as written. The general simulator accepts a wider logical operation set; constrained targets intentionally do not.
  ko: 대개 선택한 하드웨어 프로파일이나 에뮬레이터가 작성된 명령을 그대로 구현할 수 없다는 뜻입니다. 범용 시뮬레이터는 더 넓은 논리 연산 집합을 받지만, 제약이 있는 타깃은 의도적으로 지원 범위를 제한합니다.
  status: machine
- id: cfad2968f94182a6
  en: 'Check the target''s supported operations and ask which detail you meant to study:'
  ko: 타깃에서 지원하는 연산을 확인하고 무엇을 연구하려는지에 따라 선택하세요.
  status: machine
- id: 3ab3fd0488fc5cb3
  en: return to the general simulator for unrestricted algorithm behavior;
  ko: 제약 없이 알고리즘 동작을 살펴보려면 범용 시뮬레이터로 돌아갑니다.
  status: machine
- id: a9db0a2b3ba38c9f
  en: rewrite the Program in the profile's native operations when hardware constraints are the point; or
  ko: 하드웨어 제약을 연구하려면 프로파일의 네이티브 연산으로 Program을 다시 작성합니다.
  status: machine
- id: 11c7bd34cccf14fc
  en: supply an implementation/calibration only if you are deliberately extending the target.
  ko: 타깃 자체를 확장하려는 경우에만 구현이나 보정 데이터를 제공합니다.
  status: machine
- id: ba31eaa138b909a3
  en: FatQat does not silently transpile or route the Program. See [Choose how much physics to model](execution-models.md).
  ko: FatQat은 Program을 자동으로 트랜스파일하거나 라우팅하지 않습니다. [물리 모델링 수준 선택하기](execution-models.md)를 참고하세요.
  status: machine
- id: 0548d37a3281f7c8
  en: A two-resource gate fails because of placement
  ko: 두 자원에 작용하는 게이트가 배치 때문에 실패함
  status: machine
- id: 92152188b5a272ec
  en: The operation can be native while its two physical locations are not connected. Inspect or choose a [`ResourceLayout`][fatqat.ResourceLayout] and keep the ordered logical targets distinct from their device labels. The worked failure-and-fix is in [Test a Program against a hardware profile](hardware-profile-simulation.md).
  ko: 연산 자체는 네이티브여도 두 물리 위치가 연결되어 있지 않을 수 있습니다. [`ResourceLayout`][fatqat.ResourceLayout]을 확인하거나 지정하고, 순서가 있는 논리 대상과 장치 레이블을 구분하세요. [하드웨어 프로파일로 Program 검증하기](hardware-profile-simulation.md)에 실패 예제와 수정 방법이 있습니다.
  status: machine
- id: 81ebaa3fc23e5356
  en: A direct control is rejected by an emulator
  ko: 에뮬레이터가 직접 제어를 거부함
  status: machine
- id: c65497b61f8c09e0
  en: Each pulse channel comes from a particular physical model and identifies one of that model's resources. Build the control from the same model used by the emulator. Then check that the waveform uses the model's time and control units, that its values are allowed, and that the operation duration covers every control. [Follow a Program into physical dynamics](hamiltonian-emulation.md) builds this chain one piece at a time.
  ko: 각 펄스 채널은 특정 물리 모델에서 생성되며 그 모델의 자원 하나를 가리킵니다. 에뮬레이터가 사용하는 것과 같은 모델에서 제어를 만드세요. 파형의 시간·제어 단위가 모델과 맞는지, 값이 허용 범위인지, 연산의 지속 시간이 모든 제어를 포함하는지도 확인합니다. [Program에서 물리 동역학까지](hamiltonian-emulation.md)에서 이 과정을 단계별로 구성합니다.
  status: machine
- id: f78c928a5db65fdb
  en: Configuring the run
  ko: 실행 설정
  status: machine
- id: fccabf9903471a09
  en: Counts change each time
  ko: 카운트가 매번 달라짐
  status: machine
- id: 05e2a873e556e9a1
  en: 'Counts are sampled. Increase `shots` when you want a steadier estimate, and set a seed when you need to reproduce a particular sample:'
  ko: 카운트는 샘플링 결과입니다. 더 안정적인 추정값이 필요하면 `shots`를 늘리고, 특정 표본을 재현하려면 시드를 지정하세요.
  status: machine
- id: 28ff31e6c36ac66f
  en: A fixed seed aids debugging; it does not make a small sample more accurate.
  ko: 고정 시드는 디버깅에 도움이 되지만 작은 표본을 더 정확하게 만들지는 않습니다.
  status: machine
- id: bc40669ff86b00da
  en: A statevector is unavailable for a noisy or dynamic run
  ko: 잡음이 있거나 동적인 실행에서 상태 벡터를 얻을 수 없음
  status: machine
- id: 3b7bb637f15070e0
  en: After measurement, reset, or trajectory noise, one statevector is only one sampled history. Request it with `shots=1` when that single history is what you want. Use density-matrix simulation for an exact mixed state.
  ko: 측정, 리셋, 궤적 잡음 뒤의 상태 벡터 하나는 샘플링된 경로 하나만 나타냅니다. 그 개별 경로가 필요하면 `shots=1`로 요청하세요. 정확한 혼합 상태를 구하려면 밀도 행렬 시뮬레이션을 사용합니다.
  status: machine
- id: 1bc9ce1555eccd79
  en: The first Numba run is unexpectedly slow
  ko: 첫 Numba 실행이 예상보다 느림
  status: machine
- id: 8ba9327679552d33
  en: Numba compiles kernels lazily. Warm the workload before measuring repeated runtime, or choose NumPy when predictable one-off latency matters more. The benchmark pattern is in [Performance and scaling](performance.md).
  ko: Numba는 커널을 처음 사용할 때 컴파일합니다. 반복 실행 시간을 재기 전에 워크로드를 워밍업하거나, 일회성 실행의 예측 가능한 지연 시간이 더 중요하면 NumPy를 선택하세요. 벤치마크 방식은 [성능과 확장성](performance.md)에 나와 있습니다.
  status: machine
- id: 08d5f76d290cfb6d
  en: Reading the Result
  ko: Result 읽기
  status: machine
- id: ee98bc5cd0c2d8cb
  en: A Result accessor says its data is unavailable
  ko: Result 접근자가 데이터를 사용할 수 없다고 함
  status: machine
- id: f7ef98d3e7318315
  en: 'Runs contain only the data that the selected execution method produced and that you requested. Inspect the result before choosing an accessor:'
  ko: 실행에는 선택한 실행 방법이 생성했으며 사용자가 요청한 데이터만 들어 있습니다. 접근자를 고르기 전에 결과를 확인하세요.
  status: machine
- id: 488f301da9f1d419
  en: The [Result reference](../api/result.md) lists the available fields, their accessors, and which runs produce them.
  ko: '[Result 참조](../api/result.md)에 사용 가능한 필드, 접근자, 해당 데이터를 생성하는 실행이 나와 있습니다.'
  status: machine
- id: f4550463aa53c38e
  en: How are count strings ordered?
  ko: 카운트 문자열은 어떤 순서인가요?
  status: machine
- id: b7919bcf68888606
  en: Displayed count strings and tuple keys both put classical slot 0 first, on the left or at tuple position 0. When local dimensions differ, tuple keys avoid string-token parsing; native strings use commas if any classical dimension is at least 10.
  ko: 표시되는 카운트 문자열과 튜플 키 모두 고전 슬롯 0을 먼저 둡니다. 문자열에서는 맨 왼쪽, 튜플에서는 위치 0입니다. 국소 차원이 섞여 있으면 튜플 키를 사용해 문자열 토큰을 해석하는 수고를 줄일 수 있습니다. 고전 차원 중 하나라도 10 이상이면 기본 문자열은 쉼표로 구분합니다.
  status: machine
- id: d3cff453d8563cde
  en: Reduce the problem without losing the clue
  ko: 문제의 단서를 유지하며 예제 줄이기
  status: machine
- id: 2999b803a7af68ed
  en: 'If none of those matches, make a copy of the failing workflow and reduce it:'
  ko: 위 증상에 해당하지 않으면 실패하는 작업 흐름을 복사해 다음과 같이 줄여 보세요.
  status: machine
- id: fcab0e9ab2780f25
  en: keep one register and one operation;
  ko: 레지스터 하나와 연산 하나만 남깁니다.
  status: machine
- id: 1b865511cf0921f1
  en: run it with the general `Simulator`;
  ko: 범용 `Simulator`에서 실행합니다.
  status: machine
- id: ef9e4a68e8f9fb7d
  en: add the requested result field;
  ko: 필요한 결과 필드를 추가합니다.
  status: machine
- id: b5a9b2225f298a28
  en: switch to the intended profile or emulator; and
  ko: 원래 사용하려던 프로파일이나 에뮬레이터로 바꿉니다.
  status: machine
- id: f01c2ebce4dc4155
  en: restore operations one at a time.
  ko: 연산을 하나씩 복원합니다.
  status: machine
- id: d68a13ad257b7859
  en: The step where it changes tells you which boundary to inspect. Preserve the small reproducer—it is also the most useful starting point for a bug report.
  ko: 동작이 달라지는 단계가 어느 경계를 확인해야 하는지 알려 줍니다. 줄인 재현 예제는 보관하세요. 버그를 보고할 때도 가장 유용한 출발점입니다.
  status: machine
