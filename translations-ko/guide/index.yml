- id: 692fb192bcb3b4d0
  en: Choose the level of detail that answers your question. Direct simulation and physics workflows start from the same backend-independent [`Program`][fatqat.Program]. When mapping and routing are part of the question, author a [`LogicalProgram`][fatqat.LogicalProgram] for the [compiler](compiler.md).
  ko: 알고 싶은 내용에 답할 수 있는 수준의 모델을 선택하세요. 직접 시뮬레이션과 물리 계산은 모두 백엔드에 독립적인 [`Program`][fatqat.Program]에서 시작합니다. 매핑과 라우팅이 필요하다면 [컴파일러](compiler.md)에 전달할 [`LogicalProgram`][fatqat.LogicalProgram]을 작성하세요.
  status: machine
