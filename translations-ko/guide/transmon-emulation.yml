- id: 9ddf784fe4d478dc
  en: Program qubits bind to those subsystem IDs in declaration order unless a [`ResourceLayout`][fatqat.ResourceLayout] says otherwise. Every model transmon remains in the physical state even when the Program addresses only one of them.
  ko: 기본적으로 Program의 큐비트는 선언 순서대로 해당 부분계 ID에 연결됩니다. [`ResourceLayout`][fatqat.ResourceLayout]으로 이 매핑을 바꿀 수 있습니다. Program이 transmon 하나만 사용하더라도 물리 상태에는 모델의 모든 transmon이 포함됩니다.
  status: machine
- id: 11ac253adfad36b4
  en: Retain `model_document` when you need persisted frequencies, anharmonicities, model identity, or coupling topology. The runtime model provides the execution capabilities; use the document to look up the stored model data.
  ko: 저장된 주파수, 비조화도, 모델 식별 정보, 결합 구조를 확인하려면 `model_document`를 보관하세요. 런타임 모델은 계산 실행에 사용하고, 저장된 모델 데이터는 이 문서에서 확인합니다.
  status: machine
- id: e4578d45bd6941b4
  en: This guide chooses the density-matrix method because it repeatedly inspects populations. The common default is `method="statevector"`; use `method="unitary"` when the complete coherent operator is the result you need.
  ko: 이 예제에서는 각 준위의 점유 확률을 여러 번 살펴보므로 밀도 행렬 방법을 사용합니다. 일반적인 기본값은 `method="statevector"`입니다. 전체 결맞음 연산자가 필요하면 `method="unitary"`를 선택하세요.
  status: retired
- id: d8cecfc462563111
  en: A transmon uses its two lowest levels as the qubit states $\lvert 0\rangle$ and $\lvert 1\rangle$. A pulse can also move some population into the next level, $\lvert 2\rangle$. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] keeps all three levels so you can see this leakage. Here we use the same transmon to compare a reference gate pulse and a waveform you specify directly. Both follow the workflow in [Write and run pulse programs](hamiltonian-emulation.md).
  ko: Transmon은 가장 낮은 두 준위 $\lvert 0\rangle$과 $\lvert 1\rangle$을 큐비트 상태로 사용합니다. 펄스가 점유 확률의 일부를 세 번째 준위 $\lvert 2\rangle$로 옮길 수도 있습니다. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator]는 세 준위를 모두 포함하므로 이러한 누설을 확인할 수 있습니다. 이 장에서는 [펄스 프로그램 작성과 실행](hamiltonian-emulation.md)의 절차를 따라 같은 Transmon에서 기준 게이트 펄스와 직접 지정한 파형을 비교합니다.
  status: retired
- id: 639b8cd29776463d
  en: Load a single-transmon model
  ko: 단일 Transmon 모델 불러오기
  status: machine
- id: f0be9e1022d36511
  en: Load the built-in `transmon.single` model. It gives both examples the same transmon, `q0`, and the same physical parameters.
  ko: 내장 모델 `transmon.single`을 불러옵니다. 두 예제는 같은 Transmon `q0`과 같은 물리 매개변수를 사용합니다.
  status: machine
- id: bce0c2a1de21a3c9
  en: Use `method="density_matrix"` to read each level's population from the diagonal of the returned matrix. The default is `method="statevector"`. Use `method="unitary"` when you want the coherent evolution operator.
  ko: '`method="density_matrix"`를 사용하면 반환된 행렬의 대각 원소에서 각 준위의 점유 확률을 읽을 수 있습니다. 기본값은 `method="statevector"`입니다. 결맞은 시간 진화 연산자가 필요하면 `method="unitary"`를 사용합니다.'
  status: retired
- id: 537695a5f5eeebbf
  en: Add an `RX` gate with angle $\pi/2$ to the Program. The emulator looks up the reference pulse for that rotation and applies it to the transmon.
  ko: Program에 회전 각도가 $\pi/2$인 `RX` 게이트를 추가합니다. 에뮬레이터는 이 회전에 해당하는 기준 펄스를 찾아 Transmon에 적용합니다.
  status: machine
- id: f0c1b461a89daaa5
  en: After the rotation, $\lvert 0\rangle$ and $\lvert 1\rangle$ each have about half the population. `calibrated_populations[2]` is the fraction left in $\lvert 2\rangle$ at the end of the pulse, here less than 0.0001%.
  ko: 회전이 끝나면 $\lvert 0\rangle$과 $\lvert 1\rangle$의 점유 확률은 각각 약 절반입니다. `calibrated_populations[2]`는 펄스가 끝났을 때 $\lvert 2\rangle$에 남은 점유 확률로, 이 예제에서는 0.0001% 미만입니다.
  status: machine
- id: 9d2fa656510b1b0a
  en: Now drive the same transmon with a [`PulseOperation`][fatqat.operations.PulseOperation]. The example uses a 10 ns Hann pulse with an area of $\pi/2$, the target angle of the reference rotation.
  ko: 이번에는 [`PulseOperation`][fatqat.operations.PulseOperation]으로 같은 Transmon을 직접 구동합니다. 길이가 10 ns이고 면적이 기준 회전의 목표 각도와 같은 $\pi/2$인 Hann 펄스를 사용합니다.
  status: machine
- id: b973ec493fc06698
  en: The samples give the Rabi rate $\Omega(t)$ in rad/ns. Here they are real and drive the X component. An imaginary component would drive Y. The Hann envelope starts and ends at zero, and the emulator interpolates between the samples.
  ko: 샘플은 rad/ns 단위의 Rabi 주파수 $\Omega(t)$를 나타냅니다. 이 예제에서는 실수 성분으로 X 성분을 구동합니다. 허수 성분을 주면 Y 성분을 구동할 수 있습니다. Hann 포락선은 0에서 시작해 다시 0으로 돌아오며, 에뮬레이터는 샘플 사이를 보간합니다.
  status: machine
