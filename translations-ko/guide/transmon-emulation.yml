  en: 'Use a [`PulseOperation`][fatqat.operations.PulseOperation] when the waveform is part of the experiment. This example uses a Hann envelope with the same nominal \(\pi/2\) area as the calibrated rotation:'
  ko: 파형 자체가 실험의 일부라면 [`PulseOperation`][fatqat.operations.PulseOperation]을 사용하세요. 이 예제의 Hann 포락선은 보정된 회전과 같은 공칭 면적 \(\pi/2\)를 갖습니다.
  status: machine
- id: 14269bd6c1f41916
  en: The waveform samples are the full complex Rabi rate \(\Omega(t)\) in rad/ns. Real samples drive the X quadrature; imaginary samples drive the Y quadrature. The analytic Hann envelope has area \(\pi/2\), and the sampled spline closely approximates it. The 10 ns direct pulse is shorter and stronger than the reference recipe's 20 ns `RX` pulse, and it omits that recipe's DRAG corrections. Those differences account for the changed populations and the reported `|2>` leakage. Both pulses use fixed analytic values rather than numerical calibration.
  ko: 파형 샘플은 rad/ns 단위의 전체 복소 Rabi 주파수 \(\Omega(t)\)입니다. 실수 샘플은 X 직교 성분을, 허수 샘플은 Y 직교 성분을 구동합니다. 해석적 Hann 포락선의 면적은 \(\pi/2\)이며 샘플링된 스플라인은 이를 잘 근사합니다. 10 ns 직접 펄스는 기준 레시피의 20 ns `RX` 펄스보다 짧고 강하며, 기준 레시피의 DRAG 보정을 생략합니다. 이 차이 때문에 점유 확률과 보고되는 `|2>` 누설이 달라집니다. 두 펄스 모두 수치 보정 대신 고정된 해석적 값을 사용합니다.
  status: machine
- id: 0806d9b02284b8fc
  en: For a complete amplitude scan, parameter selection, and checks on other input states, follow [Calibrating a quantum gate](../tutorials/pulse-calibration.md).
  ko: 전체 진폭 스캔, 매개변수 선택, 다른 입력 상태의 검증은 [양자 게이트 보정하기](../tutorials/pulse-calibration.md)를 따라가 보세요.
  status: machine
