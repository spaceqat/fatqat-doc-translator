  ko: 재현 가능한 기준 모델 불러오기
  status: machine
- id: caacdbf1f285f7cf
  en: 'The packaged document describes one physical transmon. It is a simulation baseline, not a live calibration from a named device:'
  ko: 패키지에 포함된 문서는 물리 transmon 하나를 기술합니다. 특정 장치의 실시간 보정 데이터가 아니라 시뮬레이션용 기준 모델입니다.
  status: machine
- id: 31ddcca003cbd258
  en: Program qubits bind to those subsystem IDs in declaration order unless a [`ResourceLayout`][fatqat.ResourceLayout] says otherwise. Every model transmon remains in the physical state even when the Program addresses only one of them. Retain `model_document` when you need persisted frequencies, anharmonicities, model identity, or coupling topology; the runtime model intentionally exposes execution capabilities rather than normalized copies of those records. This guide chooses the density-matrix method because it repeatedly inspects populations. The common default is `method="statevector"`; use `method="unitary"` when the complete coherent operator is the result you need.
  ko: '[`ResourceLayout`][fatqat.ResourceLayout]으로 달리 지정하지 않으면 Program의 큐비트는 선언 순서대로 해당 부분계 ID에 연결됩니다. Program이 하나만 지정해도 모델의 모든 transmon은 물리 상태에 남아 있습니다. 저장된 주파수, 비조화도, 모델 식별 정보, 결합 구조가 필요하면 `model_document`를 보관하세요. 런타임 모델은 이러한 기록의 정규화된 사본 대신 실행 기능을 제공하도록 설계되었습니다. 이 가이드에서는 점유 확률을 반복해서 살펴보므로 밀도 행렬 방법을 선택합니다. 공통 기본값은 `method="statevector"`이며, 전체 결맞음 연산자가 필요하면 `method="unitary"`를 사용하세요.'
  status: machine
