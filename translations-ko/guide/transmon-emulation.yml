- id: 4091635eea3bb2c2
  en: This helper is a convenient way to get a simulation running. It places the two frequency groups in a checkerboard pattern, adds the requested frequency spread, and supplies fixed analytic gate recipes. It does not numerically calibrate the pulses or calculate their fidelity or leakage.
  ko: 이 도우미 함수로 시뮬레이션을 간편하게 시작할 수 있습니다. 두 주파수 그룹을 체커보드 형태로 배치하고, 요청한 주파수 분산을 추가하며, 고정된 해석적 게이트 레시피를 제공합니다. 펄스를 수치적으로 보정하거나 충실도와 누설을 계산하지는 않습니다.
  status: machine
- id: 4b1aa94f9a7c3279
  en: For each edge, the helper chooses the transmon with the higher idle frequency as the detuned endpoint for CZ. This gives the generated grid a consistent default; it is not a recommendation for a particular device.
  ko: 각 간선에서 도우미 함수는 유휴 주파수가 더 높은 transmon을 CZ의 디튜닝 대상으로 선택합니다. 생성된 격자에 일관된 기본값을 제공하기 위한 규칙이며, 특정 장치에 대한 권장 설정은 아닙니다.
  status: machine
- id: 646f0d529ba65309
  en: 'The returned documents are ordinary dictionaries. You can edit them directly or save them as JSON and load them again later:'
  ko: 반환되는 문서는 일반 딕셔너리입니다. 직접 편집하거나 JSON으로 저장해 나중에 다시 불러올 수 있습니다.
  status: machine
- id: dbd6a038d380aafd
  en: For `N` transmons, the physical qutrit Hilbert-space dimension is `3**N`.
  ko: transmon이 `N`개이면 물리 큐트릿 힐베르트 공간의 차원은 `3**N`입니다.
