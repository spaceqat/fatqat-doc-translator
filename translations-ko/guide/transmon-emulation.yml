- id: 28a78512ce1b2ef3
  en: Here \(a_i\) is the three-level lowering operator. The signed anharmonicity \(\alpha_i\) is the only coherent drift. Drive, detuning, and exchange appear only while their controls are active. In particular, there is no static exchange. Exchange is allowed only on a declared model edge; generated rectangular grids connect horizontal and vertical nearest neighbours.
  ko: 여기서 \(a_i\)는 3준위 하강 연산자입니다. 부호를 포함한 비조화도 \(\alpha_i\)가 유일한 결맞음 드리프트입니다. 구동, 디튜닝, 교환은 해당 제어가 활성화된 동안에만 나타납니다. 특히 정적 교환은 없습니다. 교환은 모델에 선언한 간선에서만 허용됩니다. 생성된 직사각형 격자는 가로와 세로의 최근접 이웃을 연결합니다.
  status: machine
