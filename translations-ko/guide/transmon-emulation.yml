- id: 8cd5efbcb013a781
  en: The nominal resonant branch closes one cycle, and a frame update removes the local phase accumulated from detuning. The defaults are 60 ns total with 3 ns ramps.
  ko: 공칭 공명 분기는 한 주기를 완성하며, 프레임 갱신으로 디튜닝에서 누적된 국소 위상을 제거합니다. 기본값은 전체 60 ns, 램프 각각 3 ns입니다.
  status: machine
- id: 5c93889272a855e5
  en: Because exchange is zero during the ramps, this recipe does not model Landau–Zener leakage from crossing an avoided crossing with finite coupling. It also omits a tunable coupler, residual exchange, waveform distortion, and non-RWA terms. Final leakage can therefore be tiny even when the transient \(\lvert20\rangle\) population is large. Changing the duration preserves the nominal exchange area; it does not recalibrate phases or fidelity.
  ko: 램프 중에는 교환이 0이므로, 이 레시피는 유한한 결합을 가진 회피 교차점을 통과할 때의 Landau–Zener 누설을 모델링하지 않습니다. 가변 결합기, 잔여 교환, 파형 왜곡, 비-RWA 항도 생략합니다. 따라서 중간에 \(\lvert20\rangle\)의 점유 확률이 크더라도 최종 누설은 매우 작을 수 있습니다. 지속 시간을 바꾸면 공칭 교환 면적은 유지되지만, 위상이나 충실도를 다시 보정하지는 않습니다.
  status: machine
