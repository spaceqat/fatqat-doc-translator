  en: \[ g_{ij}(t) = -\frac{\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T, \]
  ko: \[ g_{ij}(t) = -\frac{\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T, \]
