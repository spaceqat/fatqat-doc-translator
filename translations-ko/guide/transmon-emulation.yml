  ko: "![코사인 퍼텐셜 우물의 세 준위입니다. 두 화살표는 준위 0과 1 사이의 에너지 차이가 준위 1과 2 사이의 차이보다 크다는 것을 보여 줍니다.](../assets/generated/guide/transmon-cosine-well.svg)"
