  en: \[ g_{ij}(t) = \frac{\sqrt{2}\pi}{T_p} \sin^2\!\left(\frac{\pi(t-t_r)}{T_p}\right), \qquad t_r\leq t\leq T-t_r. \]
  ko: \[ g_{ij}(t) = \frac{\sqrt{2}\pi}{T_p} \sin^2\!\left(\frac{\pi(t-t_r)}{T_p}\right), \qquad t_r\leq t\leq T-t_r. \]
