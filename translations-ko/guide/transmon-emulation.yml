- id: 479cb32d1aed7014
  en: '**Frames and timing:** calibrated frame changes and the placement of later controls can change phases even when computational populations look alike. Returned states include terminal virtual-frame changes.'
  ko: '**프레임과 타이밍:** 계산 준위의 점유 확률이 비슷해 보여도, 보정된 프레임 변화와 뒤따르는 제어의 배치에 따라 위상이 달라질 수 있습니다. 반환되는 상태에는 마지막 가상 프레임 변화도 포함됩니다.'
  status: machine
