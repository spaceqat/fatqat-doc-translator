  status: machine
- id: 5aea9472c7ddc2a3
  en: Compare the final populations
  ko: 펄스가 끝났을 때의 점유 확률 비교하기
  status: machine
- id: 4ac69a26cecbf864
  en: The direct pulse leaves about 50.9% of the population in $\lvert 0\rangle$, 49.1% in $\lvert 1\rangle$, and 0.07% in $\lvert 2\rangle$. The reference pulse also divides the population nearly evenly between the qubit states, with less than 0.0001% left in $\lvert 2\rangle$. The 10 ns Hann pulse and the 20 ns reference `RX` pulse differ in shape, duration, and DRAG correction. The plot compares the final populations for these two recipes.
  ko: 직접 구동이 끝나면 $\lvert 0\rangle$에 약 50.9%, $\lvert 1\rangle$에 49.1%, $\lvert 2\rangle$에 0.07%가 남습니다. 기준 펄스에서도 두 큐비트 상태의 점유 확률은 거의 절반씩이고, $\lvert 2\rangle$에 남는 비율은 0.0001% 미만입니다. 10 ns Hann 펄스와 20 ns 기준 `RX` 펄스는 모양, 길이, DRAG 보정이 서로 다릅니다. 아래 그림은 두 펄스를 적용한 뒤의 점유 확률을 비교합니다.
  status: machine
