- id: f63090db2ae28017
  en: A transmon is a common type of superconducting qubit made from a circuit with a Josephson junction shunted by a capacitor. Microwave pulses control the qubit, and a single-qubit gate can take only a few tens of nanoseconds.
  ko: Transmon은 널리 쓰이는 초전도 큐비트입니다. 조셉슨 접합에 커패시터를 병렬로 연결한 회로로 만들고, 마이크로파 펄스로 제어합니다. 단일 큐비트 게이트는 수십 나노초 안에 실행할 수 있습니다.
  status: machine
- id: 7c5ccf6fff887e62
  en: Small variations in fabrication mean that even transmons made to the same design can have different transition frequencies. To produce the intended rotation on each qubit, measure its transition frequency and tune the pulse amplitude and phase. On a chip with many qubits, calibration also involves checking how a pulse affects neighbouring qubits.
  ko: 같은 설계로 제작한 Transmon도 공정에서 생기는 작은 차이 때문에 전이 주파수가 다를 수 있습니다. 각 큐비트에서 원하는 회전을 구현하려면 전이 주파수를 측정하고 구동 펄스의 진폭과 위상을 조정합니다. 칩에 여러 큐비트가 있으면 펄스가 이웃 큐비트에 미치는 영향도 확인해야 합니다.
  status: machine
- id: d790e719364a8c20
  en: Rotate a qubit with a calibrated pulse
  ko: 보정 펄스로 큐비트 회전시키기
  status: machine
- id: 6505a0d566ec77fc
  en: The returned density matrix covers all three levels of the transmon. Read its diagonal to get the probabilities of measuring each level.
  ko: 반환된 밀도 행렬은 Transmon의 세 준위를 모두 포함합니다. 이 행렬의 대각 원소를 읽으면 각 준위가 측정될 확률을 얻을 수 있습니다.
  status: machine
- id: 66f5dd15f93a1e79
  en: A transmon is a nonlinear oscillator with multiple energy levels. Its two lowest levels, $\lvert 0\rangle$ and $\lvert 1\rangle$, encode the qubit. A control pulse can also excite higher levels such as $\lvert 2\rangle$. This is leakage out of the qubit's computational space, a source of gate error that quantum engineers need to control.
  ko: Transmon은 여러 에너지 준위를 가진 비선형 진동자입니다. 보통 가장 낮은 두 준위 $\lvert 0\rangle$과 $\lvert 1\rangle$을 사용해 큐비트를 인코딩합니다. 제어 펄스를 적용하면 양자 상태의 일부가 $\lvert 2\rangle$ 같은 더 높은 준위로 이동할 수 있습니다. 이렇게 큐비트의 계산 공간을 벗어나는 현상을 누설이라고 하며, 양자 컴퓨팅에서 줄여야 할 게이트 오류 중 하나입니다.
  status: machine
- id: 49f198337d7abae0
  en: Pulse emulation lets us study how a choice of pulse affects leakage. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] models the lowest three levels. Following [Write and run pulse programs](hamiltonian-emulation.md), we use it to compare a reference gate pulse with a waveform you specify directly on the same transmon.
  ko: 펄스 에뮬레이션을 이용하면 펄스 선택에 따라 누설이 얼마나 달라지는지 살펴볼 수 있습니다. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator]는 가장 낮은 세 준위를 모델링합니다. 이 장에서는 [펄스 프로그램 작성과 실행](hamiltonian-emulation.md)의 절차를 따라 같은 Transmon에서 기준 게이트 펄스와 직접 지정한 파형을 비교합니다.
  status: machine
- id: ba42dcf99df17c06
  en: '![One well of the cosine potential with three unevenly spaced levels. The qubit uses levels 0 and 1, and leakage can reach level 2.](../assets/generated/guide/transmon-cosine-well.svg)'
  ko: '![코사인 퍼텐셜 우물 하나에 간격이 다른 세 준위가 있습니다. 가장 낮은 두 준위는 큐비트를 인코딩하는 데 사용하고, 세 번째 준위에서는 누설을 확인할 수 있습니다.](../assets/generated/guide/transmon-cosine-well.svg)'
