- id: 894ab8135aee7ce1
  en: so \(\int_0^T g_{ij}(t)\,dt=-\pi/2\). A frame swap after the pulse gives the public \(+i\) convention. The full qutrit exchange operator also couples \(\lvert11\rangle\) to \(\lvert20\rangle\) and \(\lvert02\rangle\), so conditional-phase error and residual leakage remain possible.
  ko: 이므로 \(\int_0^T g_{ij}(t)\,dt=-\pi/2\)입니다. 펄스 뒤의 프레임 스왑으로 공개 인터페이스의 \(+i\) 규약을 맞춥니다. 전체 큐트릿 교환 연산자는 \(\lvert11\rangle\)을 \(\lvert20\rangle\), \(\lvert02\rangle\)에도 결합하므로 조건부 위상 오류와 잔여 누설이 생길 수 있습니다.
  status: machine
- id: 3c122733cf30d92f
  en: For CZ, label the selected endpoint \(i\). In a basis that lists it first, the chosen branch is \(\lvert11\rangle\leftrightarrow\lvert20\rangle\). The recipe parks that endpoint with \(\delta_i(t)=-\alpha_i s(t)\). For total duration \(T\) and ramp time \(t_r\),
  ko: CZ에서는 선택한 끝점을 \(i\)라고 하겠습니다. 이 끝점을 먼저 나열하는 기저에서 선택되는 분기는 \(\lvert11\rangle\leftrightarrow\lvert20\rangle\)입니다. 레시피는 \(\delta_i(t)=-\alpha_i s(t)\)로 그 끝점의 주파수를 이동해 유지합니다. 전체 지속 시간이 \(T\), 램프 시간이 \(t_r\)이면
  status: machine
- id: eec95197fc69a9cf
  en: \[ s(t)= \begin{cases} \frac{1-\cos(\pi t/t_r)}{2}, & 0\leq t<t_r,\\ 1, & t_r\leq t\leq T-t_r,\\ \frac{1-\cos(\pi(T-t)/t_r)}{2}, & T-t_r<t\leq T. \end{cases} \]
  ko: \[ s(t)= \begin{cases} \frac{1-\cos(\pi t/t_r)}{2}, & 0\leq t<t_r,\\ 1, & t_r\leq t\leq T-t_r,\\ \frac{1-\cos(\pi(T-t)/t_r)}{2}, & T-t_r<t\leq T. \end{cases} \]
  status: machine
