- id: 0cf685d87d0dfd95
  en: A circuit can produce the expected result and still be unsuitable for a device. The device may support only some gates, or require two qubits to occupy connected positions.
  ko: 회로가 올바른 결과를 내더라도 특정 장치에서 그대로 실행할 수 있는 것은 아닙니다. 장치는 일부 게이트만 지원하거나 두 큐비트가 서로 연결된 위치에 있어야 한다는 조건을 둘 수 있습니다.
  status: machine
- id: d77248d9d74cbbce
  en: This section covers superconducting devices, neutral atoms, and linear optics. Linear optics represents photons in optical modes and can use a specialized fixed-photon-number representation to reduce the computation. Use Hamiltonian emulation when you need to study how pulse shape and duration affect the quantum state.
  ko: 이 절에서는 초전도, 중성 원자, 선형 광학을 각각 다룹니다. 선형 광학은 광학 모드로 광자를 표현하며, 고정 광자 수에 맞춘 전용 표현으로 계산량을 줄일 수 있습니다. 펄스의 모양과 지속 시간이 양자 상태에 미치는 영향을 연구하려면 해밀토니안 에뮬레이션을 사용하세요.
  status: machine
