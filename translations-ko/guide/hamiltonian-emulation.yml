  ko: 펄스 객체, 스케줄, 시뮬레이션 방법과 모델의 세부 규칙은 [펄스 제어 API](../api/pulse-control/index.md)와 [에뮬레이터 API](../api/emulators/index.md)를 참고하세요.
  status: machine
- id: 82c98d2f5e047bb8
  en: The model supplies the physical levels, units, drift, channels, and coupling. A gate implementation map turns an ordinary gate into calibrated controls. A direct pulse supplies those controls explicitly.
  ko: 모델은 물리 준위, 단위, 드리프트, 제어 채널, 결합을 정의합니다. 일반 게이트를 사용하면 게이트 구현 맵이 이를 보정된 제어 신호로 바꿉니다. 직접 펄스를 작성할 때는 이 신호를 직접 지정합니다.
  status: retired
- id: 10024a47766e901a
  en: Quantum computation is ultimately implemented in physical systems. A gate in a circuit may correspond to a control pulse on a device, during which the system also evolves under its own dynamics and interactions. To understand what happens during that pulse, we can describe the system with a physical model and calculate its Hamiltonian evolution over time.
  ko: 양자 계산은 결국 물리 시스템에서 구현됩니다. 회로의 게이트 하나는 장치에 가하는 제어 펄스에 해당할 수 있으며, 펄스가 지속되는 동안 시스템 자체의 동역학과 상호작용도 상태에 영향을 줍니다. 이 시간 동안 일어나는 일을 이해하려면 물리 모델로 시스템을 표현하고 시간에 따른 해밀토니안 진화를 계산할 수 있습니다.
  status: retired
- id: 6cbc1d34692469bf
  en: Quantum computation is ultimately implemented in physical systems. A gate in a circuit may correspond to a control pulse on a device, during which the system also evolves under its own dynamics and interactions. To understand what happens during that pulse, we need to model the physical system and calculate how it evolves under its Hamiltonian.
  ko: 양자 계산은 결국 물리계에서 구현됩니다. 회로의 한 게이트는 장치에서 제어 펄스 하나에 대응할 수 있습니다. 펄스가 적용되는 동안 계의 자체 동역학과 상호작용도 양자 상태에 영향을 줍니다. 이때 어떤 일이 일어나는지 이해하려면 물리계를 모델링하고 해밀토니안에 따른 시간 변화를 계산해야 합니다.
  status: machine
- id: 6514a3155108cb2d
  en: Whether controls come from a gate calibration or a pulse you write directly, the emulator schedules when to apply them and uses that timing to calculate the system's evolution.
  ko: 게이트 보정에서 얻은 제어 신호든 직접 작성한 펄스든, 에뮬레이터는 각 신호를 언제 적용할지 정하고 그 시간표에 따라 계의 변화를 계산합니다.
  status: machine
- id: dc921778a08a0c1e
  en: '![Calibrated gates and direct pulses both supply controls to the physical schedule. The schedule determines when the controls act during Hamiltonian or Lindblad evolution.](../assets/images/pulse-schedule.svg)'
  ko: '![보정된 게이트와 직접 작성한 펄스의 제어 신호가 모두 물리적 스케줄에 들어갑니다. 스케줄은 해밀토니안 또는 Lindblad 진화 중 각 신호를 언제 적용할지 정합니다.](../assets/images/pulse-schedule.svg)'
  status: machine
- id: 61525e7e5dd36beb
  en: A FatQat emulator takes a [`Program`][fatqat.Program] and follows the state while the controls are applied. You can use it to see how pulse duration and coupling affect the result, or how much population leaks into higher levels. It can also include noise that acts continuously during the evolution.
  ko: FatQat 에뮬레이터는 [`Program`][fatqat.Program]을 받아 제어 신호를 적용하는 동안 상태를 추적합니다. 펄스 길이와 결합이 결과에 어떤 영향을 주는지, 더 높은 준위로 얼마나 누설되는지 살펴볼 수 있습니다. 진화 중 계속 작용하는 잡음도 포함할 수 있습니다.
  status: machine
- id: a862bd73c328c473
  en: In digital quantum computation, you describe the computation with gates. At the pulse level, a gate calibration tells the emulator which control signals realize each gate. In analog quantum computation, you work with the system's evolution directly and can specify control pulses to shape its Hamiltonian over time.
  ko: 디지털 양자 계산에서는 일련의 게이트로 계산을 표현합니다. 펄스 수준에서는 에뮬레이터가 게이트 보정 데이터를 바탕으로 각 게이트를 구현할 제어 신호를 정합니다. 아날로그 양자 계산에서는 계의 진화를 직접 이용하며, 제어 펄스를 지정해 해밀토니안의 시간 변화를 조절할 수 있습니다.
  status: machine
- id: 58d1cc8ee5adc05e
  en: Realize a gate with calibrated pulses
  ko: 보정 펄스로 양자 게이트 구현하기
  status: machine
- id: 097e78760378fe3d
  en: Start with a one-qubit Program that applies a single `RX` gate. We run it with a built-in model of two three-level transmons. The model defines the physical levels, units, drift, control channels, and coupling.
  ko: 먼저 큐비트 하나에 `RX` 게이트를 한 번 적용하는 Program을 작성합니다. 여기서는 3준위 Transmon 두 개가 들어 있는 내장 모델로 실행합니다. 모델은 계의 물리적 준위, 단위, 드리프트, 제어 채널과 결합을 정의합니다.
  status: machine
- id: 7025ef57907ef691
  en: When the emulator runs `RX`, its gate implementation map supplies a calibrated pulse on the drive channel for the addressed transmon. The returned state is a QuTiP ket `Qobj` with $3^2$ amplitudes because it describes both three-level transmons in the model. Including the third level lets you see population leak out of the qubit states `|0>` and `|1>`.
  ko: 에뮬레이터가 `RX`를 실행할 때 게이트 구현 맵은 대상 Transmon의 구동 채널에 적용할 보정 펄스를 제공합니다. 반환되는 상태는 QuTiP의 켓 `Qobj`이며, 모델에 있는 두 3준위 Transmon을 함께 표현하므로 진폭이 $3^2$개입니다. 세 번째 준위까지 포함하면 큐비트 상태 `|0>`과 `|1>` 밖으로 얼마나 누설되는지 확인할 수 있습니다.
  status: machine
- id: 9563dc68fe860d38
  en: To model a different system or use a different calibration, supply its model document and gate implementation map.
  ko: 다른 계를 모델링하거나 다른 보정 데이터를 사용하려면 그에 맞는 모델 문서와 게이트 구현 맵을 제공하면 됩니다.
  status: machine
- id: 62a4767304ff8fc7
  en: Specify a control pulse directly
  ko: 제어 펄스 직접 지정하기
  status: machine
- id: 24bb2019ee05b43e
  en: Use the same model to see how a waveform of your choice drives a transmon. A [`SampledWaveform`][fatqat.emulator.SampledWaveform] sets the signal at three times. A [`PulseControl`][fatqat.emulator.PulseControl] sends it to a physical drive channel, and a [`PulseOperation`][fatqat.operations.PulseOperation] sets the duration of the control block.
  ko: 같은 모델에서 원하는 파형으로 Transmon을 구동해 봅니다. [`SampledWaveform`][fatqat.emulator.SampledWaveform]으로 세 시점의 신호값을 지정하고, [`PulseControl`][fatqat.emulator.PulseControl]로 파형을 물리적 구동 채널에 연결합니다. [`PulseOperation`][fatqat.operations.PulseOperation]으로 제어 블록의 길이를 정합니다.
  status: machine
- id: 12026d136652fd8e
  en: In `direct_program.add(pulse)`, the drive channel already specifies physical transmon `q0`. A [`ResourceLayout`][fatqat.ResourceLayout] maps logical qubits to physical positions. The pulse uses the physical address and the time and signal units defined by the model and its channel.
  ko: '`direct_program.add(pulse)`를 호출할 때 구동 채널이 이미 물리 Transmon `q0`을 지정합니다. [`ResourceLayout`][fatqat.ResourceLayout]은 논리 큐비트를 물리 위치에 배치하는 데 쓰입니다. 여기서 펄스는 물리 주소를 직접 사용하며 시간과 신호의 단위는 모델과 채널에서 정합니다.'
  status: machine
- id: c7e5eb799cf75bd9
  en: How the state evolves during a pulse
  ko: 펄스가 적용되는 동안의 상태 변화
  status: machine
- id: bce5b406a15ebc39
  en: The samples in the example let the drive rise from zero to its peak halfway through the 20-unit pulse and fall back to zero at the end. The emulator interpolates between the samples to calculate the drive at intermediate times. Together with drift and coupling, the drive determines the Hamiltonian used to evolve the full physical state through the pulse.
  ko: 이 펄스는 20 시간 단위 동안 이어집니다. 구동 신호는 0에서 시작해 중간에 최대가 되고 끝에서 다시 0으로 돌아옵니다. 에뮬레이터는 표본 사이를 보간해 각 시점의 구동 신호를 계산합니다. 구동, 드리프트, 결합이 함께 해밀토니안을 결정하고, 에뮬레이터는 그에 따라 펄스 동안 전체 물리 상태가 어떻게 변하는지 계산합니다.
  status: retired
- id: 24f7bb57e339a3e7
  en: Schedule multiple pulses
  ko: 여러 펄스의 실행 시점 정하기
  status: machine
- id: 2a4077c9f4de041e
  en: A `PulseOperation` sets a time window for all its controls. Use `start_offset` to shift a waveform within that window. Pulse blocks that use the same physical resource run in Program order. Independent blocks can overlap. To place each block as early or as late as the schedule allows, choose `"ASAP"` or `"ALAP"` through `execution_config`.
  ko: 하나의 `PulseOperation`에 들어 있는 제어 신호는 같은 시간 구간을 공유합니다. `start_offset`으로 그 구간 안에서 파형의 시작 시점을 옮길 수 있습니다. 같은 물리 자원을 쓰는 펄스 블록은 Program에 적힌 순서대로 실행되며, 독립적인 블록은 겹칠 수 있습니다. `execution_config`에서 `"ASAP"` 또는 `"ALAP"`을 선택하면 스케줄이 허용하는 한 각 블록을 일찍 또는 늦게 배치할 수 있습니다.
  status: retired
- id: f9d011c56b20c016
  en: Choose `method` when creating the emulator to set the representation used for the simulation and the corresponding Result accessor. The options are `statevector` (the default), `density_matrix`, and `unitary`.
  ko: 에뮬레이터를 만들 때 `method`로 시뮬레이션에 쓸 표현을 정하고 Result에서 그에 맞는 결과를 읽습니다. `statevector`(기본값), `density_matrix`, `unitary` 중 하나를 선택할 수 있습니다.
  status: machine
- id: dcac8f1c5ddcc0ea
  en: In the example above, the drive is zero at time 0, reaches 0.02 at time 10, and returns to zero at time 20. The emulator interpolates between those three samples to get a continuous waveform. At each instant, the drive combines with drift and coupling to determine the Hamiltonian and how the quantum state changes.
  ko: 위 예제에서 구동 진폭은 시각 0에 0이고, 시각 10에 0.02까지 올라갔다가 시각 20에 다시 0이 됩니다. 에뮬레이터는 세 표본 사이를 보간해 연속적인 파형을 얻습니다. 각 시점의 구동, 드리프트, 결합이 해밀토니안을 정하며, 에뮬레이터는 이를 바탕으로 상태의 시간 변화를 계산합니다.
  status: machine
- id: 170bff526716f555
  en: The schedule determines when each pulse block starts. Two blocks that use the same drive channel run one after the other, in Program order. Blocks can overlap when their physical resources are independent. Use `execution_config` to choose `"ASAP"` or `"ALAP"` for the earliest or latest valid start times. Within one `PulseOperation`, use `start_offset` to delay an individual waveform relative to the start of that block.
  ko: 스케줄은 각 펄스 블록의 시작 시점을 정합니다. 두 블록이 같은 구동 채널을 사용하면 Program에 적힌 순서대로 실행합니다. 사용하는 물리 자원이 서로 독립적이면 블록이 시간상 겹칠 수 있습니다. `execution_config`에서 `"ASAP"` 또는 `"ALAP"`을 선택하면 허용되는 가장 이른 시점이나 가장 늦은 시점에 각 블록을 배치합니다. 한 `PulseOperation` 안에서는 `start_offset`으로 개별 파형을 블록 시작보다 늦게 시작할 수 있습니다.
  status: machine
