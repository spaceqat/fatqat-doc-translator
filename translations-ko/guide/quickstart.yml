- id: d80bcfb861ed4414
  en: For this Bell state, each shot returns either `00` or `11`, with equal probability. Finite sampling introduces random fluctuations, so the two counts are usually close. A fixed random seed makes the results reproducible. Use `Result.draw()` to plot the counts.
  ko: 이 벨 상태의 측정 결과는 `00` 또는 `11`이며, 각각의 확률은 절반입니다. 유한한 횟수로 샘플링하면 무작위 변동이 생기므로 두 결과의 횟수는 대체로 비슷합니다. 난수 시드를 고정하면 결과를 재현하기 쉽습니다. `Result.draw()`로 측정 횟수를 그래프로 확인할 수 있습니다.
  status: machine
