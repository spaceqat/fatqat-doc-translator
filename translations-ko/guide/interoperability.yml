- id: 30de0d9498c56017
  en: Bring Programs to and from OpenQASM and Qiskit
  ko: OpenQASM 및 Qiskit과 Program 주고받기
  status: machine
- id: e893ee2f823e7631
  en: Already have a circuit? FatQat can import OpenQASM 3, convert a Qiskit `QuantumCircuit` into a [`Program`][fatqat.Program], or appear inside Qiskit as a backend.
  ko: 이미 작성한 회로가 있나요? FatQat은 OpenQASM 3를 가져오거나, Qiskit `QuantumCircuit`을 [`Program`][fatqat.Program]으로 변환하거나, Qiskit 안에서 백엔드로 동작할 수 있습니다.
  status: machine
- id: 7cd29b853caa061c
  en: Pick an integration path
  ko: 연동 방식 선택하기
  status: machine
- id: acf7cc09cf0c9b93
  en: Use OpenQASM when the exchange artifact should be portable source text.
  ko: 이식 가능한 소스 텍스트로 주고받으려면 OpenQASM을 사용하세요.
  status: machine
- id: e4e42bb51352300b
  en: Convert a Qiskit circuit when FatQat should own execution and interpretation.
  ko: 실행과 결과 해석을 FatQat에서 처리하려면 Qiskit 회로를 변환하세요.
  status: machine
- id: ba49c497d0eda34f
  en: Use `FatqatBackend` when Qiskit should continue to own the surrounding job and result workflow.
  ko: 작업 제출과 결과 처리 등 주변 흐름을 Qiskit에서 유지하려면 `FatqatBackend`를 사용하세요.
  status: machine
- id: eb310ca6fc79842c
  en: Import, run, and export OpenQASM
  ko: OpenQASM 가져오기, 실행하기, 내보내기
  status: machine
- id: b617f665a7a567d5
  en: 'The OpenQASM translator is built into FatQat and does not require Qiskit. This OpenQASM 3 source describes the same measured Bell circuit used in the quickstart:'
  ko: OpenQASM 변환기는 FatQat에 내장되어 있어 Qiskit이 필요하지 않습니다. 다음 OpenQASM 3 소스는 빠른 시작에서 사용한, 측정을 포함한 Bell 회로와 같은 회로를 표현합니다.
  status: machine
- id: 8827540bb04fabea
  en: 'The imported value is an ordinary Program. Choose a backend, run it, and read the normal FatQat result:'
  ko: 가져온 값은 일반적인 Program입니다. 백엔드를 선택해 실행하고 평소처럼 FatQat 결과를 읽으면 됩니다.
  status: machine
- id: d9c1b1281fc4beb7
  en: 'Export a supported Program to OpenQASM 3 with `to_qasm`:'
  ko: 지원되는 Program은 `to_qasm`으로 OpenQASM 3로 내보낼 수 있습니다.
  status: machine
- id: 5af85d0e06c192ae
  en: An export is a normalized representation, not a promise to reproduce the original text byte for byte. Register names may be made safe or unique, whole register operations may be expanded, and Program metadata is not part of OpenQASM.
  ko: 내보낸 결과는 정규화된 표현이며, 원본 텍스트를 바이트 단위로 재현한다고 보장하지 않습니다. 레지스터 이름이 유효하고 서로 구분되도록 바뀔 수 있고, 레지스터 전체에 적용되는 연산이 개별 연산으로 확장될 수 있습니다. Program 메타데이터는 OpenQASM에 포함되지 않습니다.
  status: machine
- id: 536bb8972d8bc6a9
  en: OpenQASM exchange currently represents bound, dimension-two circuit Programs. Unsupported language constructs or Program features fail explicitly instead of being approximated. See the [OpenQASM API reference](../api/interoperability/openqasm.md) for supported statements, version-specific conditions, file input, and conversion errors.
  ko: 현재 OpenQASM으로 주고받을 수 있는 것은 매개변수 값이 바인딩된 2차원 회로 Program입니다. 지원되지 않는 언어 구문이나 Program 기능은 근사 처리하지 않고 명시적으로 오류를 발생시킵니다. 지원 문장, 버전별 조건, 파일 입력, 변환 오류는 [OpenQASM API 참조](../api/interoperability/openqasm.md)를 참고하세요.
  status: machine
- id: c51d92ac3cde07c1
  en: Convert a Qiskit circuit into a Program
  ko: Qiskit 회로를 Program으로 변환하기
  status: machine
- id: fbd421351fbe3ae8
  en: 'Qiskit integration is optional. Install Qiskit in the same environment as FatQat; Qiskit Aer is not required:'
  ko: Qiskit 연동은 선택 사항입니다. FatQat과 같은 환경에 Qiskit을 설치하세요. Qiskit Aer는 필요하지 않습니다.
  status: machine
- id: 80a6608d4decb790
  en: 'Use [`circuit_to_program`][fatqat.qiskit.circuit_to_program] when you want to cross the boundary into FatQat and then use its backends and result model:'
  ko: FatQat으로 회로를 옮긴 뒤 FatQat 백엔드와 결과 모델을 사용하려면 [`circuit_to_program`][fatqat.qiskit.circuit_to_program]을 사용하세요.
  status: machine
- id: 3537a8d8a33cf0ca
  en: From `program` onward this is the same workflow as a Program authored directly in Python. In particular, you can choose a FatQat execution model and work with FatQat's `Result` accessors.
  ko: '`program`을 얻은 뒤의 과정은 Python에서 직접 작성한 Program과 같습니다. FatQat 실행 모델을 선택하고 FatQat의 `Result` 접근자를 사용할 수 있습니다.'
  status: machine
- id: 58fbcdab13d00091
  en: Use FatQat as a Qiskit backend
  ko: FatQat을 Qiskit 백엔드로 사용하기
  status: machine
- id: 1f7ee955c7aff144
  en: 'Use [`FatqatBackend`][fatqat.qiskit.FatqatBackend] instead when the surrounding application should remain a Qiskit workflow. Transpile to the backend''s target before submitting the circuit:'
  ko: 주변 애플리케이션의 흐름을 Qiskit으로 유지하려면 [`FatqatBackend`][fatqat.qiskit.FatqatBackend]를 사용하세요. 회로를 제출하기 전에 백엔드의 타깃에 맞게 트랜스파일합니다.
  status: machine
- id: d0114d9ebe5661cc
  en: This path returns Qiskit's job and result types, with Qiskit-formatted counts. Use direct conversion when you need FatQat state, map, or observable results; the Qiskit backend adapter is intentionally counts-oriented.
  ko: 이 경로는 Qiskit 형식의 카운트를 담은 Qiskit 작업 및 결과 타입을 반환합니다. FatQat의 상태, 맵, 관측량 결과가 필요하면 직접 변환하세요. Qiskit 백엔드 어댑터는 카운트 제공에 초점을 맞추어 설계되었습니다.
  status: machine
- id: 8cadd2f035b93b2f
  en: FATQAT full-register arrays and dense labels put subsystem 0 first, as the most-significant factor. Qiskit raw arrays and displayed Pauli labels use its own convention. Convert explicitly when comparing them; circuit operand order itself is unchanged.
  ko: FATQAT의 전체 레지스터 배열과 조밀 표현 레이블은 부분계 0을 맨 앞의 최상위 인자로 둡니다. Qiskit의 원시 배열과 표시되는 Pauli 레이블은 자체 규약을 따릅니다. 비교할 때는 명시적으로 변환하세요. 회로의 피연산자 순서 자체는 바뀌지 않습니다.
  status: machine
- id: 5e4d434920c04c46
  en: '!!! note'
  ko: '!!! note'
  status: machine
- id: 5ce922ba1fe8d980
  en: The adapter accepts bound, static circuits in its advertised target basis. Transpilation handles other supported Qiskit gate forms; unsupported dynamic control flow is rejected. A `FatqatBackend` accepts a FatQat `NoiseModel`, not a Qiskit Aer noise model.
  ko: 어댑터는 자신이 명시한 타깃 기저에 속하고 매개변수 값이 바인딩된 정적 회로를 받습니다. 그 밖의 지원되는 Qiskit 게이트 형태는 트랜스파일로 처리하며, 지원되지 않는 동적 제어 흐름은 거부합니다. `FatqatBackend`는 Qiskit Aer 잡음 모델이 아닌 FatQat `NoiseModel`을 받습니다.
  status: machine
- id: f6ebd256cb21be8b
  en: The [Qiskit API reference](../api/interoperability/qiskit.md) documents the exact target, conversion behavior, run options, batches, memory output, and error types.
  ko: '[Qiskit API 참조](../api/interoperability/qiskit.md)에는 정확한 타깃, 변환 동작, 실행 옵션, 배치, 메모리 출력, 오류 타입이 설명되어 있습니다.'
  status: machine
- id: 862e68a9788f96a1
  en: When an input cannot be represented by the supported Program subset, the converter reports an error rather than guessing at its meaning.
  ko: 지원되는 Program 부분집합으로 입력을 표현할 수 없으면, 변환기는 의미를 추측하지 않고 오류를 보고합니다.
  status: machine
