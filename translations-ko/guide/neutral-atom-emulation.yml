- id: c8704e3385c3255f
  en: Add detuning to the drive
  ko: "구동에 디튜닝 추가하기"
  status: machine
- id: 1720c7d646c15032
  en: Detuning sets how far the drive frequency is from the atomic transition. Use a second control alongside the drive to vary it during the pulse. Both channels act on every atom and use rad/µs.
  ko: "디튜닝은 구동 주파수가 원자의 전이 주파수에서 얼마나 벗어나는지를 나타냅니다. 구동 신호에 제어 신호를 하나 더 추가하면 펄스가 적용되는 동안 디튜닝을 바꿀 수 있습니다. 두 채널은 모든 원자에 작용하며 단위는 rad/µs입니다."
  status: machine
- id: 54f4f942fe381071
  en: 'The emulator includes interactions between every pair of atoms by default. Use `execution_config={"interaction_cutoff": distance}` on a run to truncate the Hamiltonian by dropping pairs farther apart than that distance.'
  ko: "에뮬레이터는 기본적으로 모든 원자 쌍의 상호작용을 포함합니다. 해밀토니안을 절단하려면 실행할 때 `execution_config={\"interaction_cutoff\": distance}`를 설정해 그 거리보다 멀리 떨어진 쌍의 상호작용 항을 제외합니다."
  status: machine
- id: dae0075b5254578e
  en: For units, channel limits, noise, and measurement support, see the [neutral-atom emulator API](../api/atom-emulators.md).
  ko: "단위, 채널 제한, 잡음 및 측정에 관한 내용은 [중성 원자 에뮬레이터 API](../api/atom-emulators.md)를 참고하세요."
  status: machine
