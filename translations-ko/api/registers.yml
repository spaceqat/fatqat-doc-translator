- id: 59e5c30d3b63d81c
  en: Immutable, hashable target returned by quantum-register selection helpers. Its [`register`](#fatqat.RegisterView.register) attribute identifies the selected quantum register. Obtain views from register helpers; direct construction is unsupported.
  ko: 양자 레지스터 선택 도우미가 반환하는 불변이며 해시 가능한 대상입니다. [`register`](#fatqat.RegisterView.register) 속성은 선택한 양자 레지스터를 가리킵니다. 뷰는 레지스터 도우미로 얻어야 하며 직접 생성은 지원하지 않습니다.
  status: machine
