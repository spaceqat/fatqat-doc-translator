- id: c7c8e3a9cc931706
  en: The APIs listed here are public, but their signatures and behavior may change between releases. Use them only when the stable backend workflow does not cover your integration.
  ko: 이 페이지의 API는 공개 API이지만 릴리스 사이에 시그니처나 동작이 바뀔 수 있습니다. 안정된 백엔드 흐름만으로 원하는 연동을 구현할 수 없을 때 사용하세요.
  status: machine
- id: 91343bb1092934bf
  en: The [compiler](compiler.md) is under development; its interfaces and supported behavior may change. Its [LogicalProgram](logical-program.md) frontend accepts built-in device-independent operations and is required by the Python compiler entry points.
  ko: '[컴파일러](compiler.md)는 개발 중이며 인터페이스와 지원 동작이 바뀔 수 있습니다. [LogicalProgram](logical-program.md) 프런트엔드는 내장된 장치 독립적 연산을 받으며, Python 컴파일러 진입점에서는 이 형식이 필요합니다.'
  status: machine
- id: 90bcd2b94fbdea07
  en: Direct construction
  ko: 직접 생성
  status: machine
- id: cb5e8095e2b4cc62
  en: Backends return [`Job`][fatqat.Job] and [`Result`][fatqat.Result]; applications normally should not construct either class. When writing a backend integration, create a successful job as `Job("DONE", result=value)` or a failed job as `Job("ERROR", error=exc)`, and translate the backend's output into a `Result`. See [Job](job.md) and [Result](result.md) for the interfaces.
  ko: 백엔드는 [`Job`][fatqat.Job]과 [`Result`][fatqat.Result]를 반환하므로 일반 애플리케이션에서는 두 클래스를 직접 생성할 필요가 없습니다. 백엔드 연동을 구현할 때는 성공한 Job을 `Job("DONE", result=value)`, 실패한 Job을 `Job("ERROR", error=exc)`로 만들고 백엔드 출력을 `Result`로 변환하세요. 인터페이스는 [Job](job.md)과 [Result](result.md)를 참고하세요.
  status: machine
