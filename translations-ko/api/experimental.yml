  en: '[Custom gate pulses](pulse-control/gate-realization.md) let you specify the physical controls that implement a gate. The [emulator pages](emulators/index.md) describe the built-in gate-to-pulse maps.'
  ko: 게이트를 구현하는 물리 제어 신호를 직접 지정하려면 [사용자 정의 게이트 펄스](pulse-control/gate-realization.md)를 사용하세요. 내장 게이트-펄스 맵은 [에뮬레이터 페이지](emulators/index.md)에 설명되어 있습니다.
  status: machine
