- id: 6e7322c5d9ab733f
  en: Use [LogicalProgram](logical-program.md) for device-independent gates written in Python. Use an OpenQASM entry point when starting from source text. The [compiler pipelines](compiler-pipelines.md) page lists the inputs for each target.
  ko: Python에서 장치 독립적인 게이트를 작성하려면 [LogicalProgram](logical-program.md)을 사용하세요. OpenQASM 소스에서 시작하는 경우 해당 컴파일 진입점을 사용합니다. 각 타깃의 입력은 [컴파일러 파이프라인](compiler-pipelines.md)을 참고하세요.
  status: retired
- id: 8e6d8257508adc4b
  en: Custom backends
  ko: 사용자 정의 백엔드
  status: machine
- id: d0b80bdd2c8f3eae
  en: If you implement a [`Backend`][fatqat.Backend], create a [`Result`][fatqat.Result] for the fields it produces and return it in a successful [`Job`][fatqat.Job]. Use `Job("DONE", result=value)` for success or `Job("ERROR", error=exc)` for a recorded failure.
  ko: '[`Backend`][fatqat.Backend]를 구현한다면 백엔드가 생성한 필드를 [`Result`][fatqat.Result]에 담아 성공한 [`Job`][fatqat.Job]으로 반환하세요. 성공에는 `Job("DONE", result=value)`를, 실패를 기록할 때는 `Job("ERROR", error=exc)`를 사용합니다.'
  status: retired
- id: 9b14d082b53b797a
  en: These APIs are available for use while their interfaces are under development. Their signatures and behavior may change between releases.
  ko: 여기에 나오는 API는 사용할 수 있지만 인터페이스는 아직 개발 중입니다. 릴리스에 따라 시그니처와 동작이 달라질 수 있습니다.
  status: machine
- id: 0f006c783a509b3e
  en: Start with [LogicalProgram](logical-program.md) if you write the logical gates in Python. If you already have OpenQASM source, choose the OpenQASM entry point for your target. [Compiler pipelines](compiler-pipelines.md) lists the inputs each entry point accepts.
  ko: Python으로 논리 게이트를 작성한다면 [LogicalProgram](logical-program.md)에서 시작하세요. 이미 OpenQASM 소스가 있다면 컴파일 대상에 맞는 OpenQASM 진입점을 고릅니다. 각 진입점이 받는 입력은 [컴파일러 파이프라인](compiler-pipelines.md)에 나와 있습니다.
  status: machine
- id: 5408a99eb6fbb9a0
  en: An implementation of [`Backend`][fatqat.Backend] puts its output fields in a [`Result`][fatqat.Result] and returns a [`Job`][fatqat.Job]. Use `Job("DONE", result=value)` to return the result. To store an execution failure for the caller, use `Job("ERROR", error=exc)`.
  ko: '[`Backend`][fatqat.Backend]를 구현할 때는 출력 필드를 [`Result`][fatqat.Result]에 담고 [`Job`][fatqat.Job]을 반환합니다. 결과를 반환할 때는 `Job("DONE", result=value)`를 사용하세요. 호출자가 처리할 실행 오류를 저장하려면 `Job("ERROR", error=exc)`를 사용합니다.'
  status: machine
