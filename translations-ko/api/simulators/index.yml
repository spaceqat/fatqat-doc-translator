- id: 5f3a5dd290f7a73f
  en: Choose a simulator according to what your program needs to represent. A general circuit can run directly, while a device-specific simulator adds rules such as which qubit sites can interact. Optical programs describe photons in modes. All four simulators use the same basic run and result interface.
  ko: 프로그램에서 무엇을 모델링할지에 따라 시뮬레이터를 선택합니다. 일반 회로는 그대로 실행할 수 있고, 장치별 시뮬레이터에서는 어떤 큐비트 위치가 상호작용할 수 있는지 등 장치 규칙을 추가로 적용합니다. 광학 프로그램은 모드에 있는 광자를 다룹니다. 네 시뮬레이터는 기본 실행 및 결과 인터페이스를 공유합니다.
  status: retired
