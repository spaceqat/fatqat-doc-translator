  ko: 먼저 [시뮬레이션과 에뮬레이션 방식 선택하기](../../guide/execution-models.md)에서 실행 방식을 고르거나, [하드웨어 제약으로 Program 검증하기](../../guide/superconducting-simulation.md)를 통해 장치 모델의 사용 과정을 살펴보세요.
