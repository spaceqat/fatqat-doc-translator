  en: '| `CZ` | 50 ns | Relaxation on each qubit, followed by joint depolarizing noise with `p = 0.001` |'
  ko: '| `CZ` | 50 ns | 각 큐비트의 이완 후 `p = 0.001`인 공동 탈분극 잡음 |'
  status: retired
- id: 15ec2ec4ac5a537c
  en: '| Measurement | — | `P(report 1 \| true 0) = 0.02` and `P(report 0 \| true 1) = 0.04` |'
  ko: '| 측정 | — | `P(report 1 \| true 0) = 0.02`, `P(report 0 \| true 1) = 0.04` |'
  status: retired
- id: 19e9419278ad6ba2
  en: See [Noise](../noise.md) for how the selected simulation method applies this model.
  ko: 선택한 시뮬레이션 방법이 이 모델을 적용하는 방식은 [잡음](../noise.md)을 참고하세요.
  status: retired
- id: ec27ee0287f983d3
  en: '[`Simulator.method`][fatqat.simulator.Simulator.method], [`SCQubitSimulator.implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map], [`Simulator.run`][fatqat.simulator.Simulator.run], [`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep], and [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] follow the general Simulator API and are included below for a complete class reference.'
  ko: '[`Simulator.method`][fatqat.simulator.Simulator.method], [`SCQubitSimulator.implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map], [`Simulator.run`][fatqat.simulator.Simulator.run], [`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep], [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model]은 일반 Simulator API를 따릅니다. 전체 클래스 참조를 위해 아래에도 포함했습니다.'
  status: retired
- id: 1c306dc2e5588b2a
  en: '[`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator] runs gate-level programs on a configurable superconducting qubit layout. Use it to check whether a program fits the available qubit sites, uses native gates, and applies `CZ` only between connected sites.'
  ko: '[`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator]는 설정 가능한 초전도 큐비트 배치에서 게이트 수준 프로그램을 실행합니다. 프로그램에 필요한 사이트가 충분한지, 네이티브 게이트를 사용하는지, `CZ`가 연결된 사이트 사이에서만 실행되는지 확인할 수 있습니다.'
  status: machine
- id: 972be5733617b195
  en: The layout determines where a program's qubits can interact. The default device has 16 sites on a 4×4 nearest-neighbor grid. You can supply another undirected coupling graph through `num_qubits` and `couplings`.
  ko: 배치에 따라 프로그램의 큐비트가 어느 위치에서 상호작용할 수 있는지가 정해집니다. 기본 장치는 4×4 격자에 배치된 16개 사이트를 가지며, 이웃한 사이트가 연결됩니다. `num_qubits`와 `couplings`로 다른 무방향 결합 그래프를 지정할 수 있습니다.
  status: retired
- id: 9fcafb476098f381
  en: The simulator accepts `X`, `SX`, and `RZ` at every site. A `CZ` accepts either order of a connected pair, such as `(0, 1)` or `(1, 0)` on the default grid. Measurement and reset follow the [rules for the chosen simulation method](../simulator.md#methods).
  ko: 모든 사이트에서 `X`, `SX`, `RZ`를 사용할 수 있습니다. `CZ`에는 연결된 쌍의 두 순서를 모두 전달할 수 있습니다. 기본 격자의 `(0, 1)`과 `(1, 0)`이 그 예입니다. 측정과 리셋은 [선택한 시뮬레이션 방법의 규칙](../simulator.md#methods)을 따릅니다.
  status: machine
- id: 42dc035315e7f533
  en: By default, qubits map to consecutive device labels in register declaration order, including the members of a [`GridRegister`][fatqat.GridRegister]. Pass a complete [`ResourceLayout`][fatqat.ResourceLayout] to place those qubits at other sites. To compile a logical circuit for the same layout, pass the target returned by [`get_compiler_target()`][fatqat.simulator.SCQubitSimulator.get_compiler_target] to the compiler.
  ko: 기본적으로 레지스터를 선언한 순서대로 큐비트에 연속된 장치 번호를 부여합니다. [`GridRegister`][fatqat.GridRegister]의 구성원도 같은 규칙을 따릅니다. 큐비트를 다른 사이트에 놓으려면 완전한 [`ResourceLayout`][fatqat.ResourceLayout]을 전달합니다. 같은 배치에 맞게 논리 회로를 컴파일하려면 [`get_compiler_target()`][fatqat.simulator.SCQubitSimulator.get_compiler_target]이 반환한 타깃을 컴파일러에 전달합니다.
  status: machine
- id: aad9874a78a6d968
  en: Use [`implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map] to check a gate family or a specific device pair before running the program.
  ko: 프로그램을 실행하기 전에 [`implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map]으로 특정 게이트 계열이나 장치 사이트 쌍에서 연산을 사용할 수 있는지 확인할 수 있습니다.
  status: retired
- id: 9ed05194329b7e5d
  en: Use the built-in model to compare ideal and noisy results on the same program. The simulator runs ideally by default. To include gate damping and readout errors, pass a fresh model from [`default_noise_model()`][fatqat.simulator.SCQubitSimulator.default_noise_model] through `noise`.
  ko: 내장 잡음 모델로 같은 프로그램의 이상적인 결과와 잡음이 포함된 결과를 비교할 수 있습니다. 기본값은 이상적인 실행입니다. 게이트 감쇠와 판독 오류를 포함하려면 [`default_noise_model()`][fatqat.simulator.SCQubitSimulator.default_noise_model]이 반환한 모델을 `noise`에 전달합니다.
  status: retired
