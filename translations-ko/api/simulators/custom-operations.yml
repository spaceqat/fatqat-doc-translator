- id: f0c620aca972d170
  en: Custom operations
  ko: 사용자 정의 연산
  status: machine
- id: b7130dde76d73ae6
  en: Use a custom operation to update quantum and classical data together or keep additional data for each shot. Define the operation as a `CustomOperation` and register a `CustomOperationImplementation` with the simulator's [`MatrixImplementationMap`](../implementation.md).
  ko: 양자 데이터와 고전 데이터를 함께 갱신하거나 샷별 추가 데이터를 보관하려면 사용자 정의 연산을 사용하세요. 연산을 `CustomOperation`으로 정의하고 시뮬레이터의 [`MatrixImplementationMap`](../implementation.md)에 `CustomOperationImplementation`을 등록합니다.
  status: retired
- id: 05c75667c0afab29
  en: Define and register an operation
  ko: 연산 정의와 등록
  status: machine
- id: 9d62c46e449a77c9
  en: 'This classical-only operation counts its calls and writes the count to the first classical register entry:'
  ko: '다음 고전 전용 연산은 호출 횟수를 세고 첫 번째 고전 레지스터 항목에 기록합니다:'
  status: retired
- id: 2fb6db3522ce552c
  en: To extend the atom-array profile, start with `AtomArraySimulator().implementation_map`.
  ko: 원자 배열 프로필을 확장하려면 `AtomArraySimulator().implementation_map`에서 시작하세요.
  status: retired
- id: ecaa2a00f52146cb
  en: State and execution
  ko: 상태와 실행
  status: retired
- id: 70eda70c9e8b6015
  en: '`execute(operation, state, context)` must return the updated state or a replacement `EvolutionState`. Keep shot-specific data in `state.classical`, rather than on the operation or implementation object, which may be reused across shots. User data is not included in counts; write reported values to `clbits` as in the example.'
  ko: '`execute(operation, state, context)`는 갱신된 상태 또는 이를 대체할 `EvolutionState`를 반환해야 합니다. 샷별 데이터는 여러 샷에서 재사용될 수 있는 연산이나 구현 객체가 아니라 `state.classical`에 보관하세요. 사용자 데이터는 카운트에 포함되지 않습니다. 보고할 값은 예제처럼 `clbits`에 쓰세요.'
  status: retired
- id: ed1ef66e51dafbe7
  en: Use `context.targets` to locate quantum operands and `context.rng` for random draws that respect the simulation seed. Field meanings, target ordering, and initialization defaults are described in the API reference below.
  ko: 양자 피연산자는 `context.targets`로 찾고, 시뮬레이션 시드를 따르는 난수 추출에는 `context.rng`를 사용하세요. 필드 의미, 대상 순서, 초기화 기본값은 아래 API 참조에 설명되어 있습니다.
  status: retired
- id: 24e4e7e46e3be2c4
  en: Classical conditions are evaluated before `execute`. On the atom-array profile, custom operations handle absent atoms and pairing requirements themselves. Attached noise runs afterward and evaluates conditions against the updated classical register.
  ko: 고전 조건은 `execute` 전에 평가합니다. 원자 배열 프로필에서 사용자 정의 연산은 원자가 없는 경우와 페어링 조건을 직접 처리해야 합니다. 부착 잡음은 그 뒤에 실행되며 갱신된 고전 레지스터를 기준으로 조건을 평가합니다.
  status: retired
- id: e099dc81ba737d77
  en: Supported usage
  ko: 지원 범위
  status: retired
- id: 271c559e1b1673e6
  en: '`Simulator` and `AtomArraySimulator` support custom operations with statevector and density-matrix methods on both NumPy and Numba.'
  ko: '`Simulator`와 `AtomArraySimulator`는 NumPy와 Numba 모두에서 상태 벡터 및 밀도 행렬 방법의 사용자 정의 연산을 지원합니다.'
  status: retired
- id: 9fe4b5853b548475
  en: '`run_sweep`, unitary/superoperator methods, and expectation calculations do not support custom operations.'
  ko: '`run_sweep`, 유니터리·초연산자 방법, 기댓값 계산은 사용자 정의 연산을 지원하지 않습니다.'
  status: retired
- id: 026d241f74518b14
  en: 'Final-state output requires `shots=1` and `result_config={"final_state": True}`. Counts without measurements require `result_config={"counts": True}`.'
  ko: '최종 상태를 출력하려면 `shots=1`과 `result_config={"final_state": True}`가 필요합니다. 측정 없이 카운트를 받으려면 `result_config={"counts": True}`를 지정하세요.'
  status: retired
- id: a7131e2ab82db613
  en: Process execution requires serializable operations, implementations, and initial data. Define classes at module level when using it.
  ko: 프로세스 실행에서는 연산, 구현, 초기 데이터가 직렬화 가능해야 합니다. 이를 사용할 때는 클래스를 모듈 수준에 정의하세요.
  status: retired
- id: 023ab5f5995ee969
  en: Use a custom operation when a circuit step needs to work directly with the current shot. It can update the quantum state, write a classical result, or carry data from one step to the next. The `CustomOperation` describes the instruction, and a `CustomOperationImplementation` defines what it does when the simulator runs it.
  ko: 회로의 한 단계에서 해당 샷의 상태를 직접 다뤄야 할 때 사용자 정의 연산을 사용합니다. 양자 상태를 갱신하거나 고전 결과를 기록하고, 같은 샷 안에서 다음 단계에 데이터를 넘길 수 있습니다. `CustomOperation`은 명령을 정의하고, `CustomOperationImplementation`은 시뮬레이터가 그 명령을 실행할 때의 동작을 정의합니다.
  status: machine
- id: 30d53fa057bc0661
  en: Register the implementation in the simulator's [`MatrixImplementationMap`](../implementation.md) so it can dispatch the instruction. This example defines an operation with no quantum targets. Each call adds one to a per-shot counter and writes the value to the first classical register entry.
  ko: 시뮬레이터가 명령에 해당하는 구현을 찾을 수 있도록 [`MatrixImplementationMap`](../implementation.md)에 구현을 등록합니다. 아래 연산에는 양자 대상이 없습니다. 호출할 때마다 해당 샷의 카운터를 하나 늘리고 첫 번째 고전 레지스터 항목에 그 값을 기록합니다.
  status: machine
- id: 2f7e403f52e72844
  en: Work with shot state
  ko: 샷 상태 읽고 쓰기
  status: machine
- id: 2676952b1cbb58c8
  en: Use `execute(operation, state, context)` to read or update the current shot. Return the updated `state` or a replacement `EvolutionState`. Keep per-shot data in `state.classical`, as the same operation and implementation can be reused across shots. Values written to `clbits` appear in the counts when requested.
  ko: '`execute(operation, state, context)`로 현재 샷의 상태를 읽거나 바꾸고, 갱신된 `state` 또는 새 `EvolutionState`를 반환합니다. 같은 연산과 구현을 여러 샷에서 재사용할 수 있으므로 샷별 데이터는 `state.classical`에 보관합니다. 집계를 요청하면 `clbits`에 기록한 값이 결과에 반영됩니다.'
  status: machine
- id: 6010313cb898bd69
  en: Use `context.targets` to locate operands and `context.rng` for random draws that follow the simulation seed. The operation's classical condition is checked before `execute`. Attached noise runs afterward and evaluates its conditions on the updated classical register.
  ko: '`context.targets`에서 연산 대상을 찾고, 시뮬레이션 시드를 따르는 난수는 `context.rng`로 뽑습니다. 연산의 고전 조건은 `execute`를 호출하기 전에 확인합니다. 연산에 붙인 노이즈는 그 뒤에 적용하며, 그 조건은 갱신된 고전 레지스터로 판단합니다.'
  status: machine
- id: 3635a451554ad034
  en: Run and request results
  ko: 실행하고 결과 요청하기
  status: machine
- id: 27e8fac16f63a945
  en: Use a statevector or density-matrix run on `Simulator` or `AtomArraySimulator`, with either NumPy or Numba. On an atom array, start with the simulator's `implementation_map`. Your implementation is responsible for checking whether its sites contain atoms and whether they are paired.
  ko: '`Simulator` 또는 `AtomArraySimulator`에서 상태 벡터나 밀도 행렬로 실행합니다. NumPy와 Numba를 모두 사용할 수 있습니다. 원자 배열에서는 시뮬레이터의 `implementation_map`에서 시작합니다. 구현에서 대상 사이트에 원자가 있는지와 페어링 상태를 확인해야 합니다.'
  status: machine
- id: 9e022cfd98a316ab
  en: Custom operations support direct `run()` calls. Parameter sweeps, operator methods, and expectation calculations require other operation types.
  ko: 사용자 정의 연산은 `run()`으로 직접 실행할 수 있습니다. 매개변수 스윕, 연산자 계산, 기댓값 계산에는 다른 유형의 연산을 사용합니다.
  status: machine
- id: eac583f24611c7cf
  en: 'To inspect a final state, use `shots=1` and `result_config={"final_state": True}`. To report counts from a program that has no measurement operations, request `result_config={"counts": True}`.'
  ko: '최종 상태를 확인하려면 `shots=1` 및 `result_config={"final_state": True}`를 전달합니다. 측정 연산이 없는 프로그램에서 집계값을 받으려면 `result_config={"counts": True}`를 요청합니다.'
  status: machine
- id: e7f087c71aabbdbe
  en: For process parallelism, define operation and implementation classes at module level and use serializable initial data.
  ko: 프로세스 병렬 실행을 사용할 때는 연산 클래스와 구현 클래스를 모듈 최상위에 정의하고 직렬화 가능한 초기 데이터를 사용합니다.
  status: machine
- id: e2b1502eff2af87d
  en: The entries below describe how to define an instruction, implement its behavior, and read the state and context passed to it.
  ko: 아래 항목에서는 명령과 그 동작을 정의하는 방법, 실행할 때 전달되는 상태와 컨텍스트를 읽는 방법을 설명합니다.
  status: machine
