  en: This class defines the array rules and native operation map. For the shared execution and result options, see [`Simulator.run()`][fatqat.simulator.Simulator.run] and [`Simulator.run_sweep()`][fatqat.simulator.Simulator.run_sweep].
  ko: 이 클래스는 배열의 규칙과 네이티브 연산 맵을 정의합니다. 공통 실행 및 결과 옵션은 [`Simulator.run()`][fatqat.simulator.Simulator.run]과 [`Simulator.run_sweep()`][fatqat.simulator.Simulator.run_sweep]을 참조하세요.
  status: retired
