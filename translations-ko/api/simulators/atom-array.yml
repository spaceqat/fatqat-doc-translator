- id: f58814884b104747
  en: Program size, mapping, and native operations
  ko: 프로그램 크기, 매핑, 네이티브 연산
  status: machine
- id: 1d9e37fc50bf9906
  en: The quantum resources in each program define the array size, so the backend needs no separate site-count or capacity setting. Registers map to integer device labels in declaration order. A [`GridRegister`][fatqat.GridRegister] is flattened because its coordinates have no physical meaning on this backend.
  ko: 각 프로그램의 양자 자원이 배열 크기를 정하므로 별도의 사이트 수나 용량 설정이 필요 없습니다. 레지스터는 선언 순서대로 정수 장치 라벨에 매핑됩니다. 이 백엔드에서 [`GridRegister`][fatqat.GridRegister]의 좌표는 물리적 의미가 없으므로 평탄화됩니다.
  status: machine
- id: c3df3543b143f41d
  en: The default gate set contains `RX`, `RY`, `RZ`, and `CZ`. The simulator does not decompose other gates, so it rejects `CX` unless an implementation is supplied. [`AtomArraySimulator.implementation_map`][fatqat.simulator.AtomArraySimulator.implementation_map] exposes this gate set, while the current `Pair` graph determines where `CZ` is legal. Add rules to this independent map and pass it as `implementation_map=` to extend the default, including [custom operations](custom-operations.md).
  ko: 기본 게이트 집합은 `RX`, `RY`, `RZ`, `CZ`입니다. 다른 게이트를 분해하지 않으므로 구현을 제공하지 않으면 `CX`를 거부합니다. [`AtomArraySimulator.implementation_map`][fatqat.simulator.AtomArraySimulator.implementation_map]은 이 게이트 집합을 제공하고, 현재 `Pair` 그래프가 `CZ`를 적용할 위치를 정합니다. 기본 기능을 확장하려면 독립적인 이 맵에 규칙을 추가해 `implementation_map=`으로 전달하세요. [사용자 정의 연산](custom-operations.md)도 추가할 수 있습니다.
  status: machine
- id: 6ccef22709adbb01
  en: Native-gate support and `CZ` pairing are checked before occupancy is considered. An unsupported gate or unpaired `CZ` is therefore rejected even when one of its sites is empty; only a supported, correctly-paired gate can become an empty-site no-op.
  ko: 점유 상태보다 먼저 네이티브 게이트 지원 여부와 `CZ` 페어링을 확인합니다. 따라서 사이트가 비어 있어도 지원하지 않는 게이트나 페어링되지 않은 `CZ`는 거부됩니다. 지원되고 올바르게 페어링된 게이트만 빈 사이트에서 아무 효과 없이 넘어갈 수 있습니다.
  status: machine
- id: fb487adac6ee1747
  en: Connectivity evolves as the program runs. An unconditional [`fatqat.operations.Pair`][fatqat.operations.Pair] connects two sites and [`fatqat.operations.Unpair`][fatqat.operations.Unpair] disconnects them. Neither operation changes the quantum state, although attached noise still applies. Both must be unconditional.
  ko: 연결 관계는 실행 중에 바뀝니다. 무조건부 [`fatqat.operations.Pair`][fatqat.operations.Pair]는 두 사이트를 연결하고 [`fatqat.operations.Unpair`][fatqat.operations.Unpair]는 연결을 끊습니다. 부착 잡음은 적용되지만 두 연산 자체는 양자 상태를 바꾸지 않습니다. 두 연산 모두 조건 없이 사용해야 합니다.
  status: machine
- id: eb4ff8c75cb7ea4a
  en: Occupancy and loss
  ko: 점유와 손실
  status: machine
- id: b388a06a14288961
  en: Occupancy is tracked independently for each shot. Sites start empty unless `initial_state` supplies an explicit `ClassicalState.occupied` set through an [`EvolutionState`][fatqat.simulator.EvolutionState]. `occupied=None` keeps the empty default. Initial occupancy does not change the supplied quantum state. [`fatqat.operations.Put`][fatqat.operations.Put] loads a fresh `\|0>` atom into an empty target and leaves an occupied target unchanged. Until a site is loaded—or after it is lost—supported gates and reset have no effect there, while measurement reports erasure digit `2`. A later `Put` can refill the site, and pairing instructions continue to update connectivity throughout.
  ko: 점유는 샷마다 독립적으로 추적합니다. `initial_state`가 [`EvolutionState`][fatqat.simulator.EvolutionState]의 명시적인 `ClassicalState.occupied` 집합을 제공하지 않으면 사이트는 비어 있는 상태로 시작합니다. `occupied=None`도 이 기본값을 유지합니다. 초기 점유 설정은 제공한 양자 상태를 바꾸지 않습니다. [`fatqat.operations.Put`][fatqat.operations.Put]은 빈 대상에 새 `\|0>` 원자를 로딩하고 이미 점유된 대상은 그대로 둡니다. 로딩 전이나 손실 후에는 지원되는 게이트와 리셋이 효과를 내지 않고 측정은 소실 숫자 `2`를 보고합니다. 나중에 `Put`으로 다시 채울 수 있으며, 그동안에도 페어링 명령은 연결 관계를 계속 갱신합니다.
  status: machine
- id: 5c7e58f8261efe83
  en: Occupancy is tracked outside the quantum-state representation. Final statevectors and density matrices still include one qubit subsystem per declared site, whether or not an atom is present. With the default initial state, a never-loaded site is represented by `|0>`, but measuring it returns `2`. These quantum-state exports cannot reveal whether a site is occupied; use measurements and counts, or request `final_classical_state`, for that distinction.
  ko: 점유는 양자 상태 표현과 별도로 추적합니다. 원자가 있든 없든 최종 상태 벡터와 밀도 행렬에는 선언된 사이트마다 큐비트 부분계 하나가 포함됩니다. 기본 초기 상태에서는 한 번도 로딩되지 않은 사이트를 `|0>`으로 표현하지만 측정하면 `2`를 반환합니다. 따라서 양자 상태 출력만으로 점유 여부를 알 수 없습니다. 이를 구분하려면 측정과 카운트를 사용하거나 `final_classical_state`를 요청하세요.
  status: machine
- id: ddcedf9103f9c8b4
  en: '[`Estimator`][fatqat.Estimator] supports loss-free programs only. It preserves both quantum state and occupancy when reusing a base execution. An observable targeting an unloaded site raises [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError] before execution.'
  ko: '[`Estimator`][fatqat.Estimator]는 손실 없는 프로그램만 지원합니다. 기본 실행을 재사용할 때 양자 상태와 점유를 모두 보존합니다. 로딩되지 않은 사이트에 작용하는 관측량은 실행 전에 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]를 발생시킵니다.'
  status: machine
- id: 5bc9c4f859f7633c
  en: '[`fatqat.noise.Loss`][fatqat.noise.Loss] can eject gate targets, make `Put` fail, or model loss during `Pair` and `Unpair`. Its selector runs only after a matching operation; `p=0` removes nothing and leaves the loading rule unchanged. No other gate-level simulator accepts `Loss`. If an otherwise-valid paired `CZ` finds a missing atom, the entangling gate is skipped; an unpaired `CZ` still fails before execution.'
  ko: '[`fatqat.noise.Loss`][fatqat.noise.Loss]는 게이트 대상의 원자를 제거하거나 `Put`을 실패시키고, `Pair`와 `Unpair` 중 손실도 모델링할 수 있습니다. 선택자는 일치하는 연산 뒤에만 실행됩니다. `p=0`이면 아무것도 제거하지 않으며 로딩 규칙도 바꾸지 않습니다. 다른 게이트 수준 시뮬레이터는 `Loss`를 받지 않습니다. 올바르게 페어링된 `CZ`에서 원자가 빠져 있으면 얽힘 게이트를 건너뛰지만, 페어링되지 않은 `CZ`는 여전히 실행 전에 실패합니다.'
  status: machine
- id: f4402208f155c77f
  en: Noise channels can act on only one qubit. For a two-qubit operation, add noise for each qubit separately, using `target_positions` to select it. If one atom is missing, the gate is skipped, but noise still applies to the remaining atom. `Loss` can act on multiple atoms.
  ko: 잡음 채널은 큐비트 하나에만 작용할 수 있습니다. 2큐비트 연산에는 `target_positions`로 각 큐비트를 선택해 잡음을 따로 추가하세요. 원자 하나가 없으면 게이트는 건너뛰지만 남아 있는 원자에는 잡음이 적용됩니다. `Loss`는 여러 원자에 작용할 수 있습니다.
  status: machine
- id: 58f00dfe93ad8d60
  en: Because an empty site produces no physical readout digit, its erasure value `2` bypasses readout-confusion noise. Atom loss also makes the final state stochastic, so `final_state=True` requires `shots == 1`. A measured lossy run returns counts by default rather than one arbitrary trajectory's final state.
  ko: 빈 사이트에는 물리적으로 읽을 숫자가 없으므로 소실 값 `2`에는 판독 혼동 잡음을 적용하지 않습니다. 원자 손실은 최종 상태도 확률적으로 만들기 때문에 `final_state=True`에는 `shots == 1`이 필요합니다. 측정이 있는 손실 실행은 임의 궤적 하나의 최종 상태 대신 기본적으로 카운트를 반환합니다.
  status: machine
- id: d029f87e3d80f8fd
  en: Example
  ko: 예제
  status: machine
- id: a56b273102780095
  en: Because occupancy sits outside the quantum matrix, `unitary` and `superop` cannot represent this lifecycle. `AtomArraySimulator` accepts only `statevector` and `density_matrix`, rejecting either operator method when the backend is constructed—even for a program with no `Put` or loss.
  ko: 점유 정보는 양자 행렬 바깥에 있으므로 `unitary`와 `superop`은 이 수명 주기를 표현할 수 없습니다. `AtomArraySimulator`는 `statevector`와 `density_matrix`만 받으며, `Put`이나 손실이 없는 프로그램이라도 백엔드 생성 시 두 연산자 방법을 거부합니다.
  status: machine
