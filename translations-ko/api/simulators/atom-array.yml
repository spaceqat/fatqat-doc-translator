- id: 26630112df5240a9
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] layers neutral-atom occupancy, loss, and dynamic pairing onto the [`Simulator`][fatqat.simulator.Simulator] execution model. It is useful for checking whether a gate-level program respects those constraints. For pulse timing, transport, or physical interactions, use the [neutral-atom emulator](../atom-emulators.md) instead.'
  ko: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]는 [`Simulator`][fatqat.simulator.Simulator] 실행 모델에 중성 원자의 점유, 손실, 동적 페어링을 추가합니다. 게이트 수준 프로그램이 이러한 제약을 지키는지 확인할 때 유용합니다. 펄스 시간, 운반, 물리적 상호작용을 다루려면 [중성 원자 에뮬레이터](../atom-emulators.md)를 사용하세요.'
  status: machine
