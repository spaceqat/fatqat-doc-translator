- id: 90920d93e2c7e632
  en: Program
  ko: Program
  status: machine
- id: ff943cbe5d7831a9
  en: '[`Program`][fatqat.Program] records a quantum workload without tying it to a device. Add operations and measurements in execution order, then choose a backend when you run it.'
  ko: '[`Program`][fatqat.Program]은 특정 장치에 종속되지 않는 양자 작업을 기록합니다. 연산과 측정을 실행 순서대로 추가하고, 실행할 때 백엔드를 선택하세요.'
  status: machine
- id: 5ab572f78b7f37f1
  en: FATQAT catches malformed targets, measurements, and conditions while you build the program. The backend checks whether it supports the requested operations, dimensions, placement, and feedforward.
  ko: FATQAT은 프로그램을 구성하는 동안 잘못된 대상, 측정, 조건을 검사합니다. 요청한 연산, 차원, 물리적 배치, 피드포워드의 지원 여부는 백엔드가 검사합니다.
  status: machine
- id: 048713a5001fc80f
  en: Registers
  ko: Registers
  status: machine
- id: 07203021cae3b43e
  en: 'The two register arguments accept these forms:'
  ko: 두 레지스터 인수는 다음 형식을 받습니다.
  status: machine
- id: 824d0be82710f3d8
  en: '**Register inputs**'
  ko: '**레지스터 입력**'
  status: machine
- id: 15c276b3e6340e5f
  en: '| Form | Result | Constraints |'
  ko: '| 형식 | 결과 | 제약 |'
  status: machine
- id: 09b8f7f42fb0fcde
  en: '| Non-negative integer `n` | `n > 0` creates one dimension-2 register named `"q"` or `"c"`; `0` creates no register. | The value must be an exact integer, not a boolean. A negative value is rejected. |'
  ko: '| 음이 아닌 정수 `n` | `n > 0`이면 이름이 `"q"` 또는 `"c"`인 차원 2 레지스터 하나를 만듭니다. `0`이면 레지스터를 만들지 않습니다. | 불리언이 아닌 정확한 정수 타입이어야 하며 음수는 허용하지 않습니다. |'
  status: machine
- id: 1517294586eb0bb6
  en: '| List or tuple of registers | Preserves the supplied register objects in a tuple. | Every item must have the matching quantum or classical register kind. Use this form for names, multiple registers, grids, or qudits. |'
  ko: '| 레지스터 리스트 또는 튜플 | 전달한 레지스터 객체를 튜플에 그대로 보존합니다. | 각 항목의 종류가 양자 또는 고전 레지스터 요구와 일치해야 합니다. 이름 지정, 여러 레지스터, 격자, 큐디트에 사용하세요. |'
  status: machine
- id: 700ca4f96b4fedeb
  en: See [Registers](registers.md) for explicit registers, dimensions, and grid selections.
  ko: 명시적 레지스터, 차원, 격자 선택은 [Registers](registers.md)를 참고하세요.
  status: machine
- id: 27445f6ab61d9a5c
  en: Targets
  ko: 대상
  status: machine
- id: f8e3cd1a2ea4f98c
  en: A bare integer indexes the sole register of the relevant kind; it is not a global index across several registers. With multiple registers, index the register you want and pass the resulting [`RegisterRef`][fatqat.RegisterRef].
  ko: 정수만 전달하면 해당 종류의 유일한 레지스터를 인덱싱합니다. 여러 레지스터를 통틀어 사용하는 전역 인덱스가 아닙니다. 레지스터가 여러 개면 원하는 레지스터를 인덱싱한 뒤 얻은 [`RegisterRef`][fatqat.RegisterRef]를 전달하세요.
  status: machine
- id: 9e17614c8790b4e7
  en: '**Target forms**'
  ko: '**대상 형식**'
  status: machine
- id: 60f5a82f6e55e730
  en: '| Form | Accepted by | Rule |'
  ko: '| 형식 | 사용 위치 | 규칙 |'
  status: machine
- id: 41bdcc720f269b0f
  en: '| Integer | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and conditions | Requires exactly one register of the relevant kind and must be within its zero-based bounds. |'
  ko: '| 정수 | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], 조건 | 해당 종류의 레지스터가 정확히 하나 있어야 하며, 인덱스는 0부터 시작하는 범위 안에 있어야 합니다. |'
  status: machine
- id: f5edf3ac1adde806
  en: '| [`RegisterRef`][fatqat.RegisterRef] | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and conditions | Must have the required register kind and come from a register in this program. |'
  ko: '| [`RegisterRef`][fatqat.RegisterRef] | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], 조건 | 필요한 종류의 레지스터를 참조해야 하며, 해당 레지스터가 이 프로그램에 속해야 합니다. |'
  status: machine
- id: 17afad4436a88be4
  en: '| [`RegisterView`](registers.md#fatqat.RegisterView) | [`add`][fatqat.Program.add] only | Every built-in unitary gate accepts views. Unary gates map over one view; multi-target gates zip one compatible view per operand. `Put` accepts one view as its complete target collection. Measurement does not accept views. |'
  ko: '| [`RegisterView`](registers.md#fatqat.RegisterView) | [`add`][fatqat.Program.add]만 가능 | 모든 내장 유니터리 게이트가 뷰를 받습니다. 단항 게이트는 뷰의 각 원소에 적용되고, 여러 대상의 게이트는 피연산자별 호환 뷰를 순서대로 짝짓습니다. `Put`은 뷰 하나를 전체 대상 모음으로 받습니다. 측정은 뷰를 받지 않습니다. |'
  status: machine
- id: 37a577ed93e02242
  en: A [`PulseOperation`][fatqat.operations.PulseOperation] does not use the target forms above. Add it with `program.add(operation)` and no `targets` argument. See [PulseOperation](pulse-control/pulse-operation.md) for details.
  ko: '[`PulseOperation`][fatqat.operations.PulseOperation]은 위의 대상 형식을 사용하지 않습니다. `targets` 인수 없이 `program.add(operation)`으로 추가하세요. 자세한 내용은 [PulseOperation](pulse-control/pulse-operation.md)을 참고하세요.'
  status: machine
- id: 8974a8716ebd0f38
  en: For other operations, `targets` is one tuple in operand order. Controlled gates list controls before targets. See [Registers](registers.md) for view selection and compatibility, and [Write quantum computations with Program](../guide/program.md) for the ordinary construction workflow.
  ko: 그 밖의 연산에서 `targets`는 피연산자 순서의 튜플 하나입니다. 제어 게이트는 제어 큐비트를 대상보다 먼저 나열합니다. 뷰 선택과 호환성은 [Registers](registers.md), 일반적인 구성 흐름은 [Program으로 양자 계산 작성](../guide/program.md)을 참고하세요.
  status: machine
- id: 97d4be8960698f97
  en: Conditions
  ko: 조건
  status: machine
- id: 08bb8d08f90dad77
  en: Pass `condition=(slot, literal)` to [`add`][fatqat.Program.add], or pass a non-empty tuple or list of such pairs for logical AND. A slot follows the same integer-or-ref rules as other classical operands. Each literal is a Python integer in `0 <= literal < slot.dim`; booleans are also accepted. Every term is compared with the current classical value when the operation is reached.
  ko: '[`add`][fatqat.Program.add]에 `condition=(slot, literal)`을 전달하세요. 여러 조건의 논리 AND에는 이러한 쌍을 담은 비어 있지 않은 튜플이나 리스트를 전달합니다. 슬롯은 다른 고전 피연산자와 같은 정수 또는 참조 규칙을 따릅니다. 각 리터럴은 `0 <= literal < slot.dim` 범위의 Python 정수이며 불리언도 허용됩니다. 실행이 해당 연산에 도달하면 각 항을 현재 고전 값과 비교합니다.'
  status: machine
- id: 6660f06490917c48
  en: FATQAT checks each condition when the operation is added. A condition may refer to an unmeasured slot, whose initial value is zero; an earlier measurement replaces that value. The backend decides whether it supports feedforward.
  ko: FATQAT은 연산을 추가할 때 각 조건을 검사합니다. 아직 측정하지 않은 슬롯을 조건에서 참조할 수도 있습니다. 초기값은 0이며, 앞선 측정이 있으면 그 결과로 대체됩니다. 피드포워드 지원 여부는 백엔드가 결정합니다.
  status: machine
- id: 3c7578035649a2b1
  en: Measurements
  ko: 측정
  status: machine
- id: a63a373747f764c7
  en: '[`measure`][fatqat.Program.measure] pairs quantum targets with classical outputs positionally. Both sides must be non-empty, have the same length, and have matching dimensions at every position. Repeated operands are processed in pair order; see [Measurement and structural operations](operations/structural.md) for measurement behavior.'
  ko: '[`measure`][fatqat.Program.measure]는 양자 대상과 고전 출력을 위치별로 짝짓습니다. 양쪽 모두 비어 있지 않아야 하고 길이가 같아야 하며 각 위치의 차원도 일치해야 합니다. 피연산자가 반복되면 쌍의 순서대로 처리합니다. 측정 동작은 [측정과 구조적 연산](operations/structural.md)을 참고하세요.'
  status: machine
- id: 1777e9698fb5368c
  en: '[`measure_all`][fatqat.Program.measure_all] appends one grouped measurement of all quantum slots, using the first corresponding classical slots by default or the destinations specified by `outputs`. Read [Write quantum computations with Program](../guide/program.md) for a mid-program measurement and feedforward workflow.'
  ko: '[`measure_all`][fatqat.Program.measure_all]은 모든 양자 슬롯을 묶어 측정하는 명령 하나를 추가합니다. 기본적으로 앞에서부터 대응하는 고전 슬롯에 저장하며, `outputs`로 다른 목적지를 지정할 수 있습니다. 프로그램 중간 측정과 피드포워드 흐름은 [Program으로 양자 계산 작성](../guide/program.md)을 참고하세요.'
  status: machine
- id: c9a1909583cca56e
  en: <a id="program-templates"></a>
  ko: <a id="program-templates"></a>
  status: machine
- id: 52ce42df206a548b
  en: Parameter binding
  ko: 매개변수 바인딩
  status: machine
- id: e4dc1f9124f6f07c
  en: 'Parameters are immutable identity objects. Names are labels only: two `Parameter("theta")` objects are different binding keys. Reuse one object when several operation arguments should share a value.'
  ko: 매개변수는 객체 정체성으로 구분되는 불변 객체입니다. 이름은 라벨일 뿐이므로 `Parameter("theta")` 객체 두 개는 서로 다른 바인딩 키입니다. 여러 연산 인수가 같은 값을 공유해야 한다면 하나의 객체를 재사용하세요.
  status: machine
- id: fd517d015ab000eb
  en: '**Binding forms**'
  ko: '**바인딩 형식**'
  status: machine
- id: a9ce84de08d9d3c9
  en: '| Mapping key | Accepted value | Constraint |'
  ko: '| 매핑 키 | 허용 값 | 제약 |'
  status: machine
- id: 8d4cdbd2a14d6ac5
  en: '| [`Parameter`][fatqat.Parameter] | Built-in integer or float, or NumPy integer or floating scalar | The same object must be supplied directly to an operation parameter. |'
  ko: '| [`Parameter`][fatqat.Parameter] | 내장 정수나 실수, 또는 NumPy 정수나 부동소수점 스칼라 | 같은 객체가 연산 매개변수로 직접 전달되어 있어야 합니다. |'
  status: machine
- id: 466efa4a2e2c7b6a
  en: '| [`ParameterVector`][fatqat.ParameterVector] | One-dimensional NumPy array, or a non-string, non-bytes, non-mapping iterable of accepted scalars | Consumed once in iteration order. The value length must match and every vector element must be used directly as an operation parameter. Bind individual elements for a partial vector. |'
  ko: '| [`ParameterVector`][fatqat.ParameterVector] | 1차원 NumPy 배열 또는 허용 스칼라를 담은 이터러블. 문자열, bytes, 매핑은 제외 | 순회 순서대로 한 번 소비합니다. 길이가 일치해야 하며 모든 벡터 원소가 연산 매개변수로 직접 사용되어야 합니다. 벡터 일부만 바인딩하려면 원소별로 지정하세요. |'
  status: machine
- id: f0cdca999be213ea
  en: '[`assign_parameters`][fatqat.Program.assign_parameters] accepts an empty or partial mapping and returns a new program. It binds only [`Parameter`][fatqat.Parameter] objects used directly as operation arguments. Unbound parameters remain symbolic and are rejected by numeric execution and export. String keys, positional assignments, boolean or complex values, and assigning both a vector and one of its elements are rejected. Replacement values still undergo the operation''s normal validation. Read [Write quantum computations with Program](../guide/program.md) for the authoring workflow and [Simulate a quantum program](../guide/simulation.md) for a parameter sweep. The complete binding and execution contracts are specified here and in [Simulator](simulator.md).'
  ko: '[`assign_parameters`][fatqat.Program.assign_parameters]는 비어 있거나 일부 매개변수만 담긴 매핑을 받아 새 프로그램을 반환합니다. 연산 인수로 직접 사용된 [`Parameter`][fatqat.Parameter] 객체만 바인딩합니다. 바인딩되지 않은 매개변수는 기호로 남으며 수치 실행이나 내보내기 시 거부됩니다. 문자열 키, 위치 기반 할당, 불리언이나 복소수 값, 벡터와 그 원소를 동시에 할당하는 방식은 허용하지 않습니다. 대체 값에도 연산의 일반 검증을 적용합니다. 작성 흐름은 [Program으로 양자 계산 작성](../guide/program.md), 매개변수 스윕은 [양자 프로그램 시뮬레이션](../guide/simulation.md)을 참고하세요. 바인딩과 실행의 전체 계약은 이 페이지와 [Simulator](simulator.md)에서 정의합니다.'
  status: machine
- id: e9dfa196fd71df85
  en: '[`copy`][fatqat.Program.copy] and [`assign_parameters`][fatqat.Program.assign_parameters] return new programs. [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and [`measure_all`][fatqat.Program.measure_all] update the current program and return `None`.'
  ko: '[`copy`][fatqat.Program.copy]와 [`assign_parameters`][fatqat.Program.assign_parameters]는 새 프로그램을 반환합니다. [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], [`measure_all`][fatqat.Program.measure_all]은 현재 프로그램을 변경하고 `None`을 반환합니다.'
  status: machine
- id: 94b0fd4467e21909
  en: Read instructions
  ko: 명령 읽기
  status: machine
- id: fa8af34ab44c5255
  en: Use [`Program.instructions`][fatqat.Program.instructions] to read a program's instructions in insertion order. It returns a read-only snapshot containing [`OperationInstruction`][fatqat.program.OperationInstruction] and [`Measurement`][fatqat.operations.Measurement] records.
  ko: '[`Program.instructions`][fatqat.Program.instructions]로 프로그램의 명령을 삽입 순서대로 읽을 수 있습니다. [`OperationInstruction`][fatqat.program.OperationInstruction]과 [`Measurement`][fatqat.operations.Measurement] 레코드를 담은 읽기 전용 스냅샷을 반환합니다.'
  status: machine
- id: 62ef756a14c66b7c
  en: Backends and other program readers should use this interface instead of depending on FatQat's private instruction representation.
  ko: 백엔드 등 프로그램을 읽는 코드는 FatQat의 비공개 명령 표현에 의존하지 말고 이 인터페이스를 사용하세요.
  status: machine
- id: 61517c08b3bf84b4
  en: Draw
  ko: 회로 그리기
  status: machine
- id: b57f3c0278fcec2d
  en: FatQat's circuit drawing is based on QuTiP-QIP's circuit drawing tools. `Program.draw()` translates the Program's instructions to a rendering adapter before invoking the selected QuTiP-QIP renderer.
  ko: FatQat의 회로 그림은 QuTiP-QIP의 회로 그리기 도구를 사용합니다. `Program.draw()`는 Program 명령을 렌더링 어댑터로 변환한 뒤 선택한 QuTiP-QIP 렌더러를 호출합니다.
  status: machine
- id: c33a3c83ca348858
  en: '**Renderers**'
  ko: '**렌더러**'
  status: machine
- id: 24a00fe63d2fa655
  en: '| `renderer` | Return value | Notes |'
  ko: '| `renderer` | 반환값 | 참고 |'
  status: machine
- id: adc72a6f37add82f
  en: '| `"matplotlib"` (default) | Matplotlib `Figure` | Pass `ax=` to draw on an existing axis; other keyword arguments are forwarded to the renderer. |'
  ko: '| `"matplotlib"`(기본값) | Matplotlib `Figure` | 기존 축에 그리려면 `ax=`를 전달하세요. 나머지 키워드 인수는 렌더러에 전달됩니다. |'
  status: machine
- id: 2d11cf26e8f478af
  en: '| `"text"` | Terminal diagram string | The string is returned, not printed. |'
  ko: '| `"text"` | 터미널 다이어그램 문자열 | 문자열을 출력하지 않고 반환합니다. |'
  status: machine
- id: af060222edca2c1b
  en: '| Another QuTiP-QIP renderer name | Renderer-defined | The name and keyword arguments are forwarded unchanged. |'
  ko: '| 다른 QuTiP-QIP 렌더러 이름 | 렌더러가 정의 | 이름과 키워드 인수를 그대로 전달합니다. |'
  status: machine
- id: 695c33c567c1e8b9
  en: Circuit drawings use one wire per slot but do not depict register dimension. Unknown or custom operations appear as labeled boxes. A direct [`PulseOperation`][fatqat.operations.PulseOperation] cannot be represented and raises [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]. The Matplotlib renderer uses FATQAT's palette by default. Pass a QuTiP-QIP `theme` or configure Matplotlib's color cycle to use a different palette.
  ko: 회로 그림은 슬롯마다 선 하나를 사용하지만 레지스터 차원은 표시하지 않습니다. 알 수 없거나 사용자 정의된 연산은 라벨이 있는 상자로 표시합니다. 직접 작성한 [`PulseOperation`][fatqat.operations.PulseOperation]은 표현할 수 없어 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]를 발생시킵니다. Matplotlib 렌더러는 기본적으로 FATQAT 팔레트를 사용합니다. 다른 팔레트를 쓰려면 QuTiP-QIP `theme`를 전달하거나 Matplotlib의 색상 순환을 설정하세요.
  status: machine
- id: 43325a1cc86ecc94
  en: 'Use [`fatqat.visualization.to_qubit_circuit`][fatqat.visualization.to_qubit_circuit] only for low-level integration with QuTiP-QIP''s drawing tools:'
  ko: '[`fatqat.visualization.to_qubit_circuit`][fatqat.visualization.to_qubit_circuit]은 QuTiP-QIP 그리기 도구와 저수준으로 연동할 때만 사용하세요.'
  status: machine
- id: 8d59a62113806b7f
  en: The returned circuit is a rendering adapter, not an execution object. The old `fatqat.draw` import path has been removed.
  ko: 반환된 회로는 실행 객체가 아닌 렌더링 어댑터입니다. 기존 `fatqat.draw` 가져오기 경로는 제거되었습니다.
  status: machine
- id: 4dc2afb5ff23fdda
  en: Logical interaction frequency
  ko: 논리적 상호작용 빈도
  status: machine
- id: feae1b19428464ae
  en: 'Logical interaction frequency is derived separately from circuit drawing:'
