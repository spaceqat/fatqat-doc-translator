- id: 32243bde8f0ac0af
  en: Import or export supported OpenQASM, convert compatible Qiskit circuits, or use FatQat through Qiskit's backend interface. See [Connect FatQat with OpenQASM and Qiskit](../../guide/interoperability.md) for the guided workflows.
  ko: 지원되는 OpenQASM을 가져오거나 내보내고, 호환되는 Qiskit 회로를 변환하거나 Qiskit 백엔드 인터페이스로 FatQat을 실행할 수 있습니다. 예제는 [FatQat을 OpenQASM 및 Qiskit과 연동하기](../../guide/interoperability.md)를 참고하세요.
  status: machine
- id: ebc3867854e2c6e2
  en: FatQat can read and write OpenQASM 2 and 3 and accept Qiskit circuits. Choose an interface based on the input you have and the result API you want to use.
  ko: FatQat은 OpenQASM 2와 3을 읽고 쓸 수 있으며 Qiskit 회로도 받습니다. 입력 형식과 사용하려는 결과 API에 맞춰 인터페이스를 고르세요.
  status: machine
