- id: 9d34f333e9d63b1d
  en: OpenQASM and Qiskit give you two ways to bring an existing circuit into FatQat. The interface to use depends on how the circuit is written and where you want to read the results.
  ko: 기존 회로는 OpenQASM이나 Qiskit을 통해 FatQat에 가져올 수 있습니다. 회로가 어떤 형식인지, 결과를 어느 쪽 API에서 읽을지에 따라 방법을 고르세요.
