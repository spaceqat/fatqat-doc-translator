- id: 6546c0fefd45dbf8
  en: Install Qiskit to use `fatqat.qiskit`. Use [`circuit_to_program()`][fatqat.qiskit.circuit_to_program] to run a converted circuit with FatQat's own result API. Use [`FatqatBackend`][fatqat.qiskit.FatqatBackend] to keep Qiskit's transpiler, job, and result APIs while running on the FatQat gate-level simulator.
  ko: '`fatqat.qiskit`을 사용하려면 Qiskit을 설치하세요. [`circuit_to_program()`][fatqat.qiskit.circuit_to_program]으로 회로를 변환하면 FatQat의 실행 및 결과 API를 쓸 수 있습니다. [`FatqatBackend`][fatqat.qiskit.FatqatBackend]를 사용하면 FatQat 게이트 수준 시뮬레이터로 실행하면서 Qiskit의 트랜스파일러, 작업 및 결과 API를 그대로 쓸 수 있습니다.'
  status: retired
- id: 4125b5375a1fbc2d
  en: Bind circuit parameters before conversion and transpile gates outside the basis of [`build_simulator_target()`][fatqat.qiskit.build_simulator_target]. Named registers are preserved. The circuit's global phase is recorded in `program.metadata["qiskit_global_phase"]`. FatQat executes the converted operations without that overall phase.
  ko: 변환 전에 회로의 매개변수를 바인딩하세요. [`build_simulator_target()`][fatqat.qiskit.build_simulator_target]의 게이트 기저에 없는 연산은 먼저 트랜스파일합니다. 이름이 있는 레지스터는 유지하며 회로의 전역 위상은 `program.metadata["qiskit_global_phase"]`에 기록합니다. FatQat은 변환된 연산을 실행할 때 이 전체 위상을 적용하지 않습니다.
  status: retired
- id: 1391c53efe0052b2
  en: Transpile to the backend's `target`. Pass a FatQat [`NoiseModel`][fatqat.NoiseModel] as `noise_model` for noisy runs. [`run()`][fatqat.qiskit.FatqatBackend.run] accepts one circuit or a batch, and documents the shot, memory, and seed settings.
  ko: 백엔드의 `target`에 맞춰 회로를 트랜스파일하세요. 잡음이 있는 실행에는 FatQat [`NoiseModel`][fatqat.NoiseModel]을 `noise_model`로 전달합니다. [`run()`][fatqat.qiskit.FatqatBackend.run]은 회로 하나나 배치를 받으며 샷, 메모리, 시드 설정도 이 항목에 설명되어 있습니다.
  status: retired
- id: 8dd1fd53c51668ed
  en: Invalid inputs or options raise [`QiskitBackendError`][fatqat.qiskit.QiskitBackendError] before a job is returned. A later conversion or execution failure is raised by [`FatqatJob.result()`][fatqat.qiskit.FatqatJob.result] as Qiskit's `QiskitError`, with the original error attached.
  ko: 입력이나 옵션이 잘못되면 작업을 반환하기 전에 [`QiskitBackendError`][fatqat.qiskit.QiskitBackendError]가 발생합니다. 이후 변환 또는 실행에 실패하면 [`FatqatJob.result()`][fatqat.qiskit.FatqatJob.result]가 원래 오류를 원인으로 연결한 Qiskit의 `QiskitError`를 일으킵니다.
  status: retired
