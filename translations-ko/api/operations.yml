- id: 9dc7e90e56b2f263
  en: Construction
  ko: 구성
  status: machine
- id: c6c4846e2d6ecd30
  en: For target-based operations, [`add`][fatqat.Program.add] resolves target references, checks arity, and rejects repeated scalar targets. The selected backend checks operation and device support when you submit the program; an unsupported family raises [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]. A direct [`PulseOperation`][fatqat.operations.PulseOperation] follows the channel-addressing rules on [PulseOperation](pulse-control/pulse-operation.md) and is added without targets.
  ko: 대상을 지정하는 연산에서 [`add`][fatqat.Program.add]는 대상 참조를 해석하고 피연산자 수를 검사하며 중복된 스칼라 대상을 거부합니다. 프로그램을 제출하면 선택한 백엔드가 연산과 장치의 지원 여부를 검사합니다. 지원하지 않는 계열은 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]를 발생시킵니다. 직접 작성한 [`PulseOperation`][fatqat.operations.PulseOperation]은 [PulseOperation](pulse-control/pulse-operation.md)의 채널 지정 규칙을 따르며 대상을 지정하지 않고 추가합니다.
  status: machine
- id: e112586e4acd1531
  en: Most targets are a scalar [`RegisterRef`][fatqat.RegisterRef] or an integer. Use an integer when the program has one quantum register; with multiple registers, index the register you want. Controlled gates use control-first order, and the first local operand is the most-significant digit in the matrices and basis actions on the family pages.
  ko: 대부분의 대상은 스칼라 [`RegisterRef`][fatqat.RegisterRef] 또는 정수입니다. 프로그램에 양자 레지스터가 하나뿐이면 정수를 사용할 수 있습니다. 레지스터가 여러 개면 원하는 레지스터를 인덱싱하세요. 제어 게이트는 제어 대상을 먼저 나열합니다. 계열별 페이지의 행렬과 기저 작용에서 첫 번째 국소 피연산자가 최상위 숫자에 해당합니다.
  status: machine
- id: f7b72fa50fc6eb9f
  en: Every built-in unitary gate accepts [`RegisterView`](registers.md#fatqat.RegisterView) targets. A unary gate acts on each selected member. A multi-target gate accepts one compatible view per operand and zips their members in order. See [Registers](registers.md) for the compatibility rules and [Write quantum computations with Program](../guide/program.md) for the ordinary construction workflow.
  ko: 모든 내장 유니터리 게이트는 [`RegisterView`](registers.md#fatqat.RegisterView)를 대상으로 받습니다. 단항 게이트는 선택된 각 원소에 작용합니다. 여러 대상을 받는 게이트는 피연산자마다 호환되는 뷰 하나를 받아 원소들을 순서대로 짝짓습니다. 호환 규칙은 [Registers](registers.md), 일반적인 구성 흐름은 [Program으로 양자 계산 작성](../guide/program.md)을 참고하세요.
  status: machine
- id: 3ec8fc994e977af6
  en: Operation base
  ko: Operation 기반 클래스
  status: machine
- id: 83a7dfd2e4379f90
  en: Subclassing [`Operation`][fatqat.operations.Operation] defines a new program-level value; it does not register a matrix or pulse realization. See [Matrix implementations](implementation.md) for the custom matrix contract and [Gate realization](pulse-control/gate-realization.md) for pulse realizations.
  ko: '[`Operation`][fatqat.operations.Operation]을 상속하면 새로운 프로그램 수준 값을 정의할 수 있지만, 행렬이나 펄스 구현이 등록되지는 않습니다. 사용자 정의 행렬 계약은 [행렬 구현](implementation.md), 펄스 구현은 [게이트 구현](pulse-control/gate-realization.md)을 참고하세요.'
  status: machine
