- id: c9229afb14318ef0
  en: When defining a custom [`Operation`][fatqat.operations.Operation], use `accepts_views` to opt into grouped targets and `validate_targets()` to check parameters against the target registers. To make the operation runnable, see [Matrix implementations](implementation.md) or [Gate realization](pulse-control/gate-realization.md).
  ko: 사용자 정의 [`Operation`][fatqat.operations.Operation]에서 대상을 묶어서 받을 수 있게 하려면 `accepts_views`를 사용하고, 매개변수가 대상 레지스터에 맞는지 검사하려면 `validate_targets()`를 사용하세요. 연산을 실행할 수 있게 하려면 [행렬 구현](implementation.md) 또는 [게이트의 펄스 구현](pulse-control/gate-realization.md)을 참고하세요.
  status: machine
