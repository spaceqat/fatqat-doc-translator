- id: b24995e9873170dd
  en: Atom-array operations
  ko: 원자 배열 연산
  status: machine
- id: 56351782c3074b17
  en: '`Put` manages atom occupancy; `Pair` and `Unpair` manage connectivity. They are not unitary matrix gates. Add them with [`fatqat.Program.add`][fatqat.Program.add]. [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] is the only built-in backend that implements them. Other matrix and pulse backends raise [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError].'
  ko: '`Put`은 원자 점유를, `Pair`와 `Unpair`는 연결 관계를 관리합니다. 이들은 유니터리 행렬 게이트가 아닙니다. [`fatqat.Program.add`][fatqat.Program.add]로 추가하세요. 내장 백엔드 중 이를 구현한 것은 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]뿐입니다. 다른 행렬 및 펄스 백엔드에서는 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]가 발생합니다.'
  status: machine
- id: 12510ccb29102296
  en: '**Atom-array operations**'
  ko: '**원자 배열 연산**'
  status: machine
- id: f8a36ad8ec50b5e2
  en: '| Value | Targets | Effect | Conditions | Attached noise |'
  ko: '| 값 | 대상 | 효과 | 조건 | 부착 잡음 |'
  status: machine
- id: e7b64cec8c35e739
  en: '| [`Put`][fatqat.operations.Put] | One or more scalars, or one [`RegisterView`](../registers.md#fatqat.RegisterView) | Loads `\|0>` into each empty site; leaves occupied sites unchanged. | Allowed. | [`Loss`][fatqat.noise.Loss] only, after each enabled `Put` operation. |'
  ko: '| [`Put`][fatqat.operations.Put] | 스칼라 하나 이상 또는 [`RegisterView`](../registers.md#fatqat.RegisterView) 하나 | 빈 사이트마다 `\|0>`을 로딩합니다. 이미 점유된 사이트는 유지합니다. | 허용. | [`Loss`][fatqat.noise.Loss]만 허용하며, 활성화된 각 `Put` 연산 뒤에 적용합니다. |'
  status: machine
- id: 885cbfdeb0c6ed58
  en: '| [`Pair`][fatqat.operations.Pair] | Exactly two scalars | Adds their undirected connectivity edge; repeated pairing is a no-op. | Rejected. | [`Loss`][fatqat.noise.Loss] or a supported finite channel. |'
  ko: '| [`Pair`][fatqat.operations.Pair] | 정확히 두 스칼라 | 무방향 연결을 추가합니다. 이미 페어링되어 있으면 아무 일도 하지 않습니다. | 거부. | [`Loss`][fatqat.noise.Loss] 또는 지원되는 유한 채널. |'
  status: machine
- id: a74e9835c25bffd8
  en: '| [`Unpair`][fatqat.operations.Unpair] | Exactly two scalars | Removes their edge; removing an absent edge is a no-op. | Rejected. | [`Loss`][fatqat.noise.Loss] or a supported finite channel. |'
  ko: '| [`Unpair`][fatqat.operations.Unpair] | 정확히 두 스칼라 | 연결을 제거합니다. 연결이 없으면 아무 일도 하지 않습니다. | 거부. | [`Loss`][fatqat.noise.Loss] 또는 지원되는 유한 채널. |'
  status: machine
- id: d80ea607936e7baf
  en: Every declared site starts empty on each shot. `Put` is the only operation that loads an atom, and a later `Put` can refill a lost site. Until a site is loaded, supported gates and reset have no effect there, and measurement reports `2`. Native-gate and pairing checks still run first, so an empty site cannot conceal an unsupported gate or unpaired `CZ`.
  ko: 각 샷에서 선언된 모든 사이트는 비어 있는 상태로 시작합니다. 원자를 로딩하는 연산은 `Put`뿐이며, 원자를 잃은 사이트도 나중에 `Put`으로 다시 채울 수 있습니다. 로딩 전에는 지원되는 게이트와 리셋이 그 사이트에 영향을 주지 않고 측정은 `2`를 보고합니다. 다만 네이티브 게이트와 페어링 검사는 먼저 수행하므로, 빈 사이트라고 해서 지원되지 않는 게이트나 페어링되지 않은 `CZ`가 허용되지는 않습니다.
  status: machine
- id: 9fe122dc238ed5a9
  en: A [`Loss`][fatqat.noise.Loss] declaration attached to `Put` shares the operation's condition and runs after every matching `Put` whose condition passes, even if the target was already occupied and loading did nothing.
  ko: '`Put`에 붙인 [`Loss`][fatqat.noise.Loss] 선언은 연산과 같은 조건을 따릅니다. 일치하는 `Put`의 조건이 참이면 그 뒤에 항상 실행되며, 대상이 이미 점유되어 로딩이 아무 일도 하지 않은 경우도 포함합니다.'
  status: machine
- id: 2aaa5f6c89a958b0
  en: To load an entire named register, use `program.add(ops.Put, register.all())`; the view expands into one variadic `Put` over its members. For a program created from an integer site count, use `program.add(ops.Put, tuple(range(num_atoms)))`.
  ko: 이름 있는 레지스터 전체에 로딩하려면 `program.add(ops.Put, register.all())`을 사용하세요. 뷰는 모든 원소에 대한 가변 인수 `Put` 하나로 확장됩니다. 정수 사이트 수로 만든 프로그램에서는 `program.add(ops.Put, tuple(range(num_atoms)))`을 사용하세요.
  status: machine
- id: 40ef0cbd7b3555ae
  en: '`Pair` and `Unpair` update the connectivity used by later supported gates; they do not change the quantum state or make an unsupported gate available. In the built-in atom-array profile, [`CZ`][fatqat.operations.CZ] is native and requires a current pairing. The atom backend rejects a condition on either instruction with [`BackendValidationError`][fatqat.errors.BackendValidationError] when the program runs.'
  ko: '`Pair`와 `Unpair`는 이후 지원 게이트가 사용하는 연결 관계를 바꿉니다. 양자 상태를 바꾸거나 지원하지 않는 게이트를 사용할 수 있게 만들지는 않습니다. 내장 원자 배열 프로필에서 [`CZ`][fatqat.operations.CZ]는 네이티브 게이트이며 현재 페어링이 필요합니다. 두 명령에 조건을 지정하면 원자 백엔드는 실행 시 [`BackendValidationError`][fatqat.errors.BackendValidationError]로 거부합니다.'
  status: machine
