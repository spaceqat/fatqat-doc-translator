- id: 095ab408027488e6
  en: Optical gates
  ko: 광학 게이트
  status: machine
- id: 58361384ac5f822e
  en: These gates act on optical modes, where level `n` is the photon number. They run on [`ModeRegister`][fatqat.ModeRegister] slots under [`LOSimulator`](../simulators/linear-optics.md), and on fixed-dimension [`QuantumRegister`][fatqat.QuantumRegister] slots, where level `d - 1` is the largest photon number. Both gates keep the total photon number.
  ko: 이 게이트들은 준위 `n`이 광자 수를 뜻하는 광학 모드에 작용합니다. [`LOSimulator`](../simulators/linear-optics.md)의 [`ModeRegister`][fatqat.ModeRegister] 슬롯과 고정 차원의 [`QuantumRegister`][fatqat.QuantumRegister] 슬롯에서 실행할 수 있습니다. 고정 차원에서는 준위 `d - 1`이 최대 광자 수입니다. 두 게이트 모두 총 광자 수를 보존합니다.
  status: machine
- id: 1c86f71a32dac445
  en: '| Constructor | Targets | Action |'
  ko: '| 생성자 | 대상 | 작용 |'
  status: machine
- id: fb419dc4d9db3c92
  en: '| [`PhaseShifter`][fatqat.operations.PhaseShifter] `(phi)` | One mode or view | `\|n> -> exp(i*n*phi)\|n>`. On a dimension-2 target it is `Phase(phi)`. |'
  ko: '| [`PhaseShifter`][fatqat.operations.PhaseShifter] `(phi)` | 모드 또는 뷰 하나 | `\|n> -> exp(i*n*phi)\|n>`. 차원이 2인 대상에서는 `Phase(phi)`와 같습니다. |'
  status: machine
- id: 42555206fb424666
  en: '| [`BeamSplitter`][fatqat.operations.BeamSplitter] `(theta, phi=0.0)` | Two modes `(mode_0, mode_1)`, or two views | Mixes the modes with reflectivity `sin(theta)**2`; `theta=pi/4` is a 50:50 splitter. |'
  ko: '| [`BeamSplitter`][fatqat.operations.BeamSplitter] `(theta, phi=0.0)` | 두 모드 `(mode_0, mode_1)` 또는 두 뷰 | 반사율 `sin(theta)**2`로 모드를 혼합합니다. `theta=pi/4`는 50:50 빔 스플리터입니다. |'
  status: machine
- id: aec12b984fa4ba45
  en: Angles are numbers in radians or [`Parameter`][fatqat.Parameter] values to bind before execution.
  ko: 각도는 라디안 단위의 수치 또는 실행 전에 바인딩할 [`Parameter`][fatqat.Parameter] 값입니다.
  status: machine
- id: 6825bd331ce46a6c
  en: Beam splitter definition
  ko: 빔 스플리터 정의
  status: machine
- id: 99b528ec05df1e0e
  en: With annihilation operators $a_0$ and $a_1$ of the two targets,
  ko: 두 대상의 소멸 연산자를 $a_0$와 $a_1$이라 하면,
  status: machine
- id: 4c8dfd4083c84b95
  en: On one photon, in the ordered basis $\lvert 1, 0\rangle, \lvert 0, 1\rangle$, it acts as
  ko: '광자 하나에 대해 순서 있는 기저 $\lvert 1, 0\rangle, \lvert 0, 1\rangle$에서 다음과 같이 작용합니다:'
  status: machine
- id: 6104f6bc2e28d3e3
  en: For a dual-rail qubit with $\lvert 0\rangle = \lvert 1, 0\rangle$ and $\lvert 1\rangle = \lvert 0, 1\rangle$, `BeamSplitter(a / 2, -pi / 2)` acts as `RX(a)` and `BeamSplitter(a / 2)` acts as `RY(a)`.
  ko: $\lvert 0\rangle = \lvert 1, 0\rangle$, $\lvert 1\rangle = \lvert 0, 1\rangle$인 이중 레일 큐비트에서 `BeamSplitter(a / 2, -pi / 2)`는 `RX(a)`로, `BeamSplitter(a / 2)`는 `RY(a)`로 작용합니다.
  status: machine
- id: 89645198ddad3fa6
  en: Truncation
  ko: 절단
  status: machine
- id: 95679ad4e81b0b75
  en: A finite cutoff keeps both gates unitary. `PhaseShifter` is always exact. `BeamSplitter` is exact while its two modes hold at most `cutoff` photons in total (`d - 1` on dimension-`d` targets); beyond that, its result is an approximation.
  ko: 유한한 절단값을 사용해도 두 게이트는 유니터리를 유지합니다. `PhaseShifter`는 항상 정확합니다. `BeamSplitter`는 두 모드의 총 광자 수가 `cutoff` 이하일 때(차원이 `d`인 대상에서는 `d - 1` 이하) 정확하며, 이를 넘으면 근삿값을 반환합니다.
  status: machine
