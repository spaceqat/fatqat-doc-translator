- id: 177dd5eae12329b6
  en: <a id="noise-backend-support"></a>
  ko: <a id="noise-backend-support"></a>
  status: machine
- id: 7354235e0d0b9af3
  en: Use these tables to see which built-in backends accept each noise type and form. **Built in** means the standard backend accepts it. **Unsupported** means the backend family rejects it.
  ko: 다음 표에서 각 잡음 타입과 형식을 받는 내장 백엔드를 확인할 수 있습니다. **내장 지원**은 기본 백엔드에서 지원한다는 뜻이며, **미지원**은 해당 백엔드 계열에서 거부한다는 뜻입니다.
  status: machine
- id: b5b07a3a53fdcaaf
  en: For one configured backend, use [`validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] on a simulator or [`validate_noise_model`][fatqat.emulator.TransmonEmulator.validate_noise_model] on a pulse emulator. These methods validate a model without a program. FATQAT checks references, device labels, operation matches, dimensions, and execution-method limits when it runs a concrete program.
  ko: 설정한 백엔드 하나를 검사하려면 시뮬레이터의 [`validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] 또는 펄스 에뮬레이터의 [`validate_noise_model`][fatqat.emulator.TransmonEmulator.validate_noise_model]을 사용하세요. 이 메서드는 프로그램 없이 모델을 검증합니다. 참조, 장치 레이블, 연산 매칭, 차원, 실행 방법의 제약은 FATQAT이 구체적인 프로그램을 실행할 때 검사합니다.
  status: machine
- id: 90cf92cf1c59d920
  en: <a id="noise-simulator-support"></a>
  ko: <a id="noise-simulator-support"></a>
  status: machine
- id: 273b17439d3ec7d8
  en: '[`Simulator`][fatqat.simulator.Simulator], [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator], and [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] share these channel rules. The two hardware profiles may impose additional operation, placement, and dimension limits.'
  ko: '[`Simulator`][fatqat.simulator.Simulator], [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator], [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]는 이 채널 규칙을 공유합니다. 두 하드웨어 프로파일은 연산, 배치, 차원에 추가 제약을 둘 수 있습니다.'
  status: machine
- id: e420516e225ad18e
  en: '**Built-in simulator channels**'
  ko: '**내장 시뮬레이터 채널**'
  status: machine
- id: f69cc19c296f6fca
  en: '| Noise type and form | Support |'
  ko: '| 잡음 타입과 형식 | 지원 범위 |'
  status: machine
- id: 49afff269f2988a5
  en: '| [`Depolarizing`][fatqat.noise.Depolarizing] `(p)` | **Built in.** Applies jointly to the selected operands after a matching operation. |'
  ko: '| [`Depolarizing`][fatqat.noise.Depolarizing] `(p)` | **내장 지원.** 매칭되는 연산 뒤에 선택한 피연산자들에 공동으로 적용합니다. |'
  status: machine
- id: 1f35ce85fedbe122
  en: '| [`PauliChannel`][fatqat.noise.PauliChannel] | **Built in.** The string width must equal the number of selected qubit operands. |'
  ko: '| [`PauliChannel`][fatqat.noise.PauliChannel] | **내장 지원.** 문자열 길이는 선택한 큐비트 피연산자 수와 같아야 합니다. |'
  status: machine
- id: 0fdcea30a08f4c2b
  en: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] `(p)` | **Built in for qubits.** Applies the conventional finite amplitude-damping channel to one selected operand. |'
  ko: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] `(p)` | **큐비트에 내장 지원.** 선택한 피연산자 하나에 일반적인 유한 진폭 감쇠 채널을 적용합니다. |'
  status: machine
- id: 4e76ff521b5e3e66
  en: '| [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(p)` | **Built in.** Applies one explicit local jump; matching declarations are applied sequentially in registration order. |'
  ko: '| [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(p)` | **내장 지원.** 명시적인 국소 점프 하나를 적용합니다. 매칭되는 선언은 등록 순서대로 차례로 적용됩니다. |'
  status: machine
- id: eb01d30aedabc801
  en: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] `(p)` | **Built in.** Applies to one selected operand of any finite local dimension. |'
  ko: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] `(p)` | **내장 지원.** 유한한 국소 차원을 갖는 피연산자 하나에 적용합니다. |'
  status: machine
- id: cb4a2799ffb2b8c1
  en: '| Built-in rate forms and [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | **Unsupported.** Simulators have no physical timeline and do not convert rates or times into a channel application. |'
  ko: '| 내장 비율 형식과 [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | **미지원.** 시뮬레이터에는 물리 타임라인이 없으며, 비율이나 시간을 채널 적용으로 변환하지 않습니다. |'
  status: machine
- id: 51e0a572e34fa2c3
  en: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | **Built in.** Applies universally or to one measured operand. The matrix size must equal the reported digit dimension; [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator] therefore requires `2 x 2`. |'
  ko: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | **내장 지원.** 모든 측정 또는 측정 피연산자 하나에 적용합니다. 행렬 크기는 보고되는 숫자의 차원과 같아야 하므로 [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator]는 `2 x 2`를 요구합니다. |'
  status: machine
- id: 9763a43883f27197
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] also supports [`Loss`][fatqat.noise.Loss], sampling each selected carrier that is present after a matching operation. Sites begin empty and [`Put`][fatqat.operations.Put] loads them, so loss attached to `Put` can model a loading failure. Other simulators reject `Loss`. Because an empty site produces no physical readout digit, its erasure value `2` bypasses readout confusion.'
  ko: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]는 [`Loss`][fatqat.noise.Loss]도 지원합니다. 매칭되는 연산 뒤에 선택한 운반체 중 현재 존재하는 각각에 대해 손실을 샘플링합니다. 사이트는 비어 있는 상태에서 시작하고 [`Put`][fatqat.operations.Put]으로 원자를 넣으므로, `Put`에 연결한 손실로 로딩 실패를 모델링할 수 있습니다. 다른 시뮬레이터는 `Loss`를 거부합니다. 빈 사이트에서는 물리 판독 숫자가 생기지 않으므로 소실 값 `2`는 판독 혼동을 거치지 않습니다.'
  status: machine
- id: 62f47db58934afab
  en: '`AtomArraySimulator` accepts only single-subsystem finite channels. Use `target_positions` to select an operand of a multi-subsystem operation; see [occupancy and loss](../simulators/atom-array.md#occupancy-and-loss) for an example and behavior when an atom is absent.'
  ko: '`AtomArraySimulator`는 단일 부분계 유한 채널만 받습니다. 여러 부분계에 작용하는 연산에서 피연산자를 선택하려면 `target_positions`를 사용하세요. 예제와 원자가 없을 때의 동작은 [점유와 손실](../simulators/atom-array.md#occupancy-and-loss)을 참고하세요.'
  status: machine
- id: 82c7c42462973cbf
  en: Attach every supported probability-form channel above to an operation; matrix backends reject background channels. A custom [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] can add a finite channel type or replace the rule for an existing one. It cannot override the rejection of built-in rate forms, background channels, or `ThermalRelaxation`. A custom type's parameter names are interpreted by its rule, whose result still represents one finite channel application. A supplied map replaces the default map and is copied when the backend is constructed.
  ko: 위에서 지원하는 모든 확률 형식 채널은 연산에 연결해야 합니다. 행렬 백엔드는 배경 채널을 거부합니다. 사용자 정의 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]으로 유한 채널 타입을 추가하거나 기존 타입의 규칙을 바꿀 수 있습니다. 그러나 내장 비율 형식, 배경 채널, `ThermalRelaxation`의 거부 동작은 바꿀 수 없습니다. 사용자 정의 타입의 매개변수 이름은 해당 규칙이 해석하며, 그 결과는 여전히 유한 채널 한 번의 적용을 나타냅니다. 전달한 맵은 기본 맵을 대체하고 백엔드 생성 시 복사됩니다.
  status: machine
- id: ed8073b6663c451e
  en: Execution method also matters. `statevector` samples one Kraus trajectory per noisy shot, while `density_matrix` and `superop` apply probability-form channels exactly. `unitary` rejects any channel that matches the program. Only `statevector` and `density_matrix` support the AtomArray occupancy lifecycle; requesting a final state with loss requires `shots == 1`.
  ko: 실행 방법도 중요합니다. `statevector`는 잡음이 있는 샷마다 Kraus 궤적 하나를 샘플링하고, `density_matrix`와 `superop`은 확률 형식 채널을 정확히 적용합니다. `unitary`는 프로그램과 매칭되는 채널을 모두 거부합니다. AtomArray 점유 수명 주기는 `statevector`와 `density_matrix`만 지원합니다. 손실이 있을 때 최종 상태를 요청하려면 `shots == 1`이어야 합니다.
  status: machine
- id: a8fb7d389dad1bf5
  en: <a id="noise-emulator-support"></a>
  ko: <a id="noise-emulator-support"></a>
  status: machine
- id: ac7d35b392ad9f96
  en: Pulse emulators use local Lindblad operators built from supported rates and times. They do not infer a rate from a probability. Built-in probability forms, [`PauliChannel`][fatqat.noise.PauliChannel], and [`Loss`][fatqat.noise.Loss] are unsupported. Each emulator family owns its continuous-noise realizations.
  ko: 펄스 에뮬레이터는 지원되는 비율과 시간으로 구성한 국소 Lindblad 연산자를 사용합니다. 확률에서 비율을 추론하지 않습니다. 내장 확률 형식, [`PauliChannel`][fatqat.noise.PauliChannel], [`Loss`][fatqat.noise.Loss]는 지원하지 않습니다. 각 에뮬레이터 계열이 자신의 연속 잡음 구현을 관리합니다.
  status: machine
- id: a97a21f3c246baba
  en: '**Emulator support**'
  ko: '**에뮬레이터 지원 범위**'
  status: machine
- id: ec8caf51af802596
  en: '| Backend | Built-in Lindblad-operator behavior | Readout and limits |'
  ko: '| 백엔드 | 내장 Lindblad 연산자 동작 | 판독과 제약 |'
  status: machine
- id: aacf85527d823f77
  en: '| [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] | Background or operation scope: [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(rate)` with explicit coefficients, [`PhaseDamping`][fatqat.noise.PhaseDamping] `(rate or t_phi)`, and [`Depolarizing`][fatqat.noise.Depolarizing] `(rate)` over the full qutrit. | Readout confusion is built in and binary. Construction and [`validate_noise_model`][fatqat.emulator.TransmonEmulator.validate_noise_model] require a `2 x 2` matrix. |'
  ko: '| [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] | 배경 또는 연산 범위: 명시적 계수를 갖는 [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(rate)`, [`PhaseDamping`][fatqat.noise.PhaseDamping] `(rate or t_phi)`, 전체 큐트릿에 대한 [`Depolarizing`][fatqat.noise.Depolarizing] `(rate)`. | 이진 판독 혼동을 내장 지원합니다. 생성 시와 [`validate_noise_model`][fatqat.emulator.TransmonEmulator.validate_noise_model]에서 `2 x 2` 행렬을 요구합니다. |'
  status: machine
- id: de86eab7ed62de42
  en: '| [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator] | Background scope: qubit [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] `(rate)`, explicit [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(rate)`, [`PhaseDamping`][fatqat.noise.PhaseDamping] `(rate or t_phi)`, qubit [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation], and [`Depolarizing`][fatqat.noise.Depolarizing] `(rate)`. | Operation-scoped continuous noise is unsupported. Readout confusion is built in and `2 x 2` only. |'
  ko: '| [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator] | 배경 범위: 큐비트 [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] `(rate)`, 명시적 [`TransitionRelaxation`][fatqat.noise.TransitionRelaxation] `(rate)`, [`PhaseDamping`][fatqat.noise.PhaseDamping] `(rate or t_phi)`, 큐비트 [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation], [`Depolarizing`][fatqat.noise.Depolarizing] `(rate)`. | 연산 범위의 연속 잡음은 지원하지 않습니다. 판독 혼동은 `2 x 2`만 내장 지원합니다. |'
  status: machine
- id: b8ff4b37fe98062f
  en: Each supported background declaration selects one site. Transmon operation-scoped noise is active only during matching pulse windows. Readout confusion may apply to every measurement or one operand; correlated multi-operand readout is not supported.
  ko: 지원되는 각 배경 잡음 선언은 사이트 하나를 선택합니다. Transmon의 연산 범위 잡음은 매칭되는 펄스 구간에만 활성화됩니다. 판독 혼동은 모든 측정 또는 피연산자 하나에 적용할 수 있으며, 여러 피연산자의 상관 판독은 지원하지 않습니다.
  status: machine
- id: 84d7bbbb460f5231
  en: Rates use the inverse of the model's time unit. `t_phi`, `t1`, and `t2` use that unit directly on families that accept them. The reference [`time_unit`][fatqat.emulator.TransmonModel.time_unit] is nanoseconds, while [`time_unit`][fatqat.emulator.Atom2LevelModel.time_unit] is microseconds. Read the chosen model's `time_unit` rather than guessing from a value's magnitude.
  ko: 비율의 단위는 모델 시간 단위의 역수입니다. `t_phi`, `t1`, `t2`를 받는 계열에서는 이 값에 시간 단위를 그대로 사용합니다. 기준 [`time_unit`][fatqat.emulator.TransmonModel.time_unit]은 나노초이고, [`time_unit`][fatqat.emulator.Atom2LevelModel.time_unit]은 마이크로초입니다. 값의 크기로 추측하지 말고 선택한 모델의 `time_unit`을 읽으세요.
  status: machine
- id: cd658d9c89abdf58
  en: Unsupported continuous declarations cannot be enabled through emulator construction. Use `NoiseModel` for the declarations listed above and call the family's `validate_noise_model()` method for an eager support check.
  ko: 지원하지 않는 연속 잡음 선언을 에뮬레이터 생성 옵션으로 활성화할 수는 없습니다. 위의 선언에는 `NoiseModel`을 사용하고, 해당 계열의 `validate_noise_model()`로 지원 여부를 미리 확인하세요.
  status: machine
