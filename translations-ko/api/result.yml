- id: 2d9fc6b1f62e76ef
  en: Simulators return NumPy arrays. For statevectors, density matrices, and unitaries, pulse emulators return QuTiP `Qobj` values. The individual state accessors document the shapes and how to convert to arrays.
  ko: 시뮬레이터는 NumPy 배열을 반환합니다. 펄스 에뮬레이터가 반환하는 상태 벡터, 밀도 행렬, 유니터리 연산자는 QuTiP `Qobj`입니다. 각 상태 접근 메서드의 설명에서 반환 형태와 배열로 바꾸는 방법을 확인할 수 있습니다.
  status: machine
- id: d7997fc1eacdfaaf
  en: Result metadata
  ko: 결과 메타데이터
  status: machine
- id: 5b82c4ab34c05821
  en: '`metadata` records details of the run. Built-in simulators and pulse emulators record normalized `execution_config` and `result_config` on direct runs. A pulse run also records `runtime="qutip"` and, when a solver runs, the solver names and options in `runtime_details`. Estimator results carry their own run metadata.'
  ko: '`metadata`에는 실행 정보가 들어 있습니다. 내장 시뮬레이터나 펄스 에뮬레이터를 직접 실행하면 정규화된 `execution_config`와 `result_config`가 기록됩니다. 펄스 실행에서는 `runtime="qutip"`도 기록하고, 솔버를 실행한 경우 이름과 옵션을 `runtime_details`에 담습니다. Estimator 결과에는 해당 실행의 메타데이터가 들어 있습니다.'
  status: retired
- id: 161d6f141b421da3
  en: Accessors generally return the stored objects. Copy an array or a dictionary such as `metadata` before editing it if you need to preserve its original contents.
  ko: 접근 메서드는 보통 저장된 객체를 그대로 반환합니다. 원본 내용을 보존하려면 배열이나 `metadata` 같은 딕셔너리를 복사한 뒤 수정하세요.
  status: retired
- id: edfe96bf6c14704b
  en: Call [`draw()`][fatqat.Result.draw] on a result with counts to get a Matplotlib figure. Use `stat="frequencies"` to show relative frequencies, or `number_to_keep` to group less frequent outcomes into an `other` bar.
  ko: 측정 횟수가 들어 있는 결과에서 [`draw()`][fatqat.Result.draw]를 호출하면 Matplotlib 그림이 반환됩니다. 상대 빈도를 표시하려면 `stat="frequencies"`를, 드물게 나온 결과를 `other` 막대로 묶으려면 `number_to_keep`를 사용하세요.
  status: retired
- id: 93ad39827f2faf13
  en: A [`Result`][fatqat.Result] contains the data produced by one execution, such as measurement counts, a final state, or expectation values. Its `available_data` lists the fields you can read. Accessing a missing field raises [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError].
  ko: '[`Result`][fatqat.Result]는 한 번 실행해서 얻은 데이터, 예를 들어 측정 횟수, 최종 상태, 기댓값을 담습니다. 읽을 수 있는 필드는 `available_data`에서 확인할 수 있습니다. 없는 필드를 읽으면 [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError]가 발생합니다.'
  status: machine
- id: cadd8e7f66592426
  en: Choose [`get_counts()`][fatqat.Result.get_counts] for display strings or [`get_counts_as_tuples()`][fatqat.Result.get_counts_as_tuples] for integer tuples. Both follow classical register order. A tuple key `(1, 0)` is displayed as `"10"` in a binary register.
  ko: 측정 횟수를 표시할 때는 [`get_counts()`][fatqat.Result.get_counts]로 문자열 키를, 각 값을 정수로 처리할 때는 [`get_counts_as_tuples()`][fatqat.Result.get_counts_as_tuples]로 튜플 키를 얻으세요. 두 키 모두 고전 레지스터 원소 순서를 따릅니다. 이진 레지스터에서 튜플 키 `(1, 0)`은 `"10"`으로 표시됩니다.
  status: machine
- id: 761ed3581beca8d5
  en: Read `metadata["state_axes"]` to match state and operator entries to physical subsystems. Each entry gives a device label (`device_operand`) and its program reference (`register_ref`). An unused physical subsystem has reference `None`. The first subsystem is the most significant in the basis index. For dimensions `dims`, position `q` has place value `prod(dims[q + 1:])`. This order applies to statevectors, both axes of density matrices and unitaries, and the underlying basis of superoperators.
  ko: '`metadata["state_axes"]`를 보면 상태와 연산자의 각 항목이 어느 물리 하위 시스템에 해당하는지 알 수 있습니다. 항목마다 장치 레이블(`device_operand`)과 프로그램 참조(`register_ref`)가 있습니다. 프로그램에서 쓰지 않은 물리 하위 시스템의 참조는 `None`입니다. 첫 번째 하위 시스템이 기저 인덱스에서 최상위 자리를 차지합니다. 차원이 `dims`일 때 위치 `q`의 자릿값은 `prod(dims[q + 1:])`입니다. 상태 벡터, 밀도 행렬과 유니터리의 두 축, 초연산자의 기저가 이 순서를 따릅니다.'
  status: machine
- id: 8beea139218e27ed
  en: On a direct backend run, check `metadata` for the effective `execution_config` and `result_config`. The [`Result`][fatqat.Result] reference below describes the solver information that pulse results can also carry. Copy stored arrays or dictionaries before editing them if you want to preserve the original values.
  ko: 백엔드를 직접 실행한 뒤에는 `metadata`에서 적용된 `execution_config`와 `result_config`를 확인할 수 있습니다. 아래의 [`Result`][fatqat.Result] 항목에는 펄스 결과에 기록될 수 있는 솔버 정보도 설명되어 있습니다. 원래 값을 보존하려면 배열이나 딕셔너리를 복사한 뒤 수정하세요.
  status: retired
- id: 631e64de360e40eb
  en: A result with measurement counts can plot them with [`draw()`][fatqat.Result.draw].
  ko: 측정 횟수가 있는 결과는 [`draw()`][fatqat.Result.draw]로 그릴 수 있습니다.
  status: machine
- id: 75daa038e789d2b9
  en: Built-in simulators and pulse emulators record the effective `execution_config` and `result_config` in `metadata` for direct runs. The [`Result`][fatqat.Result] reference also describes solver information available from pulse runs. If you plan to edit a stored array or dictionary, copy it first to preserve the original.
  ko: 내장 시뮬레이터나 펄스 에뮬레이터를 직접 실행하면 사용한 `execution_config`와 `result_config`를 `metadata`에 기록합니다. 펄스 실행의 솔버 정보는 [`Result`][fatqat.Result] 항목에도 설명되어 있습니다. 원본을 보존하려면 배열이나 딕셔너리를 수정하기 전에 복사하세요.
  status: machine
