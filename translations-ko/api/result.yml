- id: 8a62ea8e861cc0e5
  en: '| `"fixed_photon_state"` | [`get_fixed_photon_state`][fatqat.Result.get_fixed_photon_state] | A linear-optics run that returns fixed-photon amplitudes |'
  ko: '| `"fixed_photon_state"` | [`get_fixed_photon_state`][fatqat.Result.get_fixed_photon_state] | 고정 광자 수 상태의 진폭을 반환하는 선형 광학 실행 |'
