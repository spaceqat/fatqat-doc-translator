  en: 'A result containing counts can draw them directly:'
  ko: Counts를 포함한 결과에서는 바로 그래프를 그릴 수 있습니다.
  status: retired
- id: 7cf6f6278f245f67
  en: The default `stat="counts"` plots raw occurrences. `stat="frequencies"` divides each value by the total number of shots. FATQAT supplies the default categorical palette and preserves an explicitly configured Matplotlib color cycle and other `rcParams`. `number_to_keep` retains the most frequent outcomes and combines the remainder into an `other` bar.
  ko: 기본값 `stat="counts"`는 관측 횟수를 그대로 그립니다. `stat="frequencies"`는 각 값을 전체 샷 수로 나눕니다. FATQAT은 기본 범주형 팔레트를 제공하되, 명시적으로 설정한 Matplotlib 색상 순환과 나머지 `rcParams`는 유지합니다. `number_to_keep`은 가장 자주 나타난 결과만 남기고 나머지를 `other` 막대 하나로 합칩니다.
  status: retired
- id: dab3b6195075ac6d
  en: Most other accessors return the value stored in the result. Copy arrays or dictionaries before changing them if you need to preserve the original. Metadata from a direct backend run records the normalized `execution_config` and `result_config`; the deprecated key `simulation_config` holds a copy of `execution_config` until it is removed before FATQAT 0.1.0. Backend extensions may add fields. Pulse-emulator metadata records `runtime="qutip"` and a `runtime_details` mapping with `solver` and `solver_options`. A run that invokes multiple solvers reports their names as a tuple. These numerical-runtime details are informational. Keep the model, arrangement, controls, and application metadata alongside a result when they are needed to reproduce a physical run.
  ko: 그 밖의 접근 메서드는 대부분 결과에 저장된 값을 그대로 반환합니다. 원본을 보존해야 한다면 배열이나 딕셔너리를 수정하기 전에 복사하세요. 백엔드 직접 실행의 메타데이터에는 정규화된 `execution_config`와 `result_config`가 기록됩니다. 사용 중단 예정인 키 `simulation_config`에는 `execution_config`의 복사본이 저장되며, 이 키는 FATQAT 0.1.0 출시 전에 제거됩니다. 백엔드 확장은 필드를 추가할 수 있습니다. 펄스 에뮬레이터의 메타데이터에는 `runtime="qutip"`와 `solver`, `solver_options`를 담은 `runtime_details` 매핑이 기록됩니다. 솔버를 여러 개 호출한 실행은 그 이름을 튜플로 보고합니다. 이러한 수치 런타임 정보는 참고용입니다. 물리적 실행을 재현하는 데 필요하다면 모델, 원자 배치, 제어, 애플리케이션 메타데이터를 결과와 함께 보관하세요.
  status: retired
- id: fa2676e477dfd94c
  en: A [`Result`][fatqat.Result] holds the data produced by one backend or estimator run. Use the accessor for the data you requested. If a field is optional, check `available_data` for its name before reading it. A missing field raises [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError].
  ko: '[`Result`][fatqat.Result]는 백엔드나 Estimator를 한 번 실행해서 얻은 데이터를 담습니다. 요청한 데이터에 해당하는 접근 메서드를 사용하세요. 선택적인 필드는 읽기 전에 `available_data`에 그 이름이 있는지 확인할 수 있습니다. 없는 필드를 읽으면 [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError]가 발생합니다.'
  status: retired
