- id: c1038843366658a8
  en: '| OpenQASM 2 or 3 | [`compile_qasm_to_sc()`][fatqat.compiler.compile_qasm_to_sc] | [`compile_qasm_to_na()`][fatqat.compiler.compile_qasm_to_na] |'
  ko: '| OpenQASM 2 또는 3 | [`compile_qasm_to_sc()`][fatqat.compiler.compile_qasm_to_sc] | [`compile_qasm_to_na()`][fatqat.compiler.compile_qasm_to_na] |'
  status: machine
- id: d42cf30f6406bf32
  en: For superconducting compilation, pass an [`SCTarget`](sc-target.md) or an [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator]. For neutral-atom compilation, pass an architecture such as one returned by [`load_architecture()`][fatqat.compiler.algorithms.load_architecture].
  ko: 초전도 장치용으로 컴파일할 때는 [`SCTarget`](sc-target.md) 또는 [`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator]를 넘깁니다. 중성 원자 장치에는 아키텍처가 필요합니다. [`load_architecture()`][fatqat.compiler.algorithms.load_architecture]로 불러온 아키텍처를 사용할 수 있습니다.
  status: machine
- id: 71ee326e356f8cbb
  en: With the default `emit`, the four compile functions return an [`ExecutableCompilationResult`][fatqat.compiler.ExecutableCompilationResult]. Pass it directly to a compatible simulator. To inspect an intermediate representation, set `emit` to the boundary you want and read `output` from the returned [`CompilationResult`][fatqat.compiler.CompilationResult].
  ko: 기본 `emit` 값으로 호출하면 네 컴파일 함수는 모두 [`ExecutableCompilationResult`][fatqat.compiler.ExecutableCompilationResult]를 반환합니다. 이 결과는 호환 시뮬레이터에 바로 넘겨 실행할 수 있습니다. 중간 표현을 살펴보려면 `emit`으로 멈출 단계를 지정하고, 반환된 [`CompilationResult`][fatqat.compiler.CompilationResult]의 `output`을 읽으세요.
  status: machine
- id: 9c2bbcce5304f7d4
  en: Compiler errors share the `CompilerError` base class. When a compiler pass fails, check `PassError.pass_name` to find the failing stage and `__cause__` for the underlying error.
  ko: 컴파일러 오류는 모두 `CompilerError`를 상속합니다. 컴파일 패스가 실패하면 `PassError.pass_name`으로 실패한 단계를 찾고, `__cause__`에서 원래 오류를 확인하세요.
  status: machine
