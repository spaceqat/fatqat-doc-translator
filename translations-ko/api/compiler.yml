- id: e79e4b8fee7065f5
  en: Compiler errors share the `CompilerError` base class. `PassError` includes the stage that failed and preserves the original error as its cause.
  ko: 컴파일러 오류는 공통 기반 클래스 `CompilerError`를 사용합니다. `PassError`에는 실패한 단계가 포함되며 원래 오류가 원인으로 보존됩니다.
  status: machine
- id: 1b2e0db5d9659e95
  en: 'Choose a function based on your input and target:'
  ko: 입력 형식과 컴파일 대상에 맞는 함수를 고르세요.
  status: machine
- id: 3083e5a62d12d20d
  en: '| [`LogicalProgram`](logical-program.md) | [`compile_to_sc()`][fatqat.compiler.compile_to_sc] | [`compile_to_na()`][fatqat.compiler.compile_to_na] |'
