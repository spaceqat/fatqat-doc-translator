- id: 1d6ccfdd2ae4637c
  en: SampledWaveform
  ko: SampledWaveform
  status: machine
- id: 8dc6eae65ae75c28
  en: '[`SampledWaveform`][fatqat.emulator.SampledWaveform] describes a signal on a local time grid. Times use the model''s time unit, while the channel determines the sample unit and whether values may be complex.'
  ko: '[`SampledWaveform`][fatqat.emulator.SampledWaveform]은 국소 시간 격자 위의 신호를 기술합니다. 시간에는 모델의 시간 단위를 사용하며, 샘플 단위와 복소수 허용 여부는 채널이 정합니다.'
  status: machine
- id: 10a8eec8b07a4d49
  en: Interpolation
  ko: 보간
  status: machine
- id: 920f9a623db66511
  en: Built-in pulse emulators use not-a-knot spline interpolation. Two samples give a linear curve, three give a quadratic curve, and four or more give a cubic curve.
  ko: 내장 펄스 에뮬레이터는 not-a-knot 스플라인 보간을 사용합니다. 샘플이 두 개면 선형, 세 개면 2차, 네 개 이상이면 3차 곡선이 됩니다.
  status: machine
- id: 0ca833ecdc811b1b
  en: '`Atom2LevelEmulator` uses zero outside the sample interval. `TransmonEmulator` holds the nearest endpoint within the enclosing pulse block, so use zero first and last samples when a control should be off outside its grid. Every control is zero outside its block, allowing sequential pulse operations to compose without one block contributing during another. These rules do not change the operation''s duration.'
  ko: '`Atom2LevelEmulator`는 샘플 구간 밖에서 0을 사용합니다. `TransmonEmulator`는 해당 펄스 블록 안에서는 가장 가까운 끝점 값을 유지하므로, 격자 밖에서 제어가 꺼져야 한다면 처음과 마지막 샘플을 0으로 지정하세요. 모든 제어는 자기 블록 밖에서 0입니다. 따라서 순차 펄스 연산을 연결해도 한 블록이 다른 블록의 시간에 작용하지 않습니다. 이 규칙들은 연산의 지속시간을 바꾸지 않습니다.'
  status: machine
- id: 2c55dfd5ae9baed1
  en: A spline can exceed the supplied sample values between points. If a model has amplitude limits, the emulator checks the interpolated curve as well as the samples.
  ko: 스플라인은 샘플 사이에서 주어진 샘플 값의 범위를 벗어날 수 있습니다. 모델에 진폭 제한이 있으면 에뮬레이터는 샘플뿐 아니라 보간 곡선도 검사합니다.
  status: machine
- id: 28ee66f7935388c9
  en: See the [`SampledWaveform` reference][fatqat.emulator.SampledWaveform] for the spline degree used between samples. Outside the sample interval, emulators handle controls differently.
  ko: 샘플 사이에 적용하는 스플라인의 차수는 [`SampledWaveform` 레퍼런스][fatqat.emulator.SampledWaveform]에서 확인할 수 있습니다. 샘플 구간 밖의 값은 에뮬레이터마다 다르게 처리합니다.
  status: machine
- id: 15a14cc68b39d7c8
  en: '`Atom2LevelEmulator` uses zero.'
  ko: '`Atom2LevelEmulator`는 샘플 구간 밖에서 0을 사용합니다.'
  status: machine
- id: 017e1c286d41893b
  en: '`TransmonEmulator` holds the nearest endpoint within the pulse block. Set the first and last samples to zero if the control should be off outside the sample interval.'
  ko: '`TransmonEmulator`는 펄스 블록 안에서 가장 가까운 끝점의 값을 유지합니다. 샘플 구간 밖에서 구동을 끄려면 첫 샘플과 마지막 샘플을 모두 0으로 설정합니다.'
  status: machine
- id: d85453ebe172648d
  en: Every control is zero outside its block. The block duration is set by the enclosing pulse operation or definition.
  ko: 각 제어 신호는 블록 밖에서 0입니다. 블록의 지속 시간은 해당 펄스 연산이나 펄스 정의에서 정합니다.
  status: machine
- id: d80da27d2e608ffb
  en: '[`SampledWaveform`][fatqat.emulator.SampledWaveform] describes a signal on a local time grid. Times use the model''s time unit, while the channel determines the sample unit and whether values may be complex. The sample grid starts at zero, and a [`PulseControl`][fatqat.emulator.PulseControl] places it at an offset within the enclosing pulse block.'
  ko: '[`SampledWaveform`][fatqat.emulator.SampledWaveform]은 샘플 시각과 값으로 파형을 나타냅니다. 시각에는 모델의 시간 단위를 사용합니다. 샘플 값의 단위와 복소수 허용 여부는 채널이 정합니다. 샘플 시간은 0부터 시작하며, [`PulseControl`][fatqat.emulator.PulseControl]에서 파형이 펄스 블록 안의 어느 시점에 시작할지 지정합니다.'
  status: machine
