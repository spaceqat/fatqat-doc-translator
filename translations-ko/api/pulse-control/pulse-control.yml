- id: 73b670878c58e8a0
  en: PulseControl
  ko: PulseControl
  status: machine
- id: e4214f0efbedbbcb
  en: '[`PulseControl`][fatqat.emulator.PulseControl] assigns a waveform to one physical control channel. Get the channel from a model''s `control` selectors and use the result in a [PulseOperation](pulse-operation.md) or [Gate realization](gate-realization.md) definition. Do not construct [`ControlChannel`][fatqat.emulator.ControlChannel] directly.'
  ko: '[`PulseControl`][fatqat.emulator.PulseControl]은 파형을 물리 제어 채널 하나에 연결합니다. 모델의 `control` 선택기로 채널을 얻어 [PulseOperation](pulse-operation.md) 또는 [게이트의 펄스 구현](gate-realization.md) 정의에 사용하세요. [`ControlChannel`][fatqat.emulator.ControlChannel]을 직접 생성하지 마세요.'
  status: machine
- id: 302ae9c13e72b92e
  en: Methods on `model.control` check their address arguments when they create a channel. When the control is used, the emulator checks that its model family and named resources are compatible and that the waveform meets the model's limits. A channel can therefore be reused with another compatible model that contains the same resource. The built-in methods and their units are listed in [Pulse control](index.md); see [SampledWaveform](sampled-waveform.md) for interpolation outside the sample grid.
  ko: '`model.control`의 메서드는 채널을 만들 때 주소 인수를 검사합니다. 제어를 사용할 때 에뮬레이터는 모델 계열과 지정된 자원의 호환성, 파형의 모델 제한 충족 여부를 검사합니다. 따라서 같은 자원이 있는 호환 모델에서 채널을 재사용할 수 있습니다. 내장 메서드와 단위는 [펄스 제어](index.md), 샘플 격자 밖의 보간은 [SampledWaveform](sampled-waveform.md)을 참고하세요.'
  status: machine
- id: 0d6a4b1139f61e7e
  en: '[`PulseControl`][fatqat.emulator.PulseControl] assigns a waveform to one physical control channel at an offset within a pulse block. Select the channel from `model.control`, for example `model.control.drive("q0")`, then include the control in a [PulseOperation](pulse-operation.md) or a [`PulseDefinition`](gate-realization.md#fatqat.emulator.PulseDefinition).'
  ko: '[`PulseControl`][fatqat.emulator.PulseControl]은 파형을 물리 제어 채널 하나에 할당하고 펄스 블록 안에서 시작할 시점을 지정합니다. `model.control.drive("q0")`처럼 `model.control`에서 채널을 선택한 다음, 그 제어를 [PulseOperation](pulse-operation.md)이나 [`PulseDefinition`](gate-realization.md#fatqat.emulator.PulseDefinition)에 넣습니다.'
  status: machine
- id: 47b621de0c10ce33
  en: See [Direct pulse support](index.md#built-in-support) for available channels and their units, and [SampledWaveform](sampled-waveform.md#interpolation) for how emulators handle samples between and outside the grid points.
  ko: 사용할 수 있는 채널과 단위는 [직접 펄스 지원](index.md#built-in-support)을 참고하세요. 에뮬레이터가 샘플 사이와 샘플 구간 밖에서 파형을 처리하는 방식은 [SampledWaveform](sampled-waveform.md#interpolation)에 설명되어 있습니다.
  status: machine
- id: abc7dd1b1b402657
  en: See the [model control references](index.md#built-in-support) for channels and units, and [SampledWaveform](sampled-waveform.md#interpolation) for how emulators handle samples between and outside the grid points.
  ko: 채널과 단위는 [모델별 제어 레퍼런스](index.md#built-in-support)를 참고하세요. 에뮬레이터가 샘플 사이와 샘플 구간 밖의 값을 어떻게 처리하는지는 [SampledWaveform](sampled-waveform.md#interpolation)에 설명되어 있습니다.
  status: machine
