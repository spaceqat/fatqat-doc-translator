- id: b9a4acdb887c45ff
  en: PulseOperation
  ko: PulseOperation
  status: machine
- id: b29fa6ba8f162832
  en: '[`PulseOperation`][fatqat.operations.PulseOperation] adds an explicit pulse block to a program. Import it from `fatqat.operations`, normally as `ops.PulseOperation`.'
  ko: '[`PulseOperation`][fatqat.operations.PulseOperation]은 명시적인 펄스 블록을 프로그램에 추가합니다. `fatqat.operations`에서 가져와 보통 `ops.PulseOperation`으로 사용합니다.'
  status: machine
- id: 12bfe14668e6bf66
  en: 'An ordinary gate is added by passing logical targets to `Program.add`. For a `PulseOperation`, do not pass targets: every [`PulseControl`][fatqat.emulator.PulseControl] already names the physical channel to drive. Add it with `program.add(operation)`. A [`ResourceLayout`][fatqat.ResourceLayout] does not remap its channels.'
  ko: 일반 게이트는 `Program.add`에 논리 대상을 전달해 추가합니다. `PulseOperation`에는 대상을 전달하지 마세요. 각 [`PulseControl`][fatqat.emulator.PulseControl]이 이미 구동할 물리 채널을 지정합니다. `program.add(operation)`으로 추가하며, [`ResourceLayout`][fatqat.ResourceLayout]은 이 채널들을 다시 매핑하지 않습니다.
  status: machine
- id: f2ac3265eee2f5c8
  en: Conditions and noise
  ko: 조건과 잡음
  status: machine
- id: 4fb9067c07fb39a4
  en: '`TransmonEmulator` allows `program.add(operation, condition=...)`. If the condition is false, the controls are skipped but the block still takes its full duration. Model drift and background Lindblad noise continue during that time. `Atom2LevelEmulator` does not support conditions.'
  ko: '`TransmonEmulator`에서는 `program.add(operation, condition=...)`을 사용할 수 있습니다. 조건이 거짓이면 제어는 건너뛰지만 블록의 전체 지속시간은 그대로 소요됩니다. 그동안 모델 드리프트와 배경 Lindblad 잡음은 계속 작용합니다. `Atom2LevelEmulator`는 조건을 지원하지 않습니다.'
  status: machine
- id: 1202290d63b86101
  en: Operation-scoped noise cannot be attached to a direct pulse block, so `noise.add(..., operation=ops.PulseOperation)` raises `ValueError`. Background noise selected by target or device label still applies.
  ko: 직접 펄스 블록에는 연산 범위 잡음을 붙일 수 없으므로 `noise.add(..., operation=ops.PulseOperation)`은 `ValueError`를 발생시킵니다. 대상이나 장치 라벨로 선택한 배경 잡음은 여전히 적용됩니다.
  status: machine
- id: be91940b79f46910
  en: Support
  ko: 지원 범위
  status: machine
- id: dd171c59c706e434
  en: Direct `PulseOperation` blocks run on [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] and [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator]. [Pulse control](index.md) compares their channels and units. [Matrix simulators and their device profiles](../simulators/index.md) do not accept direct pulse blocks, and neither circuit drawing nor OpenQASM export can represent them.
  ko: 직접 `PulseOperation` 블록은 [`TransmonEmulator`][fatqat.emulator.TransmonEmulator]와 [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator]에서 실행됩니다. 채널과 단위 비교는 [펄스 제어](index.md)를 참고하세요. [행렬 시뮬레이터와 장치 프로필](../simulators/index.md)은 직접 펄스 블록을 받지 않으며, 회로 그림이나 OpenQASM 내보내기로도 표현할 수 없습니다.
  status: machine
