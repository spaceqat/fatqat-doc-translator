- id: 5bf59d5d33dffe89
  en: Read [Write and run pulse programs](../../guide/hamiltonian-emulation.md) first for the gate-calibration, direct-control, and scheduling workflow. This section defines the exact pulse objects and validation rules.
  ko: 게이트 보정, 직접 제어, 스케줄링 과정은 먼저 [펄스 프로그램 작성과 실행](../../guide/hamiltonian-emulation.md)를 읽어 보세요. 이 절은 펄스 객체와 검증 규칙을 정확히 정의합니다.
  status: machine
- id: 10bac4d706037c88
  en: Use the pulse APIs to drive physical channels directly or to specify the pulses that implement a gate.
  ko: 펄스 API로 물리 채널을 직접 구동하거나 게이트를 구현하는 펄스를 지정할 수 있습니다.
  status: machine
- id: 1c67165cf16676a0
  en: Direct pulses and gate pulses
  ko: 직접 펄스와 게이트 펄스
  status: machine
- id: 4841e7f8ac5da796
  en: '**Drive a physical channel.** Create a [SampledWaveform](sampled-waveform.md) for the signal and a [PulseControl](pulse-control.md) to assign it to a channel. A [PulseOperation](pulse-operation.md) groups one or more such controls into a timed program instruction. Its channels identify the physical resources it drives.'
  ko: '**물리 채널을 직접 구동합니다.** [SampledWaveform](sampled-waveform.md)으로 신호를 나타내고 [PulseControl](pulse-control.md)로 채널을 지정합니다. [PulseOperation](pulse-operation.md)은 하나 이상의 제어를 실행 시간이 정해진 프로그램 명령 하나로 묶습니다. 구동할 물리 자원은 이 제어에 지정한 채널로 정해집니다.'
  status: machine
- id: 23d6a0d642a449aa
  en: '**Supply pulses for a gate.** Register a rule in a [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap]. The rule returns a [`PulseDefinition`][fatqat.emulator.PulseDefinition] for the gate. See [Gate realization](gate-realization.md) for the forms a rule can take.'
  ko: '**펄스로 게이트를 구현합니다.** [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap]에 게이트의 [`PulseDefinition`][fatqat.emulator.PulseDefinition]을 반환하는 규칙을 등록합니다. 사용할 수 있는 규칙 형식은 [게이트의 펄스 구현](gate-realization.md)을 참고하세요.'
  status: machine
- id: 5d6d37370663eb08
  en: The value constructors check the sample grid, offsets, and block timing, including whether controls fit within the block and use distinct channels. Channel selectors check the form of an address, such as whether a subsystem label is nonempty. When the emulator prepares the block for execution, it checks the channel's model family and whether the named resources exist. It also checks real or complex sample requirements, amplitude and duration limits, and which channels can run together.
  ko: 파형, 제어, 펄스 블록을 만들 때는 샘플 시간 격자와 오프셋, 블록의 시간 구성을 검사합니다. 각 제어가 블록 안에서 끝나고 채널이 중복되지 않는지도 확인합니다. 채널 선택자는 서브시스템 레이블이 비어 있는지 등 주소의 형식만 검사합니다. 에뮬레이터는 블록의 실행을 준비할 때 채널이 해당 모델 계열에 맞는지, 지정한 자원이 존재하는지 확인합니다. 이때 샘플의 실수 또는 복소수 요건, 진폭과 지속 시간 제한, 함께 구동할 수 있는 채널 조합도 검사합니다.
  status: machine
- id: f108e755c218ae72
  en: Direct pulse support
  ko: 직접 펄스 지원
  status: machine
- id: 24b5418927229d3b
  en: Durations, offsets, and sample times use the model's time unit. Waveform values use the channel's unit. The table lists the built-in channels and whether programs can use classical conditions on direct pulses.
  ko: 지속 시간, 오프셋, 샘플 시간은 모델의 시간 단위를 사용합니다. 파형 값은 채널의 단위를 따릅니다. 아래 표에는 내장 채널과 직접 펄스에 고전 조건을 적용할 수 있는지를 정리했습니다.
  status: machine
- id: 511c916a9fa661ae
  en: '| Backend | Channels | Time / sample units | Classical conditions |'
  ko: '| 백엔드 | 채널 | 시간 및 샘플 값 단위 | 고전 조건 |'
  status: machine
- id: 14b71d86321750c6
  en: Pulse emulators use Lindblad noise specified by rates or relaxation times. For a finite channel such as [`PauliChannel`][fatqat.noise.PauliChannel], converting a probability to a rate requires a duration and a conversion convention. Use [`Simulator`][fatqat.simulator.Simulator] for discrete Pauli noise. For continuous noise, see the [supported pulse noise models](../noise/backend-support.md#noise-emulator-support) for each emulator.
  ko: 펄스 에뮬레이터는 Lindblad 잡음을 잡음률이나 이완 시간으로 지정합니다. [`PauliChannel`][fatqat.noise.PauliChannel]처럼 한 번 적용되는 유한 채널의 확률을 잡음률로 바꾸려면 적용 시간과 변환 규약이 필요합니다. 이산 Pauli 잡음에는 [`Simulator`][fatqat.simulator.Simulator]를 사용합니다. 연속 잡음에는 에뮬레이터별로 [지원하는 펄스 잡음 모델](../noise/backend-support.md#noise-emulator-support)을 참고하세요.
  status: machine
- id: 5deb65e708e98c80
  en: Pulse emulators use Lindblad noise specified by rates or relaxation times. See the [supported pulse noise models](../noise/backend-support.md#noise-emulator-support) for each emulator.
  ko: 펄스 에뮬레이터는 Lindblad 잡음을 잡음률이나 이완 시간으로 지정합니다. 에뮬레이터별로 [지원되는 펄스 잡음 모델](../noise/backend-support.md#noise-emulator-support)을 참고하세요.
  status: machine
- id: 281e97d5f458eecc
  en: A pulse emulator runs physical controls with specified waveforms, channels, and timing. When the program contains a gate, the emulator uses the gate's pulse implementation to obtain those controls. A direct pulse operation specifies the controls in the program.
  ko: 펄스 에뮬레이터는 정해진 파형을 지정된 채널에 정해진 시점에 적용합니다. 프로그램에 게이트가 있으면 게이트의 펄스 구현에서 그 제어를 가져옵니다. 직접 펄스 연산을 추가하면 프로그램에서 제어를 직접 지정할 수 있습니다.
  status: machine
- id: 0876bbefb4d30f2c
  en: Choose a pulse interface
  ko: 펄스 인터페이스 선택
  status: machine
- id: 085c33f66be27514
  en: '| What you want to do | What goes in the program | Where the pulse comes from |'
  ko: '| 하려는 작업 | 프로그램에 넣는 내용 | 펄스를 가져오는 곳 |'
  status: machine
- id: a840355abcba3075
  en: '| Run a gate with its existing pulse implementation | A gate and its logical targets, such as `program.add(ops.X, 0)` | The emulator''s gate implementation map |'
  ko: '| 기존 펄스 구현으로 게이트 실행 | 게이트와 논리 대상. 예를 들어 `program.add(ops.X, 0)` | 에뮬레이터의 게이트 구현 맵 |'
  status: machine
- id: a5d97fd235808ef8
  en: '| Specify a waveform on a physical channel | A [PulseOperation](pulse-operation.md) | A [SampledWaveform](sampled-waveform.md) assigned to a channel through [PulseControl](pulse-control.md) |'
  ko: '| 물리 채널의 파형 직접 지정 | [PulseOperation](pulse-operation.md) | [SampledWaveform](sampled-waveform.md)으로 파형을 정하고 [PulseControl](pulse-control.md)로 채널을 지정 |'
  status: machine
- id: 502dccac273b4052
  en: '| Supply your own pulses for a gate | A gate and its logical targets | A [`PulseDefinition`][fatqat.emulator.PulseDefinition] registered in a [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap]. See [Custom gate pulses](gate-realization.md). |'
  ko: '| 게이트에 사용할 펄스 정의 | 게이트와 논리 대상 | [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap]에 등록한 [`PulseDefinition`][fatqat.emulator.PulseDefinition]. [사용자 정의 게이트 펄스](gate-realization.md)를 참고하세요. |'
  status: machine
- id: 06496ef431b94f17
  en: For example, suppose logical target `0` maps to physical transmon `q0`. For `program.add(ops.X, 0)`, the emulator looks up the `X` implementation for `q0` when it prepares the program. For a direct pulse, select `model.control.drive("q0")` when creating the `PulseControl`, then add its block with `program.add(pulse)`. The control already carries the physical channel.
  ko: 예를 들어 논리 대상 `0`이 물리 트랜스몬 `q0`에 매핑된다고 가정합니다. `program.add(ops.X, 0)`을 실행할 준비를 할 때 에뮬레이터는 `q0`에 해당하는 `X` 구현을 찾습니다. 직접 펄스를 지정하려면 `PulseControl`을 만들 때 `model.control.drive("q0")`로 채널을 선택하고, `program.add(pulse)`로 블록을 추가합니다. 구동할 물리 채널은 이 제어에 이미 정해져 있습니다.
  status: machine
- id: 10d4947bfbc41872
  en: By default, [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] provides a built-in gate implementation map. The default map for [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator] is empty, so ordinary gates there require a custom map.
  ko: '[`TransmonEmulator`][fatqat.emulator.TransmonEmulator]는 기본으로 내장 게이트 구현 맵을 제공합니다. [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator]는 기본 맵이 비어 있으므로 일반 게이트를 실행하려면 사용자 정의 맵이 필요합니다.'
  status: machine
- id: 507ce4c945a9386e
  en: <a id="built-in-support"></a>
  ko: <a id="built-in-support"></a>
  status: machine
- id: e945b479d84781da
  en: Durations, offsets, and sample times use the model's time unit. For channels, waveform units, and limits, see [Transmon controls](../pulse-emulator.md#direct-controls) or [two-level atom controls](../atom-emulators.md#model-and-controls).
  ko: 지속 시간, 오프셋, 샘플 시각은 모델의 시간 단위를 사용합니다. 채널과 파형의 단위, 제한은 [트랜스몬 제어](../pulse-emulator.md#direct-controls) 또는 [두 준위 원자 제어](../atom-emulators.md#model-and-controls)를 참고하세요.
  status: machine
