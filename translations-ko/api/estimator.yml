- id: a566e72b5d4b124c
  en: Observables and estimation
  ko: 관측량과 추정
  status: machine
- id: 3c4e36c32357cbcc
  en: Use [`Estimator`][fatqat.Estimator] to evaluate one or more [`Observable`][fatqat.Observable] values on a backend. The program must be unmeasured and fully bound with no free Parameters.
  ko: '[`Estimator`][fatqat.Estimator]로 백엔드에서 하나 이상의 [`Observable`][fatqat.Observable] 값을 계산합니다. 측정이 없고 모든 Parameters에 값이 바인딩된 프로그램이어야 합니다.'
  status: machine
- id: 021ea6651f894374
  en: Estimate an observable
  ko: 관측량 추정
  status: machine
- id: 20a31d4ec63acf7d
  en: For a guided workflow, see [Estimate observables](../guide/interpret-results.md).
  ko: 단계별 사용법은 [관측량 추정](../guide/interpret-results.md)을 참고하세요.
  status: machine
- id: 73fca541df0c0421
  en: Construct an observable
  ko: 관측량 구성
  status: machine
- id: 4d1be4fea973dd2b
  en: 'An observable is a sum of real coefficients times products of local operators, each acting on one subsystem:'
  ko: '관측량은 국소 연산자들을 곱한 뒤 실수 계수를 붙인 항들의 합입니다. 각 국소 연산자는 하나의 부분계에 작용합니다:'
  status: machine
- id: 83fbba990d9b135f
  en: the Pauli operators `X`, `Y`, and `Z`, which act on qubits only;
  ko: 큐비트에만 작용하는 Pauli 연산자 `X`, `Y`, `Z`;
  status: machine
- id: 43ddd0d4221fcfe5
  en: '[`Projector(level)`][fatqat.observable.Projector], the projector onto one level, with `ZERO` and `ONE` as names for `Projector(0)` and `Projector(1)`;'
  ko: 한 준위로의 사영 연산자 [`Projector(level)`][fatqat.observable.Projector]. `ZERO`와 `ONE`은 각각 `Projector(0)`, `Projector(1)`의 이름입니다;
  status: machine
- id: 3721333e65c553bb
  en: '[`NumberOperator()`][fatqat.observable.NumberOperator], `diag(0, 1, ..., d-1)` on a subsystem of dimension `d`: the mean level of a qudit, or `ONE` on a qubit.'
  ko: 차원이 `d`인 부분계에서 `diag(0, 1, ..., d-1)`을 나타내는 [`NumberOperator()`][fatqat.observable.NumberOperator]. 큐디트에서는 평균 준위를, 큐비트에서는 `ONE`을 나타냅니다.
  status: machine
- id: 0d8172c0005fad09
  en: 'A string label gives one letter per subsystem, from `I`, `X`, `Y`, and `Z`. The character at position `q` acts on subsystem `q`, and subsystems past the end of the label carry the identity. `"XI"` means `X(q0) tensor I(q1)`; on the state `|10>`, `<ZI> = -1` and `<IZ> = +1`. These forms are equivalent:'
  ko: '문자열 라벨은 부분계마다 `I`, `X`, `Y`, `Z` 중 한 글자를 지정합니다. 위치 `q`의 문자가 부분계 `q`에 작용하며, 라벨 끝을 넘어서는 부분계에는 항등 연산자가 적용됩니다. `"XI"`는 `X(q0) tensor I(q1)`을 뜻합니다. 상태 `|10>`에서는 `<ZI> = -1`, `<IZ> = +1`입니다. 다음 표현은 서로 같습니다:'
  status: machine
- id: 0eb2b4c3ed32e9f8
  en: '[`from_sparse`][fatqat.Observable.from_sparse] names each non-identity operator and its subsystem explicitly. A term''s operators can be a letter string such as `"XY"`, one operator object, or a sequence that mixes both. This is also how you write `Projector` and `NumberOperator` operators:'
  ko: '[`from_sparse`][fatqat.Observable.from_sparse]는 항등이 아닌 각 연산자와 그 부분계를 명시합니다. 한 항의 연산자는 `"XY"` 같은 문자 문자열, 연산자 객체 하나, 또는 두 형식을 섞은 시퀀스로 지정할 수 있습니다. `Projector`와 `NumberOperator`도 이렇게 작성합니다:'
  status: machine
- id: 622c863621c52148
  en: Coefficients must be real.
  ko: 계수는 실수여야 합니다.
  status: machine
- id: 3ef4dc8bfa8ad43a
  en: 'An observable has no width or subsystem dimensions of its own. The backend checks each local operator against the program: every index must name a program subsystem, Pauli operators need a qubit, and a projector level must be below its subsystem''s dimension. This lets one observable describe qudit programs:'
  ko: '관측량 자체에는 폭이나 부분계 차원이 정해져 있지 않습니다. 백엔드가 프로그램을 기준으로 각 국소 연산자를 검증합니다. 인덱스는 프로그램의 부분계를 가리켜야 하고, Pauli 연산자는 큐비트에만 적용되며, 사영 준위는 부분계 차원보다 작아야 합니다. 따라서 하나의 관측량으로 큐디트 프로그램도 기술할 수 있습니다:'
  status: machine
- id: 479684de59bfab33
  en: Exact and sampled results
  ko: 정확한 결과와 샘플링 결과
  status: machine
- id: 06f36e9304d929af
  en: Pass one observable to receive scalar expectation and standard-error values, or a list or tuple to receive arrays in the same order.
  ko: 관측량 하나를 전달하면 기댓값과 표준 오차를 스칼라로 받습니다. 리스트나 튜플을 전달하면 같은 순서의 배열을 받습니다.
  status: machine
- id: 1b56b6f38a0057de
  en: '`shots=0` computes an exact value. A positive `shots` value samples each nonconstant term independently, and [`get_standard_error`][fatqat.Result.get_standard_error] reports the resulting sample standard error. Constant terms contribute zero standard error; one sample of a nonconstant term has undefined standard error and reports `nan`. Set `simulation_config["seed"]` to reproduce a sampled run.'
  ko: '`shots=0`이면 정확한 값을 계산합니다. 양의 `shots`에서는 상수항이 아닌 각 항을 독립적으로 샘플링하며 [`get_standard_error`][fatqat.Result.get_standard_error]가 그에 따른 표본 표준 오차를 반환합니다. 상수항의 표준 오차는 0입니다. 비상수항을 한 번만 샘플링하면 표준 오차가 정의되지 않아 `nan`을 반환합니다. 샘플링 실행을 재현하려면 `simulation_config["seed"]`를 설정하세요.'
  status: retired
- id: 8cdd28ab39614078
  en: Configure the simulation method, runtime, and noise on the backend. The Estimator forwards `simulation_config` to the backend and accepts the same keys as its normal `run()` path; see the tables for [matrix simulators](simulator.md#runtime-and-execution) and [the two-level atom emulator](atom-emulators.md#run-configuration-and-results). `result_config` is not accepted.
  ko: 시뮬레이션 방법, 런타임, 잡음은 백엔드에서 설정합니다. Estimator는 `simulation_config`를 백엔드로 전달하며, 해당 백엔드의 일반 `run()` 경로와 같은 키를 받습니다. [행렬 시뮬레이터](simulator.md#runtime-and-execution)와 [2준위 원자 에뮬레이터](atom-emulators.md#run-configuration-and-results)의 표를 참고하세요. `result_config`는 받지 않습니다.
  status: retired
- id: cc396809c6935a1a
  en: 'Read estimator results with [`get_expectation`][fatqat.Result.get_expectation] and [`get_standard_error`][fatqat.Result.get_standard_error]. Run the backend separately if you also need its final state. Result metadata is compact: backend name, method, runtime, and shots, plus the pulse solver for pulse executions.'
  ko: 추정 결과는 [`get_expectation`][fatqat.Result.get_expectation]과 [`get_standard_error`][fatqat.Result.get_standard_error]로 읽습니다. 최종 상태도 필요하면 백엔드를 별도로 실행하세요. 결과 메타데이터에는 백엔드 이름, 방법, 런타임, 샷 수만 담기며, 펄스 실행에서는 펄스 솔버도 기록됩니다.
  status: machine
- id: d0e248b10a8c7d2f
  en: Backend support
  ko: 백엔드 지원 범위
  status: machine
- id: a45f5727b71f28ea
  en: '**Matrix simulators** support every operator, exact and sampled, with a statevector or density-matrix method. Unitary and superoperator methods raise [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError] because they produce maps rather than states. For an exact expectation with reset or an applicable stochastic channel, use a density-matrix method; a statevector method can run those programs with positive shots. Programs with carrier loss are rejected.'
  ko: '**행렬 시뮬레이터**는 상태 벡터 또는 밀도 행렬 방법으로 모든 연산자의 정확 계산과 샘플링을 지원합니다. 유니터리와 초연산자 방법은 상태가 아닌 사상을 만들므로 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]가 발생합니다. 리셋이나 적용 가능한 확률적 채널이 있는 프로그램에서 정확한 기댓값을 구하려면 밀도 행렬 방법을 사용하세요. 상태 벡터 방법도 양의 샷 수로 이러한 프로그램을 실행할 수 있습니다. 캐리어 손실이 있는 프로그램은 지원하지 않습니다.'
  status: machine
- id: 04baa45c97f86597
  en: '**The two-level atom pulse emulator** evaluates observables on its qubit programs with a statevector or density-matrix method. There, `NumberOperator()` equals `ONE`, and only levels 0 and 1 are valid projector levels.'
  ko: '**2준위 원자 펄스 에뮬레이터**는 큐비트 프로그램에서 상태 벡터나 밀도 행렬 방법으로 관측량을 계산합니다. 여기서는 `NumberOperator()`가 `ONE`과 같고, 사영 연산자의 유효 준위는 0과 1뿐입니다.'
  status: machine
- id: 879881d16a619284
  en: Exact statevector evaluation rejects potentially active Lindblad evolution; use exact density-matrix execution or a positive-shot trajectory run.
  ko: 정확한 상태 벡터 계산에서는 작용할 가능성이 있는 Lindblad 진화를 허용하지 않습니다. 정확한 밀도 행렬 실행이나 양의 샷 수를 사용하는 궤적 실행을 선택하세요.
  status: machine
- id: dacd89d9643cecf8
  en: Positive-shot evaluation supports the diagonal operators `Z`, `Projector(0)`, `Projector(1)`, and `NumberOperator()`.
  ko: 양의 샷 수에서는 대각 연산자 `Z`, `Projector(0)`, `Projector(1)`, `NumberOperator()`를 지원합니다.
  status: machine
- id: 86eb367f6ecd93d4
  en: Reset is unsupported.
  ko: 리셋은 지원하지 않습니다.
  status: machine
- id: ba9641070a0beab6
  en: 'Transmon and three-level atom emulators are rejected: their local dimensions exceed the qubit observable space.'
  ko: Transmon과 3준위 원자 에뮬레이터는 국소 차원이 큐비트 관측량 공간을 넘으므로 지원하지 않습니다.
  status: machine
- id: b35d8307b89e7fad
  en: '**Readout noise.** Exact evaluation rejects readout-confusion noise, since it has no exact meaning. Positive-shot evaluation applies readout confusion to the measurements. On matrix simulators, a sampled `X` or `Y` is measured after an ideal basis change that gate noise does not affect.'
  ko: '**판독 잡음.** 판독 혼동 잡음은 정확 계산에 대응하는 의미가 없어 정확 계산에서는 거부됩니다. 양의 샷 수에서는 측정에 판독 혼동을 적용합니다. 행렬 시뮬레이터에서 `X` 또는 `Y`를 샘플링할 때는 게이트 잡음의 영향을 받지 않는 이상적인 기저 변환 후 측정합니다.'
  status: machine
- id: 72a7d5d9dd560aef
  en: Parameter sweeps
  ko: 매개변수 스윕
  status: machine
- id: dc46617b715c12de
  en: '[`run_sweep`][fatqat.Estimator.run_sweep] evaluates binding rows in input order. Validation errors raise directly; execution errors follow the backend''s error-handling policy. No partial result list is returned. See [Simulate a quantum program](../guide/simulation.md) for a guided parameter sweep; accepted binding shapes and seed behavior are specified here.'
  ko: '[`run_sweep`][fatqat.Estimator.run_sweep]는 입력 순서대로 바인딩 행을 평가합니다. 검증 오류는 바로 발생하고 실행 오류는 백엔드의 오류 처리 정책을 따릅니다. 부분 결과 목록은 반환하지 않습니다. 매개변수 스윕의 단계별 예제는 [양자 프로그램 시뮬레이션](../guide/simulation.md)을 참고하세요. 허용되는 바인딩 형태와 시드 동작은 여기에서 설명합니다.'
  status: machine
- id: 0512da99303af84f
  en: Detailed reference
  ko: API 레퍼런스
  status: machine
- id: 386e9ea92863c559
  en: '`shots=0` computes an exact value. A positive `shots` value samples each nonconstant term independently, and [`get_standard_error`][fatqat.Result.get_standard_error] reports the resulting sample standard error. Constant terms contribute zero standard error; one sample of a nonconstant term has undefined standard error and reports `nan`. Set `execution_config["seed"]` to reproduce a sampled run.'
  ko: '`shots=0`이면 정확한 값을 계산합니다. 양의 `shots`에서는 상수항이 아닌 각 항을 독립적으로 샘플링하며 [`get_standard_error`][fatqat.Result.get_standard_error]가 그에 따른 표본 표준 오차를 반환합니다. 상수항의 표준 오차는 0입니다. 비상수항을 한 번만 샘플링하면 표준 오차가 정의되지 않아 `nan`을 반환합니다. 샘플링 실행을 재현하려면 `execution_config["seed"]`를 설정하세요.'
  status: machine
- id: 66bbc8c6461e37e4
  en: Configure the simulation method, runtime, and noise on the backend. The Estimator forwards `execution_config` to the backend and accepts the same keys as its normal `run()` path; see the tables for [matrix simulators](simulator.md#runtime-and-execution) and [the two-level atom emulator](atom-emulators.md#run-configuration-and-results). `result_config` is not accepted.
  ko: 시뮬레이션 방법, 런타임, 잡음은 백엔드에서 설정합니다. Estimator는 `execution_config`를 백엔드로 전달하며, 해당 백엔드의 일반 `run()` 경로와 같은 키를 받습니다. [행렬 시뮬레이터](simulator.md#runtime-and-execution)와 [2준위 원자 에뮬레이터](atom-emulators.md#run-configuration-and-results)의 표를 참고하세요. `result_config`는 받지 않습니다.
  status: machine
- id: f4ae85f77a50d1f5
  en: Estimate an expectation value
  ko: 기댓값 추정
  status: machine
- id: 1678e2a700ad248f
  en: '**Matrix simulators** evaluate observables exactly or by sampling with a state method. Unitary and superoperator methods raise [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError] because they produce maps rather than states. For an exact expectation with reset or an applicable stochastic channel, use a density-matrix method. A statevector method can run those programs with positive shots.'
  ko: '**행렬 시뮬레이터**는 상태를 계산하는 방법으로 관측량을 정확히 계산하거나 샘플링으로 추정합니다. 유니터리와 초연산자 방법은 상태 대신 사상을 반환하므로 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]가 발생합니다. 리셋이나 적용되는 확률적 채널을 포함한 프로그램의 기댓값을 정확히 구하려면 밀도 행렬 방법을 사용합니다. 상태 벡터 방법은 양의 샷 수를 지정해 이런 프로그램을 실행할 수 있습니다.'
  status: machine
- id: cef2b35a9c4f0449
  en: On an optical mode with [`LOSimulator`][fatqat.simulator.LOSimulator], use [`NumberOperator`][fatqat.observable.NumberOperator] or [`Projector`][fatqat.observable.Projector] at a level within the photon cutoff. Supply the input photons through `initial_state`. On [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator], the observable must target loaded sites in a loss-free program.
  ko: '[`LOSimulator`][fatqat.simulator.LOSimulator]의 광학 모드에서는 [`NumberOperator`][fatqat.observable.NumberOperator] 또는 광자 수 상한 이내의 준위에 대한 [`Projector`][fatqat.observable.Projector]를 사용합니다. 입력 광자는 `initial_state`로 전달합니다. [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서는 손실이 없는 프로그램에서 원자가 로딩된 사이트를 관측 대상으로 지정합니다.'
  status: machine
- id: b3d29efac3bb6295
  en: '[`Estimator`][fatqat.Estimator] computes the expectation values of one or more [`Observable`][fatqat.Observable] objects after a program runs. Use a fully bound program without measurement operations. Choose a compatible backend for the evolution, then choose exact or sampled evaluation with `shots`.'
  ko: '[`Estimator`][fatqat.Estimator]는 프로그램 실행 후 하나 이상의 [`Observable`][fatqat.Observable] 기댓값을 계산합니다. 모든 매개변수를 바인딩하고 측정 연산이 없는 프로그램을 사용하세요. 진화에 사용할 호환 백엔드를 고른 뒤 `shots`로 정확 계산과 표본 추정 중 하나를 선택합니다.'
  status: machine
- id: 2abf1df3a761f408
  en: Each term is the product of operators on individual subsystems, multiplied by a real coefficient. Use a dense string of `I`, `X`, `Y`, and `Z` for Pauli operators on qubits. The leftmost letter acts on subsystem 0. For example, `"XI"` applies X to the first qubit and the identity to the second.
  ko: 각 항은 개별 하위 시스템에 작용하는 연산자의 곱에 실수 계수를 곱한 것입니다. 큐비트의 Pauli 연산자는 `I`, `X`, `Y`, `Z`로 이루어진 밀집 문자열로 나타낼 수 있습니다. 맨 왼쪽 문자는 0번 하위 시스템에 작용합니다. 예를 들어 `"XI"`는 첫 번째 큐비트에 X, 두 번째 큐비트에 항등 연산자를 적용합니다.
  status: machine
- id: df820d7713c6c2eb
  en: Use [`from_sparse()`][fatqat.Observable.from_sparse] to name the operators and their subsystem indices directly. This form also accepts [`Projector(level)`][fatqat.observable.Projector] for the probability of finding a subsystem in a level and [`NumberOperator()`][fatqat.observable.NumberOperator] for its mean level or photon number. Unspecified subsystems carry the identity.
  ko: '[`from_sparse()`][fatqat.Observable.from_sparse]로 연산자와 하위 시스템 인덱스를 직접 지정할 수 있습니다. [`Projector(level)`][fatqat.observable.Projector]은 특정 준위에서 하위 시스템을 발견할 확률을, [`NumberOperator()`][fatqat.observable.NumberOperator]는 평균 준위 또는 평균 광자 수를 구할 때 사용합니다. 지정하지 않은 하위 시스템에는 항등 연산자가 적용됩니다.'
  status: machine
- id: 736001f578ef6f32
  en: This example prepares one three-level subsystem in level 2 and reads both its mean level and its probability of being in level 2. Passing a list returns the values in that order.
  ko: 이 예제에서는 3준위 하위 시스템을 준위 2에 준비한 뒤 평균 준위와 준위 2에 있을 확률을 함께 읽습니다. 관측량을 목록으로 전달하면 결과도 같은 순서로 반환됩니다.
  status: machine
- id: cf0177e5627d173c
  en: With `shots=0` (the default), the estimator calculates the expectation directly and returns zero standard error. With positive `shots`, it samples that many measurements per nonconstant term. One shot gives `nan` for a nonconstant term's standard error. Set `execution_config["seed"]` to reproduce sampled runs.
  ko: 기본값 `shots=0`은 기댓값을 직접 계산하며 표준 오차는 0입니다. `shots`가 양수이면 상수가 아닌 각 항을 그 횟수만큼 측정합니다. 상수가 아닌 항을 한 번만 측정하면 그 항의 표준 오차는 `nan`입니다. 표본 실행을 재현하려면 `execution_config["seed"]`를 설정하세요.
  status: machine
- id: 3280856a71233fd1
  en: Read [`get_expectation()`][fatqat.Result.get_expectation] and [`get_standard_error()`][fatqat.Result.get_standard_error] from the result. One observable gives scalars. A list or tuple gives arrays in input order. Run the backend separately to obtain the final state.
  ko: 결과에서 [`get_expectation()`][fatqat.Result.get_expectation]으로 기댓값을, [`get_standard_error()`][fatqat.Result.get_standard_error]로 표준 오차를 읽습니다. 관측량 하나는 스칼라로, 목록이나 튜플은 입력 순서의 배열로 반환됩니다. 최종 상태가 필요하면 백엔드를 직접 실행하세요.
  status: machine
- id: 7d1ba99c7edc10c3
  en: Choose the simulation method, runtime, and noise on the backend. Per-run settings in `execution_config` are the same as for the backend's `run()` method. Use `initial_state` to choose a starting state on a simulator.
  ko: 시뮬레이션 방식, 런타임, 잡음은 백엔드에서 설정합니다. 실행별 `execution_config`에는 백엔드의 `run()`과 같은 설정을 사용합니다. 시뮬레이터에서는 `initial_state`로 시작 상태를 지정할 수 있습니다.
  status: machine
- id: 891ca72ae7f54de9
  en: '**Gate-level simulators:** Use `statevector` or `density_matrix`. For an exact result with stochastic reset or gate noise, use `density_matrix`. A statevector method can sample those runs with positive `shots`. Programs that use custom operations are unsupported.'
  ko: '**게이트 수준 시뮬레이터.** `statevector` 또는 `density_matrix`를 사용합니다. 재설정이나 게이트 잡음으로 진화에 무작위성이 생기면 `density_matrix`로 정확한 값을 계산하세요. 상태 벡터 방식에서는 양수 `shots`로 표본을 추출할 수 있습니다. 사용자 정의 연산이 있는 프로그램은 지원하지 않습니다.'
  status: machine
- id: ef31669a1b0ba211
  en: '**Linear optics:** [`LOSimulator`][fatqat.simulator.LOSimulator] also supports `fixed_photon_state`. To evaluate an optical mode, use [`NumberOperator`][fatqat.observable.NumberOperator] or a [`Projector`][fatqat.observable.Projector] with a level at or below the photon cutoff. Set the input photons with `initial_state`.'
  ko: '**선형 광학.** [`LOSimulator`][fatqat.simulator.LOSimulator]는 `fixed_photon_state`도 지원합니다. 광학 모드의 기댓값에는 [`NumberOperator`][fatqat.observable.NumberOperator] 또는 광자 수 절단 한도 이하의 준위를 지정한 [`Projector`][fatqat.observable.Projector]를 사용하세요. 입력 광자는 `initial_state`로 지정합니다.'
  status: machine
- id: 9b10a6bd48e573e4
  en: '**Neutral-atom arrays:** On [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator], the observable must target loaded sites in a loss-free program.'
  ko: '**중성 원자 배열.** [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]에서는 관측량이 원자가 적재된 위치를 대상으로 해야 하며 프로그램에 원자 손실이 없어야 합니다.'
  status: machine
- id: 0f8f2a5e6c625ea9
  en: '**Pulse emulation:** [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator] supports both state methods, without reset. Use a density matrix for exact evaluation with Lindblad noise, or sample with positive `shots`. Sampled runs accept only diagonal operators, including `Z`, `Projector(0)`, `Projector(1)`, and `NumberOperator()`. Transmon and three-level atom pulse models are unsupported.'
  ko: '**펄스 에뮬레이션.** [`Atom2LevelEmulator`][fatqat.emulator.Atom2LevelEmulator]는 재설정이 없는 프로그램에서 두 상태 방식을 모두 지원합니다. Lindblad 잡음이 있으면 밀도 행렬로 정확히 계산하거나 양수 `shots`로 표본을 추출하세요. 표본 실행에는 `Z`, `Projector(0)`, `Projector(1)`, `NumberOperator()`를 비롯한 대각 연산자만 사용할 수 있습니다. 트랜스몬과 3준위 원자 펄스 모델은 지원하지 않습니다.'
  status: machine
- id: 659b99f273e7eaa9
  en: When readout confusion applies to an observable, use positive `shots`. Gate-level simulators measure sampled `X` and `Y` terms after ideal basis changes. Gate noise acts on the program's operations but leaves those basis changes ideal.
  ko: 관측량의 측정에 판독 혼동이 적용되면 양수 `shots`를 사용하세요. 게이트 수준 시뮬레이터는 `X`와 `Y` 항을 표본 추출할 때 이상적인 기저 변환을 한 뒤 측정합니다. 게이트 잡음은 프로그램의 연산에 작용하며 이 기저 변환에는 영향을 주지 않습니다.
  status: machine
- id: 220c293e8b9c4884
  en: Use [`run_sweep()`][fatqat.Estimator.run_sweep] to evaluate the same observables at several parameter settings. Each binding row gives one result, in input order.
  ko: 같은 관측량을 여러 매개변수 설정에서 평가하려면 [`run_sweep()`][fatqat.Estimator.run_sweep]을 사용하세요. 바인딩 행마다 결과 하나가 생기며 결과는 입력 순서를 따릅니다.
  status: machine
- id: 2e51554f3353aee2
  en: '[`Estimator`][fatqat.Estimator] computes expectation values for one or more [`Observable`][fatqat.Observable] objects. Both entry points take a program without measurement operations. Choose the entry point by how you want to supply the program parameters.'
  ko: '[`Estimator`][fatqat.Estimator]는 하나 이상의 [`Observable`][fatqat.Observable]에 대한 기댓값을 계산합니다. 두 메서드 모두 측정 연산이 없는 프로그램을 받습니다. 프로그램 매개변수를 제공하는 방식에 따라 메서드를 고르세요.'
  status: machine
- id: 6e1f3fac85aa6fd3
  en: <a id="parameter-sweeps"></a>
  ko: <a id="parameter-sweeps"></a>
  status: machine
- id: 5c561e3b1e0d691c
  en: Run once or sweep
  ko: 단일 실행과 매개변수 스윕
  status: machine
- id: e6b1d653452c188b
  en: '[`run()`][fatqat.Estimator.run] evaluates a single program. Bind all its parameters before calling it. The job returns one [`Result`][fatqat.Result].'
  ko: '[`run()`][fatqat.Estimator.run]은 프로그램을 한 번 평가합니다. 호출 전에 매개변수를 모두 바인딩하세요. 작업이 성공하면 [`Result`][fatqat.Result] 하나를 반환합니다.'
  status: machine
- id: e228db4fe6d264c3
  en: '[`run_sweep()`][fatqat.Estimator.run_sweep] takes a parameterized program and a batch of complete `bindings` in the same call. The job returns one result per binding row, in input order.'
  ko: '[`run_sweep()`][fatqat.Estimator.run_sweep]은 매개변수가 있는 프로그램과 모든 매개변수 값이 채워진 `bindings` 배치를 함께 받습니다. 작업은 바인딩 행마다 결과 하나를 입력 순서대로 반환합니다.'
  status: machine
- id: 3db8c553d3932c4d
  en: For a three-level system prepared in level 2, this example reads the mean level index and the probability of being in level 2.
  ko: 이 예제에서는 3준위 계를 준위 2에 준비한 뒤 준위 인덱스의 평균과 준위 2에 있을 확률을 읽습니다.
  status: machine
- id: 646c3701f2a09adc
  en: '`shots=0` (the default) computes the expectation directly and reports zero standard error. A positive `shots` sets the number of samples per nonconstant term. Read the values with [`get_expectation()`][fatqat.Result.get_expectation] and [`get_standard_error()`][fatqat.Result.get_standard_error].'
  ko: 기본값 `shots=0`은 기댓값을 직접 계산하고 표준 오차를 0으로 반환합니다. 양수 `shots`로 상수가 아닌 항마다 표본을 몇 번 뽑을지 정합니다. [`get_expectation()`][fatqat.Result.get_expectation]으로 기댓값을, [`get_standard_error()`][fatqat.Result.get_standard_error]로 표준 오차를 읽으세요.
  status: machine
- id: 5530343c68bb4c0b
  en: Set the method, numerical runtime, and noise on the backend. Pass per-run options such as the seed through `execution_config`. Simulators also accept an `initial_state`.
  ko: 시뮬레이션 방식, 수치 런타임, 잡음은 백엔드에서 설정합니다. 시드처럼 실행마다 지정하는 옵션은 `execution_config`로 전달하세요. 시뮬레이터는 `initial_state`도 받습니다.
  status: machine
