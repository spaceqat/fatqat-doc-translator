  en: How does atom loss affect error correction? How does a control pulse change a quantum gate's behavior? And how can a power-grid partition be expressed as an optimization problem? These case studies turn questions like these into models you can run and explore with FatQat. Follow each problem from its background and assumptions through runnable code to plots and an explanation of the results. Choose a topic that interests you, run the example, and change its parameters to investigate further. For the basic use of individual features, see the [user guide](../guide/index.md).
  ko: 원자 손실은 오류 정정에 어떤 영향을 줄까요? 제어 펄스는 양자 게이트의 동작을 어떻게 바꿀까요? 전력망을 나누는 문제는 어떻게 최적화 문제로 표현할 수 있을까요? 여기서는 이런 구체적인 질문을 FatQat으로 실행하고 탐구할 수 있는 모델로 옮깁니다. 각 사례를 따라가며 문제의 배경과 모델의 가정을 살펴보고, 코드를 실행한 뒤 그래프와 설명을 통해 결과를 이해할 수 있습니다. 관심 있는 주제를 골라 예제를 실행하고, 매개변수를 바꾸면서 어떤 변화가 생기는지 살펴보세요. 개별 기능의 기본 사용법은 [사용자 가이드](../guide/index.md)를 참고하세요.
  status: machine
