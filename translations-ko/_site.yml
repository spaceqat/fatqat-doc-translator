  en: Follow [eight-atom GHZ preparation](atom-array-ghz8.md) with [atom-loss error correction](atom-loss-erasure.md), or move from [gate calibration](pulse-calibration.md) to [Rydberg CZ pulse design](optimal-cz-control.md). For optimization, work through [QUBO and QAOA](qubo-qaoa.md), [the islanding model](islanding-model.md), and [islanding with QAOA](islanding-qaoa.md).
  ko: '[8원자 GHZ 상태 준비](atom-array-ghz8.md) 다음에 [원자 손실 오류 정정](atom-loss-erasure.md)을 살펴보거나, [게이트 보정](pulse-calibration.md)에서 [Rydberg CZ 펄스 설계](optimal-cz-control.md)로 이어 가세요. 최적화는 [QUBO와 QAOA](qubo-qaoa.md), [계통 분리 모델](islanding-model.md), [QAOA를 이용한 계통 분리](islanding-qaoa.md) 순서로 진행할 수 있습니다.'
